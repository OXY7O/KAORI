services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-10-15T17-29-55Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kaori-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kaori-demo-secret}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - ${MINIO_API_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kaori-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kaori-demo-secret}
      MINIO_THANO_BUCKET: ${MINIO_THANO_BUCKET:-thanos}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set demo http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "demo/$${MINIO_THANO_BUCKET}"
        printf 'PASS — MinIO demo bucket ready: %s\n' "$${MINIO_THANO_BUCKET}"

volumes:
  minio-data:
