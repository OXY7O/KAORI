services:
  runner:
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.337.0}
    environment:
      GITHUB_RUNNER_URL: ${GITHUB_RUNNER_URL:?Set GITHUB_RUNNER_URL in example/.env}
      GITHUB_RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN:?Set GITHUB_RUNNER_TOKEN in example/.env or the shell}
      GITHUB_RUNNER_NAME: ${GITHUB_RUNNER_NAME:-kaori-demo-runner}
      GITHUB_RUNNER_LABELS: ${GITHUB_RUNNER_LABELS:-kaori-demo,linux,x64}
    group_add:
      - ${DOCKER_GID:-998}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/runner/_work
    restart: "no"

volumes:
  runner-work:
