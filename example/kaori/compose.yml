name: kaori-laptop

x-kaori-env: &kaori-env
  APP_ENV: production
  WAIT_FOR_DB: "true"
  APP_VERSION: ${APP_VERSION:-local-rc}
  APP_BUILD_SHA: ${APP_BUILD_SHA:?Set APP_BUILD_SHA to the admitted staging SHA}
  APP_BUILD_DATE: ${APP_BUILD_DATE:-local}
  DATABASE_URL: postgresql://kaori:${POSTGRES_PASSWORD:-kaori-local}@postgres:5432/kaori
  REDIS_URL: redis://:${REDIS_PASSWORD:-kaori-local}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-kaori-local}@redis:6379/1
  RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:-kaori-local}@redis:6379/2
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-kaori-local}@redis:6379/3

x-kaori-service: &kaori-service
  image: ${KAORI_IMAGE:?Set KAORI_IMAGE to an admitted RC image or immutable digest}
  env_file:
    - .env
  environment: *kaori-env
  volumes:
    - kaori_instance:/app/instance
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - kaori

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaori
      POSTGRES_USER: kaori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaori-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaori -d kaori"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kaori]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-kaori-local}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='${REDIS_PASSWORD:-kaori-local}' redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kaori]

  migrate:
    <<: *kaori-service
    command: ["flask", "--app", "run:app", "db", "upgrade"]
    restart: "no"

  web:
    <<: *kaori-service
    init: true
    ports:
      - "${KAORI_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s

  worker:
    <<: *kaori-service
    init: true
    command: ["celery", "--app", "celery_worker:celery_app", "worker", "--queues=inventory,maintenance,integration-runtime,integration-validation,analytics-batch,reports,forecasting,resolver-execution,resolver-maintenance", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *kaori-service
    init: true
    command: ["celery", "--app", "celery_worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/app/instance/celery-beat/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]

networks:
  kaori:

volumes:
  postgres_data:
  redis_data:
  kaori_instance:
