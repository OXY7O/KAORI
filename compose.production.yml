name: kaori-production

x-kaori-image: &kaori-image
  image: ${KAORI_IMAGE:?Set KAORI_IMAGE in .env.production}
  env_file:
    - .env.production
  environment:
    APP_ENV: production
  volumes:
    - kaori_production_instance:/app/instance
  networks:
    - kaori_production
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  validate:
    <<: *kaori-image
    environment:
      APP_ENV: production
      WAIT_FOR_DB: "false"
    command:
      - python
      - scripts/validate_production_env.py
    restart: "no"

  migrate:
    <<: *kaori-image
    environment:
      APP_ENV: production
      WAIT_FOR_DB: "true"
    command:
      - flask
      - --app
      - run:app
      - db
      - upgrade
    restart: "no"

  web:
    <<: *kaori-image
    environment:
      APP_ENV: production
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${KAORI_BIND_ADDRESS:-127.0.0.1}:${KAORI_PORT:-5000}:5000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=5).read()
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    <<: *kaori-image
    environment:
      APP_ENV: production
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues=inventory
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY:-1}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s

  # Run exactly one Beat replica for each KAORI environment.
  beat:
    <<: *kaori-image
    environment:
      APP_ENV: production
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/instance/celery-beat
        && exec celery --app celery_worker:celery_app beat
        --loglevel="$${CELERY_BEAT_LOG_LEVEL:-INFO}"
        --schedule=/app/instance/celery-beat/celerybeat-schedule
        --pidfile=/tmp/celerybeat.pid
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s


networks:
  kaori_production:
    name: kaori-production

volumes:
  kaori_production_instance:
    name: kaori-production-instance
