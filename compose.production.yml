services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env.production
    environment:
      APP_ENV: production
    command:
      - flask
      - --app
      - run:app
      - db
      - upgrade
    restart: "no"
    volumes:
      - kaori_production_instance:/app/instance

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env.production
    environment:
      APP_ENV: production
    restart: unless-stopped
    ports:
      - "${KAORI_PORT:-5000}:5000"
    volumes:
      - kaori_production_instance:/app/instance
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=5).read()
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s

volumes:
  kaori_production_instance:
