name: kaori-production

x-kaori-environment: &kaori-environment
  APP_ENV: production
  KAORI_IMAGE: ${KAORI_IMAGE:?KAORI_IMAGE is supplied by governed deployment}
  APP_VERSION: ${APP_VERSION:?APP_VERSION is supplied by governed deployment}
  APP_BUILD_SHA: ${APP_BUILD_SHA:?APP_BUILD_SHA is supplied by governed deployment}
  APP_BUILD_DATE: ${APP_BUILD_DATE:?APP_BUILD_DATE is supplied by governed deployment}

x-kaori-image: &kaori-image
  image: ${KAORI_IMAGE:?KAORI_IMAGE is supplied by governed deployment}
  env_file:
    - ${KAORI_ENV_FILE:-.env.production}
  environment: *kaori-environment
  volumes:
    - kaori_production_instance:/app/instance
  networks:
    - kaori_production
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  validate:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "false"
    command:
      - python
      - scripts/validate_production_env.py
    restart: "no"

  migrate:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    command:
      - flask
      - --app
      - run:app
      - db
      - upgrade
    restart: "no"

  web:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${KAORI_BIND_ADDRESS:-127.0.0.1}:${KAORI_PORT:-5000}:5000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:5000/health/ready', headers={'Host': 'localhost'}), timeout=5).read()
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues=inventory
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${INVENTORY_WORKER_CONCURRENCY:-2}"
        --prefetch-multiplier="$${INVENTORY_WORKER_PREFETCH_MULTIPLIER:-1}"
        --max-tasks-per-child="$${INVENTORY_MAX_TASKS_PER_CHILD:-50}"
        --hostname=inventory@%h
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s

  maintenance-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${JOB_MAINTENANCE_CELERY_QUEUE:-maintenance}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${JOB_MAINTENANCE_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${JOB_MAINTENANCE_MAX_TASKS_PER_CHILD:-500}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s
    cpus: "${JOB_MAINTENANCE_WORKER_CPU_LIMIT:-0.5}"
    mem_limit: "${JOB_MAINTENANCE_WORKER_MEMORY_LIMIT:-512m}"

  runtime-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${INTEGRATION_RUNTIME_CELERY_QUEUE:-integration-runtime}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${INTEGRATION_RUNTIME_WORKER_CONCURRENCY:-4}"
        --max-tasks-per-child="$${INTEGRATION_RUNTIME_MAX_TASKS_PER_CHILD:-500}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s
    cpus: "${INTEGRATION_RUNTIME_WORKER_CPU_LIMIT:-1.0}"
    mem_limit: "${INTEGRATION_RUNTIME_WORKER_MEMORY_LIMIT:-1g}"

  validation-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${INTEGRATION_VALIDATION_CELERY_QUEUE:-integration-validation}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${INTEGRATION_VALIDATION_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${INTEGRATION_VALIDATION_MAX_TASKS_PER_CHILD:-100}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s
    cpus: "${INTEGRATION_VALIDATION_WORKER_CPU_LIMIT:-2.0}"
    mem_limit: "${INTEGRATION_VALIDATION_WORKER_MEMORY_LIMIT:-2g}"

  analytics-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${ANALYTICS_CELERY_QUEUE:-analytics-batch}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${ANALYTICS_WORKER_CONCURRENCY:-2}"
        --max-tasks-per-child="$${ANALYTICS_MAX_TASKS_PER_CHILD:-50}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    stop_grace_period: 180s
    cpus: "${ANALYTICS_WORKER_CPU_LIMIT:-2.0}"
    mem_limit: "${ANALYTICS_WORKER_MEMORY_LIMIT:-2g}"

  reports-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${REPORTS_CELERY_QUEUE:-reports}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${REPORTS_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${REPORTS_MAX_TASKS_PER_CHILD:-25}"
        --hostname=reports@%h
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    stop_grace_period: 180s
    cpus: "${REPORTS_WORKER_CPU_LIMIT:-1.0}"
    mem_limit: "${REPORTS_WORKER_MEMORY_LIMIT:-1g}"

  forecasting-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${FORECASTING_CELERY_QUEUE:-forecasting}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${FORECASTING_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${FORECASTING_MAX_TASKS_PER_CHILD:-10}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    stop_grace_period: 300s
    cpus: "${FORECASTING_WORKER_CPU_LIMIT:-2.0}"
    mem_limit: "${FORECASTING_WORKER_MEMORY_LIMIT:-3g}"

  resolver-execution-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${RESOLVER_EXECUTION_CELERY_QUEUE:-resolver-execution}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${RESOLVER_EXECUTION_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${RESOLVER_EXECUTION_MAX_TASKS_PER_CHILD:-25}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    stop_grace_period: 300s
    cpus: "${RESOLVER_EXECUTION_WORKER_CPU_LIMIT:-1.0}"
    mem_limit: "${RESOLVER_EXECUTION_WORKER_MEMORY_LIMIT:-1g}"

  resolver-maintenance-worker:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${RESOLVER_MAINTENANCE_CELERY_QUEUE:-resolver-maintenance}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${RESOLVER_MAINTENANCE_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${RESOLVER_MAINTENANCE_MAX_TASKS_PER_CHILD:-500}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s
    cpus: "${RESOLVER_MAINTENANCE_WORKER_CPU_LIMIT:-0.5}"
    mem_limit: "${RESOLVER_MAINTENANCE_WORKER_MEMORY_LIMIT:-512m}"

  # Run exactly one Beat replica for each KAORI environment.
  beat:
    <<: *kaori-image
    environment:
      <<: *kaori-environment
      WAIT_FOR_DB: "true"
    init: true
    restart: unless-stopped
    read_only: true
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/instance/celery-beat
        && exec celery --app celery_worker:celery_app beat
        --loglevel="$${CELERY_BEAT_LOG_LEVEL:-INFO}"
        --schedule=/app/instance/celery-beat/celerybeat-schedule
        --pidfile=/tmp/celerybeat.pid
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    stop_grace_period: 45s


networks:
  kaori_production:
    name: kaori-production

volumes:
  kaori_production_instance:
    name: kaori-production-instance
