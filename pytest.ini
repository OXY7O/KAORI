[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: validates isolated deterministic logic without application infrastructure
    functional: validates user-visible or operational function behavior
    integration: validates collaboration across application components or infrastructure boundaries
    security: validates authentication, authorization, disclosure, input, and privileged-operation regressions
    rendering: validates Jinja, frontend, document, and visual-structure contracts
    e2e: validates critical end-to-end application smoke journeys
    contract: validates architectural ownership and retired boundaries
    migration: validates database migration behavior separately from domain functions
    debug: temporary diagnostic tests; excluded from release gates
filterwarnings =
    ignore:^tagMap is deprecated\. Please use TAG_MAP instead\.$:DeprecationWarning:ldap3\.utils\.asn1
    ignore:^typeMap is deprecated\. Please use TYPE_MAP instead\.$:DeprecationWarning:ldap3\.utils\.asn1
