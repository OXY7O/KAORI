        --queues="$${INTEGRATION_VALIDATION_CELERY_QUEUE:-integration-validation}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${INTEGRATION_VALIDATION_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${INTEGRATION_VALIDATION_MAX_TASKS_PER_CHILD:-100}"
    volumes:
