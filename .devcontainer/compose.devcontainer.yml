    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kaori}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      POSTGRES_HOST: db
      POSTGRES_INTERNAL_PORT: 5432
      WAIT_FOR_DB: "true"
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${JOB_MAINTENANCE_CELERY_QUEUE:-maintenance}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${JOB_MAINTENANCE_WORKER_CONCURRENCY:-1}"
        --max-tasks-per-child="$${JOB_MAINTENANCE_MAX_TASKS_PER_CHILD:-500}"
        --hostname=maintenance@%h
    volumes:
      - .:/workspace/kaori
      - kaori_instance_data:/workspace/kaori/instance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  runtime-worker:
    build:
