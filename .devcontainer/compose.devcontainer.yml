name: kaori-dev

# #1427: The host initializeCommand provisions private PostgreSQL credentials
# in ~/.config/kaori/devcontainer/, OUTSIDE the bind-mounted workspace.
# PostgreSQL alone receives bootstrap and runtime provisioning secrets.
# Optional pre-init env_file declarations let VS Code inspect Compose before
# initializeCommand; PostgreSQL itself fails closed when secrets are absent.
# The one-shot db-bootstrap service receives ONLY the migrator secret.
# All normal application processes use the canonical non-owner DATABASE_URL.

services:
  db:
    env_file:
      - path: ${HOME:?HOME must point to the WSL developer home}/.config/kaori/devcontainer/postgres-bootstrap.env
        required: false
      - path: ${HOME:?HOME must point to the WSL developer home}/.config/kaori/devcontainer/postgres-migrate.env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kaori
      POSTGRES_PASSWORD: !reset null
    volumes:
      - ./.devcontainer/postgres-init/01-kaori-roles.sh:/docker-entrypoint-initdb.d/01-kaori-roles.sh:ro

  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    user: root
    command: >-
      sh -c "mkdir -p
      /workspace/kaori/instance
      /workspace/kaori/instance/archive-download-cache
      /workspace/kaori/instance/archive-staging
      /workspace/kaori/instance/celery-beat
      /workspace/kaori/node_modules
      && chown -R vscode:vscode /workspace/kaori/instance /workspace/kaori/node_modules
      && exec sleep infinity"
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:?Set the non-owner KAORI runtime DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      POSTGRES_HOST: db
      POSTGRES_INTERNAL_PORT: 5432
      WAIT_FOR_DB: "false"
    volumes:
      - .:/workspace/kaori
      - kaori_instance_data:/workspace/kaori/instance
      - kaori_node_modules:/workspace/kaori/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

  inventory-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:?Set the non-owner KAORI runtime DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      POSTGRES_HOST: db
      POSTGRES_INTERNAL_PORT: 5432
      WAIT_FOR_DB: "true"
      WAIT_FOR_SCHEMA: "true"
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues=inventory
        --loglevel="${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${INVENTORY_WORKER_CONCURRENCY:-2}"
        --prefetch-multiplier="$${INVENTORY_WORKER_PREFETCH_MULTIPLIER:-1}"
        --max-tasks-per-child="$${INVENTORY_MAX_TASKS_PER_CHILD:-50}"
        --hostname=inventory@%h
    volumes:
      - .:/workspace/kaori
      - kaori_instance_data:/workspace/kaori/instance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

