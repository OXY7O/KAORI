        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${INTEGRATION_RUNTIME_WORKER_CONCURRENCY:-4}"
        --max-tasks-per-child="$${INTEGRATION_RUNTIME_MAX_TASKS_PER_CHILD:-500}"
    volumes:
