      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      POSTGRES_HOST: db
      POSTGRES_INTERNAL_PORT: 5432
      WAIT_FOR_DB: "true"
    command:
      - sh
      - -c
      - >-
        exec celery --app celery_worker:celery_app worker
        --queues="$${ANALYTICS_CELERY_QUEUE:-analytics-batch}"
        --loglevel="$${CELERY_LOG_LEVEL:-INFO}"
        --concurrency="$${ANALYTICS_WORKER_CONCURRENCY:-2}"
        --max-tasks-per-child="$${ANALYTICS_MAX_TASKS_PER_CHILD:-50}"
    volumes:
