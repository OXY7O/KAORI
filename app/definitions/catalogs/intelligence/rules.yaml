- rule_key: kubernetes.workload.missing_memory_limits
  title: Workloads Without Memory Limits
  domain: kubernetes
  source_kind: workload
  category: governance
  severity: warning
  priority: P2
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  alert_escalation:
    eligible: false
    mode: manual
    grouping_mode: rule_asset_scope
  risk_exception:
    enabled: true
    default_scope_mode: finding_keys
    allowed_scope_modes:
    - finding_keys
    - rule_asset
    guidance: Use a time-bounded exception for platform, vendor, or system workloads where memory limits cannot yet be enforced; prefer Selected Findings to avoid masking unrelated workloads.
  catalog_summary: Flags workloads missing memory limits.
  summary: Detects workloads with containers that do not declare memory limits where bounded memory policy is expected.
  condition_summary: A workload has one or more containers where resources.limits.memory is not defined.
  recommended_action: Define memory limits from observed peak usage and workload failure tolerance, then validate rollout and OOM behavior.
  impact: Reduces unbounded memory risk while preserving explicit exceptions for system and vendor-managed workloads.
  evidence_boundary: KAORI evaluates committed Kubernetes workload configuration. Metrics Source can inform sizing, but does not determine whether the memory limit field is configured.
  supported_sources:
  - Kubernetes API
  - Workload Inventory
  - Optional Metrics Source usage metrics
  visible_in:
  - Recommendations
  - Workload Analysis
  - Capacity Analysis
  - Reports
- rule_key: kubernetes.workload.latest_image_tag
  title: Container Image Uses Latest Tag
  domain: kubernetes
  source_kind: workload
  category: governance
  severity: warning
  priority: P3
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  summary: Highlights mutable image tags that make deployment traceability and rollback analysis harder.
  condition_summary: A pod or workload image reference ends with :latest or omits a deterministic tag/digest.
  recommended_action: Pin images to immutable tags or digests and connect image metadata to image governance later.
  impact: Improves change traceability and operational audit quality.
  evidence_boundary: This is inventory governance and is intentionally outside Metrics Source alert rules.
  supported_sources:
  - Kubernetes API
  - Pod Inventory
  - Workload Inventory
  visible_in:
  - Recommendations
  - Pod Inventory
  - Workload Analysis
  - Reports
- rule_key: kubernetes.namespace.missing_quota
  title: Namespace Without Resource Quota
  domain: kubernetes
  source_kind: namespace
  category: governance
  severity: info
  priority: P3
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  risk_exception:
    enabled: true
    default_scope_mode: finding_keys
    allowed_scope_modes:
    - finding_keys
    - rule_asset
    guidance: Use Selected Findings for namespaces such as kube-system or vendor-managed namespaces that intentionally operate without ResourceQuota; keep tenant namespaces actionable.
  catalog_summary: Flags namespaces without ResourceQuota.
  summary: Identifies namespaces without quota guardrails for multi-tenant capacity governance.
  condition_summary: A namespace has no ResourceQuota object or no effective quota baseline.
  recommended_action: Define namespace quota and limit range based on tenant or workload class.
  impact: Improves tenant isolation and reduces noisy-neighbor risk.
  evidence_boundary: Metrics Source can show usage, while KAORI evaluates tenant governance posture.
  supported_sources:
  - Kubernetes API
  - Namespace Inventory
  visible_in:
  - Recommendations
  - Workload Analysis
  - Capacity Analysis
  - Reports
- rule_key: kubernetes.tls_secret.expired
  title: TLS Secret Certificate Expired
  domain: kubernetes
  source_kind: tls_secret
  category: governance
  severity: critical
  priority: P1
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  alert_escalation:
    grouping_mode: rule_asset_scope
  risk_exception:
    enabled: true
    default_scope_mode: finding_keys
    allowed_scope_modes:
    - finding_keys
    - rule_asset
    guidance: Use only for documented internal or vendor-managed TLS conditions with a named risk owner and expiry; certificate truth remains visible and is not marked compliant.
  catalog_summary: Flags expired Kubernetes TLS certificates.
  summary: Detects Kubernetes TLS Secrets whose certificate validity has already passed and can break HTTPS traffic served
    by Ingress.
  condition_summary: A collected Kubernetes TLS Secret has not_after in the past or days_remaining is less than or equal to
    zero.
  recommended_action: Upload a renewed certificate and matching private key through Kubernetes Governance > TLS Secret Update,
    then validate the affected Ingress hosts.
  impact: Prevents customer-facing TLS errors, failed browser trust validation, and service availability issues on HTTPS endpoints.
  evidence_boundary: This is Kubernetes Secret governance from the Kubernetes API. Metrics Source may alert on endpoint symptoms,
    while KAORI tracks certificate posture and update readiness.
  supported_sources:
  - Kubernetes API
  - TLS Secret Inventory
  - Ingress Mapping
  visible_in:
  - Recommendations
  - Catalog
  - Kubernetes TLS Secret
  - Reports
- rule_key: kubernetes.tls_secret.expiring_soon
  title: TLS Secret Certificate Expiring Soon
  domain: kubernetes
  source_kind: tls_secret
  category: governance
  severity: warning
  priority: P2
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  alert_escalation:
    grouping_mode: rule_asset_scope
  risk_exception:
    enabled: true
    default_scope_mode: finding_keys
    allowed_scope_modes:
    - finding_keys
    - rule_asset
    guidance: Use only for documented internal or vendor-managed TLS conditions with a named risk owner and expiry; certificate truth remains visible and is not marked compliant.
  catalog_summary: Flags Kubernetes TLS certificates nearing expiry.
  summary: Detects Kubernetes TLS Secrets that are approaching expiry and should be renewed before the operational risk window
    closes.
  condition_summary: A collected Kubernetes TLS Secret has status warning or critical based on remaining certificate lifetime.
  recommended_action: Prepare the renewed certificate pair, select the affected existing TLS Secrets in TLS Secret Update,
    validate SAN coverage, and apply the update before expiry.
  impact: Reduces emergency certificate replacement work and protects planned HTTPS availability windows.
  evidence_boundary: This rule is derived from Kubernetes Secret certificate metadata. Metrics Source is not the source of truth
    for certificate update workflow.
  supported_sources:
  - Kubernetes API
  - TLS Secret Inventory
  - Ingress Mapping
  visible_in:
  - Recommendations
  - Catalog
  - Kubernetes TLS Secret
  - Reports
- rule_key: kubernetes.tls_secret.invalid
  title: TLS Secret Certificate Cannot Be Parsed
  domain: kubernetes
  source_kind: tls_secret
  category: governance
  severity: critical
  priority: P1
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  summary: Detects Kubernetes TLS Secrets with missing or invalid tls.crt data, parse errors, or metadata that cannot support
    safe certificate governance.
  condition_summary: A Secret of type kubernetes.io/tls cannot be parsed as a valid X.509 certificate or has invalid certificate
    metadata.
  recommended_action: Review the Secret content, replace it with a valid certificate and matching private key, then resync
    TLS inventory to clear the invalid posture.
  impact: Prevents broken TLS termination and avoids applying updates without reliable certificate identity and expiry metadata.
  evidence_boundary: This is Kubernetes Secret data validation. Alertmanager can receive symptoms later, but KAORI identifies
    the governance issue directly.
  supported_sources:
  - Kubernetes API
  - TLS Secret Inventory
  visible_in:
  - Recommendations
  - Catalog
  - Kubernetes TLS Secret
  - Reports
- rule_key: kubernetes.storage.pvc_high_usage_enrichment
  title: Persistent Volume Near Capacity Enrichment
  domain: kubernetes
  source_kind: persistent_volume
  category: capacity
  severity: critical
  priority: P1
  status: imported_signal
  logic_type: alert_enrichment
  signal_source: alertmanager
  summary: Enriches storage capacity alerts with ownership, namespace, workload, trend, and report context.
  condition_summary: An Alertmanager/Metrics Source signal indicates PVC or filesystem usage is near the configured threshold.
  recommended_action: Keep threshold detection in Metrics Source, then use KAORI Kubernetes Reports to add context, trend, owner,
    and remediation guidance.
  impact: Prevents storage alerts from becoming isolated technical signals without operational context.
  evidence_boundary: Metrics Source remains the alert source of truth. KAORI imports and enriches the signal instead of duplicating
    the rule.
  supported_sources:
  - Metrics Source Rule
  - Alertmanager Alert
  - Kubernetes API
  - Storage Analysis
  visible_in:
  - Alert Intelligence
  - Storage Analysis
  - Reports
- rule_key: kubernetes.node.memory_pressure_enrichment
  title: Node Memory Pressure Enrichment
  domain: kubernetes
  source_kind: node
  category: capacity
  severity: critical
  priority: P1
  status: imported_signal
  logic_type: alert_enrichment
  signal_source: alertmanager
  summary: Adds top consumers, scheduling pressure, and capacity context around memory pressure alerts.
  condition_summary: Metrics Source or Kubernetes conditions indicate node memory pressure or low memory headroom.
  recommended_action: Use existing alert routing for notification, then review top consumers, eviction risk, and capacity
    recommendations in KAORI Kubernetes Reports.
  impact: Shortens investigation time without replacing Alertmanager routing.
  evidence_boundary: Metrics Source and Alertmanager own real-time detection and routing. KAORI owns interpretation and report
    context.
  supported_sources:
  - Alertmanager Alert
  - Kubernetes API
  - Node Inventory
  - Metrics Source Metrics
  visible_in:
  - Alert Intelligence
  - Resource Utilization
  - Capacity Analysis
  - Reports
- rule_key: kubernetes.forecast.capacity_exhaustion
  title: Capacity Exhaustion Forecast
  domain: kubernetes
  source_kind: cluster
  category: capacity
  severity: warning
  priority: P2
  status: available
  logic_type: forecast_insight
  signal_source: kaori_kubernetes_analysis
  summary: Projects whether CPU, memory, or storage may run out within the forecast horizon.
  condition_summary: Recent trend data projects available headroom crossing the configured risk threshold.
  recommended_action: Plan scaling, quota changes, or workload optimization before the risk window is reached.
  impact: Supports proactive capacity planning and readable operational reporting.
  evidence_boundary: Metrics Source provides time-series history; KAORI derives forecast insight from that history.
  supported_sources:
  - Metrics Source range queries
  - Capacity Analysis
  - Forecast Analysis
  visible_in:
  - Recommendations
  - Resource Forecast
  - Capacity Analysis
  - Reports
- rule_key: object_storage.bucket.quota_pressure
  title: Object Storage Bucket Quota Pressure
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_bucket
  category: capacity
  severity: warning
  priority: P2
  status: available
  logic_type: recommendation
  signal_source: object_storage_inventory
  summary: Detects Object Storage buckets whose committed usage has entered the quota review boundary.
  condition_summary: Committed bucket usage is at least 85% and below 95% of the configured quota.
  recommended_action: Review bucket growth and ownership, validate physical capacity headroom, then adjust quota or reduce
    retained data through the approved change path.
  impact: Reduces the risk of quota exhaustion while keeping bucket governance separate from physical storage capacity.
  evidence_boundary: This rule is evaluated from committed Object Storage inventory quota and usage evidence. Metrics Source may
    provide operational growth context but is not required to detect the committed quota posture.
  supported_sources:
  - Object Storage Inventory
  - MinIO API
  visible_in:
  - Recommendations
  - Object Storage Inventory
  - Capacity & Usage
  - Reports
- rule_key: object_storage.bucket.quota_critical
  title: Object Storage Bucket Quota Critical
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_bucket
  category: capacity
  severity: critical
  priority: P1
  status: available
  logic_type: recommendation
  signal_source: object_storage_inventory
  summary: Detects Object Storage buckets whose committed usage has entered the critical quota boundary.
  condition_summary: Committed bucket usage is at least 95% of the configured quota.
  recommended_action: Validate the current bucket demand and physical headroom immediately, then expand the approved quota
    or reduce retained data before writes are constrained.
  impact: Protects write availability and prevents bucket-level quota exhaustion from becoming an operational incident.
  evidence_boundary: This rule is evaluated from committed Object Storage inventory quota and usage evidence. Metrics Source may
    enrich trend analysis but does not replace the quota evidence.
  supported_sources:
  - Object Storage Inventory
  - MinIO API
  visible_in:
  - Recommendations
  - Object Storage Inventory
  - Capacity & Usage
  - Reports
- rule_key: object_storage.forecast.capacity_exhaustion_review
  title: Object Storage Capacity Exhaustion Inside 90 Days
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: capacity
  severity: warning
  priority: P2
  status: available
  logic_type: forecast_insight
  signal_source: kaori_object_storage_analysis
  summary: Raises an evidence-backed planning recommendation when the current Object Storage forecast projects capacity exhaustion
    inside 90 days.
  condition_summary: A current worker-materialized 30-day forecast projects positive growth and capacity exhaustion in more
    than 30 and at most 90 days.
  recommended_action: Validate the sustained growth window, review top consumers and lifecycle policy, then schedule capacity
    expansion or demand reduction before headroom narrows further.
  impact: Supports proactive Object Storage capacity planning before the system enters a critical exhaustion window.
  evidence_boundary: Metrics Source supplies history to the forecasting worker; Intelligence consumes only the committed forecast
    snapshot and does not issue a live metrics query.
  supported_sources:
  - Object Storage Forecast Snapshot
  - Forecasting Worker
  - Metrics Source history via MetricsSource
  visible_in:
  - Recommendations
  - Object Storage Forecast
  - Capacity & Usage
  - Reports
- rule_key: object_storage.forecast.capacity_exhaustion_critical
  title: Object Storage Capacity Exhaustion Inside 30 Days
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: capacity
  severity: critical
  priority: P1
  status: available
  logic_type: forecast_insight
  signal_source: kaori_object_storage_analysis
  summary: Raises a critical planning recommendation when the current Object Storage forecast projects capacity exhaustion
    inside 30 days.
  condition_summary: A current worker-materialized 30-day forecast projects positive growth and capacity exhaustion in 30
    days or less.
  recommended_action: Validate the current forecast immediately, prepare approved capacity expansion or demand reduction,
    and monitor the highest-contributing consumers until headroom is restored.
  impact: Reduces the risk of near-term Object Storage saturation and protects write availability.
  evidence_boundary: Metrics Source supplies history to the forecasting worker; Intelligence consumes only the committed forecast
    snapshot and does not issue a live metrics query.
  supported_sources:
  - Object Storage Forecast Snapshot
  - Forecasting Worker
  - Metrics Source history via MetricsSource
  visible_in:
  - Recommendations
  - Object Storage Forecast
  - Capacity & Usage
  - Reports
- rule_key: object_storage.bucket.public_exposure
  title: Object Storage Public Exposure Requires Review
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_bucket
  category: governance
  severity: warning
  priority: P2
  status: available
  logic_type: governance_check
  signal_source: object_storage_inventory
  summary: Identifies Object Storage buckets whose committed exposure posture is public and requires an ownership review.
  condition_summary: The latest committed bucket inventory reports exposure_state as public.
  recommended_action: Confirm public access is intentional and approved. If it is not required, restrict anonymous access
    and resync Object Storage inventory to verify the exposure posture.
  impact: Reduces unintended data exposure while allowing intentionally public buckets to be reviewed against ownership and
    policy.
  evidence_boundary: This is Object Storage access-governance evidence from the provider API. Metrics Source and Alertmanager
    are not the source of truth for bucket exposure configuration.
  supported_sources:
  - Object Storage Inventory
  - MinIO API
  visible_in:
  - Recommendations
  - Object Storage Inventory
  - Reports
- rule_key: object_storage.bucket.encryption_not_configured
  title: Object Storage Bucket Encryption Not Configured
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_bucket
  category: governance
  severity: warning
  priority: P2
  status: available
  logic_type: governance_check
  signal_source: object_storage_inventory
  risk_exception:
    enabled: true
    default_scope_mode: rule_asset
    allowed_scope_modes:
    - finding_keys
    - rule_asset
    guidance: Use Entire Asset when one storage-system constraint applies to all affected buckets, or Selected Findings when only specific buckets are temporarily accepted.
  alert_escalation:
    grouping_mode: rule_asset
  catalog_summary: Flags buckets without configured encryption.
  summary: Identifies Object Storage buckets whose committed encryption evidence reports no configured encryption policy.
  condition_summary: The latest committed bucket inventory reports encryption_state as not_configured.
  recommended_action: Validate the data-classification requirement, enable the approved server-side encryption policy when
    required, and resync Object Storage inventory to verify the resulting posture.
  impact: Improves storage governance and reduces the risk of retaining sensitive data without the intended encryption control.
  evidence_boundary: This is provider configuration evidence from Object Storage inventory. Metrics Source and Alertmanager do
    not determine bucket encryption configuration.
  supported_sources:
  - Object Storage Inventory
  - MinIO API
  visible_in:
  - Recommendations
  - Object Storage Inventory
  - Reports
- rule_key: object_storage.metric.capacity_pressure
  title: Object Storage Capacity Pressure
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: capacity
  severity: warning
  priority: P2
  status: available
  logic_type: metric_signal
  signal_source: kaori_object_storage_analysis
  summary: Defines the review boundary for usable Object Storage capacity before the system enters the critical operating
    range.
  condition_summary: Operational capacity utilization is at least 85% and below 95% for the selected Object Storage system.
  recommended_action: Review growth direction, top consumers, lifecycle policy, and planned capacity expansion before headroom
    narrows further.
  impact: Provides an early capacity-pressure signal while preserving time to remediate before critical saturation.
  evidence_boundary: KAORI evaluates the canonical Object Storage capacity and usage metrics. The current MinIO implementation
    receives those metrics through the qualified MetricsSource adapter; Intelligence does not issue its own live query.
  supported_sources:
  - Object Storage Analytics
  - Operational Metrics Source
  - MinIO metrics via qualified adapter
  visible_in:
  - Rule Catalog
  - Object Storage Alerts & Anomalies
  - Capacity & Usage
  - Recommendations
- rule_key: object_storage.metric.capacity_critical
  title: Object Storage Capacity Critical
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: capacity
  severity: critical
  priority: P1
  status: available
  logic_type: metric_signal
  signal_source: kaori_object_storage_analysis
  summary: Defines the critical usable-capacity boundary for Object Storage operational triage.
  condition_summary: Operational capacity utilization is at least 95% for the selected Object Storage system.
  recommended_action: Protect write headroom immediately by validating current demand, reducing retained data when approved,
    or expanding usable capacity.
  impact: Reduces the risk of storage saturation and write disruption when usable headroom becomes critically constrained.
  evidence_boundary: The signal is derived from canonical capacity and usage evidence. Metrics Source is the current MinIO metrics
    backend, but the rule remains owned by the Object Storage analysis domain.
  supported_sources:
  - Object Storage Analytics
  - Operational Metrics Source
  - MinIO metrics via qualified adapter
  visible_in:
  - Rule Catalog
  - Object Storage Alerts & Anomalies
  - Capacity & Usage
  - Recommendations
- rule_key: object_storage.metric.request_error_pressure
  title: Object Storage Request Error Pressure
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: performance
  severity: warning
  priority: P2
  status: available
  logic_type: metric_signal
  signal_source: kaori_object_storage_analysis
  summary: Defines the request-error review boundary for Object Storage service reliability.
  condition_summary: Observed request error ratio is at least 5% and below 10% for the selected Object Storage system.
  recommended_action: Review request-path errors, affected buckets, storage-node health, and recent workload or configuration
    changes before demand is increased.
  impact: Surfaces material request degradation before the error ratio enters the critical reliability boundary.
  evidence_boundary: KAORI derives the ratio from canonical request and error-rate metrics. The current MinIO implementation
    uses Metrics Source through the qualified MetricsSource adapter.
  supported_sources:
  - Object Storage Analytics
  - Operational Metrics Source
  - MinIO metrics via qualified adapter
  visible_in:
  - Rule Catalog
  - Object Storage Alerts & Anomalies
  - Performance
  - Alert Intelligence
- rule_key: object_storage.metric.request_error_critical
  title: Object Storage Request Error Critical
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: reliability
  severity: critical
  priority: P1
  status: available
  logic_type: metric_signal
  signal_source: kaori_object_storage_analysis
  summary: Defines the critical request-error boundary for Object Storage operational triage.
  condition_summary: Observed request error ratio is at least 10% for the selected Object Storage system.
  recommended_action: Triage request failures immediately, correlate active provider alerts, validate storage-node health,
    and reduce avoidable demand until reliability recovers.
  impact: Highlights severe request-path degradation that can materially affect application access to stored objects.
  evidence_boundary: KAORI derives the signal from canonical request and error-rate metrics; Alertmanager lifecycle records
    remain a separate authoritative evidence stream.
  supported_sources:
  - Object Storage Analytics
  - Operational Metrics Source
  - Alertmanager correlation
  visible_in:
  - Rule Catalog
  - Object Storage Alerts & Anomalies
  - Performance
  - Alert Intelligence
- rule_key: object_storage.metric.requests_waiting
  title: Object Storage Requests Waiting
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: performance
  severity: warning
  priority: P2
  status: available
  logic_type: metric_signal
  signal_source: kaori_object_storage_analysis
  summary: Detects current request queue pressure when one or more Object Storage requests are waiting.
  condition_summary: Canonical waiting-request evidence is available and the current waiting-request count is greater than
    zero.
  recommended_action: Review request demand, error pressure, throughput direction, and storage-node health before treating
    queue pressure as a capacity-only issue.
  impact: Provides early request-processing pressure context without inventing a provider-specific concurrency threshold.
  evidence_boundary: Any positive waiting count is treated as a review signal. KAORI does not infer a critical concurrency
    threshold until a validated provider-specific boundary exists.
  supported_sources:
  - Object Storage Analytics
  - Operational Metrics Source
  - MinIO metrics via qualified adapter
  visible_in:
  - Rule Catalog
  - Object Storage Alerts & Anomalies
  - Performance
  - Alert Intelligence
- rule_key: object_storage.metric.offline_nodes
  title: Object Storage Nodes Offline
  domain: object_storage
  provider_keys:
  - minio
  source_kind: object_storage_system
  category: reliability
  severity: critical
  priority: P1
  status: available
  logic_type: metric_signal
  signal_source: kaori_object_storage_analysis
  summary: Detects Object Storage node availability degradation from canonical operational metrics.
  condition_summary: Canonical offline-node evidence is available and one or more storage nodes are offline.
  recommended_action: Validate the affected node state, healing or redundancy posture, active provider alerts, and request
    reliability before restoring normal operational assumptions.
  impact: Highlights loss of storage-node availability that can affect redundancy, request handling, and maintenance safety.
  evidence_boundary: KAORI evaluates canonical node-health evidence and correlates it with provider alerts separately; Alertmanager
    remains authoritative for alert lifecycle state.
  supported_sources:
  - Object Storage Analytics
  - Operational Metrics Source
  - Alertmanager correlation
  visible_in:
  - Rule Catalog
  - Object Storage Alerts & Anomalies
  - Performance
  - Alert Intelligence
- rule_key: server.vm.snapshot_age_policy
  title: VM Snapshot Older Than Policy
  domain: server
  source_kind: vm
  category: operations
  severity: warning
  priority: P2
  status: reserved
  logic_type: operational_hygiene
  signal_source: server_inventory
  summary: Server Node Exporter intelligence check for stale VM snapshots that consume datastore capacity and increase operational
    risk.
  condition_summary: A VM snapshot is older than the configured retention policy.
  recommended_action: Review ownership, confirm rollback need, then consolidate or delete according to change policy.
  impact: Reduces datastore pressure and long-running snapshot risk.
  evidence_boundary: This is KAORI Server Reports inventory and Node Exporter intelligence, not a Metrics Source alerting rule.
  supported_sources:
  - Server Inventory
  - Node Exporter
  - Hypervisor API
  visible_in:
