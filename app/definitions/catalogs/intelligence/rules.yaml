schema_version: 1
kind: intelligence_rules
rules:
- rule_key: kubernetes.workload.missing_cpu_requests
  title: Workloads Without CPU Requests
  domain: kubernetes
  source_kind: workload
  category: governance
  severity: warning
  priority: P2
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  alert_escalation:
    eligible: false
    mode: manual
    grouping_mode: rule_asset_scope
  risk_exception:
    enabled: true
    default_scope_mode: finding_keys
    allowed_scope_modes:
    - finding_keys
    - rule_asset
    guidance: Use a time-bounded exception for platform, vendor, or system workloads that cannot adopt the resource policy yet; prefer Selected Findings so unrelated workloads remain actionable.
  catalog_summary: Flags workloads missing CPU requests.
  summary: Detects containers that run without CPU requests, reducing scheduler quality and capacity reporting accuracy.
  condition_summary: A workload has one or more containers where resources.requests.cpu is not defined.
  recommended_action: Set CPU requests from recent p95 usage, then review namespace quota and workload criticality.
  impact: Improves scheduler placement, capacity planning, and non-technical report readability.
  evidence_boundary: This is not a Metrics Source alert replacement. Metrics Source may supply usage history, while KAORI evaluates
    configuration posture.
  supported_sources:
  - Kubernetes API
  - Inventory Collector
  - Optional Metrics Source usage metrics
  visible_in:
  - Recommendations
  - Capacity Analysis
  - Workload Analysis
  - Reports
- rule_key: kubernetes.workload.missing_memory_requests
  title: Workloads Without Memory Requests
  domain: kubernetes
  source_kind: workload
  category: governance
  severity: warning
  priority: P2
  status: available
  logic_type: governance_check
  signal_source: kubernetes_api
  alert_escalation:
    eligible: false
    mode: manual
    grouping_mode: rule_asset_scope
  risk_exception:
    enabled: true
    default_scope_mode: finding_keys
    allowed_scope_modes:
    - finding_keys
    - rule_asset
    guidance: Use a time-bounded exception for platform, vendor, or system workloads that cannot adopt the resource policy yet; prefer Selected Findings so unrelated workloads remain actionable.
  catalog_summary: Flags workloads missing memory requests.
  summary: Detects workloads without memory requests so placement and memory capacity posture can be reported clearly.
  condition_summary: A workload has one or more containers where resources.requests.memory is not defined.
  recommended_action: Define memory requests based on observed usage and application baseline requirements.
  impact: Reduces scheduling ambiguity and improves memory capacity reports.
  evidence_boundary: Metrics Source measures memory usage; KAORI evaluates whether the workload declares scheduling requirements.
  supported_sources:
  - Kubernetes API
  - Inventory Collector
  - Optional Metrics Source usage metrics
