schema_version: 1
kind: integration_provider_contract
provider: kubernetes
compatibility_profiles:
- kubernetes-v1
capabilities:
- key: discovery
  label: API Discovery
  description: Discover supported Kubernetes API resources.
  required: true
- key: inventory
  label: Inventory
  description: Collect Kubernetes inventory snapshots.
  required: true
- key: operations
  label: Operations
  description: Execute governed Kubernetes operational actions.
  required: false
- key: governance
  label: Governance
  description: Inspect Kubernetes governance and TLS controls.
  required: false
