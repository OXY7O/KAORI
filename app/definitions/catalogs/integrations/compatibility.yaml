schema_version: 1
kind: integration_compatibility
kubernetes_lifecycle_policy:
  supported_version_constraint: '>=1.20,<2.0'
  current_min_version: '1.34'
  current_max_version_exclusive: '1.37'
  current_version_label: v1.34–v1.36
  supported_version_label: v1.20–v1.x
  legacy_min_version: '1.20'
profiles:
- key: kubernetes-api-v1
  product: kubernetes
  version_constraint: '>=1.20,<2.0'
  support_level: supported
  required_capabilities: []
  notes: KAORI Kubernetes API contract v1. Live API discovery and feature-level RBAC determine readiness.
  query_profile: null
- key: prometheus-http-v2
  product: prometheus
  version_constraint: '>=2.40,<3.0'
  support_level: legacy_supported
  required_capabilities:
  - instant_query
  - range_query
  notes: Prometheus HTTP API profile for runtime major 2.
  query_profile: prometheus-core-v1
- key: prometheus-http-v3
  product: prometheus
  version_constraint: '>=3.0,<4.0'
  support_level: current
  required_capabilities:
  - instant_query
  - range_query
  notes: Prometheus HTTP API profile for runtime major 3.
  query_profile: prometheus-core-v1
- key: alertmanager-api-v2-legacy
