  version_constraint: '>=1.35,<1.38'
  contract_profile: kubernetes-core-v1
  support_level: current
  upstream_lifecycle: current
  required_capabilities: []
  notes: Current upstream-supported Kubernetes minors v1.35–v1.37.
- key: prometheus-v2-legacy
  product: prometheus
  version_constraint: '>=2.40,<3.0'
  contract_profile: prometheus-http-core-v1
  support_level: legacy_supported
  upstream_lifecycle: legacy
  required_capabilities: []
  notes: Prometheus 2.x qualified against the shared HTTP API core contract.
- key: prometheus-v3-current
  product: prometheus
  version_constraint: '>=3.0,<4.0'
  contract_profile: prometheus-http-core-v1
  support_level: current
  upstream_lifecycle: current
