schema_version: 2
kind: integration_compatibility

kubernetes_lifecycle_policy:
  supported_version_constraint: '>=1.20,<2.0'
  current_min_version: '1.35'
  current_max_version_exclusive: '1.38'
  current_version_label: v1.35–v1.37
  upstream_supported_version_label: v1.35–v1.37
  supported_version_label: v1.20–v1.37 qualified; future v1.x unverified
  legacy_min_version: '1.20'

contract_profiles:
- key: kubernetes-core-v1
  products:
  - kubernetes
  adapter_key: kubernetes_api
  required_capabilities: []
  notes: Stable Kubernetes API discovery contract; live resource discovery and feature-level RBAC remain authoritative.
  query_profile: null
- key: prometheus-http-core-v1
  products:
  - prometheus
  - thanos
  adapter_key: prometheus_http
  required_capabilities:
  - instant_query
  - range_query
  notes: Stable Prometheus HTTP API v1 query contract shared by Prometheus and Thanos Query.
  query_profile: prometheus-http-core-v1
- key: alertmanager-api-v2-contract-v1
  products:
  - alertmanager
  adapter_key: alertmanager_api_v2
  required_capabilities:
  - status_v2
  - alerts_v2
  - silences_v2
  notes: Stable Alertmanager API v2 provider contract; payload and consumer evidence remain binding-scoped.
  query_profile: null

products:
- key: kubernetes
  label: Kubernetes
  icon: ship-wheel
  version_scheme: Semantic version
  contract_profile: kubernetes-core-v1
  minimum_label: v1.20
  recommended_label: v1.37.x
  qualified_version_label: v1.20–v1.37
  upstream_lifecycle_label: Supported upstream: v1.35–v1.37
  support_label: Current + Legacy Qualified
  support_tone: info
  capability_summary: API discovery, inventory, governed operations, and TLS governance.
  validation_basis: Live API discovery and feature-level Kubernetes RBAC decide operational readiness.
- key: prometheus
  label: Prometheus
  icon: activity
  version_scheme: Semantic version
  contract_profile: prometheus-http-core-v1
  minimum_label: v2.40
  recommended_label: v3.13 LTS
  qualified_version_label: v2.40–v3.x
  upstream_lifecycle_label: Prometheus 3.x current; 2.x legacy-qualified
  support_label: HTTP Core Qualified
  support_tone: normal
  capability_summary: Prometheus HTTP API core queries with asset-scoped metric contracts.
  validation_basis: Provider query APIs must validate; consumer metrics remain independently binding-scoped.
- key: thanos
  label: Thanos Query
  icon: database-zap
  version_scheme: Semantic version
  contract_profile: prometheus-http-core-v1
  minimum_label: v0.39
  recommended_label: v0.42.4
  qualified_version_label: v0.39–v0.42.x
  upstream_lifecycle_label: v0.42.x current; v0.39–v0.41 qualified history
  support_label: Shared HTTP Core Qualified
  support_tone: normal
  capability_summary: Long-retention PromQL through the shared Prometheus HTTP API v1 contract.
  validation_basis: Provider query APIs and Thanos endpoint identity validate separately from asset metric bindings.
- key: alertmanager
  label: Alertmanager
  icon: bell-ring
  version_scheme: Semantic version
  contract_profile: alertmanager-api-v2-contract-v1
  minimum_label: v0.25
  recommended_label: v0.34.1
  qualified_version_label: v0.25–v0.34.x
  upstream_lifecycle_label: v0.34.x current; v0.25–v0.33 qualified history
  support_label: API v2 Qualified
  support_tone: normal
  capability_summary: Alertmanager API v2 status, alerts, and silences provider contract.
  validation_basis: Mandatory API probes establish provider readiness; consumer alert evidence remains binding-scoped.

qualifications:
- key: kubernetes-legacy
  product: kubernetes
  version_constraint: '>=1.20,<1.35'
  contract_profile: kubernetes-core-v1
  support_level: legacy_supported
  upstream_lifecycle: legacy
  required_capabilities: []
  notes: Legacy-qualified Kubernetes v1 line. Live API discovery and RBAC remain authoritative.
- key: kubernetes-current
