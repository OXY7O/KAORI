  notes: Prometheus 3.x qualified against the shared HTTP API core contract.
- key: alertmanager-legacy
  product: alertmanager
  version_constraint: '>=0.25,<0.27'
  contract_profile: alertmanager-api-v2-contract-v1
  support_level: legacy
  upstream_lifecycle: legacy
  required_capabilities: []
  notes: Legacy Alertmanager runtime line validated through API v2.
- key: alertmanager-current
  product: alertmanager
