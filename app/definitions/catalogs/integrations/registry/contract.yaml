schema_version: 1
kind: integration_provider_contract
provider: registry
capability_profile: registry-provider-read-v1
compatibility_profiles:
- harbor-api-v2-core-v1
core_capability_keys:
- provider_health
- system_identity
- project_discovery
- repository_discovery
capabilities:
- key: provider_health
  label: Provider Health
  category: api
  description: Observe Harbor component health without treating health as Full Validation readiness.
  required: true
  probe: GET /api/v2.0/health
  success_criteria: Harbor returns HTTP 200 with readable component health evidence.
  configuration_guidance: Allow KAORI to reach the Harbor API endpoint through the configured TLS boundary.
  impact: Establishes lightweight provider reachability and component-health evidence.
  remediation:
  - Verify DNS, routing, firewall, reverse-proxy, and TLS trust from KAORI.
- key: system_identity
  label: System Identity
  category: identity
  description: Read Harbor general system information and automatically discover the provider version.
  required: true
  probe: GET /api/v2.0/systeminfo
  success_criteria: Harbor returns HTTP 200 with a parseable harbor_version value.
  configuration_guidance: Permit read access to Harbor system information.
  impact: Required for provider identity, automatic version qualification, and compatibility evidence.
  remediation:
  - Verify /api/v2.0/systeminfo is reachable and returns Harbor JSON.
- key: project_discovery
  label: Project Discovery
  category: inventory
  description: List Registry projects visible to the configured read-oriented Harbor credential.
  required: true
  probe: GET /api/v2.0/projects?page=1&page_size=1
  success_criteria: Harbor returns HTTP 200 with a JSON array; an empty array is valid inventory evidence.
  configuration_guidance: Grant the KAORI robot identity only the project visibility required for governed Registry inventory.
  impact: Required for Registry project discovery and later reconciliation.
  remediation:
  - Confirm the credential can list the intended Harbor projects.
- key: repository_discovery
  label: Repository Discovery
  category: inventory
  description: List authorized repositories without requiring provider mutation privileges.
  required: true
  probe: GET /api/v2.0/projects/{project_name_or_id}/repositories?page=1&page_size=1
  success_criteria: Harbor returns HTTP 200 with a JSON array for a visible representative project; an empty repository array is valid evidence.
  configuration_guidance: Grant project visibility plus read/list repository permissions for the Registry scope KAORI observes.
  impact: Required for repository reconciliation and artifact discovery planning.
  remediation:
  - Confirm the Harbor credential has repository list/read permission for the intended scope.
- key: artifact_discovery
  label: Artifact Discovery
  category: inventory
  description: Read OCI artifact metadata for a deterministically selected project and repository when one exists.
  required: false
  probe: GET /api/v2.0/projects/{project_name}/repositories/{repository_name}/artifacts
  success_criteria: A representative repository returns HTTP 200 with artifact metadata.
  configuration_guidance: Permit artifact read/list access without push, delete, scan-trigger, or policy mutation.
  impact: Enables committed digest and tag inventory in the next workstream.
  remediation:
  - Confirm the credential can read representative repository artifacts.
- key: vulnerability_read
  label: Vulnerability Evidence
  category: security
  description: Read scanner-produced vulnerability summaries without triggering scans.
  required: false
  probe: Harbor artifact scan overview
  success_criteria: Harbor exposes readable scan metadata for a scanned representative artifact.
  configuration_guidance: Grant read-only scanner and artifact metadata permissions.
  impact: Enables later normalized vulnerability snapshots.
  remediation:
  - Confirm a Harbor scanner is configured and representative scan evidence exists.
- key: retention_read
  label: Retention Policy Evidence
  category: governance
  description: Read retention configuration and execution evidence without changing provider policy.
  required: false
  probe: Harbor API v2.0 retention read endpoints
  success_criteria: Retention evidence is readable where a policy exists.
  configuration_guidance: Keep retention access read-only during the Registry MVP.
  impact: Supports governance posture without provider mutation authority.
  remediation:
  - Verify the credential can read applicable retention policies.
- key: replication_read
  label: Replication Policy Evidence
  category: governance
  description: Read Registry replication policy and topology evidence without starting or changing replication.
  required: false
  probe: Harbor API v2.0 replication policy read endpoints
  success_criteria: Replication policy metadata is readable when configured.
  configuration_guidance: Keep replication access read-only; provider mutation remains outside Artifact Registry governance.
  impact: Supports resilience and topology posture without making KAORI the replication engine.
  remediation:
  - Verify the configured Registry credential can read replication policy metadata.
- key: immutability_read
  label: Immutability Evidence
  category: governance
  description: Read project immutability configuration without changing provider policy.
  required: false
  probe: Harbor API v2.0 immutability read endpoints
  success_criteria: Immutability evidence is readable for the selected project scope.
  configuration_guidance: Grant only read permission for project immutability posture.
  impact: Supports artifact-governance evidence.
  remediation:
  - Verify project-level immutability configuration is readable.
- key: signature_metadata
  label: Signature Metadata
  category: supply_chain
  description: Observe signature/accessory metadata without performing trust-policy evaluation.
  required: false
  probe: Harbor artifact accessory metadata
  success_criteria: Signature-related metadata is readable when present.
  configuration_guidance: Preserve signature presence, verification, signer identity, and policy evaluation as separate facts.
  impact: Enables later supply-chain evidence without making KAORI a signing engine.
  remediation:
  - Confirm representative signed artifacts exist when validation evidence is required.
- key: sbom_metadata
  label: SBOM Metadata
  category: supply_chain
  description: Observe Harbor SBOM availability and summary metadata without indexing full package graphs.
  required: false
  probe: Harbor artifact SBOM overview/accessory metadata
  success_criteria: SBOM availability metadata is readable when provider evidence exists.
  configuration_guidance: Keep initial SBOM integration metadata-oriented and read-only.
  impact: Enables later supply-chain context without duplicate SBOM generation.
  remediation:
  - Confirm representative artifacts have SBOM evidence where supported.
- key: webhook_readiness
  label: Webhook Readiness
  category: eventing
  description: Represent Harbor webhook readiness without treating webhook delivery as inventory truth.
  required: false
  probe: Dedicated webhook workstream
  success_criteria: Authenticated delivery reconciles with scheduled correctness collection.
  configuration_guidance: Webhooks remain a fast path; scheduled reconciliation remains mandatory.
  impact: Enables targeted refresh.
  remediation:
  - Configure authenticated webhook delivery only when the webhook workstream is enabled.
- key: metrics_readiness
  label: Metrics Readiness
  category: observability
  description: Represent Harbor Prometheus metrics readiness through the existing Metrics Source boundary.
  required: false
  probe: Canonical Observability Metrics Source capability
  success_criteria: A qualified Metrics Source observes Harbor metrics without a Registry-local metrics transport.
  configuration_guidance: Reuse Metrics Source rather than embedding Prometheus transport in Registry.
  impact: Provides operational telemetry while preserving Observability ownership.
  remediation:
  - Configure a qualified Metrics Source when Harbor metrics are required.
products:
- key: harbor
  label: Harbor
  adapter_key: harbor_api_v2
  protocol: harbor_api_v2
  compatibility_profiles:
  - harbor-api-v2-core-v1
