  requires_cluster: false
  domain: object_storage
  source_kind: object_storage
  scope_asset_type: object_storage_system
- value: object_storage_analysis
  label: Object Storage Analysis Report
  description: Capacity, usage, quota headroom, request performance, forecast, consumer concentration, and operational risk for one Object Storage system.
