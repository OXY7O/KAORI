  family: inventory
  default_format: xlsx
  allowed_formats:
  - xlsx
  - csv
  default_sections:
  - inventory_assets
  - inventory_metadata
  - inventory_field_dictionary
  period_mode: snapshot
- value: storage_inventory
  label: Storage Inventory
  description: StorageClass, persistent-volume, and persistent-volume-claim identities and lifecycle fields.
  icon: database-zap
