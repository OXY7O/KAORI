  allowed_formats:
  - xlsx
  - csv
  default_sections:
  - inventory_assets
  - inventory_metadata
  - inventory_field_dictionary
  period_mode: snapshot
- value: object_storage_inventory
  label: Object Storage Inventory Report
  description: Provider-neutral Object Storage systems, buckets or containers, committed usage, quota, protection, and lifecycle evidence.
  icon: database-backup
  family: inventory
  default_format: xlsx
  allowed_formats:
  - xlsx
  - csv
  default_sections:
  - object_storage_inventory_assets
  - object_storage_inventory_metadata
  - object_storage_inventory_field_dictionary
