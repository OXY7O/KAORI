schema_version: 1
kind: report_catalog
output_formats:
- value: pdf
  label: PDF
  extension: .pdf
  mimetype: application/pdf
- value: xlsx
  label: Excel Workbook (.xlsx)
  extension: .xlsx
  mimetype: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
- value: csv
  label: CSV (.csv)
  extension: .csv
  mimetype: text/csv
report_types:
- value: analytics_overview
  label: Analytics Overview Report
  description: High-level analytics summary across utilization, capacity, forecast, and alerts.
  icon: layout-dashboard
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_brief
  - resource_posture
  - trend_forecast
  - top_consumers
  - capacity_pressure
  - alerts_anomalies
  - reporting_summary
  - inventory_snapshot
  - data_freshness_reliability
  - recommendation_plan
  - methodology_evidence_boundary
  period_mode: range
- value: resource_utilization
  label: Resource Utilization Report
  description: CPU, memory, storage, pod utilization, and node resource detail.
  icon: activity
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - cpu_utilization
  - memory_utilization
  - storage_utilization
  - pod_utilization
  - node_resource_detail
  - operational_recommendations
  period_mode: range
- value: capacity_analysis
  label: Capacity Analysis Report
  description: Worker capacity, allocation, headroom, and pressure risk.
  icon: database
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - worker_capacity_summary
  - resource_allocation_headroom
  - capacity_pressure_risk
  - operational_recommendations
  period_mode: range
- value: storage_analysis
  label: Storage Analysis Report
  description: Filesystem, persistent volume, PVC, capacity, usage, and free space summary.
  icon: hard-drive
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - filesystem_summary
  - persistent_volume_summary
  - persistent_volume_claims
  - storage_risk
  - operational_recommendations
  period_mode: range
- value: workload_analysis
  label: Workload Analysis Report
  description: Workload resource requests, limits, mapping, and namespace resource behavior.
  icon: boxes
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - tenant_quota_summary
  - request_limit_coverage
  - workload_resource_mapping
  - governance_findings
  - operational_recommendations
  period_mode: range
- value: resource_forecast
  label: Resource Forecast Report
  description: Forecast CPU, memory, storage, and pod growth using historical metrics.
  icon: line-chart
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - forecast_summary
  - cpu_forecast
  - memory_forecast
  - storage_forecast
  - pod_forecast
  - capacity_projection
  - operational_recommendations
  period_mode: range
- value: top_consumers
  label: Top Consumers Report
  description: Top namespaces, workloads, and pods consuming cluster resources.
  icon: users
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - top_namespace_consumers
  - top_workload_consumers
  - top_pod_consumers
  - resource_hotspots
  - operational_recommendations
  period_mode: range
- value: alerts_anomalies
  label: Alerts & Anomalies Report
  description: Alert visibility, anomaly context, source health, routing, ownership, incident readiness, and recommendation
    notes.
  icon: triangle-alert
  family: analytics
  default_format: pdf
  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - active_alerts
  - alert_severity_summary
  - source_health
  - routing_grouping
  - silence_inhibition
  - ownership_runbook
  - incident_readiness
  - anomaly_context
  - affected_resources
  - operational_recommendations
  period_mode: range
- value: inventory_overview
  label: Inventory Overview
  description: Committed Kubernetes asset totals by inventory category.
  icon: layout-dashboard
  family: inventory
  default_format: xlsx
  allowed_formats:
  - xlsx
  - csv
  default_sections:
  - inventory_assets
  - inventory_metadata
  - inventory_field_dictionary
  period_mode: snapshot
- value: node_inventory
  label: Nodes Inventory
  description: Node identities, readiness, platform, capacity, addressing, and collection evidence.
  icon: server-cog
  family: inventory
  default_format: xlsx
  allowed_formats:
  - xlsx
  - csv
  default_sections:
  - inventory_assets
  - inventory_metadata
  - inventory_field_dictionary
  period_mode: snapshot
- value: namespace_inventory
  label: Namespaces Inventory
