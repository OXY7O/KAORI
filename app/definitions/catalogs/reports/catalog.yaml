  allowed_formats:
  - pdf
  - xlsx
  - csv
  default_sections:
  - executive_summary
  - object_storage_capacity_usage
  - object_storage_bucket_distribution
  - object_storage_quota_headroom
  - object_storage_performance
  - object_storage_forecast
  - object_storage_top_consumers
  - object_storage_risk_findings
  - operational_recommendations
  - methodology_evidence_boundary
  period_mode: range
  requires_cluster: false
  domain: object_storage
  source_kind: object_storage
  scope_asset_type: object_storage_system
