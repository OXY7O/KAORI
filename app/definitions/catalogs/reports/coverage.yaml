schema_version: 1
kind: report_coverage_catalog
domains:
  - key: server
    label: Server & VM Reports
    description: Planned report contracts for physical servers, virtual machines, and Node Exporter signals.
    icon: server-cog
    status: Planned
    tone: info
    items:
      - name: Server Inventory Report
        description: Physical and virtual server inventory, ownership, operating system, lifecycle, and placement summary.
        icon: server
      - name: Server Utilization Report
        description: CPU, memory, filesystem, and load behavior from server inventory and Node Exporter metrics.
        icon: activity
      - name: Server Capacity Report
        description: Allocated versus consumed compute, memory, and storage with capacity risk and growth indicators.
        icon: gauge
      - name: VM Inventory Report
        description: Virtual machine catalog, ownership, power state, operating system, CPU, memory, disk, and placement summary.
        icon: monitor-cog
      - name: VM Placement & Risk Report
        description: Placement quality, affinity context, availability readiness, and concentration risk across host groups.
        icon: git-fork
  - key: hci
    label: HCI Reports
    description: Reserved report contracts for HCI clusters, hosts, datastores, and VM placement from provider APIs.
    icon: network
    status: Reserved
    tone: unknown
    items:
      - name: HCI Cluster Health Report
        description: Cluster posture, host availability, storage pool status, replication signals, and operational risk.
        icon: network
      - name: HCI Host Utilization Report
        description: Hypervisor host usage, contention indicators, consolidation opportunity, and noisy-neighbor signals.
        icon: server-cog
      - name: Datastore & Volume Report
        description: Datastore utilization, free capacity, thin provisioning exposure, and storage pressure overview.
        icon: database
      - name: HCI VM Placement Report
        description: VM distribution, affinity, resilience, and placement risk from the connected HCI provider API.
        icon: waypoints
