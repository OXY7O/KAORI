schema_version: 1
kind: identity_providers
providers:
  - provider_key: database
    adapter_key: local_database
    family: database
    label: Local Database
    short_label: Local DB
    icon: database
    flow: credentials
    configurable: false
    supports_jit: false
    configuration_profile: local_database
    admission_policy: none
    description: Local KAORI credentials reserved for managed local identities and break-glass access.
    enabled_copy: Local Database authentication is managed by the User Management lifecycle.
    admission_label: Not Applicable
    admission_help: Local Database authentication does not use an external admission policy.
    client_secret_placeholder: ''
    guidance_partial: ''

  - provider_key: ldap_directory
    adapter_key: ldap
    family: directory
    label: LDAP / Active Directory
    short_label: LDAP
    icon: network
    flow: credentials
    configurable: true
    supports_jit: false
    configuration_profile: ldap
    admission_policy: administrative_projection
    description: Directory authentication with administrator-controlled identity projection into KAORI.
    enabled_copy: Allow provisioned directory identities to authenticate through the configured LDAP adapter.
    admission_label: Administrative Projection
    admission_help: Directory identities must be explicitly searched, reviewed, and projected by an administrator.
    client_secret_placeholder: ''
    guidance_partial: access/identity_providers/providers/ldap_directory/_guidance.html

  - provider_key: google
    adapter_key: google_oidc
    family: sso
    label: Google OpenID Connect
    short_label: Google OIDC
    icon: chrome
    flow: browser
    configurable: true
    supports_jit: true
    configuration_profile: browser_client
    admission_policy: verified_email_domain_allowlist
    description: Browser SSO through Google OpenID Connect with verified-domain admission controls.
    enabled_copy: Expose this browser SSO provider when its client secret is available to the KAORI runtime.
    admission_label: Verified Email Domains
    admission_help: One domain per line or comma separated. The provider must return a verified email in an approved domain.
    client_secret_placeholder: KAORI_GOOGLE_CLIENT_SECRET
    guidance_partial: access/identity_providers/providers/google/_guidance.html
    browser_profile:
      protocol: oidc
      scopes:
        - openid
        - email
        - profile
      discovery_url: https://accounts.google.com/.well-known/openid-configuration
      authorization_url: null
      token_url: null
      userinfo_url: null
      identity_resolver_key: oidc_claims
      pkce_policy: preferred
      authorization_parameters:
        prompt: select_account

  - provider_key: github
    adapter_key: github_oauth2
    family: sso
    label: GitHub OAuth
    short_label: GitHub OAuth
    icon: github
    flow: browser
    configurable: true
    supports_jit: true
    configuration_profile: browser_client
    admission_policy: subject_allowlist
    description: Browser SSO through GitHub OAuth with explicit external-subject admission controls.
    enabled_copy: Expose this browser SSO provider when its client secret is available to the KAORI runtime.
    admission_label: Allowed Subjects
    admission_help: One subject per line or comma separated. Prefer immutable external subject IDs when the provider exposes them.
    client_secret_placeholder: KAORI_GITHUB_CLIENT_SECRET
    guidance_partial: access/identity_providers/providers/github/_guidance.html
    browser_profile:
      protocol: oauth2
      scopes:
        - read:user
        - user:email
      discovery_url: null
      authorization_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      userinfo_url: https://api.github.com/user
      identity_resolver_key: github
      pkce_policy: preferred
      authorization_parameters:
        allow_signup: 'false'
