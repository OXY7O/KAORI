schema_version: 1
kind: registered_jobs
jobs:
- key: kubernetes.inventory.sync
  name: Kubernetes Inventory Sync
  domain: Kubernetes Inventory
  description: Refresh Kubernetes inventory across eligible clusters.
  icon: database-zap
  queue_name: inventory
  workload_class: standard
  job_type: kubernetes_inventory
  operation: sync_kubernetes_inventory
  scope_type: kubernetes_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: clusters.sync
  dispatcher_path: app.kubernetes.inventory.job_adapter:dispatch_inventory_sync
  context_builder_path: app.kubernetes.inventory.job_adapter:build_inventory_sync_context
  configuration_template: platform_operations/jobs/configuration/definitions/inventory_sync.html
  default_enabled: true
  default_interval_minutes: 60
  safety_summary: Each cluster promotes inventory only after a complete generation commits successfully.
  execution_summary: Run a fleet inventory refresh and monitor the canonical execution without leaving this page.
  recent_execution_summary: Latest scheduled and manual fleet inventory synchronizations.
  legacy_module: inventory_sync
- key: kubernetes.tenant.sync
  name: Kubernetes Tenant Sync
  domain: Kubernetes Tenant
  description: Refresh committed Tenant inventory correlation across registered clusters.
  icon: building-2
  queue_name: inventory
  workload_class: standard
  job_type: kubernetes_tenant_inventory
  operation: sync_kubernetes_tenant_inventory
  scope_type: kubernetes_tenant_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: tenant.manage
  dispatcher_path: app.kubernetes.tenant.job_adapter:dispatch_tenant_sync
  context_builder_path: app.kubernetes.tenant.job_adapter:build_tenant_sync_context
  configuration_template: platform_operations/jobs/configuration/definitions/tenant_sync.html
  default_enabled: true
  default_interval_minutes: 60
  minimum_interval_minutes: 15
  maximum_interval_minutes: 1440
  safety_summary: >-
    Tenant sync materializes correlation from canonical KAORI Tenant state and committed Kubernetes inventory
    without provider mutation.
  execution_summary: Refresh the Tenant collection snapshot on the inventory worker and monitor the canonical execution.
  recent_execution_summary: Latest scheduled and manual Tenant inventory synchronization runs.
  legacy_module: kubernetes_tenant_sync
- key: object_storage.inventory.sync
  name: Object Storage Inventory Sync
  domain: Object Storage Inventory
  description: Refresh committed bucket inventory for eligible object storage systems.
  icon: database-zap
  queue_name: inventory
  workload_class: standard
  job_type: object_storage_inventory
  operation: sync_object_storage_inventory
  scope_type: object_storage_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: storage.sync
  dispatcher_path: app.storage.object_storage.inventory.job_adapter:dispatch_object_storage_inventory_sync
  context_builder_path: app.storage.object_storage.inventory.job_adapter:build_object_storage_inventory_sync_context
  configuration_template: platform_operations/jobs/configuration/definitions/object_storage_inventory_sync.html
  default_enabled: true
  default_interval_minutes: 60
  safety_summary: Each system replaces its committed bucket snapshot only after collection succeeds.
  execution_summary: Run an object-storage inventory refresh and monitor the canonical execution without leaving this page.
  recent_execution_summary: Latest scheduled and manual object-storage inventory synchronizations.
  legacy_module: object_storage_inventory_sync
- key: artifact_registry.inventory.sync
  name: Artifact Registry Inventory Sync
  domain: Artifact Registry
  description: Refresh committed provider-neutral Registry projects, repositories, artifacts, and tags.
  icon: package-search
  queue_name: inventory
  workload_class: standard
  job_type: artifact_registry_inventory
  operation: sync_artifact_registry_inventory
  scope_type: registry_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: artifact_registry.sync
  dispatcher_path: app.artifact_registry.job_adapter:dispatch_registry_inventory_sync
  context_builder_path: app.artifact_registry.job_adapter:build_registry_inventory_sync_context
  configuration_template: platform_operations/jobs/configuration/definitions/artifact_registry_inventory_sync.html
  default_enabled: true
  default_interval_minutes: 60
  minimum_interval_minutes: 15
  maximum_interval_minutes: 1440
  safety_summary: Each Registry provider replaces its committed snapshot only after provider collection succeeds.
  execution_summary: Run Registry reconciliation and monitor the canonical execution without querying providers from operational pages.
  recent_execution_summary: Latest scheduled and manual Artifact Registry reconciliation runs.
  legacy_module: artifact_registry_inventory_sync
- key: artifact_registry.security.sync
  name: Artifact Registry Security Sync
  domain: Artifact Registry
  description: Refresh committed vulnerability, signature, and SBOM evidence incrementally from Registry providers.
  icon: shield-check
  queue_name: registry-security
  workload_class: standard
  job_type: artifact_registry_security
  operation: sync_artifact_registry_security
  scope_type: registry_security_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: artifact_registry.sync
  dispatcher_path: app.artifact_registry.security.job_adapter:dispatch_registry_security_sync
  context_builder_path: app.artifact_registry.security.job_adapter:build_registry_security_sync_context
  configuration_template: platform_operations/jobs/configuration/definitions/artifact_registry_security_sync.html
  default_enabled: true
  default_interval_minutes: 60
  minimum_interval_minutes: 15
  maximum_interval_minutes: 1440
  safety_summary: Security refresh is read-only, reuses unchanged scan evidence, and never triggers provider scans.
  execution_summary: Refresh scanner and supply-chain evidence independently from the inventory correctness path.
  recent_execution_summary: Latest scheduled and manual Artifact Registry security evidence synchronizations.
  legacy_module: artifact_registry_security_sync
- key: artifact_registry.governance.sync
  name: Artifact Registry Governance Sync
  domain: Artifact Registry
  description: Refresh committed retention, immutability, webhook, and replication evidence from Registry providers.
  icon: scale
  queue_name: inventory
  workload_class: standard
  job_type: artifact_registry_governance
  operation: sync_artifact_registry_governance
  scope_type: registry_governance_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: artifact_registry.sync
  dispatcher_path: app.artifact_registry.governance_job_adapter:dispatch_registry_governance_sync
  context_builder_path: app.artifact_registry.governance_job_adapter:build_registry_governance_sync_context
  configuration_template: platform_operations/jobs/configuration/definitions/artifact_registry_governance_sync.html
  default_enabled: true
  default_interval_minutes: 360
  minimum_interval_minutes: 30
  maximum_interval_minutes: 1440
  safety_summary: Governance collection is read-only and never mutates Registry retention, immutability, webhook, or replication policy.
  execution_summary: Refresh provider governance evidence independently from inventory reconciliation.
  recent_execution_summary: Latest scheduled and manual Artifact Registry governance synchronizations.
  legacy_module: artifact_registry_governance_sync
- key: artifact_registry.runtime_correlation.materialize
  name: Artifact Registry Runtime Correlation
  domain: Artifact Registry
  description: Materialize committed Registry artifact to Kubernetes runtime image usage correlation.
  icon: waypoints
  queue_name: inventory
  workload_class: standard
  job_type: artifact_registry_runtime_correlation
  operation: materialize_artifact_registry_runtime_correlation
  scope_type: registry_kubernetes_correlation
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: artifact_registry.sync
  dispatcher_path: app.artifact_registry.correlation_job_adapter:dispatch_registry_runtime_correlation
  context_builder_path: app.artifact_registry.correlation_job_adapter:build_registry_runtime_correlation_context
  configuration_template: platform_operations/jobs/configuration/definitions/artifact_registry_runtime_correlation.html
  default_enabled: true
  default_interval_minutes: 60
  minimum_interval_minutes: 15
  maximum_interval_minutes: 1440
  safety_summary: Correlation reads committed Registry and current Kubernetes inventory only; no provider transport is used.
  execution_summary: Rebuild digest-first runtime blast-radius evidence independently from Registry collection.
  recent_execution_summary: Latest scheduled and manual Registry to Kubernetes runtime correlation materializations.
  legacy_module: artifact_registry_runtime_correlation
- key: artifact_registry.analytics.materialize
  name: Artifact Registry Analytics Data Refresh
  domain: Artifact Registry
  description: Materialize reusable Registry analytics from committed inventory, security, governance, runtime, and optional Metrics Source evidence.
  icon: chart-column
  queue_name: analytics-batch
  workload_class: analytics
  job_type: artifact_registry_analytics
  operation: materialize_artifact_registry_analytics
  scope_type: registry_analytics_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: artifact_registry.view
  dispatcher_path: app.artifact_registry.analytics_job_adapter:dispatch_registry_analytics_materialization
  context_builder_path: app.artifact_registry.analytics_job_adapter:build_registry_analytics_context
  configuration_template: platform_operations/jobs/configuration/definitions/artifact_registry_analytics_refresh.html
  default_enabled: true
  default_interval_minutes: 15
  minimum_interval_minutes: 5
  maximum_interval_minutes: 1440
  safety_summary: Analytics reads committed Registry evidence and qualified Metrics Source bindings, then commits reusable snapshots before pages can consume them.
  execution_summary: Refresh Artifact Registry analytics without issuing provider queries from user page requests.
  recent_execution_summary: Latest scheduled and manual Artifact Registry analytics materialization runs.
  default_configuration:
    freshness_minutes: 15
    stale_grace_minutes: 1440
  legacy_module: artifact_registry_analytics_refresh
- key: object_storage.analytics.materialize
  name: Object Storage Analytics Data Refresh
  domain: Object Storage Analytics
  description: Refresh Object Storage analytics snapshots.
  icon: chart-no-axes-combined
  queue_name: analytics-batch
  workload_class: analytics
  job_type: object_storage_analytics_materialization
  operation: materialize_object_storage_analytics
  scope_type: object_storage_analytics_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: object_storage_analytics.view
  dispatcher_path: app.storage.object_storage.analytics.job_adapter:dispatch_object_storage_analytics_materialization
  context_builder_path: app.storage.object_storage.analytics.job_adapter:build_object_storage_analytics_materialization_context
  configuration_template: platform_operations/jobs/configuration/definitions/analytics_refresh.html
  default_enabled: true
  default_interval_minutes: 15
  minimum_interval_minutes: 5
  maximum_interval_minutes: 1440
  safety_summary: >-
    Operational metrics and alert evidence are collected on the analytics worker and committed before pages can read them.
    The last usable snapshot remains available inside the stale-grace window.
  execution_summary: Refresh reusable Object Storage Analytics snapshots without querying providers from user page requests.
  recent_execution_summary: Latest Object Storage operational analytics snapshot refresh runs.
  default_configuration:
    time_ranges:
    - 24h
    - 7d
    - 30d
    - 60d
    freshness_minutes: 15
    stale_grace_minutes: 1440
  legacy_module: object_storage_analytics_refresh
- key: object_storage.forecast.materialize
  name: Object Storage Forecast Data Refresh
  domain: Object Storage Analytics
  description: Generate Object Storage capacity forecasts.
  icon: chart-spline
  queue_name: forecasting
  workload_class: forecasting
  job_type: object_storage_forecast_materialization
  operation: materialize_object_storage_forecast
  scope_type: object_storage_forecast_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: object_storage_analytics.view
  dispatcher_path: app.storage.object_storage.analytics.job_adapter:dispatch_object_storage_forecast_materialization
  context_builder_path: app.storage.object_storage.analytics.job_adapter:build_object_storage_forecast_materialization_context
  configuration_template: platform_operations/jobs/configuration/definitions/forecast_refresh.html
  default_enabled: true
  default_interval_minutes: 120
  minimum_interval_minutes: 30
  maximum_interval_minutes: 1440
  safety_summary: Forecast range queries run on the forecasting queue. The last usable committed result remains available
    when a refresh fails inside its stale-grace window.
  execution_summary: Generate reusable Object Storage forecast snapshots and monitor the forecasting worker.
  recent_execution_summary: Latest Object Storage forecast refresh runs.
  default_configuration:
    history_windows:
    - 7d
    - 30d
    - 90d
    freshness_minutes: 120
    stale_grace_minutes: 4320
  legacy_module: object_storage_forecast_refresh
- key: reports.schedule.dispatch
  name: Report Schedule Dispatcher
  domain: Reports
  description: Dispatch due report schedules through the Reports worker.
  icon: file-clock
  queue_name: reports
  workload_class: standard
  job_type: report_schedule
  operation: dispatch_due_reports
  scope_type: report_schedule
  scope_key: due
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: reports.manage_schedules
  dispatcher_path: app.reports.schedules.job_adapter:dispatch_report_schedule_job
  context_builder_path: app.reports.schedules.job_adapter:build_report_schedule_context
  configuration_template: platform_operations/jobs/configuration/definitions/report_schedule.html
  default_enabled: true
  default_interval_minutes: 5
  minimum_interval_minutes: 1
  maximum_interval_minutes: 60
  safety_summary: Each schedule creates a normal report record, stores its artifact through the configured backend, and records
    delivery results.
  execution_summary: Process due report schedules or run the dispatcher manually through the dedicated Reports queue.
  recent_execution_summary: Latest scheduled and manual report dispatcher executions.
  default_configuration:
    batch_limit: 20
  legacy_module: report_schedule
- key: governance.tls_certificates.sync
  name: TLS Certificate Sync
  domain: Kubernetes Governance
  description: Refresh TLS Secret inventory, Ingress usage, expiry, and freshness.
  icon: shield-check
  queue_name: inventory
  workload_class: standard
  job_type: tls_certificate_inventory
  operation: tls_certificate_sync
  scope_type: kubernetes_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: tls_certificates.sync
  dispatcher_path: app.kubernetes.governance.tls_certificates.job_adapter:dispatch_tls_certificate_sync
  context_builder_path: app.kubernetes.governance.tls_certificates.job_adapter:build_tls_certificate_sync_context
  configuration_template: platform_operations/jobs/configuration/definitions/tls_certificate_sync.html
  default_enabled: true
  default_interval_minutes: 360
  minimum_interval_minutes: 30
  maximum_interval_minutes: 1440
  safety_summary: Each cluster is collected independently and replaces only its committed TLS inventory after the Kubernetes
    API read completes.
  execution_summary: Refresh TLS Secret inventory across eligible clusters and monitor the active worker run.
  recent_execution_summary: Latest scheduled and manual TLS Secret inventory refreshes.
  legacy_module: tls_certificate_sync
- key: analytics.materialize
  name: Kubernetes Analytics Data Refresh
  domain: Kubernetes Analytics
  description: Refresh shared Kubernetes analytics snapshots.
  icon: chart-no-axes-combined
  queue_name: analytics-batch
  workload_class: analytics
  job_type: analytics_materialization
  operation: materialize_analytics
  scope_type: analytics_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: analytics.view
  dispatcher_path: app.kubernetes.analytics.job_adapter:dispatch_analytics_materialization
  context_builder_path: app.kubernetes.analytics.job_adapter:build_analytics_materialization_context
  configuration_template: platform_operations/jobs/configuration/definitions/analytics_refresh.html
  default_enabled: true
  default_interval_minutes: 15
  minimum_interval_minutes: 5
  maximum_interval_minutes: 1440
  safety_summary: Long-range results are generated once per cluster and parameter set, then shared by every user.
  execution_summary: Refresh shared analytics snapshots and monitor worker progress from one execution workspace.
  recent_execution_summary: Latest Kubernetes analytics snapshot refresh runs.
  default_configuration:
    time_ranges:
    - 24h
    - 7d
    - 30d
    - 60d
    freshness_minutes: 15
    stale_grace_minutes: 1440
  legacy_module: analytics_refresh
- key: analytics.forecast.materialize
  name: Kubernetes Forecast Data Refresh
  domain: Kubernetes Analytics
  description: Generate persistent capacity forecasts on the forecasting worker.
  icon: chart-spline
  queue_name: forecasting
  workload_class: forecasting
  job_type: forecast_materialization
  operation: materialize_forecast
  scope_type: forecast_fleet
  scope_key: all
  configure_permission: jobs.configure
  execute_permission: jobs.execute
  domain_execute_permission: analytics.view
  dispatcher_path: app.kubernetes.analytics.job_adapter:dispatch_forecast_materialization
  context_builder_path: app.kubernetes.analytics.job_adapter:build_forecast_materialization_context
  configuration_template: platform_operations/jobs/configuration/definitions/forecast_refresh.html
  default_enabled: true
  default_interval_minutes: 120
  minimum_interval_minutes: 30
  maximum_interval_minutes: 1440
  safety_summary: Forecast range queries run in the forecasting queue and the last successful result remains available during
    refresh.
  execution_summary: Generate reusable forecast history snapshots and monitor the forecasting worker.
  recent_execution_summary: Latest Kubernetes forecast refresh runs.
  default_configuration:
    history_windows:
    - 7d
    - 30d
    - 90d
    freshness_minutes: 120
    stale_grace_minutes: 4320
  legacy_module: forecast_refresh
