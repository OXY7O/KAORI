schema_version: 1
kind: notification_event_categories
categories:
  configmap_management:
    label: ConfigMap Management
    icon: file-cog
  tls_certificate:
    label: TLS Certificate
    icon: shield-check
  secret_management:
    label: Secret Management
    icon: key-round
  integrations:
    label: Integrations
    icon: plug-zap
  intelligence:
    label: Intelligence
    icon: brain-circuit
  platform_operations:
    label: Platform Operations
    icon: workflow
  access:
    label: Access
    icon: users-round
  settings:
    label: Settings
    icon: settings-2
  operations:
    label: Operations
    icon: history
routes:
  - category: configmap_management
    prefixes: [kubernetes_configmap_]
  - category: tls_certificate
    prefixes: [governance_tls_, kubernetes_tls_secret_]
  - category: platform_operations
    prefixes:
      - kubernetes_secret_reveal_cluster_readiness_
      - kubernetes_secret_reveal_namespace_policy_
      - data_lifecycle_
      - job_
      - report_
      - generated_report_
      - generated_reports_
  - category: secret_management
    prefixes: [kubernetes_secret_]
  - category: integrations
    exact: [kubernetes_inventory_sync]
    prefixes:
      - metrics_source_
      - alertmanager_
      - cluster_
      - kubernetes_capability_
      - kubernetes_runtime_
      - integration_
      - integration.
  - category: intelligence
    prefixes:
      - alert_case_
      - alert_routing_
      - alert_notification_
      - recommendation_alert_
  - category: settings
    exact: [user_preference, account_security]
    prefixes: [settings_]
  - category: access
    exact: [authentication]
    prefixes: [rbac_, identity_provider_, external_identity_, user_]
default_category: operations
