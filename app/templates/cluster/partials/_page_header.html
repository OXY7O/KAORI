<div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-blue-700 via-blue-600 to-cyan-500 p-6 text-white shadow-lg shadow-blue-500/20 sm:px-7">
    <div class="pointer-events-none absolute -right-14 -top-16 h-48 w-48 rounded-full border border-white/10 bg-white/5"></div>
    <div class="pointer-events-none absolute -bottom-20 right-24 h-44 w-44 rounded-full border border-white/10 bg-white/5"></div>
    <div class="relative flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
        <div class="flex items-start gap-4">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white/15 text-white ring-1 ring-white/25 backdrop-blur">
                <i data-lucide="{{ page_icon }}" class="h-7 w-7"></i>
            </div>
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white">{{ page_title }}</h1>
                <p class="mt-2 max-w-3xl text-sm leading-6 text-blue-50/90 sm:text-base">{{ page_description }}</p>
                <div class="mt-4 flex flex-wrap gap-2">
                    {% for badge in page_badges %}
                        <span class="inline-flex items-center gap-1.5 rounded-lg bg-white/15 px-3 py-1 text-xs font-semibold text-white ring-1 ring-white/20 backdrop-blur">
                            {{ badge.label }}
                        </span>
                    {% endfor %}
                </div>
            </div>
        </div>
        <a href="{{ url_for('cluster.list_clusters') }}"
           class="inline-flex items-center justify-center gap-2 rounded-xl bg-white/15 px-4 py-2.5 text-sm font-semibold text-white shadow-sm ring-1 ring-white/25 backdrop-blur transition hover:bg-white/25 focus:outline-none focus:ring-4 focus:ring-white/20">
            <i data-lucide="arrow-left" class="h-4 w-4"></i>
            <span>Back to Clusters</span>
        </a>
    </div>
</div>
