{% if inventory_summary.get(cluster.id, {}).get('synced_at') %}
    <span class="inline-flex items-center gap-1.5 rounded-full border border-status-normal-border bg-status-normal-soft px-2.5 py-1 text-xs font-semibold text-status-normal-text">
        <i data-lucide="circle-check" class="h-3.5 w-3.5"></i>
        Synced
    </span>
{% else %}
    <span class="inline-flex items-center gap-1.5 rounded-full border border-status-unknown-border bg-status-unknown-soft px-2.5 py-1 text-xs font-semibold text-status-unknown-text">
        <i data-lucide="clock-3" class="h-3.5 w-3.5"></i>
        Never synced
    </span>
{% endif %}
