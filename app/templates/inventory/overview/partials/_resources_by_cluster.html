<div id="resources-by-cluster" class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <div class="border-b border-slate-200 px-6 py-5 dark:border-slate-700">
        <div class="flex flex-col gap-3 xl:flex-row xl:items-start xl:justify-between">
            <div>
                <h2 class="text-lg font-semibold text-slate-950 dark:text-white">Resources By Cluster</h2>
                <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
                    Compare collected Kubernetes resources per cluster and verify the latest inventory sync status.
                </p>
            </div>
            <a href="{{ url_for('cluster.list_clusters') }}"
               class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
                <i data-lucide="external-link" class="h-4 w-4"></i>
                Open Cluster List
            </a>
        </div>
        <div id="resources-by-cluster-loading"
             class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-blue-100 dark:bg-blue-950/60">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-blue-600 dark:bg-blue-400"></div>
        </div>
    </div>
    <div id="resources-by-cluster-content">
        {% include "inventory/overview/partials/_resources_by_cluster_content.html" %}
    </div>
</div>
