<section id="storage-inventory-card" class="overflow-hidden rounded-xl border border-outline-default bg-surface-card shadow-sm">
    <header class="border-b border-outline-subtle px-5 py-4">
        <div class="flex flex-col gap-3 xl:flex-row xl:items-start xl:justify-between">
            <div class="flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary"><i data-lucide="hard-drive" class="h-5 w-5"></i></span>
                <div><h2 class="text-lg font-semibold text-content-primary">Storage Inventory</h2><p class="mt-1 text-sm leading-6 text-content-muted">StorageClass, PersistentVolume, and PersistentVolumeClaim metadata and bindings.</p></div>
            </div>
            <a href="{{ url_for('cluster.list_clusters') }}" class="inline-flex h-9 items-center justify-center gap-2 rounded-lg border border-outline-default bg-surface-card px-3 text-xs font-semibold text-content-secondary transition hover:border-outline-focus hover:bg-kaori-soft hover:text-kaori-primary"><i data-lucide="external-link" class="h-4 w-4"></i>Open Cluster List</a>
        </div>
        <div id="storage-table-loading" class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-kaori-soft"><div class="h-full w-1/3 animate-pulse rounded-full bg-kaori-primary"></div></div>
    </header>

    <div class="border-b border-outline-subtle px-5 py-4">
        <form id="storage-filter-form" hx-get="{{ url_for('inventory.storage') }}" hx-target="#storage-inventory-card" hx-swap="outerHTML" hx-trigger="change, keyup changed delay:500ms" hx-indicator="#storage-table-loading" class="grid gap-4 xl:grid-cols-12 xl:items-end">
            <input type="hidden" name="page" value="1"><input type="hidden" name="per_page" value="{{ pagination.per_page }}">
            <div class="xl:col-span-2"><label class="mb-2 block text-sm font-semibold text-content-primary">Cluster</label><select name="cluster_id" class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20"><option value="">All Clusters</option>{% for cluster in clusters %}<option value="{{ cluster.id }}" {% if selected_cluster_id == cluster.id|string or selected_cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>{% endfor %}</select></div>
            <div class="xl:col-span-2"><label class="mb-2 block text-sm font-semibold text-content-primary">Namespace</label><select name="namespace" class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20"><option value="">All Namespaces</option>{% for ns in inventory.namespaces %}<option value="{{ ns }}" {% if selected_namespace == ns %}selected{% endif %}>{{ ns }}</option>{% endfor %}</select></div>
            <div class="xl:col-span-2"><label class="mb-2 block text-sm font-semibold text-content-primary">Type</label><select name="type" class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20"><option value="">All Types</option>{% for type_name in inventory.storage_filter_types %}<option value="{{ type_name }}" {% if selected_type == type_name %}selected{% endif %}>{{ 'PV' if type_name == 'PersistentVolume' else 'PVC' if type_name == 'PersistentVolumeClaim' else type_name }}</option>{% endfor %}</select></div>
            <div class="xl:col-span-2"><label class="mb-2 block text-sm font-semibold text-content-primary">Status</label><select name="status" class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20"><option value="">All Statuses</option>{% for status_name in inventory.storage_filter_statuses %}<option value="{{ status_name }}" {% if selected_status == status_name %}selected{% endif %}>{{ status_name }}</option>{% endfor %}</select></div>
            <div class="xl:col-span-4"><label class="mb-2 block text-sm font-semibold text-content-primary">Search storage</label><div class="relative"><i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-muted"></i><input type="search" name="search" value="{{ search }}" placeholder="Name, class, or status" class="h-11 w-full rounded-lg border border-outline-default bg-surface-card pl-10 pr-3 text-sm font-medium text-content-primary outline-none transition placeholder:text-content-disabled focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20"></div></div>
        </form>
    </div>
    <div id="storage-table-content">{% include "inventory/storage/partials/_table_content.html" %}</div>
</section>
