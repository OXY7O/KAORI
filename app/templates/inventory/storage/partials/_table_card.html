<div id="storage-inventory-card" class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <div class="border-b border-slate-200 px-6 py-5 dark:border-slate-700">
        <div class="flex flex-col gap-3 xl:flex-row xl:items-start xl:justify-between">
            <div class="flex items-center gap-3">
                <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-blue-600 dark:bg-blue-500/10 dark:text-blue-300">
                    <i data-lucide="hard-drive" class="h-5 w-5"></i>
                </div>
                <div>
                    <h2 class="text-lg font-semibold text-slate-950 dark:text-white">Storage Inventory</h2>
                    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">StorageClass, PersistentVolume, and PersistentVolumeClaim metadata and bindings.</p>
                </div>
            </div>

            <a href="{{ url_for('cluster.list_clusters') }}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
                <i data-lucide="external-link" class="h-4 w-4"></i>
                Open Cluster List
            </a>
        </div>

        <div id="storage-table-loading" class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-blue-100 dark:bg-blue-950/60">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-blue-600 dark:bg-blue-400"></div>
        </div>
    </div>

    <div class="border-b border-slate-200 px-6 py-4 dark:border-slate-700">
        <form id="storage-filter-form"
              hx-get="{{ url_for('inventory.storage') }}"
              hx-target="#storage-inventory-card"
              hx-swap="outerHTML"
              hx-trigger="change, keyup changed delay:500ms"
              hx-indicator="#storage-table-loading"
              class="grid gap-4 xl:grid-cols-12 xl:items-end">
            <input type="hidden" name="page" value="1" />
            <input type="hidden" name="per_page" value="{{ pagination.per_page }}" />

            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Cluster</label>
                <select name="cluster_id" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    <option value="">All Clusters</option>
                    {% for cluster in clusters %}
                        <option value="{{ cluster.id }}" {% if selected_cluster_id == cluster.id|string or selected_cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Namespace</label>
                <select name="namespace" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    <option value="">All Namespaces</option>
                    {% for ns in inventory.namespaces %}
                        <option value="{{ ns }}" {% if selected_namespace == ns %}selected{% endif %}>{{ ns }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Type</label>
                <select name="type" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    <option value="">All Types</option>
                    {% for type_name in inventory.storage_filter_types %}
                        <option value="{{ type_name }}" {% if selected_type == type_name %}selected{% endif %}>{{ 'PV' if type_name == 'PersistentVolume' else 'PVC' if type_name == 'PersistentVolumeClaim' else type_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Status</label>
                <select name="status" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    <option value="">All Statuses</option>
                    {% for status_name in inventory.storage_filter_statuses %}
                        <option value="{{ status_name }}" {% if selected_status == status_name %}selected{% endif %}>{{ status_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="xl:col-span-4">
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Search Storage</label>
                <div class="relative">
                    <i data-lucide="search" class="absolute top-3 left-3 h-4 w-4 text-slate-400 dark:text-slate-500"></i>
                    <input type="text" name="search" value="{{ search }}" placeholder="Name, class, status..." class="w-full rounded-xl border border-slate-300 bg-white py-2 pr-3 pl-10 text-sm text-slate-900 transition outline-none placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:focus:ring-blue-400/10" />
                </div>
            </div>
        </form>
    </div>

    <div id="storage-table-content">
        {% include "inventory/storage/partials/_table_content.html" %}
    </div>
</div>
