<div id="configuration-inventory-card" class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <div class="border-b border-slate-200 px-6 py-5 dark:border-slate-700">
        <div class="flex items-center gap-3"><div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-blue-600 dark:bg-blue-500/10 dark:text-blue-300"><i data-lucide="file-key-2" class="h-5 w-5"></i></div><div><h2 class="text-lg font-semibold text-slate-950 dark:text-white">Configuration Inventory</h2><p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Secret values are never stored; only safe metadata and usage references are collected.</p></div></div>
        <div id="configuration-table-loading" class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-blue-100 dark:bg-blue-950/60"><div class="h-full w-1/3 animate-pulse rounded-full bg-blue-600 dark:bg-blue-400"></div></div>
    </div>
    <div class="border-b border-slate-200 px-6 py-4 dark:border-slate-700">
        <form hx-get="{{ url_for('inventory.configuration') }}" hx-target="#configuration-inventory-card" hx-swap="outerHTML" hx-trigger="change from:select, keyup changed delay:500ms from:input[name='search']" hx-indicator="#configuration-table-loading" class="grid gap-4 xl:grid-cols-[1fr_1fr_0.8fr_1.4fr] xl:items-end">
            <input type="hidden" name="page" value="1"><input type="hidden" name="per_page" value="{{ pagination.per_page }}">
            <div><label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Cluster</label><select name="cluster_id" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100"><option value="">All Clusters</option>{% for cluster in clusters %}<option value="{{ cluster.id }}" {% if selected_cluster_id == cluster.id|string or selected_cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>{% endfor %}</select></div>
            <div><label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Namespace</label><select name="namespace" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100"><option value="">All Namespaces</option>{% for ns in inventory.namespaces %}<option value="{{ ns }}" {% if selected_namespace == ns %}selected{% endif %}>{{ ns }}</option>{% endfor %}</select></div>
            <div><label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Type</label><select name="type" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100"><option value="">All Types</option>{% for type_name in inventory.types %}<option value="{{ type_name }}" {% if selected_type == type_name %}selected{% endif %}>{{ type_name }}</option>{% endfor %}</select></div>
            <div><label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Search Object</label><div class="relative"><i data-lucide="search" class="absolute top-3 left-3 h-4 w-4 text-slate-400"></i><input name="search" value="{{ search }}" placeholder="Search ConfigMap or Secret..." class="w-full rounded-xl border border-slate-300 bg-white py-2 pr-3 pl-10 text-sm dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100"></div></div>
        </form>
    </div>
    <div id="configuration-table-content">{% include "inventory/configuration/partials/_table_content.html" %}</div>
</div>
