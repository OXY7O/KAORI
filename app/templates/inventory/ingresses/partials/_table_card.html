<section id="ingresses-inventory-card"
         class="overflow-hidden rounded-xl border border-outline-default bg-surface-card shadow-sm">
    <header class="border-b border-outline-subtle px-5 py-4">
        <div class="flex items-start gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                <i data-lucide="route" class="h-5 w-5"></i>
            </span>
            <div>
                <h2 class="text-lg font-semibold text-content-primary">Ingress Inventory</h2>
                <p class="mt-1 text-sm leading-6 text-content-muted">Ingress identity, class, published hosts, TLS configuration, addresses, and backend routing context.</p>
            </div>
        </div>
        <div id="ingresses-table-loading"
             class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-kaori-soft">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-kaori-primary"></div>
        </div>
    </header>
    <div class="border-b border-outline-subtle px-5 py-4">
        <form id="ingresses-filter-form"
              hx-get="{{ url_for('inventory.ingresses') }}"
              hx-target="#ingresses-inventory-scope"
              hx-swap="outerHTML"
              hx-trigger="change from:select, keyup changed delay:500ms from:input[name='search']"
              hx-indicator="#ingresses-table-loading"
              class="grid gap-4 xl:grid-cols-12 xl:items-end">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="per_page" value="{{ pagination.per_page }}">
            <input type="hidden" name="partial_mode" value="inventory_scope" />
            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-content-secondary">Cluster</label>
                <select name="cluster_id"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All Clusters</option>
                    {% for cluster in clusters %}
                        <option value="{{ cluster.id }}"
                                {% if selected_cluster_id == cluster.id|string or selected_cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-content-secondary">Namespace</label>
                <select name="namespace"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All Namespaces</option>
                    {% for ns in inventory.namespaces %}
                        <option value="{{ ns }}" {% if selected_namespace == ns %}selected{% endif %}>{{ ns }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-content-secondary">Ingress class</label>
                <select name="class"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All Classes</option>
                    {% for class_name in inventory.classes %}
                        <option value="{{ class_name }}"
                                {% if selected_class == class_name %}selected{% endif %}>{{ class_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="xl:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-content-secondary">TLS state</label>
                <select name="tls"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All TLS States</option>
                    <option value="enabled" {% if selected_tls == 'enabled' %}selected{% endif %}>TLS Enabled</option>
                    <option value="disabled"
                            {% if selected_tls == 'disabled' %}selected{% endif %}>No TLS</option>
                </select>
            </div>
            <div class="xl:col-span-4">
                <label class="mb-2 block text-sm font-semibold text-content-secondary">Search ingress</label>
                <div class="relative">
                    <i data-lucide="search"
                       class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-muted"></i>
                    <input type="search"
                           name="search"
                           value="{{ search }}"
                           placeholder="Name, host, address, or class"
                           class="h-11 w-full rounded-lg border border-outline-default bg-surface-card pl-10 pr-3 text-sm font-medium text-content-primary outline-none transition placeholder:text-content-disabled focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                </div>
            </div>
        </form>
    </div>
    <div id="ingresses-table-content">{% include "inventory/ingresses/partials/_table_content.html" %}</div>
</section>
