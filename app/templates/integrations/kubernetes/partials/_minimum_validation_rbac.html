<section x-data="{
             open: false,
             activeExample: 'baseline',
             copied: '',
             copyYaml(refName, copiedKey) {
                 const value = this.$refs[refName]?.textContent?.trim();
                 if (!value || !navigator.clipboard) return;
                 navigator.clipboard.writeText(value).then(() => {
                     this.copied = copiedKey;
                     window.setTimeout(() => { if (this.copied === copiedKey) this.copied = ''; }, 1600);
                 });
             }
         }"
         class="rounded-xl border border-outline-subtle bg-surface-card">
    <div class="flex flex-col gap-4 p-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex min-w-0 items-start gap-3">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-outline-subtle bg-surface-card text-content-secondary" aria-hidden="true">
                <i data-lucide="shield-check" class="h-4 w-4"></i>
            </span>
            <div class="min-w-0">
                <p class="text-sm font-semibold text-content-primary">Minimum Validation RBAC Examples</p>
                <p class="mt-1 text-xs leading-5 text-content-secondary">Open the baseline and optional namespace-scoped manifests in one copy-friendly workspace. Secret access remains outside the baseline contract.</p>
            </div>
        </div>
        <button type="button"
                @click="activeExample = 'baseline'; open = true; $nextTick(() => $refs.rbacDialog?.focus())"
                aria-haspopup="dialog"
                aria-controls="kubernetes-rbac-examples-modal"
                class="inline-flex h-10 shrink-0 items-center justify-center gap-2 rounded-lg border border-outline-default bg-surface-card px-4 text-sm font-semibold text-content-primary transition hover:border-outline-strong hover:bg-kaori-mist focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus">
            <i data-lucide="file-code-2" class="h-4 w-4" aria-hidden="true"></i>
            Open RBAC Examples
        </button>
    </div>

    <template x-teleport="body">
        <div id="kubernetes-rbac-examples-modal"
             x-show="open"
             x-cloak
             x-transition.opacity
             @keydown.escape.window="open = false"
             class="fixed inset-0 z-[90] flex items-center justify-center p-2 sm:p-4 lg:p-6">
            <button type="button"
                    @click="open = false"
                    class="absolute inset-0 h-full w-full cursor-default bg-surface-overlay/70 backdrop-blur-sm"
                    aria-label="Close Minimum Validation RBAC Examples"></button>

            <section x-ref="rbacDialog"
                     role="dialog"
                     aria-modal="true"
                     aria-labelledby="kubernetes-rbac-examples-title"
                     tabindex="-1"
                     class="relative flex h-[calc(100dvh-1rem)] w-[calc(100vw-1rem)] max-w-6xl flex-col overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-2xl sm:h-[calc(100dvh-2rem)] sm:w-[calc(100vw-2rem)] lg:h-[calc(100dvh-3rem)] lg:w-[calc(100vw-3rem)]">
                <header class="shrink-0 border-b border-outline-subtle px-4 py-3 sm:px-5 sm:py-4">
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex min-w-0 items-start gap-3">
                            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-outline-subtle bg-surface-card text-content-secondary" aria-hidden="true">
                                <i data-lucide="shield-check" class="h-5 w-5"></i>
                            </span>
                            <div class="min-w-0">
                                <h2 id="kubernetes-rbac-examples-title" class="text-base font-semibold text-content-primary">Minimum Validation RBAC Examples</h2>
                                <p class="mt-1 text-xs leading-5 text-content-secondary">Copy the baseline manifest first. Add the optional Secret reader only to explicitly approved namespaces.</p>
                            </div>
                        </div>
                        <button type="button"
                                @click="open = false"
                                class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-outline-default bg-surface-card text-content-muted transition hover:bg-kaori-mist focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus"
                                aria-label="Close Minimum Validation RBAC Examples">
                            <i data-lucide="x" class="h-4 w-4"></i>
                        </button>
                    </div>
                    <div class="mt-4 flex gap-2 overflow-x-auto" role="tablist" aria-label="Kubernetes RBAC examples">
                        <button type="button"
                                role="tab"
                                :aria-selected="activeExample === 'baseline'"
                                @click="activeExample = 'baseline'"
                                :class="activeExample === 'baseline' ? 'border-outline-strong bg-surface-hover text-content-primary' : 'border-outline-default bg-surface-card text-content-secondary'"
                                class="inline-flex min-h-9 shrink-0 items-center gap-2 rounded-lg border px-3 text-xs font-semibold transition hover:bg-kaori-mist">
                            <i data-lucide="shield-check" class="h-3.5 w-3.5" aria-hidden="true"></i>
                            Validation Baseline
                        </button>
                        <button type="button"
                                role="tab"
                                :aria-selected="activeExample === 'secret-reader'"
                                @click="activeExample = 'secret-reader'"
                                :class="activeExample === 'secret-reader' ? 'border-outline-strong bg-surface-hover text-content-primary' : 'border-outline-default bg-surface-card text-content-secondary'"
                                class="inline-flex min-h-9 shrink-0 items-center gap-2 rounded-lg border px-3 text-xs font-semibold transition hover:bg-kaori-mist">
                            <i data-lucide="key-round" class="h-3.5 w-3.5" aria-hidden="true"></i>
                            Optional Secret Reader
                        </button>
                    </div>
                </header>

                <div class="min-h-0 flex-1 overflow-y-auto bg-surface-page p-4 sm:p-5">
                    <div x-show="activeExample === 'baseline'" class="space-y-4">
                        <div class="flex flex-col gap-3 rounded-xl border border-outline-subtle bg-surface-card p-4 sm:flex-row sm:items-start sm:justify-between">
                            <div>
                                <p class="text-sm font-semibold text-content-primary">Validation Baseline · ClusterRole and ClusterRoleBinding</p>
                                <p class="mt-1 text-xs leading-5 text-content-secondary">Read-only discovery and inventory metadata. The baseline intentionally excludes Secrets and write verbs.</p>
                            </div>
                            <button type="button"
                                    @click="copyYaml('baselineYaml', 'baseline')"
                                    class="inline-flex h-9 shrink-0 items-center justify-center gap-2 rounded-lg border border-outline-default bg-surface-card px-3 text-xs font-semibold text-content-primary transition hover:bg-kaori-mist">
                                <i data-lucide="copy" class="h-3.5 w-3.5" aria-hidden="true"></i>
                                <span x-text="copied === 'baseline' ? 'Copied' : 'Copy Baseline YAML'">Copy Baseline YAML</span>
                            </button>
                        </div>
                        <div class="overflow-x-auto rounded-xl border border-outline-default bg-content-primary p-4">
                            <pre class="min-w-max text-xs leading-5 text-surface-card"><code x-ref="baselineYaml">apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaori
  namespace: kaori-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaori-validation-reader
rules:
  - nonResourceURLs: ["/api", "/apis", "/version", "/healthz", "/readyz"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "endpoints", "persistentvolumes", "persistentvolumeclaims", "resourcequotas", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaori-validation-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kaori-validation-reader
subjects:
  - kind: ServiceAccount
    name: kaori
    namespace: kaori-system</code></pre>
                        </div>
                        <div class="rounded-xl border border-outline-subtle bg-surface-card p-4">
                            <p class="text-xs font-semibold text-content-primary">Baseline Boundary</p>
                            <p class="mt-1 text-xs leading-5 text-content-secondary">This manifest supports discovery, normalized inventory, compatibility validation, and effective read-access checks. It does not grant Secret access or operational write permissions.</p>
                        </div>
                    </div>

                    <div x-show="activeExample === 'secret-reader'" x-cloak class="space-y-4">
                        <div class="flex flex-col gap-3 rounded-xl border border-outline-subtle bg-surface-card p-4 sm:flex-row sm:items-start sm:justify-between">
                            <div>
                                <p class="text-sm font-semibold text-content-primary">Optional Governance Secret Reader · Namespace Scope</p>
                                <p class="mt-1 text-xs leading-5 text-content-secondary">Create one Role and RoleBinding per approved namespace used by TLS Governance or an explicitly approved Secret metadata workflow.</p>
                            </div>
                            <button type="button"
                                    @click="copyYaml('secretReaderYaml', 'secret-reader')"
                                    class="inline-flex h-9 shrink-0 items-center justify-center gap-2 rounded-lg border border-outline-default bg-surface-card px-3 text-xs font-semibold text-content-primary transition hover:bg-kaori-mist">
                                <i data-lucide="copy" class="h-3.5 w-3.5" aria-hidden="true"></i>
                                <span x-text="copied === 'secret-reader' ? 'Copied' : 'Copy Secret Reader YAML'">Copy Secret Reader YAML</span>
                            </button>
                        </div>
                        <div class="overflow-x-auto rounded-xl border border-outline-default bg-content-primary p-4">
                            <pre class="min-w-max text-xs leading-5 text-surface-card"><code x-ref="secretReaderYaml">apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaori-governance-secret-reader
  namespace: &lt;approved-namespace&gt;
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaori-governance-secret-reader
  namespace: &lt;approved-namespace&gt;
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaori-governance-secret-reader
subjects:
  - kind: ServiceAccount
    name: kaori
    namespace: kaori-system</code></pre>
                        </div>
                        <div class="rounded-xl border border-status-warning-border bg-surface-card p-4">
                            <div class="flex items-start gap-3">
                                <i data-lucide="triangle-alert" class="mt-0.5 h-4 w-4 shrink-0 text-status-warning-text" aria-hidden="true"></i>
                                <div>
                                    <p class="text-xs font-semibold text-status-warning-text">Sensitive Permission</p>
                                    <p class="mt-1 text-xs leading-5 text-content-secondary">Kubernetes get/list permission on Secrets can expose Secret data returned by the API. Grant this Role only in explicitly approved namespaces and keep KAORI allow-list, protected-secret, reveal, and Activity Audit guardrails enabled.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <footer class="flex shrink-0 items-center justify-between gap-3 border-t border-outline-subtle bg-surface-card px-4 py-3 sm:px-5">
                    <p class="hidden text-xs leading-5 text-content-muted sm:block">Apply manifests using the same service-account identity registered in KAORI, then rerun Full Validation.</p>
                    <button type="button"
                            @click="open = false"
                            class="ml-auto inline-flex h-9 items-center justify-center gap-2 rounded-lg border border-outline-default bg-surface-card px-4 text-xs font-semibold text-content-secondary transition hover:bg-kaori-mist">
                        <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                        Close
                    </button>
                </footer>
            </section>
        </div>
    </template>
</section>
