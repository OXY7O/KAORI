<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div class="min-w-0">
        <label for="notification-telegram-token"
               class="{{ table_ui.filter_label_classes() }}">Bot Token</label>
        <input id="notification-telegram-token"
               name="bot_token"
               type="password"
               autocomplete="new-password"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="{{ 'Leave blank to keep current token' if form_channel and form_channel.credential_configured else 'BotFather token' }}">
    </div>
    <div class="min-w-0">
        <label for="notification-telegram-chat-id"
               class="{{ table_ui.filter_label_classes() }}">Chat ID / @Channel</label>
        <input id="notification-telegram-chat-id"
               name="target_chat_id"
               value="{{ form_channel.target_chat_id if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="-1001234567890 or @channel">
    </div>
    <div class="min-w-0">
        <label for="telegram-topic-id"
               class="{{ table_ui.filter_label_classes() }}">Telegram Topic ID (Optional)</label>
        <input id="telegram-topic-id"
               name="telegram_topic_id"
               type="text"
               inputmode="numeric"
               pattern="[0-9]*"
               value="{{ form_channel.telegram_topic_id if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="123">
    </div>
</div>
