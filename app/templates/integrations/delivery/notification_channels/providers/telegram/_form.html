<div class="grid gap-4 sm:grid-cols-2">
    <div>
        <label class="{{ table_ui.filter_label_classes() }}">Bot Token</label>
        <input name="bot_token"
               type="password"
               autocomplete="new-password"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="{{ 'Leave blank to keep current token' if form_channel and form_channel.credential_configured else 'BotFather token' }}">
        <p class="mt-1 text-xs leading-5 text-content-muted">Stored as a secret and never rendered back after save.</p>
    </div>
    <div>
        <label class="{{ table_ui.filter_label_classes() }}">Chat ID / @Channel</label>
        <input name="target_chat_id"
               value="{{ form_channel.target_chat_id if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="-1001234567890 or @channel">
        <p class="mt-1 text-xs leading-5 text-content-muted">The bot must already be able to post to this destination.</p>
    </div>
    <div class="sm:col-span-2">
        <label for="telegram-topic-id"
               class="{{ table_ui.filter_label_classes() }}">Telegram Topic ID (optional)</label>
        <input id="telegram-topic-id"
               name="telegram_topic_id"
               type="text"
               inputmode="numeric"
               pattern="[0-9]*"
               value="{{ form_channel.telegram_topic_id if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }} max-w-sm"
               placeholder="123">
        <p class="mt-1 text-xs leading-5 text-content-muted">
            Numeric Telegram message_thread_id of a Forum Topic in your supergroup.
            Leave blank for ordinary chat delivery. Changing this requires a new Test Delivery.
        </p>
    </div>
</div>
