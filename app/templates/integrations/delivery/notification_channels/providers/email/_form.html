<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div>
        <label for="smtp-host" class="{{ table_ui.filter_label_classes() }}">SMTP Host</label>
        <input id="smtp-host" name="smtp_host"
               value="{{ form_channel.smtp_host if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="smtp.example.com">
    </div>
    <div>
        <label for="smtp-port" class="{{ table_ui.filter_label_classes() }}">SMTP Port</label>
        <input id="smtp-port" name="smtp_port"
               type="number"
               min="1"
               max="65535"
               value="{{ form_channel.smtp_port if form_channel else 587 }}"
               class="{{ table_ui.filter_input_classes() }}">
    </div>
    <div>
        <label for="smtp-security" class="{{ table_ui.filter_label_classes() }}">Transport Security</label>
        <select id="smtp-security" name="smtp_security" class="{{ table_ui.filter_select_classes() }}">
            {% for option in payload.smtp_security_options %}
                <option value="{{ option.value }}"
                        {% if (form_channel.smtp_security if form_channel else 'starttls') == option.value %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label for="smtp-username" class="{{ table_ui.filter_label_classes() }}">SMTP Username</label>
        <input id="smtp-username" name="smtp_username"
               value="{{ form_channel.smtp_username if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="Optional for trusted relay">
    </div>
    <div>
        <label for="smtp-password" class="{{ table_ui.filter_label_classes() }}">SMTP Password</label>
        <input id="smtp-password" name="smtp_password"
               type="password"
               autocomplete="new-password"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="{{ 'Leave blank to keep current password' if form_channel and form_channel.credential_configured else 'Required when username is set' }}">
    </div>
    <div>
        <label for="smtp-sender-name" class="{{ table_ui.filter_label_classes() }}">Sender Name</label>
        <input id="smtp-sender-name" name="sender_name"
               value="{{ form_channel.sender_name if form_channel else 'KAORI' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="KAORI">
    </div>
    <div>
        <label for="smtp-sender-email" class="{{ table_ui.filter_label_classes() }}">Sender Email</label>
        <input id="smtp-sender-email" name="sender_email"
               type="email"
               value="{{ form_channel.sender_email if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="kaori@example.com">
    </div>
    <div class="sm:col-span-2">
        <label for="smtp-recipients" class="{{ table_ui.filter_label_classes() }}">Recipients</label>
        <input id="smtp-recipients" name="email_recipients"
               value="{{ form_channel.email_recipients if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="noc@example.com, platform@example.com">
    </div>
</div>
