<div class="grid gap-4 sm:grid-cols-2">
    <div class="min-w-0">
        <label for="teams-destination" class="{{ table_ui.filter_label_classes() }}">Destination Label</label>
        <input id="teams-destination"
               name="teams_destination"
               value="{{ form_channel.teams_destination if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="Platform Ops / Alert Intelligence">
    </div>
    <div class="min-w-0">
        <label for="teams-workflow-url"
               class="{{ table_ui.filter_label_classes() }}">Workflow Webhook URL</label>
        <input id="teams-workflow-url"
               name="teams_workflow_url"
               type="password"
               autocomplete="new-password"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="{{ 'Leave blank to keep current webhook URL' if form_channel and form_channel.credential_configured else 'https://...environment.api.powerplatform.com/...' }}">
    </div>
</div>
