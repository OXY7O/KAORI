{% import "components/table_primitives.html" as table_ui %}
<dialog id="notification-channel-actions-{{ channel.id }}"
        data-kaori-native-dialog
        aria-labelledby="notification-channel-actions-title-{{ channel.id }}"
        aria-describedby="notification-channel-actions-description-{{ channel.id }}"
        class="kaori-native-dialog m-auto w-[calc(100vw-1.5rem)] max-w-sm overflow-hidden rounded-2xl border border-outline-default bg-surface-card p-0 shadow-2xl sm:w-[calc(100vw-3rem)]">
    <section class="flex max-h-[calc(100dvh-2rem)] min-h-0 flex-col">
        <header class="flex items-start justify-between gap-3 border-b border-outline-subtle px-5 py-4">
            <div class="min-w-0">
                <h2 id="notification-channel-actions-title-{{ channel.id }}" autofocus tabindex="-1"
                    class="text-base font-semibold text-content-primary">Channel Actions</h2>
                <p id="notification-channel-actions-description-{{ channel.id }}"
                   class="mt-1 break-words text-xs text-content-muted">{{ channel.name }} · {{ channel.provider_label }}</p>
            </div>
            <button type="button" data-kaori-dialog-close aria-label="Close actions for {{ channel.name }}"
                    class="{{ table_ui.action_classes() }}">
                <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
            </button>
        </header>
        <div class="min-h-0 space-y-2 overflow-y-auto p-4">
            <a href="{{ url_for('notification_channels.index',
                            tab='channels', edit=channel.id, configure=1,
                            channel_search=payload.channel_filters.search,
                            channel_provider=payload.channel_filters.provider,
                            channel_state=payload.channel_filters.state,
                            channel_page=payload.channel_pagination.page,
                            channel_per_page=payload.channel_pagination.per_page) }}"
               hx-get="{{ url_for('notification_channels.index',
                            tab='channels', edit=channel.id, configure=1,
                            channel_search=payload.channel_filters.search,
                            channel_provider=payload.channel_filters.provider,
                            channel_state=payload.channel_filters.state,
                            channel_page=payload.channel_pagination.page,
                            channel_per_page=payload.channel_pagination.per_page) }}"
               hx-target="#notification-channels-workspace" hx-select="#notification-channels-workspace"
               hx-swap="outerHTML" hx-indicator="#notification-channel-loading" hx-push-url="false"
               class="{{ table_ui.action_classes() }} w-full justify-start">
                <i data-lucide="pencil" class="h-3.5 w-3.5" aria-hidden="true"></i>Edit Channel
            </a>
            <form method="post" action="{{ url_for('notification_channels.test', channel_id=channel.id) }}"
                  hx-post="{{ url_for('notification_channels.test', channel_id=channel.id) }}"
                  hx-target="#notification-channels-workspace" hx-select="#notification-channels-workspace"
                  hx-swap="outerHTML" hx-indicator="#notification-channel-loading" hx-push-url="false"
                  hx-disabled-elt="button[type='submit']">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {{ channel_return_fields() }}
                <button type="submit" class="{{ table_ui.action_classes() }} w-full justify-start">
                    <i data-lucide="send" class="h-3.5 w-3.5" aria-hidden="true"></i>Test Delivery
                </button>
            </form>
            <div class="border-t border-outline-subtle pt-2">
                <button type="button" data-kaori-dialog-open data-kaori-dialog-transition
                        data-dialog-target="notification-channel-retire-{{ channel.id }}"
                        aria-haspopup="dialog" aria-controls="notification-channel-retire-{{ channel.id }}"
                        class="{{ table_ui.action_classes() }} w-full justify-start">
                    <i data-lucide="archive" class="h-3.5 w-3.5" aria-hidden="true"></i>Retire Channel
                </button>
            </div>
            {% if channel.delete_blocked %}
                <button type="button" data-kaori-dialog-open data-kaori-dialog-transition
                        data-dialog-target="notification-channel-delete-blockers-{{ channel.id }}"
                        aria-haspopup="dialog" aria-controls="notification-channel-delete-blockers-{{ channel.id }}"
                        aria-label="Locked: view deletion dependencies for {{ channel.name }}"
                        class="inline-flex min-h-9 w-full items-center justify-start gap-2 rounded-md border border-status-warning-border bg-status-warning-soft px-3 text-xs font-semibold text-status-warning-text focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-status-warning">
                    <i data-lucide="lock-keyhole" class="h-3.5 w-3.5" aria-hidden="true"></i>Locked
                </button>
            {% else %}
                <form method="post" action="{{ url_for('notification_channels.delete', channel_id=channel.id) }}"
                      hx-post="{{ url_for('notification_channels.delete', channel_id=channel.id) }}"
                      hx-target="#notification-channels-workspace" hx-select="#notification-channels-workspace"
                      hx-swap="outerHTML" hx-push-url="false" hx-indicator="#notification-channel-loading"
                      hx-disabled-elt="button[type='submit']">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    {{ channel_return_fields() }}
                    <button type="submit" class="hidden" tabindex="-1" aria-hidden="true"
                            id="notification-channel-delete-submit-{{ channel.id }}">Confirm Delete</button>
                    <button type="button" @click="$el.closest('dialog').close()"
                            data-destructive-modal-open
                            data-destructive-modal-id="notification-channel-delete-confirmation"
                            data-destructive-target="{{ channel.name }}"
                            data-destructive-submit-button-id="notification-channel-delete-submit-{{ channel.id }}"
                            aria-haspopup="dialog" aria-controls="notification-channel-delete-confirmation"
                            aria-label="Confirm deletion of {{ channel.name }}"
                            class="{{ table_ui.action_classes(destructive=true) }} w-full justify-start">
                        <i data-lucide="trash-2" class="h-3.5 w-3.5" aria-hidden="true"></i>Delete Channel
                    </button>
                </form>
            {% endif %}
        </div>
        <footer class="flex justify-end border-t border-outline-subtle px-5 py-3">
            <button type="button" data-kaori-dialog-close class="{{ table_ui.action_classes() }}">Close</button>
        </footer>
    </section>
</dialog>
