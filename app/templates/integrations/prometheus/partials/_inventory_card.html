<section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
  <div class="border-b border-slate-200 px-6 py-5 dark:border-slate-700">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-blue-600 dark:bg-blue-500/10 dark:text-blue-300">
        <i data-lucide="activity" class="h-5 w-5"></i>
      </div>
      <div>
        <h2 class="text-lg font-semibold text-slate-950 dark:text-white">Prometheus Inventory</h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Prometheus integrations discovered across connected Kubernetes clusters.</p>
      </div>
    </div>
    <div id="prometheus-inventory-loading"
         class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-blue-100 dark:bg-blue-950/60">
      <div class="h-full w-1/3 animate-pulse rounded-full bg-blue-600 dark:bg-blue-400"></div>
    </div>
  </div>

  <form hx-get="{{ url_for('integrations.prometheus') }}"
        hx-target="#prometheus-inventory-content"
        hx-swap="innerHTML"
        hx-indicator="#prometheus-inventory-loading"
        hx-trigger="change from:select"
        class="grid gap-4 border-b border-slate-200 bg-slate-50/70 px-6 py-5 md:grid-cols-3 dark:border-slate-700 dark:bg-slate-900/30">
    <input type="hidden" name="page" value="1">
    <input type="hidden" name="per_page" value="{{ pagination.per_page }}">
    <label class="space-y-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Status</span>
      <select name="status" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm font-medium text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        <option value="">All statuses</option>
        {% for option in status_options %}
          <option value="{{ option }}" {% if selected_status == option %}selected{% endif %}>{{ option|replace('_', ' ')|title }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="space-y-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Environment</span>
      <select name="environment" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm font-medium text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        <option value="">All environments</option>
        {% for option in environment_options %}
          <option value="{{ option.value }}" {% if selected_environment == option.value %}selected{% endif %}>{{ option.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="space-y-2">
      <span class="text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">Profile</span>
      <select name="profile" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm font-medium text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        <option value="">All profiles</option>
        {% for option in profile_options %}
          <option value="{{ option }}" {% if selected_profile == option %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
    </label>
  </form>

  <div id="prometheus-inventory-content">
    {% include 'integrations/prometheus/partials/_inventory_content.html' %}
  </div>
</section>
