<section id="prometheus-inventory-card"
         class="overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-sm">
    <header class="border-b border-outline-subtle px-5 py-4 sm:px-6">
        <div class="flex items-start gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary">
                <i data-lucide="database-zap" class="h-5 w-5" aria-hidden="true"></i>
            </span>
            <div>
                <h2 class="text-lg font-semibold text-content-primary">Prometheus Connection Registry</h2>
                <p class="mt-1 text-sm leading-6 text-content-secondary">Manage reusable metrics connections and the operational scopes that can use them.</p>
            </div>
        </div>
        <div id="prometheus-inventory-loading"
             class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-kaori-soft">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-kaori-primary"></div>
        </div>
    </header>
    <div class="border-b border-outline-subtle bg-surface-hover px-5 py-4 sm:px-6">
        <form id="prometheus-inventory-filter-form"
              method="get"
              action="{{ url_for('integrations.prometheus') }}"
              hx-get="{{ url_for('integrations.prometheus') }}"
              hx-target="#prometheus-inventory-content"
              hx-swap="innerHTML"
              hx-push-url="true"
              hx-trigger="change from:select, keyup changed delay:500ms from:input[name='q'], search from:input[name='q']"
              hx-indicator="#prometheus-inventory-loading"
              class="grid gap-4 md:grid-cols-2 xl:grid-cols-12 xl:items-end">
            <input type="hidden" name="tab" value="registry">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="per_page" value="{{ pagination.per_page }}">
            <input type="hidden" name="coverage_page" value="1">
            <input type="hidden"
                   name="coverage_per_page"
                   value="{{ coverage_pagination.per_page }}">
            <input type="hidden" name="coverage_q" value="{{ selected_coverage_query }}">
            <input type="hidden"
                   name="coverage_environment"
                   value="{{ selected_coverage_environment }}">
            <input type="hidden"
                   name="coverage_status"
                   value="{{ selected_coverage_status }}">
            <div class="md:col-span-2 xl:col-span-5">
                <label class="mb-2 block text-sm font-semibold text-content-secondary"
                       for="prometheus-search">Search Connection</label>
                <div class="relative">
                    <i data-lucide="search"
                       class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-muted"
                       aria-hidden="true"></i>
                    <input id="prometheus-search"
                           type="search"
                           name="q"
                           value="{{ selected_query }}"
                           placeholder="Name, endpoint, product, version, or profile"
                           class="h-11 w-full rounded-lg border border-outline-default bg-surface-card pl-10 pr-3 text-sm font-medium text-content-primary outline-none transition placeholder:text-content-disabled focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                </div>
            </div>
            <div class="xl:col-span-3">
                <label class="mb-2 block text-sm font-semibold text-content-secondary"
                       for="prometheus-readiness">Readiness</label>
                <select id="prometheus-readiness"
                        name="readiness"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All Readiness</option>
                    {% for option in readiness_options %}
                        <option value="{{ option }}"
                                {% if selected_readiness == option %}selected{% endif %}>{{ option|replace('_', ' ') |title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="xl:col-span-4">
                <label class="mb-2 block text-sm font-semibold text-content-secondary"
                       for="prometheus-compatibility">Compatibility</label>
                <select id="prometheus-compatibility"
                        name="compatibility"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All Compatibility States</option>
                    {% for option in compatibility_options %}
                        <option value="{{ option }}"
                                {% if selected_compatibility == option %}selected{% endif %}>{{ option|replace('_', ' ') |title }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>
    <div id="prometheus-inventory-content">{% include 'integrations/prometheus/partials/_inventory_content.html' %}</div>
</section>
