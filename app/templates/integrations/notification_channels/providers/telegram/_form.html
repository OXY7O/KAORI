<div class="mb-4 flex items-start gap-3">
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-surface-card text-kaori-primary shadow-sm">
        <i data-lucide="message-circle" class="h-4 w-4"></i>
    </span>
    <div>
        <p class="text-sm font-semibold text-content-primary">Telegram Bot API</p>
        <p class="mt-1 text-xs leading-5 text-content-muted">
            Create a bot with BotFather, add it to the intended chat/group/channel, then enter the token and destination. Test Delivery verifies both credential and destination access.
        </p>
    </div>
</div>
<div class="grid gap-4 sm:grid-cols-2">
    <div>
        <label class="{{ table_ui.filter_label_classes() }}">Bot Token</label>
        <input name="bot_token"
               type="password"
               autocomplete="new-password"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="{{ 'Leave blank to keep current token' if form_channel and form_channel.credential_configured else 'BotFather token' }}">
    </div>
    <div>
        <label class="{{ table_ui.filter_label_classes() }}">Chat ID / @Channel</label>
        <input name="target_chat_id"
               value="{{ form_channel.target_chat_id if form_channel else '' }}"
               class="{{ table_ui.filter_input_classes() }}"
               placeholder="-1001234567890 or @channel">
    </div>
</div>
