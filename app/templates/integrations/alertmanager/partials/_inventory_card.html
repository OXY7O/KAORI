<section id="alertmanager-inventory-card"
         class="overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-sm">
    <header class="border-b border-outline-subtle px-5 py-4 sm:px-6">
        <div class="flex items-start gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary">
                <i data-lucide="server-cog" class="h-5 w-5" aria-hidden="true"></i>
            </span>
            <div>
                <h2 class="text-lg font-bold text-content-primary">Alertmanager Instance Registry</h2>
                <p class="mt-1 text-sm leading-6 text-content-secondary">Manage reusable Alertmanager connections independently from the systems, services, and workflows that use them. Bindings define where each connection is eligible.</p>
            </div>
        </div>
        <div id="alertmanager-inventory-loading"
             class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-kaori-soft">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-kaori-primary"></div>
        </div>
    </header>

    <div class="border-b border-outline-subtle bg-surface-hover px-5 py-4 sm:px-6">
        <form id="alertmanager-inventory-filter-form"
              method="get"
              action="{{ url_for('integrations.alertmanager') }}"
              hx-get="{{ url_for('integrations.alertmanager') }}"
              hx-target="#alertmanager-inventory-content"
              hx-swap="innerHTML"
              hx-push-url="true"
              hx-trigger="change from:select, keyup changed delay:500ms from:input[name='q'], search from:input[name='q']"
              hx-indicator="#alertmanager-inventory-loading"
              class="grid gap-4 md:grid-cols-2 xl:grid-cols-12 xl:items-end">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="per_page" value="{{ pagination.per_page }}">

            <div class="md:col-span-2 xl:col-span-5">
                <label class="mb-2 block text-sm font-semibold text-content-secondary" for="alertmanager-search">Search instance</label>
                <div class="relative">
                    <i data-lucide="search"
                       class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-muted"
                       aria-hidden="true"></i>
                    <input id="alertmanager-search"
                           type="search"
                           name="q"
                           value="{{ selected_query }}"
                           placeholder="Name, endpoint, description, or connection type"
                           class="h-11 w-full rounded-lg border border-outline-default bg-surface-card pl-10 pr-3 text-sm font-medium text-content-primary outline-none transition placeholder:text-content-disabled focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                </div>
            </div>

            <div class="xl:col-span-3">
                <label class="mb-2 block text-sm font-semibold text-content-secondary" for="alertmanager-readiness">Readiness</label>
                <select id="alertmanager-readiness"
                        name="readiness"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All Readiness</option>
                    {% for option in readiness_options %}
                        <option value="{{ option }}" {% if selected_readiness == option %}selected{% endif %}>{{ option|replace('_', ' ')|title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="xl:col-span-4">
                <label class="mb-2 block text-sm font-semibold text-content-secondary" for="alertmanager-deployment">Connection Type</label>
                <select id="alertmanager-deployment"
                        name="deployment_type"
                        class="h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
                    <option value="">All Connection Types</option>
                    {% for option in deployment_type_options %}
                        <option value="{{ option }}" {% if selected_deployment_type == option %}selected{% endif %}>{{ option|replace('_', ' ')|title }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>

    <div id="alertmanager-inventory-content">
        {% include 'integrations/alertmanager/partials/_inventory_content.html' %}
    </div>
</section>
