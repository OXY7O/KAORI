<section class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-blue-700 via-blue-600 to-cyan-500 px-6 py-6 text-white shadow-lg shadow-blue-500/20 sm:px-7 sm:py-7">
  <div class="absolute inset-y-0 right-0 hidden w-1/3 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.22),transparent_55%)] lg:block"></div>
  <div class="relative grid gap-6 lg:grid-cols-[minmax(0,1fr)_20rem] lg:items-center">
    <div>
      <div class="inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/10 px-3 py-1 text-xs font-medium"><i data-lucide="blocks" class="h-3.5 w-3.5"></i>{{ badge }}</div>
      <h1 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">{{ title }}</h1>
      <p class="mt-2 max-w-4xl text-sm leading-6 text-blue-50/90 sm:text-base">{{ description }}</p>
    </div>
    <div class="rounded-2xl border border-white/15 bg-white/10 p-4 backdrop-blur">
      <p class="text-xs font-medium uppercase tracking-[0.2em] text-blue-50/80">Integration posture</p>
      <div class="mt-4 grid grid-cols-3 gap-3 text-center">
        <div><div class="text-2xl font-bold">{{ stats.configured }}</div><div class="text-xs text-blue-50/80">Configured</div></div>
        <div><div class="text-2xl font-bold">{{ stats.ready }}</div><div class="text-xs text-blue-50/80">Ready</div></div>
        <div><div class="text-2xl font-bold">{{ stats.attention }}</div><div class="text-xs text-blue-50/80">Attention</div></div>
      </div>
    </div>
  </div>
</section>
