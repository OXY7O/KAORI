{% macro render(title, consequence, scope_label) -%}
    <div x-show="deleteModal"
         x-transition.opacity
         class="fixed inset-0 z-50 flex items-center justify-center bg-surface-overlay px-4 backdrop-blur-sm"
         x-cloak
         @keydown.escape.window="deleteModal = false">
        <div @click.away="deleteModal = false"
             x-transition
             role="dialog"
             aria-modal="true"
             aria-label="{{ title }}"
             class="max-h-[calc(100dvh-2rem)] w-full max-w-lg overflow-y-auto rounded-xl border border-outline-default bg-surface-card shadow-2xl">
            <header class="flex items-start gap-3 border-b border-outline-subtle px-5 py-4">
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-status-critical-soft text-status-critical">
                    <i data-lucide="trash-2" class="h-5 w-5" aria-hidden="true"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <h3 class="text-base font-semibold text-content-primary">{{ title }}</h3>
                    <p class="mt-1 text-xs leading-5 text-content-secondary">Confirm the KAORI connection lifecycle action.</p>
                </div>
                <button type="button" @click="deleteModal = false" aria-label="Close confirmation"
                        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-outline-default bg-surface-card text-content-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus">
                    <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                </button>
            </header>
            <div class="space-y-4 px-5 py-4">
                <p class="text-sm leading-6 text-content-secondary">
                    Delete <span class="font-semibold text-content-primary [overflow-wrap:anywhere]" x-text="deleteName"></span> from KAORI?
                </p>
                <section class="rounded-lg border border-outline-default bg-surface-subtle p-3">
                    <p class="text-xs font-semibold text-content-primary">{{ scope_label }}</p>
                    <p class="mt-1 text-xs leading-5 text-content-secondary">{{ consequence }}</p>
                </section>
                <div class="flex items-center gap-2 text-xs font-semibold text-status-critical-text">
                    <i data-lucide="triangle-alert" class="h-4 w-4 shrink-0" aria-hidden="true"></i>
                    This action cannot be undone.
                </div>
            </div>
            <div class="flex justify-end gap-2 border-t border-outline-subtle bg-surface-hover px-5 py-4">
                <button type="button"
                        @click="deleteModal = false"
                        class="inline-flex h-10 items-center justify-center rounded-lg border border-outline-default bg-surface-card px-4 text-sm font-semibold text-content-secondary transition hover:border-outline-focus hover:text-kaori-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus/20">
                    Cancel
                </button>
                <form x-bind:action="deleteUrl" method="post">
                    {% if csrf_token is defined %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
                    <button type="submit"
                            data-operation-submit
                            data-loading-label="Deleting Connection..."
                            class="inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-status-critical px-4 text-sm font-semibold text-white transition hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus disabled:cursor-wait disabled:opacity-70">
                        <i data-lucide="trash-2" class="h-4 w-4" aria-hidden="true"></i>
                        <span data-operation-submit-label>Delete Connection</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
{%- endmacro %}
