{#
  KAORI Integration record actions.

  Registry-style `View More` actions share one compact interaction contract so
  capability, runtime, validation, and future evidence registries do not drift.
#}
{% macro view_more(dialog_target, label='View More', role='record') -%}
<button type="button"
        class="inline-flex h-9 items-center justify-center gap-2 rounded-lg border border-outline-default bg-surface-card px-3 text-xs font-semibold text-content-primary transition hover:border-outline-focus hover:bg-surface-subtle focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus"
        data-kaori-dialog-open
        data-dialog-target="{{ dialog_target }}"
        aria-haspopup="dialog"
        aria-controls="{{ dialog_target }}"
        data-kaori-{{ role }}-view-more>
    <i data-lucide="panel-top-open" class="h-3.5 w-3.5" aria-hidden="true"></i>
    <span>{{ label }}</span>
</button>
{%- endmacro %}
