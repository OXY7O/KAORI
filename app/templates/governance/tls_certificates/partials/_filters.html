<form id="tls-certificate-filter-form"
      method="get"
      action="{{ url_for('governance.tls_certificates') }}"
      hx-get="{{ url_for('governance.tls_certificates') }}"
      hx-target="#tls-certificates-table-card"
      hx-swap="outerHTML"
      hx-indicator="#tls-certificates-table-loading"
      hx-trigger="change from:select, keyup changed delay:450ms from:input[name='search']"
      class="grid grid-cols-1 gap-4 md:grid-cols-4 md:items-end">
    <input type="hidden" name="page" value="1">
    <input type="hidden"
           name="per_page"
           value="{{ payload.pagination.per_page }}">
    <input type="hidden" name="partial_mode" value="table">
    <label class="block min-w-0">
        <span class="text-sm font-semibold text-content-primary">Cluster</span>
        <select name="cluster_id"
                class="mt-2 h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
            <option value="">All clusters</option>
            {% for cluster in payload.clusters %}
                <option value="{{ cluster.id }}"
                        {% if payload.filters.cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="block min-w-0">
        <span class="text-sm font-semibold text-content-primary">Namespace</span>
        <select name="namespace"
                class="mt-2 h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
            <option value="">All namespaces</option>
            {% for namespace in payload.namespaces %}
                <option value="{{ namespace }}"
                        {% if payload.filters.namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="block min-w-0">
        <span class="text-sm font-semibold text-content-primary">Status</span>
        <select name="status"
                class="mt-2 h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
            {% for status in payload.status_options %}
                <option value="{{ status }}"
                        {% if payload.filters.status == status %}selected{% endif %}>{{ status.replace('_', ' ') |title }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="block min-w-0">
        <span class="text-sm font-semibold text-content-primary">Search TLS Secret</span>
        <span class="relative mt-2 block">
            <i data-lucide="search"
               class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-content-muted"></i>
            <input type="search"
                   name="search"
                   value="{{ payload.filters.search }}"
                   placeholder="Search Secret, namespace, CN, or issuer"
                   class="h-11 w-full rounded-lg border border-outline-default bg-surface-card pl-10 pr-3 text-sm font-medium text-content-primary shadow-sm outline-none transition placeholder:text-content-disabled focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
        </span>
    </label>
</form>
