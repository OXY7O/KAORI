<div id="tls-secret-sync-toast-{{ sync.public_id }}"
     hx-get="{{ url_for('governance.tls_certificates_sync_status', public_id=sync.public_id) }}"
     hx-trigger="load delay:2s"
     hx-swap="outerHTML"
     data-quick-action-toast
     role="status"
     aria-live="polite"
     class="quick-action-toast pointer-events-auto relative overflow-hidden rounded-2xl border border-outline-default bg-surface-elevated shadow-xl shadow-black/10">
    <div class="p-4">
        <div class="flex items-start gap-3">
            <span class="mt-0.5 flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary">
                <i data-lucide="refresh-cw" class="h-5 w-5 animate-spin"></i>
            </span>
            <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-content-primary">TLS Secret Sync In Progress</p>
                        <p class="mt-1 text-xs font-semibold leading-5 text-content-secondary">{{ sync.message }}</p>
                    </div>
                    <span class="rounded-lg bg-kaori-soft px-2 py-1 text-[10px] font-semibold uppercase tracking-wide text-kaori-primary">
                        {{ sync.status_label }}
                    </span>
                </div>
                <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-[10px] font-semibold text-content-muted">
                    <span class="inline-flex items-center gap-1.5">
                        <i data-lucide="server" class="h-3.5 w-3.5"></i>
                        {{ sync.progress_current }} of {{ sync.progress_total or sync.target_count }} clusters processed
                    </span>
                    <a href="{{ url_for('jobs.executions', queue='inventory', search=sync.public_id) }}"
                       class="inline-flex items-center gap-1.5 text-kaori-primary hover:text-kaori-primary-hover">
                        View Job
                        <i data-lucide="arrow-up-right" class="h-3.5 w-3.5"></i>
                    </a>
                </div>
            </div>
        </div>
        <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-kaori-soft/70" aria-hidden="true">
            <div class="notification-progress-indeterminate h-full rounded-full bg-kaori-primary"></div>
        </div>
    </div>
</div>
