<form id="tls-secret-update-filter-form"
      method="get"
      action="{{ url_for('governance.tls_certificates_bulk_update') }}"
      hx-get="{{ url_for('governance.tls_certificates_bulk_update') }}"
      hx-target="#tls-secret-update-target-workspace"
      hx-swap="outerHTML"
      hx-indicator="#tls-secret-update-table-loading"
      hx-trigger="change, keyup changed delay:450ms from:input[name='search']"
      class="grid gap-3 xl:grid-cols-[1.1fr_1fr_1fr_1.4fr]">
    <input type="hidden" name="page" value="1">
    <input type="hidden" name="per_page" value="{{ payload.pagination.per_page }}">
    <input type="hidden" name="partial_mode" value="bulk_workspace">
    <select name="cluster_id" class="rounded-2xl border border-slate-300 bg-white px-3 py-2.5 text-left text-sm font-semibold text-slate-700 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        <option value="">All Clusters</option>
        {% for cluster in payload.clusters %}
            <option value="{{ cluster.id }}" {% if payload.filters.cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>
        {% endfor %}
    </select>
    <select name="namespace" class="rounded-2xl border border-slate-300 bg-white px-3 py-2.5 text-left text-sm font-semibold text-slate-700 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        <option value="">All Namespaces</option>
        {% for namespace in payload.namespaces %}
            <option value="{{ namespace }}" {% if payload.filters.namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
        {% endfor %}
    </select>
    <select name="status" class="rounded-2xl border border-slate-300 bg-white px-3 py-2.5 text-left text-sm font-semibold text-slate-700 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
        {% for status in payload.status_options %}
            <option value="{{ status }}" {% if payload.filters.status == status %}selected{% endif %}>{{ status.replace('_', ' ')|title }}</option>
        {% endfor %}
    </select>
    <div class="relative">
        <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
        <input type="search" name="search" value="{{ payload.filters.search }}" placeholder="Search secret, namespace, CN, or issuer" class="w-full rounded-2xl border border-slate-300 bg-white py-2.5 pl-10 pr-3 text-left text-sm font-semibold text-slate-700 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
    </div>
</form>
