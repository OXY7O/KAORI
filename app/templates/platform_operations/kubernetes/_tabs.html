{% macro render(active_tab) -%}
    <nav class="border-b border-outline-default bg-kaori-soft/50 px-5 pt-4"
         aria-label="Kubernetes Administration Workspaces">
        <div class="flex gap-2 overflow-x-auto" role="tablist">
            {% set tabs = [
                ('overview', 'layout-dashboard', 'Overview'),
                ('secret-reveal', 'scan-eye', 'Secret Reveal')
            ] %}
            {% for key, icon, label in tabs %}
                <button type="button"
                        role="tab"
                        :aria-selected="activeTab === '{{ key }}'"
                        aria-controls="kubernetes-administration-{{ key }}-tabpanel"
                        @click="activeTab='{{ key }}'; history.replaceState(null, '', '{{ url_for('platform_operations.kubernetes.index', tab=key) }}'); {% if key == 'secret-reveal' %}$nextTick(() => window.dispatchEvent(new CustomEvent('kubernetes:load-secret-reveal'))){% endif %}"
                        class="inline-flex min-h-10 shrink-0 items-center gap-2 rounded-t-xl border px-4 py-2.5 text-sm font-semibold transition"
                        :class="activeTab === '{{ key }}' ? '-mb-px border-kaori-primary bg-kaori-primary text-white' : 'border-kaori-primary/25 bg-white text-kaori-primary hover:bg-kaori-soft'">
                    <i data-lucide="{{ icon }}" class="h-4 w-4" aria-hidden="true"></i>
                    {{ label }}
                </button>
            {% endfor %}
        </div>
    </nav>
{%- endmacro %}
