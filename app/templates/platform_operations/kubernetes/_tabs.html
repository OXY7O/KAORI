{% macro render(active_tab) -%}
    <section class="overflow-hidden rounded-2xl border border-brand-outline bg-kaori-soft/60 shadow-sm"
             aria-label="Kubernetes Administration Workspace Tabs">
        <div class="flex flex-wrap gap-2 p-2" role="tablist">
            {% set tabs = [
                ('overview', 'layout-dashboard', 'Overview'),
                ('secret-reveal', 'scan-eye', 'Secret Reveal')
            ] %}
            {% for key, icon, label in tabs %}
                <button type="button"
                        role="tab"
                        :aria-selected="activeTab === '{{ key }}'"
                        aria-controls="kubernetes-administration-{{ key }}-tabpanel"
                        @click="setTab('{{ key }}')"
                        class="inline-flex min-h-10 shrink-0 items-center gap-2 rounded-lg px-4 text-sm font-semibold transition"
                        :class="activeTab === '{{ key }}' ? 'bg-kaori-primary text-white shadow-sm' : 'border border-brand-outline bg-surface-card text-kaori-primary hover:bg-kaori-soft'">
                    <i data-lucide="{{ icon }}" class="h-4 w-4" aria-hidden="true"></i>
                    {{ label }}
                </button>
            {% endfor %}
        </div>
    </section>
{%- endmacro %}
