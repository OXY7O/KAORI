{% macro desktop_trigger() -%}
    <button type="button"
            @click="openGlobalSearch()"
            class="flex h-10 w-full max-w-md items-center justify-between rounded-xl border border-outline-default bg-surface-page px-3 text-left text-xs text-content-secondary shadow-sm transition hover:border-kaori-primary/30 hover:bg-surface-card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus"
            aria-label="Open global search"
            aria-haspopup="dialog"
            :aria-expanded="searchOpen.toString()">
        <span class="flex min-w-0 items-center gap-2">
            <i data-lucide="search" class="h-4 w-4 shrink-0 text-content-muted" aria-hidden="true"></i>
            <span class="truncate">Search resources and pages...</span>
        </span>
        <span class="ml-3 inline-flex shrink-0 items-center gap-1 rounded-lg border border-outline-default bg-surface-card px-2 py-1 text-xs font-semibold text-content-muted">
            Ctrl K
        </span>
    </button>
{%- endmacro %}

{% macro mobile_trigger() -%}
    <button type="button"
            @click="openGlobalSearch()"
            class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-outline-default bg-surface-card text-content-secondary shadow-sm transition hover:border-kaori-primary/30 hover:bg-kaori-soft hover:text-kaori-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus xl:hidden"
            aria-label="Open global search"
            aria-haspopup="dialog"
            :aria-expanded="searchOpen.toString()">
        <i data-lucide="search" class="h-4.5 w-4.5" aria-hidden="true"></i>
    </button>
{%- endmacro %}

{% macro dialog() -%}
    <template x-teleport="body">
        <div id="global-search"
             data-global-search-root
             data-search-url="{{ url_for('platform_operations.global_search.global_search') }}"
             x-cloak
             x-show="searchOpen"
             class="fixed inset-0 z-[95] flex items-start justify-center p-4 pt-20 sm:pt-24"
             role="presentation">
            <button type="button"
                    class="absolute inset-0 h-full w-full cursor-default bg-surface-overlay/75 backdrop-blur-sm"
                    @click="closeGlobalSearch()"
                    aria-label="Close global search"></button>
            <section role="dialog"
                     aria-modal="true"
                     aria-labelledby="global-search-title"
                     @keydown.tab="trapGlobalSearchFocus($event)"
                     class="relative flex max-h-[calc(100dvh-7rem)] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-outline-default bg-surface-elevated shadow-2xl shadow-black/20">
                <header class="shrink-0 border-b border-outline-subtle bg-surface-card px-4 py-4 sm:px-5">
                    <div class="flex items-center gap-3">
                        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary" aria-hidden="true">
                            <i data-lucide="search" class="h-5 w-5"></i>
                        </span>
                        <div class="min-w-0 flex-1">
                            <h2 id="global-search-title" class="text-sm font-semibold text-content-primary">Search KAORI</h2>
                            <p class="mt-0.5 text-xs text-content-muted">Navigation and committed inventory snapshots.</p>
                        </div>
                        <span class="hidden rounded-lg border border-outline-default bg-surface-page px-2 py-1 text-xs font-semibold text-content-muted sm:inline-flex">Esc</span>
                    </div>
                    <label class="mt-4 flex h-11 items-center gap-3 rounded-xl border border-outline-default bg-surface-page px-3 transition focus-within:border-kaori-primary/40 focus-within:ring-2 focus-within:ring-outline-focus">
                        <i data-lucide="search" class="h-4 w-4 shrink-0 text-content-muted" aria-hidden="true"></i>
                        <span class="sr-only">Search KAORI resources and pages</span>
                        <input type="search"
                               data-global-search-input
                               x-model="searchQuery"
                               @input="queueGlobalSearch()"
                               @keydown.down.prevent="moveGlobalSearchSelection(1)"
                               @keydown.up.prevent="moveGlobalSearchSelection(-1)"
                               @keydown.enter.prevent="openSelectedGlobalSearchResult()"
                               @keydown.escape.prevent.stop="closeGlobalSearch()"
                               class="min-w-0 flex-1 border-0 bg-transparent p-0 text-sm font-medium text-content-primary outline-none placeholder:text-content-disabled focus:ring-0"
                               placeholder="Search clusters, namespaces, pods, buckets, pages..."
                               autocomplete="off"
                               spellcheck="false"
                               role="combobox"
                               aria-autocomplete="list"
                               aria-controls="global-search-results"
                               :aria-expanded="searchOpen.toString()"
                               :aria-activedescendant="globalSearchSelectedId ? 'global-search-option-' + globalSearchDomId(globalSearchSelectedId) : null">
                        <span x-show="searchLoading" class="inline-flex h-5 w-5 items-center justify-center text-kaori-primary" aria-label="Searching">
                            <i data-lucide="loader-circle" class="h-4 w-4 animate-spin" aria-hidden="true"></i>
                        </span>
                    </label>
                    <div class="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs text-content-muted">
                        <p><span class="font-semibold text-content-secondary">↑ ↓</span> navigate · <span class="font-semibold text-content-secondary">Enter</span> open</p>
                        <p x-show="searchQuery.trim().length === 1">Type one more character to search inventory.</p>
                    </div>
                </header>

                <div id="global-search-results" class="min-h-0 flex-1 overflow-y-auto bg-surface-page px-3 py-3 sm:px-4" role="listbox">
                    <div x-show="searchError" class="rounded-xl border border-outline-default bg-status-warning-soft p-4">
                        <div class="flex items-start gap-3">
                            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-surface-card text-status-warning-text" aria-hidden="true">
                                <i data-lucide="wifi-off" class="h-4 w-4"></i>
                            </span>
                            <div>
                                <p class="text-sm font-semibold text-status-warning-text">Search unavailable</p>
                                <p class="mt-1 text-xs leading-5 text-status-warning-text">KAORI could not read the committed search index. Try again.</p>
                            </div>
                        </div>
                    </div>

                    <template x-if="!searchQuery.trim() && searchRecent.length">
                        <section class="mb-4" aria-labelledby="global-search-recent-heading">
                            <div class="mb-2 flex items-center justify-between gap-3 px-1">
                                <h3 id="global-search-recent-heading" class="text-xs font-semibold uppercase tracking-wide text-content-muted">Recent</h3>
                                <button type="button" @click="clearGlobalSearchRecent()" class="text-xs font-semibold text-kaori-primary hover:text-kaori-primary-dark">Clear</button>
                            </div>
                            <div class="space-y-1">
                                <template x-for="item in searchRecent" :key="'recent:' + item.id">
                                    <a :href="item.url"
                                       :id="'global-search-option-' + globalSearchDomId(item.id)"
                                       @mouseenter="setGlobalSearchSelection(item)"
                                       @focus="setGlobalSearchSelection(item)"
                                       @click="rememberGlobalSearchResult(item)"
                                       class="group flex items-center gap-3 rounded-xl border border-transparent px-3 py-2.5 transition hover:border-outline-subtle hover:bg-surface-card focus-visible:border-kaori-primary/30 focus-visible:bg-surface-card focus-visible:outline-none"
                                       :class="globalSearchSelectedId === item.id ? 'border-outline-subtle bg-surface-card' : ''"
                                       role="option"
                                       :aria-selected="(globalSearchSelectedId === item.id).toString()">
                                        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-surface-hover text-content-muted group-hover:bg-kaori-soft group-hover:text-kaori-primary" aria-hidden="true">
                                            <i data-lucide="history" class="h-4 w-4"></i>
                                        </span>
                                        <span class="min-w-0 flex-1">
                                            <span class="block truncate text-sm font-semibold text-content-primary" x-text="item.title"></span>
                                            <span class="mt-0.5 block truncate text-xs text-content-muted" x-text="item.subtitle"></span>
                                        </span>
                                        <i data-lucide="arrow-up-right" class="h-4 w-4 shrink-0 text-content-disabled group-hover:text-kaori-primary" aria-hidden="true"></i>
                                    </a>
                                </template>
                            </div>
                        </section>
                    </template>

                    <template x-for="section in searchSections" :key="section.key">
                        <section class="mb-4 last:mb-0">
                            <h3 class="mb-2 px-1 text-xs font-semibold uppercase tracking-wide text-content-muted" x-text="section.label"></h3>
                            <div class="space-y-1">
                                <template x-for="item in section.items" :key="item.id">
                                    <a :href="item.url"
                                       :id="'global-search-option-' + globalSearchDomId(item.id)"
                                       @mouseenter="setGlobalSearchSelection(item)"
                                       @focus="setGlobalSearchSelection(item)"
                                       @click="rememberGlobalSearchResult(item)"
                                       class="group flex items-center gap-3 rounded-xl border border-transparent px-3 py-2.5 transition hover:border-outline-subtle hover:bg-surface-card focus-visible:border-kaori-primary/30 focus-visible:bg-surface-card focus-visible:outline-none"
                                       :class="globalSearchSelectedId === item.id ? 'border-outline-subtle bg-surface-card' : ''"
                                       role="option"
                                       :aria-selected="(globalSearchSelectedId === item.id).toString()">
                                        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-surface-hover text-content-muted transition group-hover:bg-kaori-soft group-hover:text-kaori-primary" aria-hidden="true">
                                            <i :data-lucide="item.icon || 'search'" class="h-4 w-4"></i>
                                        </span>
                                        <span class="min-w-0 flex-1">
                                            <span class="flex min-w-0 items-center gap-2">
                                                <span class="truncate text-sm font-semibold text-content-primary" x-text="item.title"></span>
                                                <span x-show="item.status"
                                                      class="inline-flex min-h-6 shrink-0 items-center rounded-md border px-2 text-xs font-semibold"
                                                      :class="globalSearchStatusClasses(item.status_tone)"
                                                      x-text="item.status"></span>
                                            </span>
                                            <span class="mt-0.5 block truncate text-xs text-content-muted" x-text="item.subtitle"></span>
                                        </span>
                                        <span class="hidden shrink-0 text-xs font-medium text-content-disabled sm:inline" x-text="item.kind"></span>
                                        <i data-lucide="arrow-up-right" class="h-4 w-4 shrink-0 text-content-disabled group-hover:text-kaori-primary" aria-hidden="true"></i>
                                    </a>
                                </template>
                            </div>
                        </section>
                    </template>

                    <div x-show="!searchLoading && !searchError && searchQuery.trim() && !globalSearchHasResults()"
                         class="rounded-xl border border-outline-subtle bg-surface-card px-5 py-8 text-center">
                        <span class="mx-auto flex h-11 w-11 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary" aria-hidden="true">
                            <i data-lucide="search-x" class="h-5 w-5"></i>
                        </span>
                        <p class="mt-3 text-sm font-semibold text-content-primary">No matching results</p>
                        <p class="mx-auto mt-1 max-w-md text-xs leading-5 text-content-muted">Try another resource name, namespace, cluster, page, or operational keyword.</p>
                    </div>
                </div>

                <footer class="shrink-0 border-t border-outline-subtle bg-surface-card px-4 py-3 text-xs text-content-muted sm:px-5">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <span>Snapshot-backed search · no live Kubernetes or provider query</span>
                        <span class="font-medium text-content-secondary">Ctrl/Cmd + K</span>
                    </div>
                </footer>
            </section>
        </div>
    </template>
{%- endmacro %}
