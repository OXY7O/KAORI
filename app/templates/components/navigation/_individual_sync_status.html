<div id="individual-sync-task-{{ sync.task_id }}"
     hx-get="{{ url_for('cluster.individual_sync_status', task_id=sync.task_id) }}"
     hx-trigger="load delay:2s"
     hx-swap="outerHTML"
     role="status"
     aria-live="polite"
     class="pointer-events-auto relative overflow-hidden rounded-2xl border border-blue-200 bg-white shadow-2xl shadow-slate-900/15 dark:border-blue-500/30 dark:bg-slate-900 dark:shadow-slate-950/50">
    <div class="p-4 pb-5">
        <div class="flex items-start gap-3">
            <span class="mt-0.5 flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-300">
                <i data-lucide="refresh-cw" class="h-5 w-5 animate-spin"></i>
            </span>
            <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-sm font-bold text-slate-950 dark:text-white">Cluster inventory sync in progress</p>
                        <p class="mt-1 text-xs font-semibold leading-5 text-slate-600 dark:text-slate-300">Synchronizing Kubernetes inventory for {{ sync.cluster_name }}.</p>
                    </div>
                    <span class="rounded-lg bg-blue-50 px-2 py-1 text-[9px] font-bold uppercase tracking-wide text-blue-700 dark:bg-blue-500/10 dark:text-blue-300">{{ sync.state_label }}</span>
                </div>
                <div class="mt-3 flex items-center gap-2 text-[10px] font-semibold text-slate-400">
                    <i data-lucide="clock-3" class="h-3.5 w-3.5"></i>
                    Running for {{ sync.elapsed_seconds }}s · Celery continues after reload or navigation
                </div>
            </div>
        </div>
    </div>
    <div class="absolute inset-x-0 bottom-0 h-1 overflow-hidden bg-blue-100 dark:bg-blue-500/10">
        <div class="notification-progress-indeterminate h-full rounded-full bg-blue-600"></div>
    </div>
</div>
