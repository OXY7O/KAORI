{% import "components/activity_status_card.html" as activity_status_card %}
<div id="individual-sync-task-{{ sync.task_id }}"
     hx-get="{{ url_for('cluster.individual_sync_status', task_id=sync.task_id) }}"
     hx-trigger="load delay:2s"
     hx-swap="outerHTML"
     role="status"
     aria-live="polite"
     class="{{ activity_status_card.shell_classes() }}">
    <div class="p-4">
        <div class="flex items-start gap-3">
            <span class="mt-0.5 flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                <i data-lucide="refresh-cw" class="h-5 w-5 animate-spin"></i>
            </span>
            <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-content-primary">Cluster inventory sync in progress</p>
                        <p class="mt-1 text-xs font-semibold leading-5 text-content-secondary">Synchronizing Kubernetes inventory for {{ sync.cluster_name }}.</p>
                    </div>
                    <span class="rounded-lg bg-kaori-soft px-2 py-1 text-xs font-semibold uppercase tracking-wide text-kaori-primary">{{ sync.state_label }}</span>
                </div>
                <div class="mt-3 flex items-center gap-2 text-xs font-semibold text-content-muted">
                    <i data-lucide="clock-3" class="h-3.5 w-3.5"></i>
                    Running for {{ sync.elapsed_seconds }}s · Celery continues after reload or navigation
                </div>
            </div>
        </div>
        <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-kaori-soft/70"
             aria-hidden="true">
            <div class="notification-progress-indeterminate h-full rounded-full bg-kaori-primary"></div>
        </div>
    </div>
</div>
