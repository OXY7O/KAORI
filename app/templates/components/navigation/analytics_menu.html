{% set analytics_active = request.endpoint and request.endpoint.startswith('analytics.') %}
<details class="sidebar-menu space-y-1"
         {% if analytics_active %}open{% endif %}>
    <!-- Analytics Parent -->
    <summary class="{{ 'sidebar-parent-active' if analytics_active else 'sidebar-item-idle' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between min-h-11 rounded-lg px-2.5 py-2 text-base font-semibold leading-6 transition [.sidebar-collapsed_&]:justify-center [.sidebar-collapsed_&]:px-2"
             title="K8s Analytics"
             aria-label="K8s Analytics"
             @click="if (!sidebarExpanded) { $event.preventDefault(); toggleSidebar(); $el.parentElement.open = true }">
        <div class="flex min-w-0 items-center gap-2.5">
            <span class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg {{ 'sidebar-parent-active-icon' if analytics_active else 'sidebar-item-idle-icon' }} transition">
                <i data-lucide="chart-column" class="h-4 w-4"></i>
            </span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap">K8s Analytics</span>
        </div>
        <i data-lucide="chevron-right"
           class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4 {{ 'text-kaori-accent' if analytics_active else 'text-white/[0.35]' }}"></i>
    </summary>
    <!-- Analytics Sub Menu -->
    <div class="sidebar-expanded-only sidebar-submenu ml-6 mt-1 space-y-1 border-l border-white/10 pl-3">
        <a href="{{ url_for('analytics.overview') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint == 'analytics.overview' else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint == 'analytics.overview' else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="layout-dashboard" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Overview</span>
        </a>
        <a href="{{ url_for('analytics.utilization') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint == 'analytics.utilization' else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint == 'analytics.utilization' else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="activity" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Resource Utilization</span>
        </a>
        <a href="{{ url_for('analytics.capacity') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint == 'analytics.capacity' else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint == 'analytics.capacity' else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="database" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Capacity Analysis</span>
        </a>
        <a href="{{ url_for('analytics.storage') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint in ['analytics.storage', 'analytics.storage_filesystem_summary', 'analytics.storage_persistent_summary'] else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint in ['analytics.storage', 'analytics.storage_filesystem_summary', 'analytics.storage_persistent_summary'] else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="hard-drive" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Storage Analysis</span>
        </a>
        <a href="{{ url_for('analytics.workload') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint in ['analytics.workload', 'analytics.workload_tenant_quota', 'analytics.workload_resource_mapping'] else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint in ['analytics.workload', 'analytics.workload_tenant_quota', 'analytics.workload_resource_mapping'] else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="boxes" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Workload Analysis</span>
        </a>
        <a href="{{ url_for('analytics.forecast') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint in ['analytics.forecast', 'analytics.forecast_section'] else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint in ['analytics.forecast', 'analytics.forecast_section'] else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="line-chart" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Resource Forecast</span>
        </a>
        <a href="{{ url_for('analytics.top_consumers') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint in ['analytics.top_consumers', 'analytics.top_consumers_section', 'analytics.top_consumers_table'] else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint in ['analytics.top_consumers', 'analytics.top_consumers_section', 'analytics.top_consumers_table'] else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="users" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Top Consumers</span>
        </a>
        <a href="{{ url_for('analytics.alerts') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint in ['analytics.alerts', 'analytics.alerts_table', 'analytics.alerts_anomalies', 'analytics.alerts_anomalies_table'] else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint in ['analytics.alerts', 'analytics.alerts_table', 'analytics.alerts_anomalies', 'analytics.alerts_anomalies_table'] else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="triangle-alert" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Alerts &amp; Anomalies</span>
        </a>
    </div>
</details>
