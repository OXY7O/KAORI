{% set analytics_active = request.endpoint and request.endpoint.startswith('analytics.') %}
<details class="sidebar-menu space-y-1"
         {% if analytics_active %}open{% endif %}>
    <!-- Analytics Parent -->
    <summary class="{{ 'bg-blue-600/15 text-blue-300 ring-1 ring-blue-500/20' if analytics_active else 'text-slate-300 hover:bg-slate-900 hover:text-white' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between rounded-2xl px-3 py-3 text-[13px] leading-5 font-semibold">
        <div class="flex min-w-0 items-center gap-3">
            <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl {{ 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' if analytics_active else 'bg-slate-900 text-slate-400 group-hover:bg-slate-800 group-hover:text-white' }} transition">
                <i data-lucide="chart-column" class="h-4 w-4"></i>
            </span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap text-[13px] leading-5">K8s Analytics</span>
        </div>
        <i data-lucide="chevron-right"
           class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4 {{ 'text-blue-300' if analytics_active else 'text-slate-500' }}"></i>
    </summary>
    <!-- Analytics Sub Menu -->
    <div class="sidebar-expanded-only sidebar-submenu ml-7 mt-1 space-y-1 border-l border-slate-800 pl-4">
        <a href="{{ url_for('analytics.overview') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'analytics.overview' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'analytics.overview' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="layout-dashboard" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Overview</span>
        </a>
        <a href="{{ url_for('analytics.utilization') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'analytics.utilization' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'analytics.utilization' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="activity" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Resource Utilization</span>
        </a>
        <a href="{{ url_for('analytics.capacity') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'analytics.capacity' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'analytics.capacity' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="database" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Capacity Analysis</span>
        </a>
        <a href="{{ url_for('analytics.storage') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint in ['analytics.storage', 'analytics.storage_filesystem_summary', 'analytics.storage_persistent_summary'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint in ['analytics.storage', 'analytics.storage_filesystem_summary', 'analytics.storage_persistent_summary'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="hard-drive" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Storage Analysis</span>
        </a>
        <a href="{{ url_for('analytics.workload') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint in ['analytics.workload', 'analytics.workload_tenant_quota', 'analytics.workload_resource_mapping'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint in ['analytics.workload', 'analytics.workload_tenant_quota', 'analytics.workload_resource_mapping'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="boxes" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Workload Analysis</span>
        </a>
        <a href="{{ url_for('analytics.forecast') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint in ['analytics.forecast', 'analytics.forecast_section'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint in ['analytics.forecast', 'analytics.forecast_section'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="line-chart" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Resource Forecast</span>
        </a>
        <a href="{{ url_for('analytics.top_consumers') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint in ['analytics.top_consumers', 'analytics.top_consumers_section', 'analytics.top_consumers_table'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint in ['analytics.top_consumers', 'analytics.top_consumers_section', 'analytics.top_consumers_table'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="users" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Top Consumers</span>
        </a>
        <a href="{{ url_for('analytics.alerts') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint in ['analytics.alerts', 'analytics.alerts_table', 'analytics.alerts_anomalies', 'analytics.alerts_anomalies_table', 'analytics.anomalies'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint in ['analytics.alerts', 'analytics.alerts_table', 'analytics.alerts_anomalies', 'analytics.alerts_anomalies_table', 'analytics.anomalies'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="triangle-alert" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Alerts &amp; Anomalies</span>
        </a>
    </div>
</details>
