{% set integrations_active = request.endpoint and (request.endpoint.startswith('integrations.') or request.endpoint.startswith('prometheus.') or request.endpoint.startswith('alertmanager.')) %}
<details class="sidebar-menu space-y-1" {% if integrations_active %}open{% endif %}>
    <summary class="{{ 'bg-blue-600/15 text-blue-300 ring-1 ring-blue-500/20' if integrations_active else 'text-slate-300 hover:bg-slate-900 hover:text-white' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between rounded-2xl px-3 py-3 text-[13px] font-semibold">
        <div class="flex min-w-0 items-center gap-3">
            <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl {{ 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' if integrations_active else 'bg-slate-900 text-slate-400 group-hover:bg-slate-800 group-hover:text-white' }} transition"><i data-lucide="blocks" class="h-4 w-4"></i></span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap">Integrations</span>
        </div>
        <i data-lucide="chevron-right" class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4"></i>
    </summary>
    <div class="sidebar-expanded-only sidebar-submenu ml-7 mt-1 space-y-1 border-l border-slate-800 pl-4">
        <a href="{{ url_for('integrations.overview') }}" class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'integrations.overview' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} flex items-center gap-2 rounded-xl px-3 py-2 text-[12px]"><i data-lucide="layout-grid" class="h-3.5 w-3.5"></i><span>Overview</span></a>
        <a href="{{ url_for('integrations.prometheus') }}" class="{{ 'bg-slate-900 text-blue-300' if request.endpoint and ('prometheus' in request.endpoint) else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} flex items-center gap-2 rounded-xl px-3 py-2 text-[12px]"><i data-lucide="activity" class="h-3.5 w-3.5"></i><span>Prometheus</span></a>
        <a href="{{ url_for('integrations.alertmanager') }}" class="{{ 'bg-slate-900 text-blue-300' if request.endpoint and ('alertmanager' in request.endpoint) else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} flex items-center gap-2 rounded-xl px-3 py-2 text-[12px]"><i data-lucide="siren" class="h-3.5 w-3.5"></i><span>Alertmanager</span></a>
    </div>
</details>
