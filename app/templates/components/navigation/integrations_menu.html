{% set integrations_active = integration_navigation.is_active %}
<details class="sidebar-menu space-y-1"
         {% if integrations_active %}open{% endif %}>
    <summary class="{{ 'sidebar-parent-active' if integrations_active else 'sidebar-item-idle' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between min-h-11 rounded-lg px-2.5 py-2 text-base font-semibold leading-6 transition [.sidebar-collapsed_&]:justify-center [.sidebar-collapsed_&]:px-2"
             title="Integrations"
             aria-label="Integrations"
             @click="if (!sidebarExpanded) { $event.preventDefault(); toggleSidebar(); $el.parentElement.open = true }">
        <div class="flex min-w-0 items-center gap-2.5">
            <span class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg {{ 'sidebar-parent-active-icon' if integrations_active else 'sidebar-item-idle-icon' }} transition"><i data-lucide="blocks" class="h-4 w-4"></i></span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap">Integrations</span>
        </div>
        <i data-lucide="chevron-right"
           class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4"></i>
    </summary>
    <div class="sidebar-expanded-only sidebar-submenu ml-6 mt-1 space-y-1 border-l border-white/10 pl-3">
        <a href="{{ url_for('integrations.overview') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if integration_navigation.overview_active else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if integration_navigation.overview_active else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="layout-grid" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Overview</span>
        </a>
        {% for domain in integration_navigation.domains %}
            <a href="{{ url_for(domain.workspace_endpoint) }}"
               class="{{ 'bg-white/[0.08] text-kaori-accent' if domain.active else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
                <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if domain.active else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
                <i data-lucide="{{ domain.icon }}" class="h-3.5 w-3.5"></i>
                <span class="truncate whitespace-nowrap">{{ domain.label }}</span>
            </a>
        {% endfor %}
    </div>
</details>
