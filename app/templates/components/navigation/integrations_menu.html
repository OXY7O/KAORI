{% set integrations_active = request.endpoint and (request.endpoint.startswith('integrations.') or request.endpoint.startswith('prometheus.') or request.endpoint.startswith('alertmanager.') or request.endpoint.startswith('cluster.')) %}
<details class="sidebar-menu space-y-1" {% if integrations_active %}open{% endif %}>
    <summary class="{{ 'bg-kaori-primary text-white shadow-lg shadow-kaori-primary/20 ring-1 ring-white/10' if integrations_active else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between min-h-11 rounded-lg px-2.5 py-2 text-sm font-semibold transition [.sidebar-collapsed_&]:justify-center [.sidebar-collapsed_&]:px-2"
             title="Integrations"
             aria-label="Integrations"
             @click="if (!sidebarExpanded) { $event.preventDefault(); toggleSidebar(); $el.parentElement.open = true }">
        <div class="flex min-w-0 items-center gap-2.5">
            <span class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg {{ 'bg-white/15 text-white' if integrations_active else 'bg-white/5 text-brand-foreground-muted group-hover:bg-white/10 group-hover:text-white' }} transition"><i data-lucide="blocks" class="h-4 w-4"></i></span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap">Integrations</span>
        </div>
        <i data-lucide="chevron-right" class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4"></i>
    </summary>
    <div class="sidebar-expanded-only sidebar-submenu ml-6 mt-1 space-y-0.5 border-l border-white/10 pl-3">
        <a href="{{ url_for('integrations.overview') }}" class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint == 'integrations.overview' else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} flex items-center gap-2 rounded-lg px-2.5 py-1 text-[13px] leading-5"><i data-lucide="layout-grid" class="h-3.5 w-3.5"></i><span>Overview</span></a>
        <a href="{{ url_for('integrations.kubernetes') }}" class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint and (request.endpoint.startswith('integrations.kubernetes') or request.endpoint.startswith('cluster.')) else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} flex items-center gap-2 rounded-lg px-2.5 py-1 text-[13px] leading-5"><i data-lucide="boxes" class="h-3.5 w-3.5"></i><span>Kubernetes</span></a>
        <a href="{{ url_for('integrations.prometheus') }}" class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint and ('prometheus' in request.endpoint) else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} flex items-center gap-2 rounded-lg px-2.5 py-1 text-[13px] leading-5"><i data-lucide="activity" class="h-3.5 w-3.5"></i><span>Prometheus</span></a>
        <a href="{{ url_for('integrations.alertmanager') }}" class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint and ('alertmanager' in request.endpoint) else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} flex items-center gap-2 rounded-lg px-2.5 py-1 text-[13px] leading-5"><i data-lucide="siren" class="h-3.5 w-3.5"></i><span>Alertmanager</span></a>
    </div>
</details>
