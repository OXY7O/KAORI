{% set inventory_active = request.endpoint and request.endpoint.startswith('inventory.') %}
<details class="sidebar-menu space-y-1"
         {% if inventory_active %}open{% endif %}>
    <!-- Inventory Parent -->
    <summary class="{{ 'bg-blue-600/15 text-blue-300 ring-1 ring-blue-500/20' if inventory_active else 'text-slate-300 hover:bg-slate-900 hover:text-white' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between rounded-2xl px-3 py-3 text-[13px] leading-5 font-semibold">
        <div class="flex min-w-0 items-center gap-3">
            <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl {{ 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' if inventory_active else 'bg-slate-900 text-slate-400 group-hover:bg-slate-800 group-hover:text-white' }} transition">
                <i data-lucide="package-search" class="h-4 w-4"></i>
            </span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap text-[13px] leading-5">K8s Inventory</span>
        </div>
        <i data-lucide="chevron-right"
           class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4 {{ 'text-blue-300' if inventory_active else 'text-slate-500' }}"></i>
    </summary>
    <!-- Inventory Sub Menu -->
    <div class="sidebar-expanded-only sidebar-submenu ml-7 mt-1 space-y-1 border-l border-slate-800 pl-4">
        <a href="{{ url_for('inventory.overview') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.overview' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.overview' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="layout-grid" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Overview</span>
        </a>
        <a href="{{ url_for('inventory.topology') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint in ['inventory.topology', 'inventory.topology_data'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint in ['inventory.topology', 'inventory.topology_data'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="waypoints" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Topology</span>
        </a>
        <a href="{{ url_for('inventory.nodes') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.nodes' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.nodes' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="server" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Nodes</span>
        </a>
        <a href="{{ url_for('inventory.namespaces') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.namespaces' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.namespaces' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="folders" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Namespaces</span>
        </a>
        <a href="{{ url_for('inventory.workloads') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.workloads' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.workloads' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="boxes" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Workloads</span>
        </a>
        <a href="{{ url_for('inventory.pods') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.pods' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.pods' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="box" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Pods</span>
        </a>
        <a href="{{ url_for('inventory.services') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.services' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.services' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="network" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Services</span>
        </a>
        <a href="{{ url_for('inventory.ingresses') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.ingresses' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.ingresses' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="route" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Ingresses</span>
        </a>
        <a href="{{ url_for('inventory.storage') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint == 'inventory.storage' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint == 'inventory.storage' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="hard-drive" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Storage</span>
        </a>
        <a href="{{ url_for('inventory.configuration') }}"
           class="{{ 'bg-slate-900 text-blue-300' if request.endpoint in ['inventory.configuration', 'inventory.configuration_details'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if request.endpoint in ['inventory.configuration', 'inventory.configuration_details'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="file-key-2" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Configuration</span>
        </a>
    </div>
</details>
