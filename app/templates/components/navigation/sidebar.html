<div class="contents"
     x-data="{ mobileNavOpen: false, mobileNavTrigger: null, openMobileNavigation(event) { this.mobileNavTrigger = event.detail?.trigger || null; this.mobileNavOpen = true; this.$nextTick(() => this.$refs.mobileNavClose?.focus()); }, closeMobileNavigation() { this.mobileNavOpen = false; this.$nextTick(() => this.mobileNavTrigger?.focus()); } }"
     @kaori:mobile-nav-open.window="openMobileNavigation($event)"
     @keydown.escape.window="if (mobileNavOpen) closeMobileNavigation()">
    <div x-cloak
         x-show="mobileNavOpen"
         data-mobile-navigation-backdrop
         @click="closeMobileNavigation()"
         class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm lg:hidden"
         aria-hidden="true"></div>
    <aside x-cloak
           id="app-sidebar"
           data-mobile-navigation
           :class="mobileNavOpen ? 'visible translate-x-0' : 'invisible -translate-x-[calc(100%+1rem)]'"
           class="kaori-sidebar fixed inset-y-2 left-2 z-50 flex h-[calc(100%-1rem)] min-h-0 w-[min(20rem,calc(100vw-1rem))] shrink-0 flex-col overflow-hidden rounded-2xl border border-brand-outline bg-surface-sidebar text-white shadow-2xl shadow-black/25 transition-[transform,width] duration-200 lg:relative lg:inset-auto lg:z-auto lg:h-full lg:w-[250px] lg:visible lg:translate-x-0 lg:[.sidebar-collapsed_&]:w-[78px]">
        <div class="pointer-events-none absolute -left-24 -top-32 h-72 w-72 rounded-full bg-kaori-primary/20 blur-3xl"
             aria-hidden="true"></div>
        <div class="pointer-events-none absolute -bottom-36 -right-28 h-72 w-72 rounded-full bg-kaori-accent/10 blur-3xl"
             aria-hidden="true"></div>
        <div class="relative z-10 p-3 pb-2">
            <div class="sidebar-brand-card flex items-center gap-3 rounded-xl border border-brand-outline bg-white/5 p-2.5 shadow-sm backdrop-blur-xl lg:[.sidebar-collapsed_&]:justify-center lg:[.sidebar-collapsed_&]:gap-0 lg:[.sidebar-collapsed_&]:p-2">
                <div class="sidebar-brand-icon flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-lg border border-white/10 bg-white/5 shadow-lg shadow-kaori-primary/20">
                    <img src="{{ url_for('static', filename='images/kaori-logo.svg') }}"
                         alt=""
                         aria-hidden="true"
                         class="h-11 w-11 object-contain">
                </div>
                <div class="sidebar-expanded-only min-w-0 flex-1">
                    <h1 class="truncate text-sm font-extrabold leading-5 tracking-tight text-white">KAORI</h1>
                    <p class="truncate text-xs font-medium text-brand-foreground-muted">Infrastructure Operations</p>
                </div>
                <button type="button"
                        x-ref="mobileNavClose"
                        data-mobile-navigation-close
                        @click="closeMobileNavigation()"
                        class="ml-auto inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-white/10 bg-white/5 text-white transition hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/80 lg:hidden"
                        aria-label="Close navigation">
                    <i data-lucide="x" class="h-5 w-5" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <nav class="relative z-10 flex-1 space-y-4 overflow-y-auto overscroll-contain px-3 py-3 [scrollbar-gutter:stable]"
             aria-label="Primary navigation"
             @click="if ($event.target.closest('a[href]')) closeMobileNavigation()">
            {% for section in sidebar_navigation %}
                <div class="sidebar-nav-section"
                     data-kaori-sidebar-section="{{ section['label']|lower|replace(' ', '-') }}">
                    <div class="sidebar-expanded-only mb-1.5 px-3 sidebar-section-label text-xs font-extrabold uppercase tracking-widest">{{ section['label'] }}</div>
                    <div class="space-y-1">
                        {% for item in section['items'] %}
                            <a href="{{ item['href'] }}"
                               title="{{ item['label'] }}"
                               aria-label="{{ item['label'] }}"
                               data-kaori-sidebar-workspace="{{ item['key'] }}"
                               {% if item['active'] %}aria-current="page"{% endif %}
                               class="{{ 'sidebar-parent-active' if item['active'] else 'sidebar-item-idle' }} sidebar-parent-link group flex min-h-11 items-center gap-2.5 rounded-lg px-2.5 py-2 text-base font-semibold leading-6 transition lg:[.sidebar-collapsed_&]:justify-center lg:[.sidebar-collapsed_&]:px-2">
                                <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg {{ 'sidebar-parent-active-icon' if item['active'] else 'sidebar-item-idle-icon' }} transition">
                                    <i data-lucide="{{ item['icon'] }}" class="h-4 w-4" aria-hidden="true"></i>
                                </span>
                                <span class="sidebar-expanded-only truncate whitespace-nowrap">{{ item['label'] }}</span>
                            </a>
                        {% endfor %}
                    </div>
                </div>
            {% endfor %}
        </nav>
    </aside>
</div>
