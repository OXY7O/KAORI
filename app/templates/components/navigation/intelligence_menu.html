{% set endpoint = request.endpoint or '' %}
{% set intelligence_active = endpoint.startswith('intelligence.') %}
<details class="sidebar-menu space-y-1" {% if intelligence_active %}open{% endif %}>
    <summary class="{{ 'bg-blue-600/15 text-blue-300 ring-1 ring-blue-500/20' if intelligence_active else 'text-slate-300 hover:bg-slate-900 hover:text-white' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between rounded-2xl px-3 py-3 text-[13px] leading-5 font-semibold">
        <div class="flex min-w-0 items-center gap-3">
            <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl {{ 'bg-blue-600 text-white shadow-lg shadow-blue-600/25' if intelligence_active else 'bg-slate-900 text-slate-400 group-hover:bg-slate-800 group-hover:text-white' }} transition">
                <i data-lucide="brain-circuit" class="h-4 w-4"></i>
            </span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap text-[13px] leading-5">Intelligence</span>
        </div>
        <i data-lucide="chevron-right" class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4 {{ 'text-blue-300' if intelligence_active else 'text-slate-500' }}"></i>
    </summary>

    <div class="sidebar-expanded-only sidebar-submenu ml-7 mt-1 space-y-1 border-l border-slate-800 pl-4">
        <a href="{{ url_for('intelligence.recommendations') }}"
           class="{{ 'bg-slate-900 text-blue-300' if endpoint in ['intelligence.index', 'intelligence.recommendations'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if endpoint in ['intelligence.index', 'intelligence.recommendations'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Recommendations</span>
        </a>
        <a href="{{ url_for('intelligence.alert_intelligence') }}"
           class="{{ 'bg-slate-900 text-blue-300' if endpoint == 'intelligence.alert_intelligence' else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if endpoint == 'intelligence.alert_intelligence' else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="triangle-alert" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Alert Intelligence</span>
        </a>
        <a href="{{ url_for('intelligence.catalog') }}"
           class="{{ 'bg-slate-900 text-blue-300' if endpoint in ['intelligence.catalog', 'intelligence.rule_catalog'] else 'text-slate-400 hover:bg-slate-900 hover:text-white' }} group flex items-center gap-2 rounded-xl px-3 py-2 text-[12px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-blue-400' if endpoint in ['intelligence.catalog', 'intelligence.rule_catalog'] else 'bg-slate-700 group-hover:bg-slate-500' }}"></span>
            <i data-lucide="list-checks" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Catalog</span>
        </a>
    </div>
</details>
