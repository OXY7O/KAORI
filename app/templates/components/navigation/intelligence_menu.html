{% set endpoint = request.endpoint or '' %}
{% set intelligence_active = endpoint.startswith('intelligence.') %}
<details class="sidebar-menu space-y-1"
         {% if intelligence_active %}open{% endif %}>
    <summary class="{{ 'bg-kaori-primary text-white shadow-lg shadow-kaori-primary/20 ring-1 ring-white/10' if intelligence_active else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between min-h-11 rounded-lg px-2.5 py-2 text-[12px] font-semibold transition">
        <div class="flex min-w-0 items-center gap-2.5">
            <span class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg {{ 'bg-white/15 text-white' if intelligence_active else 'bg-white/5 text-brand-foreground-muted group-hover:bg-white/10 group-hover:text-white' }} transition">
                <i data-lucide="brain-circuit" class="h-4 w-4"></i>
            </span>
            <span class="truncate whitespace-nowrap text-[12px] leading-5">Intelligence</span>
        </div>
        <i data-lucide="chevron-right"
           class="sidebar-menu-chevron h-4 w-4 {{ 'text-kaori-accent' if intelligence_active else 'text-white/[0.35]' }}"></i>
    </summary>
    <div class="sidebar-submenu ml-6 mt-1 space-y-1 border-l border-white/10 pl-3">
        <a href="{{ url_for('intelligence.recommendations') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if endpoint in ['intelligence.index', 'intelligence.recommendations'] else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-[11px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if endpoint in ['intelligence.index', 'intelligence.recommendations'] else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Recommendations</span>
        </a>
        <a href="{{ url_for('intelligence.alert_intelligence') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if endpoint == 'intelligence.alert_intelligence' else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-[11px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if endpoint == 'intelligence.alert_intelligence' else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="triangle-alert" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Alert Intelligence</span>
        </a>
        <a href="{{ url_for('intelligence.catalog') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if endpoint in ['intelligence.catalog', 'intelligence.rule_catalog'] else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-[11px] leading-4 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if endpoint in ['intelligence.catalog', 'intelligence.rule_catalog'] else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="list-checks" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Catalog</span>
        </a>
    </div>
</details>
