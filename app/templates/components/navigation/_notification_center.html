{% set center = activity_center|default({}) %}
{% set active_count = center.get('active_count', 0) %}
{% set unread_count = center.get('unread_count', 0) %}
{% set inbox_unread_count = center.get('inbox_unread_count', 0) %}
<div id="notification-center"
     class="contents"
     data-notification-deck-root
     data-snapshot-url="{{ url_for('notifications.panel_snapshot') }}">
    <button @click="openNotificationDeck('inbox')"
            type="button"
            class="relative inline-flex h-10 w-10 items-center justify-center rounded-xl border border-outline-default bg-surface-card text-content-secondary shadow-sm transition hover:border-kaori-primary/30 hover:bg-kaori-soft hover:text-kaori-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus"
            aria-label="Open work inbox"
            aria-controls="notification-deck"
            :aria-expanded="notificationDeckOpen && notificationDeckTab === 'inbox' ? 'true' : 'false'"
            title="Work Inbox">
        <i data-lucide="message-square-text" class="h-5 w-5"></i>
        <span id="work-inbox-badge"
              class="absolute -right-1 -top-1 inline-flex min-h-5 min-w-5 items-center justify-center rounded-md bg-kaori-primary px-1 text-xs font-semibold text-white ring-2 ring-surface-card {% if inbox_unread_count == 0 %}hidden{% endif %}">
            {{ '9+' if inbox_unread_count > 9 else inbox_unread_count }}
        </span>
    </button>
    <button @click="openNotificationDeck({{ "'notifications'" if unread_count else "'activity'" }})"
            type="button"
            class="relative inline-flex h-10 w-10 items-center justify-center rounded-xl border border-outline-default bg-surface-card text-content-secondary shadow-sm transition hover:border-kaori-primary/30 hover:bg-kaori-soft hover:text-kaori-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus"
            aria-label="Open notification deck"
            aria-controls="notification-deck"
            :aria-expanded="notificationDeckOpen.toString()"
            title="Notifications">
        <i data-lucide="bell" class="h-5 w-5"></i>
        <span id="notification-bell-badge"
              class="absolute -right-1 -top-1 inline-flex min-h-5 min-w-5 items-center justify-center rounded-md bg-status-critical px-1 text-xs font-semibold text-white ring-2 ring-surface-card {% if unread_count == 0 %}hidden{% endif %}">
            {{ '9+' if unread_count > 9 else unread_count }}
        </span>
        <span id="notification-running-indicator"
              class="absolute -bottom-0.5 -left-0.5 h-2.5 w-2.5 rounded-full border-2 border-surface-card bg-kaori-primary {% if active_count == 0 %}hidden{% endif %}"
              aria-hidden="true"></span>
    </button>
    <template x-teleport="body">
        <div x-cloak
             x-show="notificationDeckOpen"
             class="fixed inset-0 z-50"
             role="dialog"
             aria-modal="true"
             aria-label="Notification deck"
             data-notification-deck-dialog>
            <button type="button"
                    class="absolute inset-0 bg-surface-overlay/70 backdrop-blur-sm"
                    @click="notificationDeckOpen = false"
                    aria-label="Close notification deck"></button>
            <aside id="notification-deck"
                   class="absolute inset-y-0 right-0 flex h-dvh max-h-dvh w-full max-w-none flex-col overflow-hidden border-l border-outline-default bg-surface-elevated shadow-2xl shadow-black/20 sm:h-full sm:max-h-none sm:max-w-lg"
                   x-transition:enter="transition ease-out duration-200"
                   x-transition:enter-start="translate-x-full"
                   x-transition:enter-end="translate-x-0"
                   x-transition:leave="transition ease-in duration-150"
                   x-transition:leave-start="translate-x-0"
                   x-transition:leave-end="translate-x-full">
                <header class="flex shrink-0 items-center justify-between gap-3 border-b border-outline-subtle bg-surface-card px-3 py-3 sm:gap-4 sm:px-4 sm:py-3.5">
                    <div class="flex min-w-0 items-center gap-3">
                        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                            <i data-lucide="bell" class="h-4.5 w-4.5"></i>
                        </span>
                        <div class="min-w-0">
                            <h2 class="text-base font-semibold text-content-primary leading-6">Notification Deck</h2>
                            <p class="mt-0.5 hidden truncate text-xs text-content-muted sm:block">Assigned work, active work, and persistent updates</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button"
                                @click="notificationDeckOpen = false"
                                class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-outline-default bg-surface-card text-content-muted transition hover:bg-surface-hover hover:text-content-primary"
                                aria-label="Close notification deck">
                            <i data-lucide="x" class="h-4 w-4"></i>
                        </button>
                    </div>
                </header>
                <div class="shrink-0 border-b border-outline-subtle bg-surface-card px-3 py-2 sm:px-4 sm:py-3">
                    <nav class="inline-flex w-full rounded-xl border border-outline-default bg-surface-hover p-1"
                         aria-label="Notification deck sections"
                         data-notification-deck-tabs
                         role="tablist">
                        <button type="button"
                                @click="notificationDeckTab = 'activity'"
                                :class="notificationDeckTab === 'activity' ? 'bg-surface-card text-kaori-primary shadow-sm dark:text-kaori-accent' : 'text-content-secondary hover:text-content-primary'"
                                :aria-selected="(notificationDeckTab === 'activity').toString()"
                                aria-controls="notification-deck-activity"
                                role="tab"
                                class="inline-flex min-h-9 flex-1 items-center justify-center gap-1 rounded-lg px-2 text-center text-xs font-semibold leading-4 transition sm:gap-2 sm:px-4">
                            Active Work
                            <span id="notification-deck-active-count"
                                  class="inline-flex min-h-5 min-w-5 items-center justify-center rounded-md bg-surface-card px-1.5 text-xs font-semibold text-kaori-primary">{{ active_count }}</span>
                        </button>
                        <button type="button"
                                @click="notificationDeckTab = 'inbox'"
                                :class="notificationDeckTab === 'inbox' ? 'bg-surface-card text-kaori-primary shadow-sm dark:text-kaori-accent' : 'text-content-secondary hover:text-content-primary'"
                                :aria-selected="(notificationDeckTab === 'inbox').toString()"
                                aria-controls="notification-deck-inbox"
                                role="tab"
                                class="inline-flex min-h-9 flex-1 items-center justify-center gap-1 rounded-lg px-2 text-center text-xs font-semibold leading-4 transition sm:gap-2 sm:px-3">
                            Inbox
                            <span id="notification-deck-inbox-count"
                                  class="inline-flex min-h-5 min-w-5 items-center justify-center rounded-md bg-surface-card px-1.5 text-xs font-semibold text-kaori-primary">{{ inbox_unread_count }}</span>
                        </button>
                        <button type="button"
                                @click="notificationDeckTab = 'notifications'"
                                :class="notificationDeckTab === 'notifications' ? 'bg-surface-card text-kaori-primary shadow-sm dark:text-kaori-accent' : 'text-content-secondary hover:text-content-primary'"
                                :aria-selected="(notificationDeckTab === 'notifications').toString()"
                                aria-controls="notification-deck-notifications"
                                role="tab"
                                class="inline-flex min-h-9 flex-1 items-center justify-center gap-1 rounded-lg px-2 text-center text-xs font-semibold leading-4 transition sm:gap-2 sm:px-4">
                            Notifications
                            <span id="notification-deck-unread-count"
                                  class="inline-flex min-h-5 min-w-5 items-center justify-center rounded-md bg-surface-card px-1.5 text-xs font-semibold text-kaori-primary">{{ unread_count }}</span>
                        </button>
                    </nav>
                </div>
                <div class="min-h-0 flex-1 overflow-y-auto bg-surface-page p-2 [scrollbar-gutter:stable] sm:p-3">
                    <section id="notification-deck-activity"
                             x-cloak
                             :class="notificationDeckTab === 'activity' ? 'block' : 'hidden'"
                             role="tabpanel"
                             class="space-y-2"
                             data-notification-deck-panel>
                        {% include "platform_operations/notifications/partials/_notification_deck_activity.html" %}
                    </section>
                    <section id="notification-deck-inbox"
                             x-cloak
                             :class="notificationDeckTab === 'inbox' ? 'block' : 'hidden'"
                             role="tabpanel"
                             class="space-y-2"
                             data-notification-deck-panel>
                        <div id="notification-deck-inbox-content">
                            {% include "platform_operations/notifications/partials/_notification_deck_inbox.html" %}
                        </div>
                    </section>
                    <section id="notification-deck-notifications"
                             x-cloak
                             :class="notificationDeckTab === 'notifications' ? 'block' : 'hidden'"
                             role="tabpanel"
                             class="space-y-2"
                             data-notification-deck-panel>
                        <div id="notification-deck-notifications-content">
                            {% include "platform_operations/notifications/partials/_notification_deck_notifications.html" %}
                        </div>
                    </section>
                </div>
                <footer class="flex shrink-0 flex-col items-stretch gap-2 border-t border-outline-subtle bg-surface-card px-3 py-2.5 sm:flex-row sm:items-center sm:justify-between sm:gap-3 sm:px-4 sm:py-3"
                        data-notification-deck-footer>
                    <div class="min-w-0 text-xs text-content-muted" aria-live="polite">
                        <p class="inline-flex min-w-0 items-center gap-1.5 sm:truncate">
                            <span class="h-2 w-2 shrink-0 rounded-full"
                                  :class="notificationDeckConnectionIssue ? 'bg-status-warning' : 'bg-status-normal'"></span>
                            <span x-show="!notificationDeckConnectionIssue">Auto refresh every 15 seconds</span>
                            <span x-cloak x-show="notificationDeckConnectionIssue">Connection issue · retrying automatically</span>
                        </p>
                        <p x-cloak
                           x-show="notificationDeckLastChecked"
                           class="mt-0.5 hidden truncate sm:block"
                           x-text="`Updated ${notificationDeckLastChecked}`"></p>
                    </div>
                    <a x-cloak
                       x-show="notificationDeckTab === 'inbox'"
                       href="{{ url_for('notifications.center', view='notifications', category='intelligence') }}"
                       @click="notificationDeckOpen = false"
                       class="inline-flex min-h-9 w-full shrink-0 items-center justify-center gap-1 rounded-lg px-3 py-2 text-xs font-semibold text-kaori-primary transition hover:bg-surface-hover hover:text-kaori-primary-hover sm:min-h-0 sm:w-auto sm:justify-start sm:rounded-none sm:px-0 sm:py-0 sm:hover:bg-transparent">
                        View Intelligence <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i>
                    </a>
                    <a x-show="notificationDeckTab !== 'inbox'"
                       href="{{ url_for('notifications.center', view='notifications') }}"
                       @click="notificationDeckOpen = false"
                       class="inline-flex min-h-9 w-full shrink-0 items-center justify-center gap-1 rounded-lg px-3 py-2 text-xs font-semibold text-kaori-primary transition hover:bg-surface-hover hover:text-kaori-primary-hover sm:min-h-0 sm:w-auto sm:justify-start sm:rounded-none sm:px-0 sm:py-0 sm:hover:bg-transparent">
                        View All <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i>
                    </a>
                </footer>
            </aside>
        </div>
    </template>
</div>
