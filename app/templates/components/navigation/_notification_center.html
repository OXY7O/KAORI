{% set center = activity_center|default({}) %}
{% set active_count = center.get('active_count', 0) %}
{% set unread_count = center.get('unread_count', 0) %}
<div id="notification-center"
     class="contents"
     data-notification-deck-root>
    <button @click="notificationDeckTab = {{ "'notifications'" if unread_count else "'activity'" }}; notificationDeckOpen = true; quickOpen = false; userOpen = false"
            type="button"
            class="relative inline-flex h-10 w-10 items-center justify-center rounded-xl border border-outline-default bg-surface-card text-content-secondary shadow-sm transition hover:border-kaori-primary/30 hover:bg-kaori-soft hover:text-kaori-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus"
            aria-label="Open notification deck"
            aria-controls="notification-deck"
            :aria-expanded="notificationDeckOpen.toString()"
            title="Notifications">
        <i data-lucide="bell" class="h-5 w-5"></i>
        <span id="notification-bell-badge"
              class="absolute -right-1 -top-1 inline-flex min-h-5 min-w-5 items-center justify-center rounded-full bg-status-critical px-1 text-xs font-semibold text-white ring-2 ring-surface-card {% if unread_count == 0 %}hidden{% endif %}">
            {{ '9+' if unread_count > 9 else unread_count }}
        </span>
        <span id="notification-running-indicator"
              class="absolute -bottom-0.5 -left-0.5 h-2.5 w-2.5 rounded-full border-2 border-surface-card bg-kaori-primary {% if active_count == 0 %}hidden{% endif %}"
              aria-hidden="true"></span>
    </button>

    <template x-teleport="body">
        <div x-cloak
             x-show="notificationDeckOpen"
             class="fixed inset-0 z-50"
             role="dialog"
             aria-modal="true"
             aria-label="Notification deck"
             data-notification-deck-dialog>
            <button type="button"
                    class="absolute inset-0 bg-surface-overlay/70 backdrop-blur-sm"
                    @click="notificationDeckOpen = false"
                    aria-label="Close notification deck"></button>
            <aside id="notification-deck"
                   class="absolute inset-y-0 right-0 flex h-full w-full max-w-md flex-col overflow-hidden border-l border-outline-default bg-surface-elevated shadow-2xl shadow-black/20"
                   x-transition:enter="transition ease-out duration-200"
                   x-transition:enter-start="translate-x-full"
                   x-transition:enter-end="translate-x-0"
                   x-transition:leave="transition ease-in duration-150"
                   x-transition:leave-start="translate-x-0"
                   x-transition:leave-end="translate-x-full">
                <header class="flex shrink-0 items-center justify-between gap-4 border-b border-outline-subtle bg-surface-card px-4 py-3.5">
                    <div class="flex min-w-0 items-center gap-3">
                        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                            <i data-lucide="bell" class="h-4.5 w-4.5"></i>
                        </span>
                        <div class="min-w-0">
                            <h2 class="text-sm font-semibold text-content-primary">Notifications</h2>
                            <p class="mt-0.5 truncate text-xs text-content-muted">Running activity and persistent updates</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button type="button"
                                @click="window.htmx?.trigger(document.body, 'kaori:notification-deck-refresh')"
                                class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-content-muted transition hover:bg-surface-hover hover:text-content-primary"
                                aria-label="Refresh notification deck"
                                title="Refresh">
                            <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                        </button>
                        <button type="button"
                                @click="notificationDeckOpen = false"
                                class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-content-muted transition hover:bg-surface-hover hover:text-content-primary"
                                aria-label="Close notification deck">
                            <i data-lucide="x" class="h-4 w-4"></i>
                        </button>
                    </div>
                </header>

                <div class="grid shrink-0 grid-cols-2 gap-1 border-b border-outline-subtle bg-surface-subtle p-2">
                    <button type="button"
                            @click="notificationDeckTab = 'activity'"
                            :class="notificationDeckTab === 'activity' ? 'border-kaori-primary bg-surface-card text-kaori-primary shadow-sm' : 'border-transparent text-content-muted hover:bg-surface-card hover:text-content-primary'"
                            class="inline-flex min-h-10 items-center justify-center gap-2 rounded-lg border px-3 text-xs font-semibold transition">
                        <i data-lucide="activity" class="h-3.5 w-3.5"></i>
                        Activity
                        <span id="notification-deck-active-count"
                              class="inline-flex min-h-5 min-w-5 items-center justify-center rounded-md bg-kaori-soft px-1.5 text-xs text-kaori-primary">{{ active_count }}</span>
                    </button>
                    <button type="button"
                            @click="notificationDeckTab = 'notifications'"
                            :class="notificationDeckTab === 'notifications' ? 'border-kaori-primary bg-surface-card text-kaori-primary shadow-sm' : 'border-transparent text-content-muted hover:bg-surface-card hover:text-content-primary'"
                            class="inline-flex min-h-10 items-center justify-center gap-2 rounded-lg border px-3 text-xs font-semibold transition">
                        <i data-lucide="bell" class="h-3.5 w-3.5"></i>
                        Notifications
                        <span id="notification-deck-unread-count"
                              class="inline-flex min-h-5 min-w-5 items-center justify-center rounded-md bg-surface-card px-1.5 text-xs">{{ unread_count }}</span>
                    </button>
                </div>

                <div class="min-h-0 flex-1 overflow-y-auto bg-surface-page p-3 [scrollbar-gutter:stable]">
                    <section id="notification-deck-activity"
                             x-show="notificationDeckTab === 'activity'"
                             class="space-y-2"
                             hx-get="{{ url_for('notifications.panel_activity') }}"
                             hx-trigger="every 15s, kaori:notifications-changed from:body, kaori:notification-deck-refresh from:body"
                             hx-target="this"
                             hx-swap="innerHTML"
                             hx-sync="this:replace"
                             hx-history="false">
                        {% include "notifications/partials/_notification_deck_activity.html" %}
                    </section>

                    <section id="notification-deck-notifications"
                             x-show="notificationDeckTab === 'notifications'"
                             class="space-y-2"
                             hx-get="{{ url_for('notifications.panel_notifications') }}"
                             hx-trigger="every 15s, kaori:notifications-changed from:body, kaori:notification-deck-refresh from:body"
                             hx-target="this"
                             hx-swap="innerHTML"
                             hx-sync="this:replace"
                             hx-history="false">
                        {% include "notifications/partials/_notification_deck_notifications.html" %}
                    </section>
                </div>

                <footer class="flex shrink-0 items-center justify-between gap-3 border-t border-outline-subtle bg-surface-card px-4 py-3">
                    <p class="min-w-0 truncate text-xs text-content-muted">Auto refresh every 15 seconds</p>
                    <a href="{{ url_for('notifications.center', view='notifications') }}"
                       @click="notificationDeckOpen = false"
                       class="inline-flex shrink-0 items-center gap-1 text-xs font-semibold text-kaori-primary hover:text-kaori-primary-hover">
                        View all <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i>
                    </a>
                </footer>
            </aside>
        </div>
    </template>
</div>
