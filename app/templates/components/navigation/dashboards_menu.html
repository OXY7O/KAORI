{% set dashboards_active = request.endpoint and request.endpoint.startswith('kubernetes_dashboard.') %}
<details class="sidebar-menu space-y-1"
         {% if dashboards_active %}open{% endif %}>
    <summary class="{{ 'bg-kaori-primary text-white shadow-lg shadow-kaori-primary/20 ring-1 ring-white/10' if dashboards_active else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between min-h-11 rounded-lg px-2.5 py-2 text-base font-semibold leading-6 transition [.sidebar-collapsed_&]:justify-center [.sidebar-collapsed_&]:px-2"
             title="Dashboards"
             aria-label="Dashboards"
             @click="if (!sidebarExpanded) { $event.preventDefault(); toggleSidebar(); $el.parentElement.open = true }">
        <div class="flex min-w-0 items-center gap-2.5">
            <span class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg {{ 'bg-white/15 text-white' if dashboards_active else 'bg-white/5 text-brand-foreground-muted group-hover:bg-white/10 group-hover:text-white' }} transition">
                <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
            </span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap">Dashboards</span>
        </div>
        <i data-lucide="chevron-right"
           class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4"></i>
    </summary>
    <div class="sidebar-expanded-only sidebar-submenu ml-6 mt-1 space-y-1 border-l border-white/10 pl-3">
        <a href="{{ url_for('kubernetes_dashboard.index') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint and request.endpoint.startswith('kubernetes_dashboard.') else 'text-brand-foreground-muted hover:bg-white/[0.07] hover:text-white' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint and request.endpoint.startswith('kubernetes_dashboard.') else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span>
            <i data-lucide="boxes" class="h-3.5 w-3.5"></i>
            <span class="truncate whitespace-nowrap">Kubernetes</span>
        </a>
    </div>
</details>
