{% set settings_owned_endpoints = ["settings.general", "settings.account"] %}
{% set settings_active = request.endpoint in settings_owned_endpoints %}
<details class="sidebar-menu space-y-1"
         {% if settings_active %}open{% endif %}>
    <summary class="{{ 'sidebar-parent-active' if settings_active else 'sidebar-item-idle' }} sidebar-parent-link group flex cursor-pointer select-none items-center justify-between min-h-11 rounded-lg px-2.5 py-2 text-base font-semibold leading-6 transition [.sidebar-collapsed_&]:justify-center [.sidebar-collapsed_&]:px-2"
             title="Settings"
             aria-label="Settings"
             @click="if (!sidebarExpanded) { $event.preventDefault(); toggleSidebar(); $el.parentElement.open = true }">
        <div class="flex min-w-0 items-center gap-2.5">
            <span class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg {{ 'sidebar-parent-active-icon' if settings_active else 'sidebar-item-idle-icon' }} transition">
                <i data-lucide="settings" class="h-4 w-4"></i>
            </span>
            <span class="sidebar-expanded-only truncate whitespace-nowrap">Settings</span>
        </div>
        <i data-lucide="chevron-right"
           class="sidebar-expanded-only sidebar-menu-chevron h-4 w-4 {{ 'text-kaori-accent' if settings_active else 'text-white/[0.35]' }}"></i>
    </summary>
    <div class="sidebar-expanded-only sidebar-submenu ml-6 mt-1 space-y-1 border-l border-white/10 pl-3">
        <a href="{{ url_for('settings.general') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint == 'settings.general' else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint == 'settings.general' else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span><i data-lucide="settings" class="h-3.5 w-3.5"></i><span class="truncate whitespace-nowrap">General</span>
        </a>
        <a href="{{ url_for('settings.account') }}"
           class="{{ 'bg-white/[0.08] text-kaori-accent' if request.endpoint == 'settings.account' else 'sidebar-item-idle' }} group flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm leading-5 transition">
            <span class="h-1.5 w-1.5 rounded-full {{ 'bg-kaori-accent' if request.endpoint == 'settings.account' else 'bg-white/20 group-hover:bg-white/[0.45]' }}"></span><i data-lucide="user" class="h-3.5 w-3.5"></i><span class="truncate whitespace-nowrap">Account</span>
        </a>
    </div>
</details>
