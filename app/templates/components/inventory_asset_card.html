{# Canonical destination card for one Kubernetes inventory asset type. #}
{% macro render(title, count, description, href, icon, action_label='Open Inventory') -%}
    <a href="{{ href }}"
       class="group flex h-full min-h-40 flex-col rounded-xl border border-outline-default bg-surface-card p-4 transition hover:border-kaori-primary/30 hover:bg-kaori-mist hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus">
        <div class="flex items-start justify-between gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary"
                  aria-hidden="true">
                <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
            </span>
            <span class="text-2xl font-semibold leading-none text-content-primary">{{ count }}</span>
        </div>
        <div class="mt-4 min-w-0 flex-1">
            <h3 class="text-base font-semibold text-content-primary">{{ title }}</h3>
            <p class="mt-1 text-xs leading-5 text-content-muted">{{ description }}</p>
        </div>
        <div class="mt-4 flex items-center justify-between gap-3 border-t border-outline-subtle pt-3 text-xs font-semibold text-kaori-primary">
            <span>{{ action_label }}</span>
            <i data-lucide="arrow-up-right" class="h-4 w-4 transition-transform group-hover:translate-x-0.5" aria-hidden="true"></i>
        </div>
    </a>
{%- endmacro %}
