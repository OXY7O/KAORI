{% macro render(label, key_name, value, encoding='UTF-8', expires_in_seconds=60) -%}
    <section data-protected-value-panel
             data-expires-in="{{ expires_in_seconds }}"
             class="overflow-hidden rounded-xl border border-outline-default bg-surface-card shadow-sm">
        <header class="flex flex-wrap items-start justify-between gap-3 border-b border-outline-subtle px-4 py-3.5">
            <div class="flex min-w-0 items-start gap-3">
                <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-status-warning-soft text-status-warning-text"
                      aria-hidden="true"><i data-lucide="eye" class="h-4 w-4"></i></span>
                <div class="min-w-0">
                    <h3 class="break-words text-sm font-semibold text-content-primary [overflow-wrap:anywhere]">{{ label }}</h3>
                    <p class="mt-1 break-words text-xs leading-5 text-content-muted [overflow-wrap:anywhere]">Key · {{ key_name }}</p>
                </div>
            </div>
            <span class="inline-flex min-h-6 items-center rounded-md border border-outline-default bg-status-warning-soft px-2 text-xs font-semibold text-status-warning-text"
                  data-protected-value-countdown
                  aria-live="polite">{{ expires_in_seconds }}s</span>
        </header>
        <div class="p-4">
            <div class="rounded-lg border border-outline-subtle bg-surface-elevated p-4">
                <pre data-protected-value
                     class="max-h-72 overflow-auto whitespace-pre-wrap break-words font-mono text-sm leading-6 text-content-primary [overflow-wrap:anywhere]">{{ value }}</pre>
            </div>
            <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-xs leading-5 text-content-muted">
                <span>Encoding · {{ encoding }}</span>
                <span>Clears automatically when the window expires.</span>
            </div>
        </div>
    </section>
{%- endmacro %}
