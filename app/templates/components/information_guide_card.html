{% macro render(title, description, items, icon='book-open', open_by_default=false, aria_label=None) -%}
    <details class="group overflow-hidden rounded-xl border border-outline-default bg-surface-card shadow-sm"
             aria-label="{{ aria_label or title }}"
             {% if open_by_default %}open{% endif %}>
        <summary class="flex cursor-pointer list-none select-none items-start justify-between gap-3 border-b border-outline-subtle bg-surface-hover px-4 py-3.5 transition hover:bg-kaori-soft/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-outline-focus [&::-webkit-details-marker]:hidden">
            <div class="flex min-w-0 items-start gap-3">
                <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                    <i data-lucide="{{ icon }}" class="h-4 w-4" aria-hidden="true"></i>
                </span>
                <div class="min-w-0">
                    <h2 class="text-sm font-semibold text-content-primary">{{ title }}</h2>
                    <p class="mt-0.5 text-xs leading-5 text-content-muted">{{ description }}</p>
                </div>
            </div>
            <span class="ml-auto flex shrink-0 items-center gap-2 pl-3 text-xs font-semibold text-content-secondary">
                <span class="group-open:hidden">Details</span>
                <span class="hidden group-open:inline">Collapse</span>
                <i data-lucide="chevron-down"
                   class="h-4 w-4 transition-transform duration-200 group-open:rotate-180"
                   aria-hidden="true"></i>
            </span>
        </summary>
        <div class="divide-y divide-outline-subtle p-4">
            {% for item in items %}
                <div class="flex items-start gap-3 py-3 first:pt-0 last:pb-0">
                    <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-outline-subtle bg-surface-hover text-kaori-primary">
                        <i data-lucide="{{ item[0] }}" class="h-4 w-4" aria-hidden="true"></i>
                    </span>
                    <div class="min-w-0">
                        <h3 class="text-xs font-semibold leading-5 text-content-secondary">{{ item[1] }}</h3>
                        <p class="mt-0.5 text-xs leading-5 text-content-muted">{{ item[2] }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </details>
{%- endmacro %}
