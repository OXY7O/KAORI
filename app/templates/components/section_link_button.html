{% macro render(href, label, icon='arrow-up-right', aria_label=None) -%}
    <a href="{{ href }}"
       {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
       class="inline-flex h-8 shrink-0 items-center justify-center gap-1.5 rounded-lg border border-outline-default bg-surface-card px-3 text-xs font-semibold text-content-secondary shadow-sm transition-colors hover:border-brand-outline hover:bg-kaori-soft hover:text-kaori-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus focus-visible:ring-offset-2 focus-visible:ring-offset-surface-card">
        <span>{{ label }}</span>
        {% if icon %}
            <i data-lucide="{{ icon }}" class="h-3.5 w-3.5 shrink-0" aria-hidden="true"></i>
        {% endif %}
    </a>
{%- endmacro %}
