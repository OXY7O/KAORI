{% macro option(value, title, description, icon, model='selectedChoice', input_name='choice', checked=false) -%}
    <label class="secret-type-choice block min-w-0 cursor-pointer">
        <input type="radio"
               name="{{ input_name }}"
               value="{{ value }}"
               class="secret-type-input sr-only"
               x-model="{{ model }}"
               @change="{{ model }} = $event.target.value"
               {% if checked %}checked{% endif %}>
        <span class="secret-type-option relative flex min-h-0 min-w-0 flex-col overflow-hidden rounded-xl border border-brand-outline bg-kaori-soft p-4 text-left transition-colors hover:border-kaori-primary hover:bg-kaori-mist">
            <span class="flex items-start justify-between gap-3">
                <span class="secret-type-icon flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-outline-subtle bg-kaori-soft text-kaori-primary transition-colors"
                      aria-hidden="true"><i data-lucide="{{ icon }}" class="h-4 w-4"></i></span>
                <span class="secret-type-selected-indicator inline-flex min-h-6 items-center gap-1 rounded-md bg-kaori-soft px-2 text-xs font-semibold text-kaori-primary"
                      aria-hidden="true"><i data-lucide="check" class="h-3.5 w-3.5"></i>Selected</span>
            </span>
            <span class="secret-type-title mt-3 break-words text-sm font-semibold leading-5 text-content-primary [overflow-wrap:anywhere]">{{ title }}</span>
            <span class="mt-1 break-words text-xs leading-5 text-content-muted [overflow-wrap:anywhere]">{{ description }}</span>
        </span>
    </label>
{%- endmacro %}
