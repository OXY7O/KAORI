{% macro option(value, title, description, icon, model='selectedChoice', input_name='choice', checked=false) -%}
    <label class="block min-w-0 cursor-pointer">
        <input type="radio"
               name="{{ input_name }}"
               value="{{ value }}"
               class="sr-only"
               x-model="{{ model }}"
               {% if checked %}checked{% endif %}>
        <span class="flex min-h-0 min-w-0 flex-col rounded-xl border border-outline-default bg-surface-card p-4 text-left transition hover:border-kaori-primary/40 hover:bg-kaori-soft/40"
              :class="{{ model }} === {{ value|tojson }} ? 'border-kaori-primary bg-kaori-soft ring-1 ring-kaori-primary/20' : ''"
              role="radio"
              :aria-checked="{{ model }} === {{ value|tojson }} ? 'true' : 'false'">
            <span class="flex items-start justify-between gap-3">
                <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-outline-subtle bg-kaori-soft text-kaori-primary" aria-hidden="true"><i data-lucide="{{ icon }}" class="h-4 w-4"></i></span>
                <span class="inline-flex h-6 w-6 items-center justify-center rounded-full border border-outline-default bg-surface-card text-kaori-primary"
                      x-show="{{ model }} === {{ value|tojson }}" x-cloak aria-hidden="true"><i data-lucide="check" class="h-3.5 w-3.5"></i></span>
            </span>
            <span class="mt-3 break-words text-sm font-semibold leading-5 text-content-primary [overflow-wrap:anywhere]">{{ title }}</span>
            <span class="mt-1 break-words text-xs leading-5 text-content-muted [overflow-wrap:anywhere]">{{ description }}</span>
        </span>
    </label>
{%- endmacro %}
