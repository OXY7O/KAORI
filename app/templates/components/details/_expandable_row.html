{% import "components/table.html" as table_ui %}
{% macro toggle_button(group, item_id, detail_url, target_id, row_id, class_name='') -%}
    <button type="button"
            data-detail-toggle
            data-detail-group="{{ group }}"
            data-detail-item="{{ item_id }}"
            data-detail-target="{{ target_id }}"
            data-detail-row="{{ row_id }}"
            aria-expanded="false"
            hx-get="{{ detail_url }}"
            hx-target="#{{ target_id }}"
            hx-swap="innerHTML"
            class="{{ table_ui.action_classes() }} {{ class_name }}">
        <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
        <span data-detail-toggle-label>View More</span>
    </button>
{%- endmacro %}
{% macro detail_row(row_id, target_id, colspan, content_classes='w-full min-w-0 overflow-x-auto') -%}
    <tr id="{{ row_id }}" class="hidden border-0">
        <td colspan="{{ colspan }}" class="w-full p-0 leading-none align-top">
            <div id="{{ target_id }}"
                 data-detail-content
                 data-open="false"
                 class="{{ content_classes }}"></div>
        </td>
    </tr>
{%- endmacro %}
