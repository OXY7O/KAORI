{% macro toggle_button(group, item_id, detail_url, target_id, row_id, class_name='') -%}
    <button type="button"
            data-detail-toggle
            data-detail-group="{{ group }}"
            data-detail-item="{{ item_id }}"
            data-detail-target="{{ target_id }}"
            data-detail-row="{{ row_id }}"
            aria-expanded="false"
            hx-get="{{ detail_url }}"
            hx-target="#{{ target_id }}"
            hx-swap="innerHTML"
            class="inline-flex h-8 items-center gap-1.5 rounded-lg border border-outline-default bg-surface-card px-2.5 text-xs font-semibold text-content-secondary shadow-sm transition hover:border-outline-focus hover:bg-kaori-soft hover:text-kaori-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus {{ class_name }}">
        <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
        <span data-detail-toggle-label>View More</span>
    </button>
{%- endmacro %}
{% macro detail_row(row_id, target_id, colspan) -%}
    <tr id="{{ row_id }}" class="hidden border-0">
        <td colspan="{{ colspan }}" class="p-0 leading-none align-top">
            <div id="{{ target_id }}" data-detail-content data-open="false"></div>
        </td>
    </tr>
{%- endmacro %}
