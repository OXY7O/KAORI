{% import "components/table_label.html" as table_label %}

{% macro render(workspace) -%}
    <a href="{{ workspace.href }}"
       class="group flex min-h-60 flex-col rounded-xl border border-outline-default bg-surface-card p-5 shadow-sm transition duration-200 hover:border-outline-focus hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus focus-visible:ring-offset-2 focus-visible:ring-offset-surface-card"
       aria-label="Open {{ workspace.title }} Workspace"
       data-workspace-card
       data-search-text="{{ workspace.search_text }}">
        <div class="flex items-start justify-between gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-brand-outline bg-kaori-soft text-kaori-primary transition group-hover:bg-kaori-primary group-hover:text-white"
                  aria-hidden="true">
                <i data-lucide="{{ workspace.icon }}" class="h-4 w-4"></i>
            </span>
            {{ table_label.metadata_label(workspace.scope) }}
        </div>

        <div class="mt-5 flex-1">
            <p class="text-xs font-semibold text-kaori-primary">{{ workspace.label }}</p>
            <h4 class="mt-2 text-base font-semibold leading-6 text-content-primary">{{ workspace.title }}</h4>
            <p class="mt-2 text-xs leading-5 text-content-muted">{{ workspace.description }}</p>
        </div>

        <div class="mt-5 flex items-center justify-between gap-3 border-t border-outline-subtle pt-4">
            <span class="text-sm font-semibold text-kaori-primary">Open Workspace</span>
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary transition group-hover:bg-kaori-primary group-hover:text-white"
                  aria-hidden="true">
                <i data-lucide="arrow-up-right" class="h-4 w-4"></i>
            </span>
        </div>
    </a>
{%- endmacro %}
