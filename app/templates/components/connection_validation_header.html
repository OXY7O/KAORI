{% macro render(title, description, icon='plug-zap', aria_label=None) -%}
<header class="flex flex-col gap-3 border-b border-outline-subtle px-4 py-4 sm:px-5 lg:flex-row lg:items-center lg:justify-between"
        aria-label="{{ aria_label or title }}">
    <div class="flex min-w-0 items-start gap-3">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
            <i data-lucide="{{ icon }}" class="h-5 w-5" aria-hidden="true"></i>
        </span>
        <div class="min-w-0">
            <h2 class="text-base font-semibold text-content-primary">{{ title }}</h2>
            <p class="mt-0.5 max-w-2xl text-xs leading-5 text-content-muted">{{ description }}</p>
        </div>
    </div>
    {% if caller is defined %}
        <div class="flex shrink-0 flex-wrap items-center gap-2">
            {{ caller() }}
        </div>
    {% endif %}
</header>
{%- endmacro %}
