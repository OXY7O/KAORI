{% macro render(modal_id, title, target_name, consequence, confirm_button_id, action_label='Delete Resource') -%}
    <div id="{{ modal_id }}" data-destructive-confirmation-modal class="fixed inset-0 z-[90] hidden items-center justify-center p-4" aria-hidden="true">
        <button type="button" data-destructive-modal-close class="absolute inset-0 bg-surface-overlay/70 backdrop-blur-sm" aria-label="Cancel Destructive Operation"></button>
        <section role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title" tabindex="-1" class="relative w-full max-w-lg overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-2xl">
            <header class="flex items-start gap-3 border-b border-outline-subtle px-5 py-4">
                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-status-critical-soft text-status-critical-text" aria-hidden="true"><i data-lucide="triangle-alert" class="h-5 w-5"></i></span>
                <div class="min-w-0">
                    <h2 id="{{ modal_id }}-title" class="break-words text-lg font-semibold leading-6 text-content-primary [overflow-wrap:anywhere]">{{ title }}</h2>
                    <p class="mt-1 break-words text-sm leading-6 text-content-secondary [overflow-wrap:anywhere]">This final action cannot be reversed by KAORI.</p>
                </div>
            </header>
            <div class="space-y-4 p-5">
                <dl class="rounded-lg border border-outline-subtle bg-surface-elevated px-4 py-3">
                    <div class="grid gap-2 sm:grid-cols-[8rem_minmax(0,1fr)]">
                        <dt class="text-xs text-content-muted">Target</dt>
                        <dd data-destructive-target-name class="break-words text-sm font-semibold text-content-primary [overflow-wrap:anywhere]">{{ target_name or 'Selected Resource' }}</dd>
                        <dt class="text-xs text-content-muted">Scope</dt>
                        <dd data-destructive-target-scope class="break-words text-sm font-medium text-content-secondary [overflow-wrap:anywhere]">Live Kubernetes target</dd>
                    </div>
                </dl>
                <p class="break-words text-sm leading-6 text-content-secondary [overflow-wrap:anywhere]">{{ consequence }}</p>
            </div>
            <footer class="flex flex-col-reverse gap-2 border-t border-outline-subtle bg-surface-hover px-5 py-4 sm:flex-row sm:justify-end">
                <button type="button" data-destructive-modal-close class="inline-flex h-10 items-center justify-center rounded-lg border border-outline-default bg-surface-card px-4 text-sm font-semibold text-content-secondary hover:bg-kaori-soft">Cancel</button>
                <button type="button" data-destructive-modal-confirm data-submit-button-id="{{ confirm_button_id }}" class="inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-status-critical px-4 text-sm font-semibold text-white"><i data-lucide="trash-2" class="h-4 w-4"></i>{{ action_label }}</button>
            </footer>
        </section>
    </div>
{%- endmacro %}
