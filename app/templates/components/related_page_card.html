{% macro render(title, description, href, action_label, icon='arrow-up-right', eyebrow='Related Workspace', boundary=None, aria_label=None) -%}
<section class="flex h-full flex-col rounded-2xl border border-brand-outline bg-kaori-primary p-5 text-brand-foreground shadow-sm"
         aria-label="{{ aria_label or title }}">
    <div class="flex items-start gap-3">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-brand-outline bg-brand-surface-strong">
            <i data-lucide="{{ icon }}" class="h-5 w-5" aria-hidden="true"></i>
        </span>
        <div class="min-w-0">
            <p class="text-[10px] font-semibold uppercase tracking-[0.12em] text-brand-foreground-muted">{{ eyebrow }}</p>
            <h2 class="mt-1 text-base font-semibold text-brand-foreground">{{ title }}</h2>
            <p class="mt-1 text-sm leading-6 text-brand-foreground-muted">{{ description }}</p>
        </div>
    </div>

    {% if boundary %}
        <div class="mt-4 rounded-xl border border-white/20 bg-brand-surface px-3 py-3">
            <p class="text-xs leading-5 text-brand-foreground-muted">{{ boundary }}</p>
        </div>
    {% endif %}

    <a href="{{ href }}"
       class="mt-auto inline-flex min-h-10 w-full items-center justify-center gap-2 rounded-lg border border-white/30 bg-surface-card px-3 py-2 text-sm font-semibold text-kaori-primary transition hover:bg-kaori-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70">
        {{ action_label }}
        <i data-lucide="arrow-right" class="h-4 w-4" aria-hidden="true"></i>
    </a>
</section>
{%- endmacro %}
