{% macro render(title, description, href, action_label, icon='arrow-up-right', eyebrow='Related Workspace', boundary=None, aria_label=None) -%}
    <section class="flex flex-col rounded-2xl border border-kaori-primary/20 bg-kaori-soft p-5 shadow-sm dark:border-brand-outline"
             aria-label="{{ aria_label or title }}"
             data-kaori-related-workspace-card>
        <div class="flex items-start gap-3">
            <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-kaori-primary/15 bg-surface-card text-kaori-primary shadow-sm dark:border-brand-outline dark:text-kaori-accent">
                <i data-lucide="{{ icon }}" class="h-5 w-5" aria-hidden="true"></i>
            </span>
            <div class="min-w-0">
                <p class="text-xs font-semibold uppercase tracking-wider text-kaori-primary dark:text-kaori-accent">{{ eyebrow }}</p>
                <h2 class="mt-1 text-base font-semibold text-content-primary">{{ title }}</h2>
                <p class="mt-1 text-sm leading-6 text-content-secondary">{{ description }}</p>
            </div>
        </div>
        {% if boundary %}
            <div class="mt-4 rounded-xl border border-outline-subtle bg-surface-card px-3 py-3">
                <p class="text-xs leading-5 text-content-secondary">{{ boundary }}</p>
            </div>
        {% endif %}
        <div class="mt-6">
            <a href="{{ href }}"
               class="inline-flex min-h-10 w-full items-center justify-center gap-2 rounded-lg bg-kaori-primary px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-kaori-primary-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus focus-visible:ring-offset-2 focus-visible:ring-offset-kaori-soft">
                {{ action_label }}
                <i data-lucide="arrow-right" class="h-4 w-4" aria-hidden="true"></i>
            </a>
        </div>
    </section>
{%- endmacro %}
