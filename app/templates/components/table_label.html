{% macro status_label(text, tone='info', icon=None) -%}
    <span class="kaori-semantic-label inline-flex min-h-6 items-center gap-1 rounded-md px-2 py-0.5 text-[10px] font-semibold leading-4 {% if tone == 'normal' %}bg-status-normal-soft text-status-normal-text {% elif tone == 'warning' %}bg-status-warning-soft text-status-warning-text {% elif tone == 'critical' %}bg-status-critical-soft text-status-critical-text {% elif tone == 'unknown' %}bg-status-unknown-soft text-status-unknown-text {% elif tone == 'disabled' %}bg-status-disabled-soft text-status-disabled-text {% elif tone == 'maintenance' %}bg-status-warning-soft text-status-warning-text {% elif tone == 'pending' %}bg-status-info-soft text-status-info-text {% else %}bg-status-info-soft text-status-info-text{% endif %}">
        {% if icon %}
            <i data-lucide="{{ icon }}"
               class="h-3 w-3 shrink-0 {% if tone == 'normal' %}text-status-normal{% elif tone == 'warning' %}text-status-warning{% elif tone == 'critical' %}text-status-critical{% elif tone == 'unknown' %}text-status-unknown{% elif tone == 'disabled' %}text-status-disabled{% elif tone == 'maintenance' %}text-status-warning{% elif tone == 'pending' %}text-status-info{% else %}text-status-info{% endif %}"
               aria-hidden="true"></i>
        {% endif %}
        <span>{{ text }}</span>
    </span>
{%- endmacro %}
{% macro metadata_label(text, icon=None) -%}
    <span class="kaori-semantic-label inline-flex min-h-6 items-center gap-1 rounded-md bg-kaori-soft px-2 py-0.5 text-[10px] font-semibold leading-4 text-kaori-primary-dark">
        {% if icon %}
            <i data-lucide="{{ icon }}"
               class="h-3 w-3 shrink-0 text-kaori-primary"
               aria-hidden="true"></i>
        {% endif %}
        <span>{{ text }}</span>
    </span>
{%- endmacro %}
