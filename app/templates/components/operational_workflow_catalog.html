{% import "components/table_primitives.html" as table_ui %}
{% macro render(title, description, eyebrow='Operational Workflow Catalog', aria_label=None) -%}
    <section class="{{ table_ui.block_classes() }}"
             aria-label="{{ aria_label or title }}">
        <header class="px-5 py-5 sm:px-6">
            <p class="text-xs font-semibold text-kaori-primary dark:text-kaori-accent">{{ eyebrow }}</p>
            <h2 class="mt-1 text-xl font-semibold text-content-primary">{{ title }}</h2>
            <p class="mt-1 break-words text-sm leading-6 text-content-secondary [overflow-wrap:anywhere]">{{ description }}</p>
        </header>
        <div class="border-t border-outline-subtle">{{ caller() }}</div>
    </section>
{%- endmacro %}
