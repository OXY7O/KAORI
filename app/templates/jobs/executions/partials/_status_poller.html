<span id="execution-overview-status-poller"
      class="hidden"
      aria-hidden="true"
      hx-get="{{ url_for('jobs.executions', fragment='status', execution_tab=selected_job_tab) }}"
      hx-trigger="load delay:3s, every 30s"
      hx-target="this"
      hx-on::before-request="if (document.hidden) event.preventDefault()"
      hx-swap="outerHTML swap:0ms settle:0ms"
      hx-sync="this:replace"></span>
