{% import "components/action_button.html" as action_button %}
<dialog id="kaori-session-expiry"
        data-kaori-session-warning
        data-status-url="{{ url_for('auth.session_status') }}"
        data-activity-url="{{ url_for('auth.session_activity') }}"
        data-login-url="{{ url_for('auth.login') }}"
        data-csrf="{{ csrf_token() }}"
        aria-labelledby="kaori-session-expiry-title"
        aria-describedby="kaori-session-expiry-description"
        class="kaori-native-dialog m-auto w-[calc(100vw-1.5rem)] max-w-md overflow-hidden rounded-2xl border border-outline-default bg-surface-card p-0 shadow-2xl sm:w-[calc(100vw-3rem)]">
    <section class="flex max-h-[calc(100dvh-2rem)] min-h-0 flex-col overflow-hidden">
        <header class="flex items-start gap-3 border-b border-outline-subtle bg-surface-card px-5 py-4 sm:px-6">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-status-warning-soft text-status-warning-text"
                  aria-hidden="true"><i data-lucide="clock" class="h-5 w-5"></i></span>
            <div class="min-w-0">
                <p class="text-xs font-semibold text-kaori-primary">Session Security</p>
                <h2 id="kaori-session-expiry-title"
                    class="mt-1 text-lg font-semibold leading-7 text-content-primary">Session Expiring</h2>
                <p id="kaori-session-expiry-description"
                   data-session-expiry-description
                   class="mt-1 text-xs leading-5 text-content-muted">Your authenticated session is approaching its server deadline.</p>
            </div>
        </header>
        <div class="space-y-3 overflow-y-auto p-5 sm:px-6">
            <p class="text-center text-xs font-semibold uppercase tracking-wide text-content-muted">Time Remaining</p>
            <p data-session-expiry-countdown
               class="text-center text-3xl font-semibold tabular-nums text-status-warning-text">--:--</p>
            <p data-session-expiry-message
               role="status"
               aria-live="polite"
               class="text-center text-xs leading-5 text-content-secondary">Continuing can extend idle time only.</p>
        </div>
        <footer class="flex flex-wrap justify-end gap-2 border-t border-outline-subtle bg-surface-card px-5 py-4 sm:px-6">
            <form method="post" action="{{ url_for('auth.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="{{ action_button.classes('secondary') }}">Sign Out</button>
            </form>
            <button type="button"
                    data-session-continue
                    autofocus
                    class="{{ action_button.classes('primary') }} disabled:cursor-not-allowed disabled:opacity-50">Continue Session</button>
        </footer>
    </section>
</dialog>
