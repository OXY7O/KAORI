<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon"
              type="image/svg+xml"
              href="{{ url_for('static', filename='favicon.svg') }}" />
        <title>{% block title %}KAORI{% endblock title %}</title>
        <script>
            ;(function () {
                const storedTheme = localStorage.getItem('theme')

                if (storedTheme === 'dark') {
                    document.documentElement.classList.add('dark')
                }
            })()
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
              rel="stylesheet" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/output.css') }}" />
    </head>
    <body class="min-h-full bg-surface-page font-sans text-content-primary antialiased">
        {% block content %}
        {% endblock content %}
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const renderIcons = () => {
                    if (window.lucide) {
                        window.lucide.createIcons()
                    }
                }

                renderIcons()

                const passwordInput = document.querySelector('[data-password-input]')
                const passwordToggle = document.querySelector('[data-password-toggle]')
                const passwordIcon = document.querySelector('[data-password-icon]')

                if (passwordInput && passwordToggle) {
                    passwordToggle.addEventListener('click', () => {
                        const showingPassword = passwordInput.type === 'text'
                        passwordInput.type = showingPassword ? 'password' : 'text'
                        passwordToggle.setAttribute(
                            'aria-label',
                            showingPassword ? 'Show password' : 'Hide password'
                        )

                        if (passwordIcon) {
                            passwordIcon.setAttribute(
                                'data-lucide',
                                showingPassword ? 'eye' : 'eye-off'
                            )
                            renderIcons()
                        }
                    })
                }

                const themeToggle = document.getElementById('auth-theme-toggle')
                const themeIcon = document.getElementById('auth-theme-icon')

                const updateThemeIcon = () => {
                    if (!themeIcon) {
                        return
                    }

                    const dark = document.documentElement.classList.contains('dark')
                    themeIcon.setAttribute('data-lucide', dark ? 'sun' : 'moon')
                    renderIcons()
                }

                updateThemeIcon()

                if (themeToggle) {
                    themeToggle.addEventListener('click', () => {
                        document.documentElement.classList.toggle('dark')
                        const dark = document.documentElement.classList.contains('dark')
                        localStorage.setItem('theme', dark ? 'dark' : 'light')
                        updateThemeIcon()
                    })
                }
            })
        </script>
    </body>
</html>
