<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon"
              type="image/svg+xml"
              href="{{ url_for('static', filename='favicon.svg') }}" />
        <title>{% block title %}KAORI{% endblock title %}</title>
        <script>
            ;(function () {
                const theme = localStorage.getItem('theme')

                if (theme === 'dark') {
                    document.documentElement.classList.add('dark')
                }
            })()
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
              rel="stylesheet" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/output.css') }}" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/auth-login.css') }}" />
    </head>
    <body class="min-h-full font-sans antialiased">
        {% block content %}
        {% endblock content %}
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                if (window.lucide) {
                    window.lucide.createIcons()
                }

                const passwordInput = document.querySelector('[data-password-input]')
                const passwordToggle = document.querySelector('[data-password-toggle]')
                const passwordIcon = document.querySelector('[data-password-icon]')

                if (passwordInput && passwordToggle) {
                    passwordToggle.addEventListener('click', () => {
                        const showingPassword = passwordInput.type === 'text'
                        passwordInput.type = showingPassword ? 'password' : 'text'
                        passwordToggle.setAttribute(
                            'aria-label',
                            showingPassword ? 'Show password' : 'Hide password'
                        )

                        if (passwordIcon) {
                            passwordIcon.setAttribute(
                                'data-lucide',
                                showingPassword ? 'eye' : 'eye-off'
                            )

                            if (window.lucide) {
                                window.lucide.createIcons()
                            }
                        }
                    })
                }
            })
        </script>
    </body>
</html>
