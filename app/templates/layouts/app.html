<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon"
              type="image/svg+xml"
              href="{{ url_for('static', filename='favicon.svg') }}" />
        <title>{% block title %}KAORI{% endblock title %}</title>
        <script>
            ;(function () {
                const theme = localStorage.getItem('theme')
                const sidebarOpen = localStorage.getItem('kubereport.sidebarOpen')

                if (theme === 'dark') {
                    document.documentElement.classList.add('dark')
                }

                if (sidebarOpen === 'false') {
                    document.documentElement.classList.add('sidebar-collapsed')
                }
            })()
        </script>
        <style>
            html {
                font-size: 12px;
            }

            @media (min-width: 1536px) {
                html {
                    font-size: 13px;
                }
            }

            @media (min-width: 1920px) {
                html {
                    font-size: 14px;
                }
            }

            [x-cloak] {
                display: none !important;
            }

            .kubereport-sidebar {
                width: 260px;
            }

            .sidebar-collapsed .kubereport-sidebar {
                width: 72px;
            }

            .app-content-shell {
                padding: 24px;
            }

            @media (min-width: 1024px) {
                .app-content-shell {
                    padding: 28px;
                }
            }

            @media (min-width: 1536px) {
                .app-content-shell {
                    padding: 32px;
                }
            }

            .sidebar-collapsed .sidebar-expanded-only {
                display: none !important;
            }

            .sidebar-collapsed .sidebar-nav-section {
                margin-bottom: 0.5rem;
            }

            .sidebar-collapsed .sidebar-brand-card {
                justify-content: center;
                gap: 0;
                padding: 0.5rem;
            }

            .sidebar-collapsed .sidebar-brand-icon {
                height: 2.5rem;
                width: 2.5rem;
                border-radius: 0.75rem;
            }

            .sidebar-collapsed .sidebar-parent-link {
                justify-content: center;
            }


            .sidebar-menu > summary {
                list-style: none;
            }

            .sidebar-menu > summary::-webkit-details-marker {
                display: none;
            }

            .sidebar-menu-chevron {
                transform: rotate(0deg);
                transition: transform 150ms ease;
            }

            .sidebar-menu[open] > summary .sidebar-menu-chevron {
                transform: rotate(90deg);
            }

            .sidebar-collapsed .sidebar-menu-chevron,
            .sidebar-collapsed .sidebar-submenu {
                display: none !important;
            }

            .sidebar-toggle-collapsed-icon {
                display: none;
            }

            .sidebar-collapsed .sidebar-toggle-expanded-icon {
                display: none;
            }

            .sidebar-collapsed .sidebar-toggle-collapsed-icon {
                display: block;
            }

            .htmx-indicator {
                opacity: 0;
                pointer-events: none;
                transition: opacity 150ms ease-in;
                visibility: hidden;
            }

            .htmx-request .htmx-indicator,
            .htmx-request.htmx-indicator {
                opacity: 1;
                visibility: visible;
            }


        </style>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
              rel="stylesheet" />
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/output.css') }}" />
        <style>
            /* KAORI sidebar density standard */
            .kubereport-sidebar nav > :not([hidden]) ~ :not([hidden]) {
                margin-top: 16px !important;
            }

            .sidebar-brand-card {
                gap: 10px !important;
                padding: 10px !important;
            }

            .sidebar-brand-icon {
                width: 40px !important;
                height: 40px !important;
                border-radius: 12px !important;
            }

            .sidebar-brand-icon svg {
                width: 17px !important;
                height: 17px !important;
            }

            .sidebar-brand-card h1 {
                font-size: 13px !important;
                line-height: 18px !important;
            }

            .sidebar-brand-card p {
                font-size: 10px !important;
                line-height: 15px !important;
            }

            .sidebar-nav-section > .sidebar-expanded-only:first-child {
                margin-bottom: 6px !important;
                padding-right: 10px !important;
                padding-left: 10px !important;
                font-size: 9px !important;
                line-height: 14px !important;
                letter-spacing: 0.14em !important;
            }

            .sidebar-parent-link {
                min-height: 48px;
                gap: 10px !important;
                padding: 8px 10px !important;
                border-radius: 13px !important;
                font-size: 12px !important;
                line-height: 18px !important;
            }

            summary.sidebar-parent-link > div {
                gap: 10px !important;
            }

            .sidebar-parent-link > span:first-child,
            .sidebar-parent-link > div > span:first-child {
                width: 32px !important;
                height: 32px !important;
                border-radius: 10px !important;
            }

            .sidebar-parent-link > span:first-child svg,
            .sidebar-parent-link > div > span:first-child svg {
                width: 15px !important;
                height: 15px !important;
            }

            .sidebar-parent-link .sidebar-expanded-only:not(.sidebar-menu-chevron) {
                font-size: 12px !important;
                line-height: 18px !important;
            }

            .sidebar-menu-chevron {
                width: 14px !important;
                height: 14px !important;
            }

            .sidebar-submenu {
                margin-left: 24px !important;
                padding-left: 12px !important;
            }

            .sidebar-submenu a {
                gap: 7px !important;
                padding: 6px 9px !important;
                border-radius: 10px !important;
                font-size: 11px !important;
                line-height: 16px !important;
            }

            .sidebar-submenu a > span:first-child {
                width: 5px !important;
                height: 5px !important;
            }

            .sidebar-submenu a svg {
                width: 13px !important;
                height: 13px !important;
            }

            .sidebar-collapsed .sidebar-parent-link {
                min-height: 44px;
                padding: 6px !important;
            }

            .sidebar-collapsed .sidebar-parent-link > span:first-child,
            .sidebar-collapsed .sidebar-parent-link > div > span:first-child {
                width: 32px !important;
                height: 32px !important;
            }
        </style>
    </head>
    <body class="h-full overflow-hidden bg-slate-50 font-sans text-slate-900 antialiased transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100">
        <div x-data="{
                 sidebarOpen: localStorage.getItem('kubereport.sidebarOpen') !== 'false',
                 init() {
                     document.documentElement.classList.toggle('sidebar-collapsed', !this.sidebarOpen)

                     this.$watch('sidebarOpen', value => {
                         localStorage.setItem('kubereport.sidebarOpen', value ? 'true' : 'false')
                         document.documentElement.classList.toggle('sidebar-collapsed', !value)
                     })
                 }
             }"
             @toggle-sidebar.window="sidebarOpen = !sidebarOpen"
             class="flex h-full min-h-0 overflow-hidden">
            {% include "components/navigation/sidebar.html" %}
            <div class="flex min-h-0 flex-1 flex-col overflow-hidden">
                {% include "components/navigation/navbar.html" %}
                <main class="min-h-0 flex-1 overflow-y-auto bg-slate-50 transition-colors duration-300 dark:bg-slate-900">
                    <div class="app-content-shell">
                        {% block dashboard_content %}
                        {% endblock dashboard_content %}
                    </div>
                </main>
            </div>
        </div>
        <div id="quick-action-feedback"
             {% if current_user.is_authenticated and current_user.has_permission('clusters.sync') %}
                 hx-get="{{ url_for('cluster.active_sync_all_status') }}"
                 hx-trigger="load"
                 hx-swap="innerHTML"
             {% endif %}
             style="width:min(28rem, calc(100vw - 2rem));"
             class="pointer-events-none fixed right-4 top-20 z-50 space-y-3 sm:right-6 lg:right-8"></div>
        <script defer
                src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                if (window.lucide) {
                    window.lucide.createIcons()
                }
            })

            document.body.addEventListener('htmx:afterSwap', (event) => {
                if (window.Alpine && event.detail && event.detail.elt) {
                    window.Alpine.initTree(event.detail.elt)
                }

                if (window.lucide) {
                    window.lucide.createIcons()
                }
            })

            document.addEventListener('click', (event) => {
                const closeButton = event.target.closest('[data-quick-action-toast-close]')

                if (!closeButton) {
                    return
                }

                event.preventDefault()
                event.stopPropagation()

                const toast = closeButton.closest('[data-quick-action-toast]')

                if (toast) {
                    toast.remove()
                }
            }, true)
        </script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const button = document.getElementById('theme-toggle')

                if (!button) {
                    return
                }

                button.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark')

                    const dark = document.documentElement.classList.contains('dark')

                    localStorage.setItem('theme', dark ? 'dark' : 'light')
                })
            })
        </script>
        {% block scripts %}
        {% endblock scripts %}
    </body>
</html>
