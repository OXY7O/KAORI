{% import "components/resource_posture_grid.html" as posture_grid %}
{% set overview_metrics = [] %}
{% for kpi in overview.kpis %}
    {% set _ = overview_metrics.append((kpi.icon, kpi.label, kpi.value, kpi.description, 'info')) %}
{% endfor %}
<div id="artifact-registry-dashboard-kpis"
     aria-live="polite"
     data-kaori-artifact-registry-operational-kpis>
    {{ posture_grid.render(overview_metrics, columns=4) }}
</div>
