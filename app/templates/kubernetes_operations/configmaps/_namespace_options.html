{% import "components/live_lookup_notice.html" as live_lookup %}
<div id="configmap-namespace-field">
    <label class="block min-w-0" for="namespace">
        <span class="text-sm font-semibold text-content-primary">Namespace</span>
        <select id="namespace" name="namespace" required class="mt-2 h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20" {% if not namespaces %}disabled{% endif %}>
            <option value="">{% if namespaces %}Select namespace{% else %}No live namespaces available{% endif %}</option>
            {% for namespace in namespaces %}
                <option value="{{ namespace }}" {{ 'selected' if namespace == selected_namespace else '' }}>{{ namespace }}</option>
            {% endfor %}
        </select>
        {% if cluster_selected and not namespace_error and not namespaces %}
            <span class="mt-2 block text-xs leading-5 text-content-muted">No live namespace is available for the selected cluster.</span>
        {% elif namespaces %}
            <span class="mt-2 block text-xs leading-5 text-content-muted">Loaded directly from the selected Kubernetes API.</span>
        {% endif %}
    </label>
</div>
{% if request.headers.get('HX-Request') == 'true' %}
    <div id="configmap-live-lookup-notice" hx-swap-oob="outerHTML" class="mt-4">
        {% if namespace_error %}{{ live_lookup.warning('Live namespace lookup failed', namespace_error, '') }}{% endif %}
    </div>
{% endif %}
