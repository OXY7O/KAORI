<label class="block min-w-0" for="namespace">
    <span class="text-sm font-semibold text-content-primary">Namespace</span>
    <select id="namespace" name="namespace" required class="mt-2 h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20">
        <option value="">Select namespace</option>
        {% for namespace in namespaces %}
            <option value="{{ namespace }}" {{ 'selected' if namespace == selected_namespace else '' }}>{{ namespace }}</option>
        {% endfor %}
    </select>
</label>
{% if not namespaces %}
    <p class="mt-2 text-xs leading-5 text-status-warning-text">No live namespace is available, or KAORI could not read namespaces from this cluster.</p>
{% endif %}
