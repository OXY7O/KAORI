<input type="hidden" name="workspace_mode" value="{{ workspace_mode|default('update') }}">
<div class="grid gap-4 md:grid-cols-3"><div><label class="text-sm font-medium">Cluster</label><select name="cluster_id" hx-get="{{ url_for('kubernetes_operations.configmap_workspace') }}" hx-target="#configmap-workspace" hx-include="closest #configmap-workspace" class="mt-2 min-h-11 w-full rounded-xl border border-slate-200 px-3 dark:border-slate-700 dark:bg-slate-900"><option value="">Select cluster</option>{% for cluster in clusters|default([]) %}<option value="{{ cluster.id }}" {{ 'selected' if cluster.id|string == selected_cluster_id|string else '' }}>{{ cluster.name }}</option>{% endfor %}</select></div><div><label class="text-sm font-medium">Namespace</label><select name="namespace" hx-get="{{ url_for('kubernetes_operations.configmap_workspace') }}" hx-target="#configmap-workspace" hx-include="closest #configmap-workspace" class="mt-2 min-h-11 w-full rounded-xl border border-slate-200 px-3 dark:border-slate-700 dark:bg-slate-900"><option value="">Select namespace</option>{% for namespace in namespaces %}<option value="{{ namespace }}" {{ 'selected' if namespace == selected_namespace else '' }}>{{ namespace }}</option>{% endfor %}</select></div><div><label class="text-sm font-medium">ConfigMap</label><select name="inventory_id" hx-get="{{ delete_target_url if workspace_mode == 'delete' else url_for('kubernetes_operations.configmap_editor') }}" hx-target="{{ '#configmap-delete-target' if workspace_mode == 'delete' else '#configmap-editor' }}" hx-include="this" class="mt-2 min-h-11 w-full rounded-xl border border-slate-200 px-3 dark:border-slate-700 dark:bg-slate-900"><option value="">Select ConfigMap</option>{% for item in configmaps %}<option value="{{ item.id }}" {{ 'selected' if item.id|string == selected_inventory_id|string else '' }}>{{ item.name }}</option>{% endfor %}</select></div></div>
