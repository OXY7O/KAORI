<div id="configmap-delete-actions"
     class="flex flex-wrap gap-3 sm:justify-end"
     {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
    {% if delete_validation_token %}
        <input type="hidden"
               name="delete_validation_token"
               value="{{ delete_validation_token }}">
    {% endif %}
    <button type="submit"
            name="operation"
            value="validate"
            class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-kaori-primary/25 bg-kaori-soft px-5 text-sm font-semibold text-kaori-primary transition hover:border-kaori-primary/40 hover:bg-kaori-primary/15 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus cursor-pointer disabled:cursor-not-allowed">
        <i data-lucide="scan-search" class="h-4 w-4"></i>
        {{ 'Revalidate Deletion' if delete_validation_token else 'Validate Deletion' }}
    </button>
    <button type="submit"
            name="operation"
            value="delete"
            {% if not delete_validation_token %}disabled aria-disabled="true" title="Validate deletion before applying the final delete action"{% endif %}
            class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-status-critical px-5 text-sm font-semibold text-white transition hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-status-critical cursor-pointer disabled:cursor-not-allowed disabled:opacity-50">
        <i data-lucide="trash-2" class="h-4 w-4"></i>
        Delete ConfigMap
    </button>
</div>
