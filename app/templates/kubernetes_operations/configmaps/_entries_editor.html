{% import "components/structured_entry_editor.html" as entry_editor %}
<div class="mb-2 hidden grid-cols-[minmax(10rem,0.72fr)_8rem_minmax(14rem,1.6fr)_2.5rem] gap-3 px-3 text-xs font-semibold uppercase tracking-wide text-content-muted lg:grid"
     aria-hidden="true">
    <span>Key</span>
    <span>Type</span>
    <span>Value</span>
    <span></span>
</div>
<div id="configmap-entries" class="space-y-3">
    {% for key, value in entries %}
        <div class="configmap-entry {{ entry_editor.row_classes('configmap') }}">
            <label class="min-w-0">
                <span class="mb-1 block {{ entry_editor.label_classes() }} lg:hidden">Key</span>
                <input name="entry_key"
                       value="{{ key }}"
                       placeholder="Key"
                       class="{{ entry_editor.control_classes() }}">
            </label>
            <label class="min-w-0">
                <span class="mb-1 block {{ entry_editor.label_classes() }} lg:hidden">Content Type</span>
                <select name="entry_kind" class="{{ entry_editor.control_classes() }}">
                    <option value="text" {{ 'selected' if value.kind == 'text' else '' }}>Text
                    </option>
                    <option value="binary" {{ 'selected' if value.kind == 'binary' else '' }}>Binary / Base64
                    </option>
                </select>
            </label>
            <label class="min-w-0">
                <span class="mb-1 block {{ entry_editor.label_classes() }} lg:hidden">Value</span>
                <textarea name="entry_value"
                          rows="3"
                          placeholder="Value"
                          class="{{ entry_editor.textarea_classes(true) }} font-mono">{{ value.value }}</textarea>
            </label>
            <button type="button"
                    data-remove-entry
                    class="{{ entry_editor.remove_button_classes() }}"
                    aria-label="Remove ConfigMap entry">
                <i data-lucide="trash-2" class="h-4 w-4"></i>
            </button>
        </div>
    {% endfor %}
</div>
<button type="button"
        data-add-entry
        class="mt-3 {{ entry_editor.add_button_classes() }}"><i data-lucide="plus" class="h-4 w-4"></i>Add Entry</button>
<template id="configmap-entry-template">
    <div class="configmap-entry {{ entry_editor.row_classes('configmap') }}">
        <label class="min-w-0">
            <span class="mb-1 block {{ entry_editor.label_classes() }} lg:hidden">Key</span>
            <input name="entry_key"
                   placeholder="Key"
                   class="{{ entry_editor.control_classes() }}">
        </label>
        <label class="min-w-0">
            <span class="mb-1 block {{ entry_editor.label_classes() }} lg:hidden">Content Type</span>
            <select name="entry_kind" class="{{ entry_editor.control_classes() }}">
                <option value="text">Text</option>
                <option value="binary">Binary / Base64</option>
            </select>
        </label>
        <label class="min-w-0">
            <span class="mb-1 block {{ entry_editor.label_classes() }} lg:hidden">Value</span>
            <textarea name="entry_value"
                      rows="3"
                      placeholder="Value"
                      class="{{ entry_editor.textarea_classes(true) }} font-mono"></textarea>
        </label>
        <button type="button"
                data-remove-entry
                class="{{ entry_editor.remove_button_classes() }}"
                aria-label="Remove ConfigMap entry">
            <i data-lucide="trash-2" class="h-4 w-4"></i>
        </button>
    </div>
</template>
