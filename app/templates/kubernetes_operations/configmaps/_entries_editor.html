<div id="configmap-entries" class="space-y-3">
  {% for key, value in entries %}
  <div class="configmap-entry grid items-start gap-3 rounded-xl border border-slate-200 bg-slate-50/70 p-3 md:grid-cols-[minmax(180px,0.8fr)_120px_minmax(260px,2fr)_44px] dark:border-slate-700 dark:bg-slate-900/30">
    <input name="entry_key" value="{{ key }}" placeholder="Key" class="min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm dark:border-slate-700 dark:bg-slate-900">
    <select name="entry_kind" class="min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm dark:border-slate-700 dark:bg-slate-900"><option value="text" {{ 'selected' if value.kind == 'text' else '' }}>Text</option><option value="binary" {{ 'selected' if value.kind == 'binary' else '' }}>Binary/base64</option></select>
    <textarea name="entry_value" rows="5" placeholder="Value" class="min-h-28 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-mono dark:border-slate-700 dark:bg-slate-900">{{ value.value }}</textarea>
    <button type="button" data-remove-entry class="flex h-10 w-10 items-center justify-center rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
  </div>
  {% endfor %}
</div>
<button type="button" data-add-entry class="mt-3 inline-flex min-h-10 items-center gap-2 rounded-xl border border-blue-200 bg-blue-50 px-4 text-sm font-semibold text-blue-700 hover:bg-blue-100"><i data-lucide="plus" class="h-4 w-4"></i>Add key</button>
<template id="configmap-entry-template"><div class="configmap-entry grid items-start gap-3 rounded-xl border border-slate-200 bg-slate-50/70 p-3 md:grid-cols-[minmax(180px,0.8fr)_120px_minmax(260px,2fr)_44px] dark:border-slate-700 dark:bg-slate-900/30"><input name="entry_key" placeholder="Key" class="min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm dark:border-slate-700 dark:bg-slate-900"><select name="entry_kind" class="min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm dark:border-slate-700 dark:bg-slate-900"><option value="text">Text</option><option value="binary">Binary/base64</option></select><textarea name="entry_value" rows="5" placeholder="Value" class="min-h-28 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-mono dark:border-slate-700 dark:bg-slate-900"></textarea><button type="button" data-remove-entry class="flex h-10 w-10 items-center justify-center rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div></template>
<script>
(function(){const root=document.currentScript.parentElement;root.querySelector('[data-add-entry]')?.addEventListener('click',()=>{root.querySelector('#configmap-entries').append(root.querySelector('#configmap-entry-template').content.cloneNode(true));window.renderKaoriIcons?.();});root.addEventListener('click',e=>{const button=e.target.closest('[data-remove-entry]');if(button&&root.querySelectorAll('.configmap-entry').length>1)button.closest('.configmap-entry').remove();});})();
</script>
