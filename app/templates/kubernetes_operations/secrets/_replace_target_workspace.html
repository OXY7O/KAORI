<div id="replace-target-workspace" class="contents">
    <label class="block min-w-0">
        <span class="text-sm font-medium text-content-secondary">Namespace</span>
        <select name="namespace"
                {% if cluster_id %} hx-get="{{ url_for('kubernetes_operations.replace_secret_workspace') }}" hx-target="#replace-target-workspace" hx-swap="outerHTML" hx-include="[name='cluster_id'], this" {% endif %}
                {% if not namespaces %}disabled{% endif %}
                class="mt-2.5 w-full rounded-lg border border-outline-default bg-surface-card px-3.5 py-2.5 text-sm text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20 disabled:cursor-not-allowed disabled:bg-surface-disabled disabled:text-content-muted">
            <option value="">
                {% if cluster_id %}
                    Select namespace
                {% else %}
                    Select cluster first
                {% endif %}
            </option>
            {% for item in namespaces %}
                <option value="{{ item }}" {% if namespace == item %}selected{% endif %}>{{ item }}</option>
            {% endfor %}
        </select>
        {% if cluster_id and not namespaces %}<span class="mt-1.5 block text-xs text-status-warning-text">No namespace snapshot found. Run inventory sync first.</span>{% endif %}
    </label>
    <label class="block min-w-0">
        <span class="text-sm font-medium text-content-secondary">Secret</span>
        <select name="inventory_id"
                {% if namespace %} hx-get="{{ url_for('kubernetes_operations.replace_secret_content') }}" hx-target="#replace-content-workspace" hx-swap="innerHTML" {% endif %}
                {% if not targets %}disabled{% endif %}
                class="mt-2.5 w-full rounded-lg border border-outline-default bg-surface-card px-3.5 py-2.5 text-sm text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20 disabled:cursor-not-allowed disabled:bg-surface-disabled disabled:text-content-muted">
            <option value="">
                {% if namespace %}
                    Select Secret
                {% else %}
                    Select namespace first
                {% endif %}
            </option>
            {% for item in targets %}
                {% set config = replace_types.get(item.secret_type) %}
                <option value="{{ item.id }}"
                        {% if item.immutable %}disabled{% endif %}
                        {% if selected_target_id == item.id|string %}selected{% endif %}>
                    {{ item.name }} · {{ config.label if config else item.secret_type }}
                    {% if item.immutable %}· immutable{% endif %}
                </option>
            {% endfor %}
        </select>
        {% if namespace and not targets %}<span class="mt-1.5 block text-xs text-content-muted">No supported mutable non-TLS Secret found in this namespace.</span>{% endif %}
    </label>
    {% if reset_content %}
        <div id="replace-content-workspace" hx-swap-oob="innerHTML">
            <section class="rounded-xl border border-dashed border-outline-default bg-surface-hover p-8 text-center">
                <div class="mx-auto flex h-11 w-11 items-center justify-center rounded-xl bg-surface-disabled text-content-muted">
                    <i data-lucide="target" class="h-5 w-5"></i>
                </div>
                <h2 class="mt-4 text-sm font-semibold text-content-primary">Select a Secret target</h2>
                <p class="mt-1 text-xs leading-5 text-content-muted">The replacement fields are generated from the selected inventory snapshot.</p>
            </section>
        </div>
    {% endif %}
</div>
