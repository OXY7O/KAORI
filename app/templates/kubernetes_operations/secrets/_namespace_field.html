{% import "components/live_lookup_notice.html" as live_lookup %}
<div id="secret-namespace-field" class="contents">
    <label class="order-2 block min-w-0">
        <span class="text-sm font-semibold text-content-primary">Namespace</span>
        <span class="mt-1 block text-xs leading-5 text-content-muted">
            {% if not cluster_selected %}
                Select a cluster to load live namespaces
            {% elif namespaces %}
                Loaded directly from the selected Kubernetes API
            {% elif not namespace_error %}
                No namespace was returned by the live Kubernetes API
            {% endif %}
        </span>
        <select required
                name="namespace"
                {% if not cluster_selected or not namespaces %}disabled{% endif %}
                class="mt-2 h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20 disabled:cursor-not-allowed disabled:bg-surface-disabled disabled:text-content-muted">
            <option value="">
                {% if not cluster_selected %}
                    Select cluster first
                {% elif namespaces %}
                    Select namespace
                {% else %}
                    No live namespaces available
                {% endif %}
            </option>
            {% for namespace in namespaces %}
                <option value="{{ namespace }}" {% if selected_namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
            {% endfor %}
        </select>
    </label>
    {% if namespace_error %}
        {{ live_lookup.warning('Live namespace lookup failed', namespace_error, 'order-3 col-span-full') }}
    {% endif %}
</div>
