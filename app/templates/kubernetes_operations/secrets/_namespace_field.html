{% import "components/live_lookup_notice.html" as live_lookup %}
{% import "components/table_label.html" as table_label %}
<div id="secret-namespace-field">
    <label class="block min-w-0">
        <span class="flex items-center justify-between gap-2">
            <span class="text-sm font-semibold text-content-primary">Namespace</span>
            {{ table_label.status_label('Live', 'normal', 'radio') }}
        </span>
        <select required name="namespace" {% if not cluster_selected or not namespaces %}disabled{% endif %} class="mt-2 h-11 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20 disabled:cursor-not-allowed disabled:bg-surface-disabled disabled:text-content-muted">
            <option value="">
                {% if not cluster_selected %}Select cluster first
                {% elif namespaces %}Select namespace
                {% else %}No live namespaces available{% endif %}
            </option>
            {% for namespace in namespaces %}
                <option value="{{ namespace }}" {% if selected_namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
            {% endfor %}
        </select>
    </label>
</div>
{% if request.headers.get('HX-Request') == 'true' %}
    <div id="secret-live-lookup-notice" hx-swap-oob="outerHTML" class="mt-4">
        {% if namespace_error %}{{ live_lookup.warning('Live namespace lookup failed', namespace_error) }}{% endif %}
    </div>
{% endif %}
