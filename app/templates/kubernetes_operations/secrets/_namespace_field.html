<label id="secret-namespace-field" class="block min-w-0">
    <span class="text-sm font-medium text-content-secondary">Namespace</span>
    <span class="mt-1 block text-xs text-content-muted">
        {% if not cluster_selected %}
            Select a cluster to load its namespaces
        {% elif namespaces %}
            Secret scope inside the selected cluster
        {% else %}
            No namespace snapshot is available; run inventory sync first
        {% endif %}
    </span>
    <select required
            name="namespace"
            {% if not cluster_selected or not namespaces %}disabled{% endif %}
            class="mt-2.5 w-full rounded-lg border border-outline-default bg-surface-card px-3.5 py-2.5 text-sm text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20 disabled:cursor-not-allowed disabled:bg-surface-disabled disabled:text-content-muted">
        <option value="">
            {% if not cluster_selected %}
                Select cluster first
            {% elif namespaces %}
                Select namespace
            {% else %}
                No namespaces available
            {% endif %}
        </option>
        {% for namespace in namespaces %}
            <option value="{{ namespace }}"
                    {% if selected_namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
        {% endfor %}
    </select>
</label>
