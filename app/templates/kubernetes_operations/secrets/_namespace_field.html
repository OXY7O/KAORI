{% import "components/live_lookup_notice.html" as live_lookup %}
{% import "components/table_label.html" as table_label %}
<div id="secret-target-workspace" class="contents">
    <label class="block min-w-0">
        <span class="flex items-center justify-between gap-2">
            <span class="text-xs font-semibold text-content-primary">Namespace</span>
            {{ table_label.status_label('Live', 'normal', 'radio') }}
        </span>
        <select required
                name="namespace"
                {% if not cluster_selected or not namespaces %}disabled{% endif %}
                class="mt-2 h-10 w-full rounded-lg border border-outline-default bg-surface-card px-3 text-sm font-medium text-content-primary shadow-sm outline-none transition focus:border-outline-focus focus:ring-2 focus:ring-outline-focus/20 disabled:cursor-not-allowed disabled:bg-surface-disabled disabled:text-content-muted">
            <option value="">
                {% if not cluster_selected %}
                    Select cluster first
                {% elif namespaces %}
                    Select namespace
                {% else %}
                    No live namespaces available
                {% endif %}
            </option>
            {% for namespace in namespaces %}
                <option value="{{ namespace }}"
                        {% if selected_namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
            {% endfor %}
        </select>
    </label>
    {% if namespace_error %}
        <div class="lg:col-span-2">{{ live_lookup.warning('Live namespace lookup failed', namespace_error) }}</div>
    {% endif %}
</div>
