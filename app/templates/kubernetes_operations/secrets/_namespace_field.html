<label id="secret-namespace-field" class="block min-w-0">
    <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Namespace</span>
    <span class="mt-1 block text-xs text-slate-500 dark:text-slate-400">
        {% if not cluster_selected %}
            Select a cluster to load its namespaces
        {% elif namespaces %}
            Secret scope inside the selected cluster
        {% else %}
            No namespace snapshot is available; run inventory sync first
        {% endif %}
    </span>
    <select required
            name="namespace"
            {% if not cluster_selected or not namespaces %}disabled{% endif %}
            class="mt-2.5 w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400 dark:border-slate-600 dark:bg-slate-900 dark:text-white dark:disabled:bg-slate-800">
        <option value="">
            {% if not cluster_selected %}
                Select cluster first
            {% elif namespaces %}
                Select namespace
            {% else %}
                No namespaces available
            {% endif %}
        </option>
        {% for namespace in namespaces %}
            <option value="{{ namespace }}"
                    {% if selected_namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
        {% endfor %}
    </select>
</label>
