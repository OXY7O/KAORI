<div id="secret-delete-actions"
     class="flex flex-wrap gap-3 sm:justify-end"
     {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
    {% if delete_validation_token %}<input type="hidden" name="delete_validation_token" value="{{ delete_validation_token }}" data-secret-delete-validation-token>{% endif %}
    <button type="submit" name="operation" value="validate" data-secret-delete-validation-label class="{{ secret_ui.validate_button_classes() }}"><i data-lucide="scan-search" class="h-4 w-4"></i>{{ 'Revalidate Deletion' if delete_validation_token else 'Validate Deletion' }}</button>
    <button id="secret-delete-submit" type="submit" name="operation" value="delete" data-validation-apply class="hidden" tabindex="-1" aria-hidden="true"></button>
    <button type="button"
            data-destructive-modal-open
            data-secret-delete-final-action
            data-destructive-modal-id="secret-delete-confirmation"
            data-destructive-target-input="#secret-confirm-name"
            {% if not delete_validation_token %}disabled aria-disabled="true" title="Validate deletion before applying the final delete action"{% endif %}
            class="{{ secret_ui.destructive_button_classes() }}"><i data-lucide="trash-2" class="h-4 w-4"></i>Delete Secret</button>
</div>
