<form id="tls-secret-update-filter-form"
      method="get"
      action="{{ url_for('kubernetes_operations.tls_secret_bulk_rotation') }}"
      hx-get="{{ url_for('kubernetes_operations.tls_secret_bulk_rotation') }}"
      hx-target="#tls-secret-update-target-table"
      hx-swap="outerHTML"
      hx-indicator="#tls-secret-update-table-loading"
      hx-trigger="change, keyup changed delay:450ms from:input[name='search']"
      class="grid grid-cols-1 gap-4 md:grid-cols-4 md:items-end">
    <input type="hidden" name="page" value="1">
    <input type="hidden"
           name="per_page"
           value="{{ payload.pagination.per_page }}">
    <input type="hidden" name="partial_mode" value="bulk_table">
    <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Cluster</span>
        <span class="relative block">
            <select name="cluster_id"
                    class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                <option value="">All clusters</option>
                {% for cluster in payload.clusters %}
                    <option value="{{ cluster.id }}"
                            {% if payload.filters.cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>
                {% endfor %}
            </select>
        </span>
    </label>
    <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Namespace</span>
        <span class="relative block">
            <select name="namespace"
                    class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                <option value="">All namespaces</option>
                {% for namespace in payload.namespaces %}
                    <option value="{{ namespace }}"
                            {% if payload.filters.namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
                {% endfor %}
            </select>
        </span>
    </label>
    <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Status</span>
        <span class="relative block">
            <select name="status"
                    class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                {% for status in payload.status_options %}
                    <option value="{{ status }}"
                            {% if payload.filters.status == status %}selected{% endif %}>{{ status.replace('_', ' ') |title }}</option>
                {% endfor %}
            </select>
        </span>
    </label>
    <label class="block">
        <span class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Search TLS Secret</span>
        <span class="relative block">
            <i data-lucide="search"
               class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
            <input type="search"
                   name="search"
                   value="{{ payload.filters.search }}"
                   placeholder="Secret, namespace, CN, or issuer"
                   class="w-full rounded-xl border border-slate-300 bg-white py-2 pr-3 pl-10 text-sm text-slate-900 transition outline-none placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
        </span>
    </label>
</form>
