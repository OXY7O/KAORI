{% if operation_result %}
    <section class="rounded-xl border p-4 {{ 'border-status-normal-border bg-status-normal-soft text-status-normal-text' if operation_result.status == 'success' else 'border-status-critical-border bg-status-critical-soft text-status-critical-text' }}">
        <div class="flex items-start gap-3">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg"><i data-lucide="{{ 'check' if operation_result.status == 'success' else 'triangle-alert' }}" class="h-5 w-5"></i></div>
            <div class="min-w-0"><h2 class="text-sm font-semibold">{{ operation_result.title }}</h2><p class="mt-1 text-sm leading-6 opacity-85">{{ operation_result.message }}</p></div>
        </div>
    </section>
{% endif %}
