{% import "components/table.html" as table_ui %}
{% set endpoint_name = 'intelligence.recommendations' %}
<form id="recommendation-filter-form"
      method="get"
      action="{{ url_for(endpoint_name) }}"
      hx-get="{{ url_for(endpoint_name) }}"
      hx-target="#recommendations-workspace-content"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-indicator="#recommendations-loading-bar"
      hx-sync="this:replace"
      hx-trigger="input changed delay:350ms from:input[name='q'], change from:select"
      class="border-b border-outline-subtle bg-surface-hover px-4 py-4 sm:px-5">
    <input type="hidden" name="page" value="1">
    <input type="hidden" name="per_page" value="{{ payload.pagination.per_page }}">

    <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
        <div>
            <p class="text-sm font-semibold text-content-primary">Recommendation Filters</p>
            <p class="mt-1 text-xs leading-5 text-content-muted">Results refresh automatically when search or scope filters change.</p>
        </div>
        <a href="{{ url_for(endpoint_name) }}"
           hx-get="{{ url_for(endpoint_name) }}"
           hx-target="#recommendations-workspace-content"
           hx-swap="outerHTML"
           hx-push-url="true"
           hx-indicator="#recommendations-loading-bar"
           class="inline-flex min-h-9 shrink-0 items-center justify-center gap-2 rounded-lg border border-outline-default bg-surface-card px-3 text-xs font-semibold text-content-secondary transition-colors hover:border-brand-outline hover:bg-kaori-soft hover:text-kaori-primary-dark focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline-focus">
            <i data-lucide="rotate-ccw" class="h-3.5 w-3.5" aria-hidden="true"></i>
            Reset
        </a>
    </div>

    <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
        <label class="block xl:col-span-2">
            <span class="{{ table_ui.filter_label_classes() }}">Search</span>
            {{ table_ui.search_field('q', payload.filters.q, 'Search recommendation, evidence, or action') }}
        </label>
        <label class="block">
            <span class="{{ table_ui.filter_label_classes() }}">Domain</span>
            <select name="domain" class="{{ table_ui.filter_select_classes() }}">
                {% for option in payload.filter_options.domains %}<option value="{{ option.value }}" {% if payload.filters.domain == option.value %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
            </select>
        </label>
        <label class="block">
            <span class="{{ table_ui.filter_label_classes() }}">Severity</span>
            <select name="severity" class="{{ table_ui.filter_select_classes() }}">
                {% for option in payload.filter_options.severities %}<option value="{{ option.value }}" {% if payload.filters.severity == option.value %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
            </select>
        </label>
        <label class="block">
            <span class="{{ table_ui.filter_label_classes() }}">Category</span>
            <select name="category" class="{{ table_ui.filter_select_classes() }}">
                {% for option in payload.filter_options.categories %}<option value="{{ option.value }}" {% if payload.filters.category == option.value %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
            </select>
        </label>
        <label class="block">
            <span class="{{ table_ui.filter_label_classes() }}">Resource Type</span>
            <select name="source_kind" class="{{ table_ui.filter_select_classes() }}">
                {% for option in payload.filter_options.source_kinds %}<option value="{{ option.value }}" {% if payload.filters.source_kind == option.value %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
            </select>
        </label>
        <label class="block">
            <span class="{{ table_ui.filter_label_classes() }}">Logic Type</span>
            <select name="logic_type" class="{{ table_ui.filter_select_classes() }}">
                {% for option in payload.filter_options.logic_types %}<option value="{{ option.value }}" {% if payload.filters.logic_type == option.value %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
            </select>
        </label>
        <label class="block">
            <span class="{{ table_ui.filter_label_classes() }}">Signal Source</span>
            <select name="signal_source" class="{{ table_ui.filter_select_classes() }}">
                {% for option in payload.filter_options.signal_sources %}<option value="{{ option.value }}" {% if payload.filters.signal_source == option.value %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
            </select>
        </label>
    </div>
</form>
