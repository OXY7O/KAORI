<section class="overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-sm dark:border-outline-default dark:bg-surface-card">
    <div class="border-b border-outline-default px-6 py-5 dark:border-outline-default">
        <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary dark:bg-kaori-soft dark:text-kaori-primary">
                <i data-lucide="list-filter" class="h-5 w-5"></i>
            </span>
            <div>
                <h2 class="text-lg font-semibold text-content-primary dark:text-white">Activity audit table</h2>
                <p class="mt-1 text-sm text-content-muted dark:text-content-muted">Filter cross-user background actions and inspect complete execution details without mixing the table with summary information cards.</p>
            </div>
        </div>
        <div id="operational-activity-loading"
             class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-kaori-soft dark:bg-kaori-soft">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-kaori-primary dark:bg-kaori-primary"></div>
        </div>
    </div>
    <div class="border-b border-outline-default px-6 py-4 dark:border-outline-default">
        <form id="operational-activity-filter-form"
              hx-get="{{ url_for('notifications.activity_log') }}"
              hx-target="#operational-activity-content"
              hx-swap="innerHTML"
              hx-push-url="true"
              hx-trigger="change from:select, keyup changed delay:500ms from:input[name='search']"
              hx-indicator="#operational-activity-loading"
              class="grid gap-4 xl:grid-cols-[minmax(0,1.15fr)_minmax(0,0.75fr)_minmax(0,1fr)_minmax(0,0.75fr)_minmax(16rem,1.35fr)] xl:items-end">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="per_page" value="{{ pagination.per_page }}">
            <div>
                <label class="mb-2 block text-sm font-medium text-content-secondary dark:text-slate-300">User</label>
                <select name="user_id"
                        class="w-full rounded-xl border border-outline-default bg-surface-card px-3 py-2 text-sm text-content-primary transition outline-none focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 dark:border-outline-default dark:bg-surface-card dark:text-content-primary dark:focus:border-kaori-primary dark:focus:ring-kaori-primary/10">
                    <option value="">All Users</option>
                    {% for option in user_options %}
                        <option value="{{ option.id }}"
                                {% if filters.user_id == option.id %}selected{% endif %}>{{ option.label }} · {{ option.email }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-content-secondary dark:text-slate-300">Status</label>
                <select name="status"
                        class="w-full rounded-xl border border-outline-default bg-surface-card px-3 py-2 text-sm text-content-primary transition outline-none focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 dark:border-outline-default dark:bg-surface-card dark:text-content-primary dark:focus:border-kaori-primary dark:focus:ring-kaori-primary/10">
                    {% for value, label in [('all', 'All Status'), ('success', 'Success'), ('warning', 'Warning'), ('error', 'Error'), ('info', 'Information')] %}
                        <option value="{{ value }}"
                                {% if filters.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-content-secondary dark:text-slate-300">Activity Type</label>
                <select name="event_type"
                        class="w-full rounded-xl border border-outline-default bg-surface-card px-3 py-2 text-sm text-content-primary transition outline-none focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 dark:border-outline-default dark:bg-surface-card dark:text-content-primary dark:focus:border-kaori-primary dark:focus:ring-kaori-primary/10">
                    <option value="all">All Activity Types</option>
                    {% for option in event_types %}
                        <option value="{{ option.value }}"
                                {% if filters.event_type == option.value %}selected{% endif %}>{{ option.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-content-secondary dark:text-slate-300">Read State</label>
                <select name="read_state"
                        class="w-full rounded-xl border border-outline-default bg-surface-card px-3 py-2 text-sm text-content-primary transition outline-none focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 dark:border-outline-default dark:bg-surface-card dark:text-content-primary dark:focus:border-kaori-primary dark:focus:ring-kaori-primary/10">
                    {% for value, label in [('all', 'All States'), ('unread', 'Unread'), ('read', 'Read')] %}
                        <option value="{{ value }}"
                                {% if filters.read_state == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-2 block text-sm font-medium text-content-secondary dark:text-slate-300">Search Activity</label>
                <div class="relative">
                    <i data-lucide="search"
                       class="absolute left-3 top-3 h-4 w-4 text-content-muted dark:text-content-muted"></i>
                    <input type="search"
                           name="search"
                           value="{{ filters.search }}"
                           placeholder="Search user, message, detail, or type..."
                           class="w-full rounded-xl border border-outline-default bg-surface-card py-2 pr-3 pl-10 text-sm text-content-primary transition outline-none placeholder:text-content-muted focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 dark:border-outline-default dark:bg-surface-card dark:text-content-primary dark:placeholder:text-content-muted dark:focus:border-kaori-primary dark:focus:ring-kaori-primary/10">
                </div>
            </div>
        </form>
    </div>
    <div id="operational-activity-content">{% include "notifications/partials/_activity_table_content.html" %}</div>
</section>
