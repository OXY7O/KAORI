<section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <div class="border-b border-slate-200 px-6 py-5 dark:border-slate-700">
        <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-blue-600 dark:bg-blue-500/10 dark:text-blue-300">
                <i data-lucide="list-filter" class="h-5 w-5"></i>
            </span>
            <div>
                <h2 class="text-lg font-semibold text-slate-950 dark:text-white">Activity audit table</h2>
                <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Filter cross-user background actions and inspect complete execution details without mixing the table with summary information cards.</p>
            </div>
        </div>
        <div id="operational-activity-loading" class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-blue-100 dark:bg-blue-950/60">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-blue-600 dark:bg-blue-400"></div>
        </div>
    </div>

    <div class="border-b border-slate-200 px-6 py-4 dark:border-slate-700">
        <form id="operational-activity-filter-form"
              hx-get="{{ url_for('notifications.activity_log') }}"
              hx-target="#operational-activity-content"
              hx-swap="innerHTML"
              hx-push-url="true"
              hx-trigger="change from:select, keyup changed delay:500ms from:input[name='search']"
              hx-indicator="#operational-activity-loading"
              class="grid gap-4 xl:grid-cols-[minmax(0,1.15fr)_minmax(0,0.75fr)_minmax(0,1fr)_minmax(0,0.75fr)_minmax(16rem,1.35fr)] xl:items-end">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="per_page" value="{{ pagination.per_page }}">

            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">User</label>
                <select name="user_id"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    <option value="">All Users</option>
                    {% for option in user_options %}
                        <option value="{{ option.id }}" {% if filters.user_id == option.id %}selected{% endif %}>{{ option.label }} · {{ option.email }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Status</label>
                <select name="status"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    {% for value, label in [('all', 'All Status'), ('success', 'Success'), ('warning', 'Warning'), ('error', 'Error'), ('info', 'Information')] %}
                        <option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Activity Type</label>
                <select name="event_type"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    <option value="all">All Activity Types</option>
                    {% for option in event_types %}
                        <option value="{{ option.value }}" {% if filters.event_type == option.value %}selected{% endif %}>{{ option.label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Read State</label>
                <select name="read_state"
                        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 transition outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                    {% for value, label in [('all', 'All States'), ('unread', 'Unread'), ('read', 'Read')] %}
                        <option value="{{ value }}" {% if filters.read_state == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Search Activity</label>
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-3 h-4 w-4 text-slate-400 dark:text-slate-500"></i>
                    <input type="search"
                           name="search"
                           value="{{ filters.search }}"
                           placeholder="Search user, message, detail, or type..."
                           class="w-full rounded-xl border border-slate-300 bg-white py-2 pr-3 pl-10 text-sm text-slate-900 transition outline-none placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 dark:border-slate-600 dark:bg-slate-950/40 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:focus:ring-blue-400/10">
                </div>
            </div>
        </form>
    </div>

    <div id="operational-activity-content">
        {% include "notifications/partials/_activity_table_content.html" %}
    </div>
</section>
