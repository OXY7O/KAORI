<section class="overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-sm" aria-label="Reporting summary">
    <div class="grid gap-px bg-outline-subtle sm:grid-cols-2 xl:grid-cols-4">
        {% for card in payload.summary_cards %}
            <article class="flex min-w-0 items-center gap-3 bg-surface-card px-4 py-3.5 sm:px-5">
                <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary" aria-hidden="true">
                    <i data-lucide="{{ card.icon }}" class="h-4 w-4"></i>
                </span>
                <div class="min-w-0">
                    <p class="text-[11px] font-semibold uppercase tracking-[0.12em] text-content-muted">{{ card.label }}</p>
                    <div class="mt-1 flex min-w-0 items-baseline gap-2">
                        <p class="shrink-0 text-xl font-semibold text-content-primary">{{ card.value }}</p>
                        <p class="truncate text-xs text-content-muted" title="{{ card.caption }}">{{ card.caption }}</p>
                    </div>
                </div>
            </article>
        {% endfor %}
    </div>
</section>
