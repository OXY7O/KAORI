<section class="rounded-2xl border border-outline-default bg-white shadow-sm dark:border-outline-default bg-surface-card">
    <div class="border-b border-outline-default px-5 py-4 dark:border-outline-default">
        <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary bg-kaori-soft dark:text-kaori-primary">
                <i data-lucide="list-checks" class="h-4 w-4"></i>
            </div>
            <div>
                <h2 class="text-base font-semibold text-content-primary">Recommended Actions</h2>
                <p class="text-xs text-content-muted dark:text-content-muted">Suggested next steps for Reports setup.</p>
            </div>
        </div>
    </div>
    <div class="divide-y divide-outline-default divide-outline-default">
        {% for action in payload.recommended_actions %}
            <a href="{{ action.href }}"
               class="flex items-center justify-between gap-4 px-5 py-4 transition hover:bg-surface-subtle hover:bg-kaori-soft">
                <div class="flex min-w-0 items-start gap-3">
                    <div class="mt-1 h-4 w-4 shrink-0 rounded border border-outline-default bg-white border-outline-default bg-surface-subtle">
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-content-primary dark:text-content-primary">{{ action.label }}</p>
                        <p class="mt-1 text-xs leading-5 text-content-muted dark:text-content-muted">{{ action.description }}</p>
                    </div>
                </div>
                <i data-lucide="chevron-right"
                   class="h-4 w-4 shrink-0 text-content-muted"></i>
            </a>
        {% endfor %}
    </div>
</section>
