<section class="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <div class="border-b border-slate-200 px-5 py-4 dark:border-slate-700">
        <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-300">
                <i data-lucide="list-checks" class="h-4 w-4"></i>
            </div>
            <div>
                <h2 class="text-base font-semibold text-slate-950 dark:text-white">Recommended Actions</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">Suggested next steps for Reports setup.</p>
            </div>
        </div>
    </div>
    <div class="divide-y divide-slate-100 dark:divide-slate-800">
        {% for action in payload.recommended_actions %}
            <a href="{{ action.href }}"
               class="flex items-center justify-between gap-4 px-5 py-4 transition hover:bg-slate-50 dark:hover:bg-slate-950">
                <div class="flex min-w-0 items-start gap-3">
                    <div class="mt-1 h-4 w-4 shrink-0 rounded border border-slate-300 bg-white dark:border-slate-600 dark:bg-slate-950">
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ action.label }}</p>
                        <p class="mt-1 text-xs leading-5 text-slate-500 dark:text-slate-400">{{ action.description }}</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-slate-400"></i>
            </a>
        {% endfor %}
    </div>
</section>
