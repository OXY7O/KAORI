<section class="rounded-2xl border border-outline-default bg-white shadow-sm dark:border-outline-default bg-surface-card">
    <div class="border-b border-outline-default px-5 py-4 dark:border-outline-default">
        <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary bg-kaori-soft dark:text-kaori-primary">
                <i data-lucide="clipboard-list" class="h-4 w-4"></i>
            </div>
            <div>
                <h2 class="text-base font-semibold text-content-primary">Report Type Coverage</h2>
                <p class="text-xs text-content-muted dark:text-content-muted">Implemented report categories available for MVP2 reporting.</p>
            </div>
        </div>
    </div>
    <div class="divide-y divide-outline-default divide-outline-default">
        {% for item in payload.report_type_coverage %}
            <div class="flex items-start justify-between gap-4 px-5 py-4">
                <div class="flex min-w-0 items-start gap-3">
                    <div class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-surface-subtle text-kaori-primary bg-surface-subtle dark:text-kaori-primary">
                        <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-content-primary dark:text-content-primary">{{ item.name }}</p>
                        <p class="mt-1 text-xs leading-5 text-content-muted dark:text-content-muted">{{ item.description }}</p>
                    </div>
                </div>
                <span class="shrink-0 rounded-lg bg-kaori-soft px-2.5 py-1 text-xs font-semibold text-content-secondary bg-kaori-soft dark:text-content-secondary">
                    {{ item.status }}
                </span>
            </div>
        {% endfor %}
    </div>
</section>
