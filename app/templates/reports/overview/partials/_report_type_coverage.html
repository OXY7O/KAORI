<section class="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <div class="border-b border-slate-200 px-5 py-4 dark:border-slate-700">
        <div class="flex items-center gap-3">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-300">
                <i data-lucide="clipboard-list" class="h-4 w-4"></i>
            </div>
            <div>
                <h2 class="text-base font-semibold text-slate-950 dark:text-white">Report Type Coverage</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">Implemented report categories available for MVP2 reporting.</p>
            </div>
        </div>
    </div>
    <div class="divide-y divide-slate-100 dark:divide-slate-800">
        {% for item in payload.report_type_coverage %}
            <div class="flex items-start justify-between gap-4 px-5 py-4">
                <div class="flex min-w-0 items-start gap-3">
                    <div class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-slate-50 text-blue-600 dark:bg-slate-950 dark:text-blue-300">
                        <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ item.name }}</p>
                        <p class="mt-1 text-xs leading-5 text-slate-500 dark:text-slate-400">{{ item.description }}</p>
                    </div>
                </div>
                <span class="shrink-0 rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                    {{ item.status }}
                </span>
            </div>
        {% endfor %}
    </div>
</section>
