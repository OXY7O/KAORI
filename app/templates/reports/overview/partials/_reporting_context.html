<section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-300">
            <i data-lucide="target" class="h-4 w-4"></i>
        </div>
        <h2 class="text-base font-semibold text-slate-950 dark:text-white">Reporting Context</h2>
    </div>
    <ul class="mt-4 space-y-3">
        {% for item in payload.reporting_context %}
            <li class="flex gap-3 text-sm leading-6 text-slate-600 dark:text-slate-300">
                <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-blue-500"></span>
                <span>{{ item }}</span>
            </li>
        {% endfor %}
    </ul>
</section>
