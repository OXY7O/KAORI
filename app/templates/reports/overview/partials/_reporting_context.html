<section class="rounded-2xl border border-outline-default bg-white p-5 shadow-sm dark:border-outline-default bg-surface-card">
    <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary bg-kaori-soft dark:text-kaori-primary">
            <i data-lucide="target" class="h-4 w-4"></i>
        </div>
        <h2 class="text-base font-semibold text-content-primary">Reporting Context</h2>
    </div>
    <ul class="mt-4 space-y-3">
        {% for item in payload.reporting_context %}
            <li class="flex gap-3 text-sm leading-6 text-content-secondary dark:text-content-secondary">
                <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-kaori-primary"></span>
                <span>{{ item }}</span>
            </li>
        {% endfor %}
    </ul>
</section>
