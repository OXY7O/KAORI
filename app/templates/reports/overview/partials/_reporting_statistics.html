<section class="overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-sm"
         aria-labelledby="reporting-statistics-title">
    <header class="flex flex-col gap-3 border-b border-outline-subtle px-5 py-4 sm:flex-row sm:items-start sm:justify-between sm:px-6">
        <div class="flex min-w-0 items-start gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary" aria-hidden="true">
                <i data-lucide="chart-spline" class="h-5 w-5"></i>
            </span>
            <div class="min-w-0">
                <h2 id="reporting-statistics-title" class="text-base font-semibold text-content-primary">Reporting Statistics</h2>
                <p class="mt-0.5 text-xs leading-5 text-content-muted">Artifact volume, completion quality, storage footprint, and reusable report configuration.</p>
            </div>
        </div>
        <a href="{{ url_for('reports.generated_reports') }}"
           class="inline-flex min-h-9 items-center justify-center gap-2 rounded-lg border border-kaori-primary/30 bg-surface-card px-3 text-xs font-semibold text-kaori-primary transition hover:bg-kaori-soft">
            <i data-lucide="folder-open" class="h-4 w-4" aria-hidden="true"></i>
            Open Generated Reports
        </a>
    </header>

    <div class="grid divide-y divide-outline-subtle sm:grid-cols-2 sm:divide-x sm:divide-y-0 xl:grid-cols-4">
        {% for item in payload.artifact_statistics %}
            <article class="px-5 py-4 sm:px-6">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-xs font-semibold text-content-muted">{{ item.label }}</p>
                        <p class="mt-1 text-2xl font-bold tracking-tight text-content-primary">{{ item.value }}</p>
                    </div>
                    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary" aria-hidden="true">
                        <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                    </span>
                </div>
                <p class="mt-2 text-xs leading-5 text-content-secondary">{{ item.caption }}</p>
            </article>
        {% endfor %}
    </div>
</section>
