<section class="overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-sm"
         aria-labelledby="reporting-activity-title">
    <header class="flex items-center gap-3 border-b border-outline-subtle px-5 py-4 sm:px-6">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary"
              aria-hidden="true">
            <i data-lucide="chart-no-axes-combined" class="h-4 w-4"></i>
        </span>
        <div>
            <h2 id="reporting-activity-title" class="text-base font-semibold text-content-primary">Reporting Activity Snapshot</h2>
            <p class="mt-0.5 text-xs leading-5 text-content-muted">Current report volume, artifact readiness, and recurring automation.</p>
        </div>
    </header>
    <div class="grid gap-px bg-outline-subtle sm:grid-cols-2 xl:grid-cols-4">
        {% for card in payload.summary_cards %}
            <article class="bg-surface-card px-5 py-4 sm:px-6">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-[10px] font-semibold uppercase tracking-[0.12em] text-content-muted">{{ card.label }}</p>
                        <p class="mt-2 text-2xl font-semibold tracking-tight text-content-primary">{{ card.value }}</p>
                    </div>
                    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary"
                          aria-hidden="true">
                        <i data-lucide="{{ card.icon }}" class="h-4 w-4"></i>
                    </span>
                </div>
                <p class="mt-2 text-xs leading-5 text-content-secondary">{{ card.caption }}</p>
            </article>
        {% endfor %}
    </div>
</section>
