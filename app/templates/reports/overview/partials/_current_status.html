<section class="overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-sm"
         x-data="{ open: false }"
         aria-labelledby="reports-current-status-title">
    <button type="button"
            class="flex w-full items-start justify-between gap-4 px-5 py-4 text-left"
            @click="open = !open"
            :aria-expanded="open ? 'true' : 'false'">
        <div class="flex min-w-0 items-start gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary"
                  aria-hidden="true">
                <i data-lucide="activity" class="h-5 w-5"></i>
            </span>
            <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">
                    <h2 id="reports-current-status-title"
                        class="text-base font-semibold text-content-primary">Current Status</h2>
                    {{ table_label.status_label(payload.current_status_summary.posture,
                                        payload.current_status_summary.tone,
                                        none,
                                        'detail') }}
                </div>
                <p class="mt-1 text-xs leading-5 text-content-muted">{{ payload.current_status_summary.ready }} Ready · {{ payload.current_status_summary.review }} Review · {{ payload.current_status_summary.neutral }} Informational</p>
            </div>
        </div>
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-outline-default bg-surface-hover text-content-secondary transition"
              :class="{ 'rotate-180': open }"
              aria-hidden="true">
            <i data-lucide="chevron-down" class="h-4 w-4"></i>
        </span>
    </button>
    <div class="border-t border-outline-subtle"
         x-show="open"
         x-collapse
         x-cloak>
        <div class="divide-y divide-outline-subtle px-5 sm:px-6">
            {% for item in payload.current_status %}
                <article class="py-3.5">
                    <div class="flex items-start gap-3">
                        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary"
                              aria-hidden="true">
                            <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                        </span>
                        <div class="min-w-0 flex-1">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <p class="text-sm font-semibold text-content-primary">{{ item.label }}</p>
                                {{ table_label.status_label(item.value, item.tone, none, 'detail') }}
                            </div>
                            <p class="mt-1 text-xs leading-5 text-content-secondary">{{ item.description }}</p>
                        </div>
                    </div>
                </article>
            {% endfor %}
        </div>
    </div>
</section>
