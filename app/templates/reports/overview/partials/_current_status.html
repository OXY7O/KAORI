<section class="rounded-2xl border border-outline-default bg-white p-5 shadow-sm dark:border-outline-default bg-surface-card">
    <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-kaori-soft text-kaori-primary bg-kaori-soft dark:text-kaori-primary">
            <i data-lucide="activity" class="h-4 w-4"></i>
        </div>
        <h2 class="text-base font-semibold text-content-primary">Current Status</h2>
    </div>
    <div class="mt-4 space-y-3">
        {% for item in payload.current_status %}
            {% set dot_class = {
                            'gray': 'bg-content-muted',
                            'amber': 'bg-amber-500',
                            'blue': 'bg-kaori-primary',
                            'green': 'bg-emerald-500',
                            'red': 'bg-rose-500'
                        }.get(item.tone, 'bg-content-muted') %}
            <div class="flex items-center gap-3 rounded-xl bg-surface-subtle px-3 py-2.5 bg-surface-subtle">
                <span class="h-2.5 w-2.5 rounded-full {{ dot_class }}"></span>
                <span class="text-sm font-medium text-content-secondary dark:text-content-secondary">{{ item.label }}</span>
            </div>
        {% endfor %}
    </div>
</section>
