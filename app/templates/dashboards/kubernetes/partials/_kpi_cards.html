<section id="dashboard-kpi-cards" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    {% for kpi in dashboard.global_kpis %}
        <article class="group rounded-xl border border-outline-default bg-surface-card p-4 shadow-sm transition duration-150 hover:border-outline-strong hover:bg-surface-hover">
            <div class="flex items-start justify-between gap-4">
                <div class="min-w-0">
                    <p class="text-xs font-semibold uppercase tracking-[0.08em] text-kaori-primary">{{ kpi.label }}</p>
                    <p class="mt-2 text-2xl font-semibold tracking-tight text-content-primary">{{ kpi.value }}</p>
                </div>
                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                    <i data-lucide="{{ kpi.icon }}" class="h-5 w-5"></i>
                </div>
            </div>
            <p class="mt-3 line-clamp-2 text-xs leading-5 text-content-muted">{{ kpi.description }}</p>
        </article>
    {% endfor %}
</section>
