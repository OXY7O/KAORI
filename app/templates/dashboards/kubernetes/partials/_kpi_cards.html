<section id="dashboard-kpi-cards" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    {% for kpi in dashboard.global_kpis %}
        <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-[11px] font-medium text-slate-500 dark:text-slate-400">{{ kpi.label }}</p>
                    <p class="mt-2 text-[1.45rem] font-bold tracking-tight text-slate-950 dark:text-white 2xl:text-[1.65rem]">{{ kpi.value }}</p>
                </div>
                <div class="flex h-11 w-11 items-center justify-center rounded-2xl {% if kpi.tone == 'emerald' %}bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-300 {% elif kpi.tone == 'amber' or kpi.tone == 'orange' %}bg-amber-50 text-amber-600 dark:bg-amber-950/40 dark:text-amber-300 {% elif kpi.tone == 'red' %}bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-300 {% elif kpi.tone == 'violet' %}bg-violet-50 text-violet-600 dark:bg-violet-950/40 dark:text-violet-300 {% elif kpi.tone == 'slate' %}bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-300 {% else %}bg-blue-50 text-blue-600 dark:bg-blue-950/40 dark:text-blue-300{% endif %}">
                    <i data-lucide="{{ kpi.icon }}" class="h-5 w-5"></i>
                </div>
            </div>
            <p class="mt-4 line-clamp-2 text-[0.74rem] leading-5 text-slate-500 dark:text-slate-400">{{ kpi.description }}</p>
        </article>
    {% endfor %}
</section>
