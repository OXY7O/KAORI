{% set title = title|default('Dashboard section') %}
{% set description = description|default('Preparing live dashboard data from the selected scope.') %}
{% set icon = icon|default('loader-circle') %}
<section class="h-full rounded-3xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-start gap-4">
        <div class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950/40 dark:text-blue-300">
            <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
        </div>
        <div class="min-w-0 flex-1">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm font-semibold text-slate-900 dark:text-white">{{ title }}</p>
                    <p class="mt-1 text-xs leading-5 text-slate-500 dark:text-slate-400">{{ description }}</p>
                </div>
                <span class="inline-flex w-fit items-center gap-2 rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700 dark:bg-blue-950/40 dark:text-blue-300">
                    <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-blue-500"></span>
                    Preparing
                </span>
            </div>
            <div class="mt-5 grid gap-3 sm:grid-cols-3">
                <div class="h-16 animate-pulse rounded-2xl bg-slate-100 dark:bg-slate-800"></div>
                <div class="h-16 animate-pulse rounded-2xl bg-slate-100 dark:bg-slate-800"></div>
                <div class="h-16 animate-pulse rounded-2xl bg-slate-100 dark:bg-slate-800"></div>
            </div>
        </div>
    </div>
</section>
