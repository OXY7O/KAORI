{% set title = title|default('Dashboard section') %}
{% set description = description|default('Preparing live dashboard data from the selected scope.') %}
{% set icon = icon|default('loader-circle') %}
<section class="h-full rounded-xl border border-outline-default bg-surface-card p-5 shadow-sm">
    <div class="flex items-start gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
            <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
        </div>
        <div class="min-w-0 flex-1">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm font-semibold text-content-primary">{{ title }}</p>
                    <p class="mt-1 text-xs leading-5 text-content-muted">{{ description }}</p>
                </div>
                <span class="inline-flex w-fit items-center gap-2 rounded-full border border-status-pending-border bg-status-pending-soft px-3 py-1 text-xs font-semibold text-status-pending-text">
                    <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-status-pending"></span>
                    Preparing
                </span>
            </div>
            <div class="mt-4 grid gap-3 sm:grid-cols-3">
                <div class="h-14 animate-pulse rounded-lg bg-surface-hover"></div>
                <div class="h-14 animate-pulse rounded-lg bg-surface-hover"></div>
                <div class="h-14 animate-pulse rounded-lg bg-surface-hover"></div>
            </div>
        </div>
    </div>
</section>
