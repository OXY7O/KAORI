<section id="dashboard-data-freshness"
         x-data="{ open: false }"
         class="h-full rounded-3xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <div @click="open = !open"
         class="flex cursor-pointer select-none items-center gap-4 border-b border-slate-100 px-6 py-5 dark:border-slate-800">
        <div class="flex min-w-0 flex-1 items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950/40 dark:text-blue-300">
                <i data-lucide="clock-3" class="h-5 w-5"></i>
            </div>
            <div>
                <h2 class="font-semibold text-slate-950 dark:text-white">Data Freshness</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">Source readiness for inventory snapshots, live metrics, alerts, and reports.</p>
            </div>
        </div>
        <div class="ml-auto flex flex-shrink-0 items-center gap-3">
            <button type="button"
                    class="inline-flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 transition hover:border-blue-200 hover:text-blue-600 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-400 dark:hover:border-blue-800 dark:hover:text-blue-300"
                    @click.stop="open = !open"
                    :aria-expanded="open.toString()"
                    aria-label="Toggle section">
                <i data-lucide="chevron-down"
                   class="h-4 w-4 transition-transform duration-200"
                   :class="open ? 'rotate-180' : ''"></i>
            </button>
        </div>
    </div>
    <div x-show="open" x-transition class="grid gap-3 p-6 sm:grid-cols-2">
        {% for item in dashboard.data_freshness %}
            <div class="rounded-2xl border border-slate-100 p-4 dark:border-slate-800">
                <div class="flex items-start gap-3">
                    <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-2xl {% if item.status == 'Healthy' %}bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-300 {% elif item.status == 'Warning' %}bg-amber-50 text-amber-600 dark:bg-amber-950/40 dark:text-amber-300 {% elif item.status == 'Unavailable' %}bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-300 {% elif item.status == 'Info' %}bg-blue-50 text-blue-600 dark:bg-blue-950/40 dark:text-blue-300 {% else %}bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-300{% endif %}">
                        <i data-lucide="{{ item.icon }}" class="h-5 w-5"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <p class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ item.label }}</p>
                                <p class="mt-1 truncate text-xs font-medium text-slate-500 dark:text-slate-400">{{ item.value }}</p>
                            </div>
                            <span class="rounded-full px-2.5 py-1 text-[11px] font-semibold {% if item.status == 'Healthy' %}bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 {% elif item.status == 'Warning' %}bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-300 {% elif item.status == 'Unavailable' %}bg-red-50 text-red-700 dark:bg-red-950/40 dark:text-red-300 {% elif item.status == 'Info' %}bg-blue-50 text-blue-700 dark:bg-blue-950/40 dark:text-blue-300 {% else %}bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300{% endif %}">
                                {{ item.status }}
                            </span>
                        </div>
                        {% if item.description %}
                            <p class="mt-3 text-xs leading-5 text-slate-500 dark:text-slate-400">{{ item.description }}</p>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
