<section id="dashboard-data-freshness"
         class="h-full rounded-xl border border-outline-default bg-surface-card shadow-sm">
    <div class="flex items-center gap-3 border-b border-outline-subtle px-5 py-4">
        <div class="flex min-w-0 flex-1 items-center gap-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                <i data-lucide="clock-3" class="h-5 w-5"></i>
            </div>
            <div class="min-w-0">
                <h2 class="text-sm font-semibold text-content-primary">Data Freshness</h2>
                <p class="mt-0.5 text-xs leading-5 text-content-muted">Readiness and collection state for inventory, metrics, alerts, and reports.</p>
            </div>
        </div>
    </div>
    <div class="grid gap-3 p-5 sm:grid-cols-2">
        {% for item in dashboard.data_freshness %}
            <div class="rounded-lg border border-outline-subtle bg-surface-elevated p-3.5">
                <div class="flex items-start gap-3">
                    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary">
                        <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                                <p class="text-sm font-semibold text-content-primary">{{ item.label }}</p>
                                <p class="mt-0.5 truncate text-xs font-medium text-content-muted">{{ item.value }}</p>
                            </div>
                            <span class="rounded-md border px-2.5 py-1 text-xs font-semibold {% if item.status == 'Healthy' %}border-status-normal-border bg-status-normal-soft text-status-normal-text {% elif item.status == 'Warning' %}border-status-warning-border bg-status-warning-soft text-status-warning-text {% elif item.status == 'Unavailable' %}border-status-critical-border bg-status-critical-soft text-status-critical-text {% elif item.status == 'Info' %}border-status-info-border bg-status-info-soft text-status-info-text {% else %}border-status-unknown-border bg-status-unknown-soft text-status-unknown-text{% endif %}">
                                {{ item.status }}
                            </span>
                        </div>
                        {% if item.description %}
                            <p class="mt-2 text-xs leading-5 text-content-muted">{{ item.description }}</p>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
