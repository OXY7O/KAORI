{% import "components/action_button.html" as action_button %}
<div id="tenant-adoption-preflight-modal"
     data-tenant-adoption-modal
     class="fixed inset-0 z-[90] flex items-center justify-center p-3 sm:p-5"
     aria-hidden="false">
    <button type="button"
            data-tenant-adoption-close
            class="absolute inset-0 bg-surface-overlay/75 backdrop-blur-sm"
            aria-label="Close Tenant Adoption Preflight"></button>
    <section role="dialog"
             aria-modal="true"
             aria-labelledby="tenant-adoption-preflight-error-title"
             tabindex="-1"
             class="relative w-full max-w-xl overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-2xl">
        <header class="border-b border-outline-subtle px-5 py-4 sm:px-6">
            <div class="flex items-start justify-between gap-4">
                <div class="flex min-w-0 items-start gap-3">
                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-status-warning-soft text-status-warning-text"
                          aria-hidden="true">
                        <i data-lucide="shield-alert" class="h-5 w-5"></i>
                    </span>
                    <div>
                        <h2 id="tenant-adoption-preflight-error-title"
                            class="text-lg font-semibold text-content-primary">Adoption Preflight Unavailable</h2>
                        <p class="mt-1 text-sm leading-6 text-content-secondary">The live candidate changed or could not be revalidated.</p>
                    </div>
                </div>
                <button type="button"
                        data-tenant-adoption-close
                        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-outline-default bg-surface-card text-content-muted transition hover:border-brand-outline hover:bg-kaori-soft hover:text-kaori-primary"
                        aria-label="Close Adoption Preflight">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>
        </header>
        <div class="p-5 sm:p-6">
            <div class="rounded-xl border border-outline-subtle bg-status-warning-soft p-4 text-status-warning-text">
                <p class="text-sm font-semibold">Refresh Discovery before continuing</p>
                <p class="mt-2 text-xs leading-5">{{ tenant_adoption_preflight_error }}</p>
            </div>
            <p class="mt-4 text-xs leading-5 text-content-muted">
                No KAORI or provider state was changed by this preflight request.
            </p>
        </div>
        <footer class="flex justify-end border-t border-outline-subtle bg-surface-card px-5 py-4 sm:px-6">
            <button type="button"
                    data-tenant-adoption-close
                    class="{{ action_button.classes('secondary') }}">Close</button>
        </footer>
    </section>
</div>
