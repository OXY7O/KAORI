<form method="post"
                  action="{{ url_for('tenant.create_tenant_route') }}"
                  class="rounded-xl border border-outline-subtle bg-surface-card p-5 shadow-sm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-5 flex items-start gap-3">
                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary dark:text-kaori-accent"><i data-lucide="building-2" class="h-5 w-5"></i></span>
                    <div>
                        <h2 class="text-base font-semibold text-content-primary">1. Add Tenant</h2>
                        <p class="mt-1 text-sm leading-6 text-content-secondary">Bind one Tenant and initial environment to a Ready cluster.</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <label class="block">
                        {{ form_field.label_row("Tenant Name") }}
                        <input name="name"
                               required
                               autocomplete="off"
                               placeholder="Payments"
                               class="{{ form_field.input_classes() }}">
                    </label>
                    <label class="block">
                        {{ form_field.label_row("Tenant Slug") }}
                        <input name="slug"
                               autocomplete="off"
                               placeholder="payments"
                               class="{{ form_field.input_classes() }}">
                        {{ form_field.help("Optional. KAORI derives a lowercase slug from the name when omitted.") }}
                    </label>
                    <label class="block">
                        {{ form_field.label_row("Cluster") }}
                        <select name="cluster_id" required class="{{ form_field.select_classes() }}">
                            <option value="">Select Ready cluster</option>
                            {% for cluster in ready_clusters %}
                                <option value="{{ cluster.id }}">{{ cluster.name }} · {{ cluster.environment|title }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <label class="block">
                        {{ form_field.label_row("Environment") }}
                        <select name="environment" required class="{{ form_field.select_classes() }}">
                            <option value="development">Development</option>
                            <option value="staging">Staging</option>
                            <option value="production">Production</option>
                        </select>
                    </label>
                    <label class="block">
                        {{ form_field.label_row('Provider', 'Baseline', 'normal', 'shield-check') }}
                        <select disabled class="{{ form_field.select_classes() }}">
                            <option>Native Kubernetes</option>
                            <option>Capsule — available after capability qualification</option>
                        </select>
                        <input type="hidden" name="provider_key" value="native_kubernetes">
                    </label>
                    <label class="block">
                        {{ form_field.label_row("Description") }}
                        <input name="description"
                               autocomplete="off"
                               placeholder="Optional operator context"
                               class="{{ form_field.input_classes() }}">
                    </label>
                </div>
                <button type="submit"
                        {% if not can_manage or not native_available %}disabled aria-disabled="true"{% endif %}
                        class="mt-5 inline-flex min-h-10 w-full items-center justify-center gap-2 rounded-lg bg-kaori-primary px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-kaori-primary-hover disabled:cursor-not-allowed disabled:opacity-50">
                    <i data-lucide="plus" class="h-4 w-4"></i>Add Tenant
                </button>
            </form>
