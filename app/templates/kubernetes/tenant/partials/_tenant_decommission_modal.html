<div id="tenant-decommission-modal"
     data-destructive-confirmation-modal
     class="fixed inset-0 z-[90] hidden items-center justify-center bg-surface-overlay/70 px-4 backdrop-blur-sm"
     aria-hidden="true">
    <button type="button"
            data-destructive-modal-close
            class="absolute inset-0"
            aria-label="Cancel Tenant decommission"></button>
    <section role="dialog"
             aria-modal="true"
             aria-labelledby="tenant-decommission-modal-title"
             class="relative w-full max-w-lg overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-2xl">
        <header class="flex items-start gap-3 border-b border-outline-subtle px-5 py-4">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-status-critical-soft text-status-critical-text"
                  aria-hidden="true">
                <i data-lucide="archive-x" class="h-5 w-5"></i>
            </span>
            <div class="min-w-0">
                <h2 id="tenant-decommission-modal-title"
                    data-destructive-modal-title
                    class="text-lg font-semibold leading-6 text-content-primary">Decommission Tenant</h2>
                <p class="mt-1 text-sm leading-6 text-content-secondary">
                    KAORI does not hard-delete governed Tenant evidence from routine UI.
                </p>
            </div>
        </header>
        <div class="space-y-4 p-5">
            <dl class="rounded-lg border border-outline-subtle bg-surface-elevated px-4 py-3">
                <div class="grid gap-2 sm:grid-cols-[8rem_minmax(0,1fr)]">
                    <dt class="text-xs text-content-muted">Tenant</dt>
                    <dd data-destructive-target-name
                        class="text-sm font-semibold text-content-primary">Selected Tenant</dd>
                    <dt class="text-xs text-content-muted">Result</dt>
                    <dd class="text-sm font-medium text-content-secondary">Lifecycle → Decommissioned</dd>
                </div>
            </dl>
            <div class="rounded-lg border border-status-critical-border bg-status-critical-soft p-3">
                <p data-destructive-detail class="text-xs leading-5 text-status-critical-text">
                    Decommission is blocked while governed dependent state remains.
                </p>
            </div>
        </div>
        <form data-destructive-dynamic-form
              method="post"
              action=""
              hx-target="#tenant-admin-workspace"
              hx-select="#tenant-admin-workspace"
              hx-swap="outerHTML show:none focus-scroll:false"
              hx-indicator="#tenant-admin-loading"
              hx-disabled-elt="button[type='submit']">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="flex justify-end gap-2 border-t border-outline-subtle bg-surface-hover px-5 py-4">
                <button type="button"
                        data-destructive-modal-close
                        class="inline-flex h-10 items-center justify-center rounded-lg border border-outline-default bg-surface-card px-4 text-sm font-semibold text-content-secondary transition hover:border-outline-focus hover:text-kaori-primary">
                    Cancel
                </button>
                <button type="submit"
                        data-operation-submit
                        data-loading-label="Decommissioning..."
                        class="inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-status-critical px-4 text-sm font-semibold text-white transition hover:opacity-90 disabled:cursor-wait disabled:opacity-70">
                    <i data-lucide="archive-x" class="h-4 w-4" aria-hidden="true"></i>
                    <span data-destructive-action-label data-operation-submit-label>Decommission</span>
                </button>
            </div>
        </form>
    </section>
</div>
