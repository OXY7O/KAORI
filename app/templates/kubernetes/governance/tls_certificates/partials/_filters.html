{% import "components/table.html" as table_ui %}
<form id="tls-certificate-filter-form"
      method="get"
      action="{{ url_for('governance.tls_certificates') }}"
      hx-get="{{ url_for('governance.tls_certificates') }}"
      hx-target="#tls-certificates-page-workspace"
      hx-swap="outerHTML"
      hx-indicator="#tls-certificates-table-loading"
      hx-trigger="change, keyup changed delay:500ms from:find input[name='search']"
      class="{{ table_ui.filter_layout_classes() }}">
    <input type="hidden" name="page" value="1">
    <input type="hidden"
           name="per_page"
           value="{{ payload.pagination.per_page }}">
    <input type="hidden" name="partial_mode" value="page_workspace">
    <div class="min-w-0">
        <label class="{{ table_ui.filter_label_classes() }}"
               for="tls-cluster-filter">Cluster</label>
        <select id="tls-cluster-filter"
                name="cluster_id"
                class="{{ table_ui.filter_select_classes() }}">
            <option value="">All Clusters</option>
            {% for cluster in payload.clusters %}
                <option value="{{ cluster.id }}"
                        {% if payload.filters.cluster_id == cluster.id|string or payload.filters.cluster_id == cluster.id %}selected{% endif %}>{{ cluster.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="min-w-0">
        <label class="{{ table_ui.filter_label_classes() }}"
               for="tls-namespace-filter">Namespace</label>
        <select id="tls-namespace-filter"
                name="namespace"
                class="{{ table_ui.filter_select_classes() }}">
            <option value="">All Namespaces</option>
            {% for namespace in payload.namespaces %}
                <option value="{{ namespace }}"
                        {% if payload.filters.namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="min-w-0">
        <label class="{{ table_ui.filter_label_classes() }}" for="tls-status-filter">Validity</label>
        <select id="tls-status-filter"
                name="status"
                class="{{ table_ui.filter_select_classes() }}">
            {% for status in payload.status_options %}
                {% set label = 'All Validity States' if status == 'all' else ('Valid' if status == 'healthy' else ('Renewal Window' if status == 'warning' else ('Critical Window' if status == 'critical' else status.replace('_', ' ')|title))) %}
                <option value="{{ status }}"
                        {% if payload.filters.status == status %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="min-w-0">
        <label class="{{ table_ui.filter_label_classes() }}" for="tls-search-filter">Search TLS Certificates</label>
        {{ table_ui.search_field('search', payload.filters.search, 'Search Secret name, namespace, subject, or issuer') }}
    </div>
</form>
