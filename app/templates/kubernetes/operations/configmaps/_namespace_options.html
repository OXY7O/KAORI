{% import "components/live_lookup_notice.html" as live_lookup %}
{% import "components/form_field.html" as form_field %}
<div id="configmap-namespace-field">
    <label class="block min-w-0" for="namespace">
        <span class="text-xs font-semibold text-content-primary">Namespace</span>
        <select id="namespace"
                name="namespace"
                required
                data-configmap-namespace
                class="{{ form_field.select_classes() }} font-medium"
                {% if not namespaces %}disabled{% endif %}>
            <option value="">
                {% if not cluster_selected %}
                    Select cluster first
                {% elif namespaces %}
                    Select namespace
                {% else %}
                    No live namespaces available
                {% endif %}
            </option>
            {% for namespace in namespaces %}
                <option value="{{ namespace }}"
                        {{ 'selected' if namespace == selected_namespace else '' }}>{{ namespace }}
                </option>
            {% endfor %}
        </select>
        {% if cluster_selected and not namespace_error and not namespaces %}
            {{ form_field.help("No live namespace is available for the selected cluster.") }}
        {% elif namespaces %}
        {% endif %}
    </label>
</div>
{% if request.headers.get('HX-Request') == 'true' %}
    <div id="configmap-live-lookup-notice"
         hx-swap-oob="outerHTML"
         class="mt-4">
        {% if namespace_error %}{{ live_lookup.warning('Live namespace lookup failed', namespace_error) }}{% endif %}
    </div>
{% endif %}
