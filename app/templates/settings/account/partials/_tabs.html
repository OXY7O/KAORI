<nav class="border-b border-outline-default bg-surface-subtle px-5 pt-4"
     aria-label="Account and authentication sections">
    <div class="flex gap-2 overflow-x-auto" role="tablist">
        <a href="{{ url_for('settings.account', tab='profile') }}"
           hx-get="{{ url_for('settings.account', tab='profile') }}"
           hx-target="#account-authentication-page"
           hx-swap="outerHTML"
           hx-push-url="true"
           role="tab"
           aria-selected="{{ 'true' if active_tab == 'profile' else 'false' }}"
           class="inline-flex min-h-10 shrink-0 items-center gap-2 rounded-t-xl border px-4 py-2.5 text-sm font-semibold transition {{ 'border-outline-default border-b-surface-card bg-surface-card text-kaori-primary -mb-px' if active_tab == 'profile' else 'border-transparent text-content-muted hover:bg-kaori-soft hover:text-kaori-primary' }}">
            <i data-lucide="id-card" class="h-4 w-4 shrink-0"></i>
            <span>Account Profile & Access</span>
            <span class="rounded-md border px-2 py-0.5 text-xs font-semibold {{ 'border-brand-outline bg-kaori-soft text-kaori-primary' if active_tab == 'profile' else 'border-outline-subtle bg-surface-card text-content-muted' }}">
                {{ identity_context.type_label }}
            </span>
        </a>
        <a href="{{ url_for('settings.account', tab='activity') }}"
           hx-get="{{ url_for('settings.account', tab='activity') }}"
           hx-target="#account-authentication-page"
           hx-swap="outerHTML"
           hx-push-url="true"
           role="tab"
           aria-selected="{{ 'true' if active_tab == 'activity' else 'false' }}"
           class="inline-flex min-h-10 shrink-0 items-center gap-2 rounded-t-xl border px-4 py-2.5 text-sm font-semibold transition {{ 'border-outline-default border-b-surface-card bg-surface-card text-kaori-primary -mb-px' if active_tab == 'activity' else 'border-transparent text-content-muted hover:bg-kaori-soft hover:text-kaori-primary' }}">
            <i data-lucide="activity" class="h-4 w-4 shrink-0"></i>
            <span>Recent Authentication Activity</span>
            <span class="rounded-md border px-2 py-0.5 text-xs font-semibold {{ 'border-brand-outline bg-kaori-soft text-kaori-primary' if active_tab == 'activity' else 'border-outline-subtle bg-surface-card text-content-muted' }}">
                {{ activity_summary.total }} recent
            </span>
        </a>
        <a href="{{ url_for('settings.account', tab='credentials') }}"
           hx-get="{{ url_for('settings.account', tab='credentials') }}"
           hx-target="#account-authentication-page"
           hx-swap="outerHTML"
           hx-push-url="true"
           role="tab"
           aria-selected="{{ 'true' if active_tab == 'credentials' else 'false' }}"
           class="inline-flex min-h-10 shrink-0 items-center gap-2 rounded-t-xl border px-4 py-2.5 text-sm font-semibold transition {{ 'border-outline-default border-b-surface-card bg-surface-card text-kaori-primary -mb-px' if active_tab == 'credentials' else 'border-transparent text-content-muted hover:bg-kaori-soft hover:text-kaori-primary' }}">
            <i data-lucide="key-round" class="h-4 w-4 shrink-0"></i>
            <span>Credential Management</span>
            <span class="rounded-md border px-2 py-0.5 text-xs font-semibold {{ 'border-brand-outline bg-kaori-soft text-kaori-primary' if active_tab == 'credentials' else 'border-outline-subtle bg-surface-card text-content-muted' }}">
                {{ 'KAORI managed' if can_change_password else 'Provider managed' }}
            </span>
        </a>
    </div>
</nav>
