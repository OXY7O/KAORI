<div class="overflow-hidden rounded-xl border border-outline-default bg-surface-card shadow-sm ">
    <div class="border-b border-outline-subtle px-5 py-4 sm:px-6">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div class="min-w-0">
                <p class="text-xs font-semibold uppercase tracking-[0.24em] text-content-muted ">Alert Controls</p>
                <h2 class="mt-1 text-sm font-semibold text-content-primary">Alert Analysis Filters</h2>
                <p class="mt-1 text-xs leading-5 text-content-muted ">
                    Select cluster, source, severity, status, namespace, and search context.
                </p>
            </div>
            <div class="inline-flex w-fit items-center gap-2 rounded-full border border-outline-default bg-surface-subtle px-3 py-1.5 text-xs font-semibold text-content-secondary ">
                <i data-lucide="sliders-horizontal"
                   class="h-3.5 w-3.5 text-kaori-primary"></i>
                Filter scope
            </div>
        </div>
    </div>
    <div class="px-5 py-4 sm:px-6">
        <div class="grid gap-3 lg:grid-cols-2 xl:grid-cols-[minmax(170px,1fr)_minmax(130px,.7fr)_minmax(130px,.7fr)_minmax(130px,.7fr)_minmax(180px,1fr)_minmax(240px,1.2fr)] xl:items-end">
            <label class="block min-w-0">
                <span class="text-xs font-medium text-content-muted ">Cluster</span>
                <select id="alerts-cluster-select"
                        name="cluster_id"
                        data-kaori-reset-fields="namespace=,search=,page=1"
                        class="mt-1 w-full rounded-xl border border-outline-strong bg-surface-card px-3 py-2 pr-9 text-sm font-semibold text-content-primary shadow-sm outline-none transition focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 ">
                    {% for cluster in clusters %}
                        <option value="{{ cluster.id }}"
                                {% if selected_cluster_id == cluster.id %}selected{% endif %}>
                            {{ cluster.name }}
                        </option>
                    {% endfor %}
                </select>
            </label>
            <label class="block min-w-0">
                <span class="text-xs font-medium text-content-muted ">Source</span>
                <select name="source"
                        class="mt-1 w-full rounded-xl border border-outline-strong bg-surface-card px-3 py-2 pr-9 text-sm font-semibold text-content-primary shadow-sm outline-none transition focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 ">
                    <option value="auto" {% if selected_source == 'auto' %}selected{% endif %}>Auto</option>
                    <option value="alertmanager"
                            {% if selected_source == 'alertmanager' %}selected{% endif %}>Alertmanager</option>
                    <option value="prometheus"
                            {% if selected_source == 'prometheus' %}selected{% endif %}>Prometheus</option>
                </select>
            </label>
            <label class="block min-w-0">
                <span class="text-xs font-medium text-content-muted ">Severity</span>
                <select name="severity"
                        class="mt-1 w-full rounded-xl border border-outline-strong bg-surface-card px-3 py-2 pr-9 text-sm font-semibold text-content-primary shadow-sm outline-none transition focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 ">
                    {% for option in severity_options %}
                        <option value="{{ option }}"
                                {% if selected_severity == option %}selected{% endif %}>{{ option | title }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="block min-w-0">
                <span class="text-xs font-medium text-content-muted ">Status</span>
                <select name="status"
                        class="mt-1 w-full rounded-xl border border-outline-strong bg-surface-card px-3 py-2 pr-9 text-sm font-semibold text-content-primary shadow-sm outline-none transition focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 ">
                    {% for option in status_options %}
                        <option value="{{ option }}"
                                {% if selected_status == option %}selected{% endif %}>{{ option | title }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="block min-w-0">
                <span class="text-xs font-medium text-content-muted ">Namespace</span>
                <select name="namespace"
                        class="mt-1 w-full rounded-xl border border-outline-strong bg-surface-card px-3 py-2 pr-9 text-sm font-semibold text-content-primary shadow-sm outline-none transition focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 ">
                    <option value="" {% if not selected_namespace %}selected{% endif %}>All Namespaces</option>
                    {% for namespace in namespace_options %}
                        <option value="{{ namespace }}"
                                {% if selected_namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="block min-w-0">
                <span class="text-xs font-medium text-content-muted ">Search</span>
                <span class="relative mt-1 block">
                    <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-content-muted" aria-hidden="true">
                        <i data-lucide="search" class="h-4 w-4"></i>
                    </span>
                    <input type="text"
                           name="search"
                           value="{{ selected_search }}"
                           placeholder="Search alert, pod, node, namespace..."
                           class="w-full min-w-0 rounded-xl border border-outline-strong bg-surface-card py-2 pl-10 pr-3 text-sm font-semibold text-content-primary shadow-sm outline-none transition placeholder:font-normal placeholder:text-content-muted focus:border-kaori-primary focus:ring-4 focus:ring-kaori-primary/10 ">
                </span>
            </label>
        </div>
        <div id="alerts-refresh-indicator"
             class="htmx-indicator mt-4 h-1 overflow-hidden rounded-full bg-kaori-soft">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-kaori-primary"></div>
        </div>
    </div>
</div>
