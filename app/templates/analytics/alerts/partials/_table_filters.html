{% set is_alert_table = table_kind == 'alerts' %}
{% set indicator_id = 'alerts-table-loading-indicator' if is_alert_table else 'anomalies-table-loading-indicator' %}
<div class="border-b border-outline-default bg-surface-hover px-4 py-4 sm:px-5">
    <form id="{{ table_kind }}-table-filter-form"
          class="grid gap-3 sm:grid-cols-2 lg:items-end {{ 'lg:grid-cols-4' if is_alert_table else 'lg:grid-cols-3' }}"
          hx-get="{{ url_for(endpoint_name) }}"
          hx-trigger="change delay:120ms from:select, keyup changed delay:450ms from:input[name='search'], search from:input[name='search']"
          hx-target="{{ target_id }}"
          hx-swap="outerHTML settle:120ms"
          hx-push-url="false"
          hx-sync="{{ target_id }}:replace"
          hx-indicator="#{{ indicator_id }}"
          hx-on::before-request="window.dispatchEvent(new CustomEvent('kaori:alerts-collapse'))">
        <input type="hidden" name="cluster_id" value="{{ selected_cluster_id }}">
        <input type="hidden" name="source" value="{{ selected_source }}">
        <input type="hidden" name="alerts_per_page" value="{{ selected_alerts_per_page }}">
        <input type="hidden" name="anomalies_per_page" value="{{ selected_anomalies_per_page }}">
        <input type="hidden" name="page" value="1">

        <label class="block min-w-0">
            <span class="text-xs font-semibold text-content-muted">Severity</span>
            <select name="severity" class="mt-1 h-10 w-full rounded-md border border-outline-default bg-surface-card px-3 pr-9 text-sm text-content-primary outline-none transition-colors hover:border-outline-strong focus:border-kaori-primary focus:ring-2 focus:ring-kaori-soft">
                {% for option in severity_options %}
                    <option value="{{ option }}" {% if selected_severity == option %}selected{% endif %}>{{ option|title }}</option>
                {% endfor %}
            </select>
        </label>

        {% if is_alert_table %}
            <label class="block min-w-0">
                <span class="text-xs font-semibold text-content-muted">State</span>
                <select name="status" class="mt-1 h-10 w-full rounded-md border border-outline-default bg-surface-card px-3 pr-9 text-sm text-content-primary outline-none transition-colors hover:border-outline-strong focus:border-kaori-primary focus:ring-2 focus:ring-kaori-soft">
                    {% for option in status_options %}
                        <option value="{{ option }}" {% if selected_status == option %}selected{% endif %}>{{ option|title }}</option>
                    {% endfor %}
                </select>
            </label>
        {% else %}
            <input type="hidden" name="status" value="{{ selected_status }}">
        {% endif %}

        <label class="block min-w-0">
            <span class="text-xs font-semibold text-content-muted">Namespace</span>
            <select name="namespace" class="mt-1 h-10 w-full rounded-md border border-outline-default bg-surface-card px-3 pr-9 text-sm text-content-primary outline-none transition-colors hover:border-outline-strong focus:border-kaori-primary focus:ring-2 focus:ring-kaori-soft">
                <option value="" {% if not selected_namespace %}selected{% endif %}>All Namespaces</option>
                {% for namespace in namespace_options %}
                    <option value="{{ namespace }}" {% if selected_namespace == namespace %}selected{% endif %}>{{ namespace }}</option>
                {% endfor %}
            </select>
        </label>

        <label class="relative block min-w-0">
            <span class="text-xs font-semibold text-content-muted">Search</span>
            <i data-lucide="search" class="pointer-events-none absolute left-3 top-[35px] h-4 w-4 text-content-muted"></i>
            <input type="search" name="search" value="{{ selected_search }}" placeholder="{{ 'Search alert records...' if is_alert_table else 'Search anomaly candidates...' }}" class="mt-1 h-10 w-full rounded-md border border-outline-default bg-surface-card py-2 pl-10 pr-3 text-sm text-content-primary outline-none transition-colors placeholder:text-content-muted hover:border-outline-strong focus:border-kaori-primary focus:ring-2 focus:ring-kaori-soft">
        </label>
    </form>
</div>
