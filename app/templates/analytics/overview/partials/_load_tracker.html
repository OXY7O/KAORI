<div id="analytics-overview-load-tracker"
     class="hidden overflow-hidden rounded-xl border border-outline-default bg-surface-card px-4 py-3 shadow-sm sm:px-5"
     data-overview-load-tracker="true"
     data-overview-load-state="idle"
     role="status"
     aria-live="polite">
    <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex min-w-0 items-center gap-3">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-kaori-soft text-kaori-primary" aria-hidden="true">
                <i data-lucide="loader-circle" class="h-4 w-4 animate-spin"></i>
            </span>
            <div class="min-w-0">
                <p class="text-sm font-semibold text-content-primary" data-overview-load-title>Loading Analytics Overview</p>
                <p class="mt-0.5 text-xs leading-5 text-content-muted" data-overview-load-description>Preparing committed analytics snapshots.</p>
            </div>
        </div>
        <p class="shrink-0 text-xs font-semibold text-kaori-primary" data-overview-load-counter>0/0 Sections</p>
    </div>
    <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-kaori-soft" aria-hidden="true">
        <div class="relative h-full w-[4%] min-w-[4%] rounded-full bg-kaori-primary transition-[width] duration-300 ease-out"
             data-overview-load-progress>
            <span class="kaori-loading-bar-segment absolute inset-y-0 left-0 w-1/3 rounded-full bg-white/40"></span>
        </div>
    </div>
</div>
<script>
(function () {
    function overviewPage() {
        return document.getElementById('analytics-overview-page');
    }

    function trackerElement() {
        return document.getElementById('analytics-overview-load-tracker');
    }

    function lazySections() {
        var page = overviewPage();
        return page ? Array.from(page.querySelectorAll('[data-overview-lazy-section="true"]')) : [];
    }

    function requestElement(event) {
        return event.detail && event.detail.elt ? event.detail.elt : event.target;
    }

    function trackedSection(event) {
        var element = requestElement(event);
        return element && element.closest
            ? element.closest('[data-overview-lazy-section="true"]')
            : null;
    }

    function isOverviewRefresh(event) {
        var element = requestElement(event);
        return Boolean(element && element.closest && element.closest('[data-overview-refresh-request="true"]'));
    }

    function showTracker(mode) {
        var tracker = trackerElement();
        if (!tracker) return;

        tracker.classList.remove('hidden');
        tracker.dataset.overviewLoadState = mode || 'loading';
    }

    function updateTracker() {
        var tracker = trackerElement();
        var sections = lazySections();
        if (!tracker || !sections.length) return;

        var completed = sections.filter(function (section) {
            return section.dataset.overviewLoadState === 'loaded'
                || section.dataset.overviewLoadState === 'failed';
        }).length;
        var failed = sections.filter(function (section) {
            return section.dataset.overviewLoadState === 'failed';
        }).length;
        var total = sections.length;
        var percentage = Math.max(4, Math.round((completed / total) * 100));
        var title = tracker.querySelector('[data-overview-load-title]');
        var description = tracker.querySelector('[data-overview-load-description]');
        var counter = tracker.querySelector('[data-overview-load-counter]');
        var progress = tracker.querySelector('[data-overview-load-progress]');

        if (counter) counter.textContent = completed + '/' + total + ' Sections';
        if (progress) progress.style.width = percentage + '%';

        if (completed >= total) {
            tracker.dataset.overviewLoadState = failed ? 'completed-with-errors' : 'complete';
            if (title) title.textContent = failed ? 'Analytics Overview Loaded With Exceptions' : 'Analytics Overview Ready';
            if (description) {
                description.textContent = failed
                    ? failed + ' section' + (failed === 1 ? '' : 's') + ' could not be refreshed.'
                    : 'All committed Overview sections are available.';
            }
            window.setTimeout(function () {
                var current = trackerElement();
                if (current && ['complete', 'completed-with-errors'].includes(current.dataset.overviewLoadState)) {
                    current.classList.add('hidden');
                }
            }, failed ? 2600 : 1200);
            return;
        }

        showTracker('loading');
        if (title) title.textContent = 'Loading Analytics Overview';
        if (description) description.textContent = 'Preparing committed analytics snapshots.';
    }

    function initializeTracker() {
        var sections = lazySections();
        if (!sections.length || !trackerElement()) return;

        sections.forEach(function (section) {
            if (!section.dataset.overviewLoadState) {
                section.dataset.overviewLoadState = 'pending';
            }
        });
        updateTracker();
    }

    window.kaoriInitializeOverviewLoadTracker = initializeTracker;

    if (!window.kaoriOverviewLoadTrackerBound) {
        window.kaoriOverviewLoadTrackerBound = true;

        document.body.addEventListener('htmx:beforeRequest', function (event) {
            var section = trackedSection(event);
            if (section) {
                section.dataset.overviewLoadState = 'loading';
                showTracker('loading');
                updateTracker();
            } else if (isOverviewRefresh(event)) {
                var tracker = trackerElement();
                showTracker('refreshing');
                if (tracker) {
                    var title = tracker.querySelector('[data-overview-load-title]');
                    var description = tracker.querySelector('[data-overview-load-description]');
                    if (title) title.textContent = 'Refreshing Analytics Overview';
                    if (description) description.textContent = 'Applying the selected cluster and analysis window.';
                }
            }
        });

        document.body.addEventListener('htmx:afterSettle', function (event) {
            var section = trackedSection(event);
            if (section) {
                section.dataset.overviewLoadState = 'loaded';
                updateTracker();
            }

            var target = event.detail && event.detail.target ? event.detail.target : event.target;
            if (target && target.id === 'analytics-overview-page') {
                window.setTimeout(initializeTracker, 0);
            }
        });

        ['htmx:responseError', 'htmx:sendError', 'htmx:timeout'].forEach(function (eventName) {
            document.body.addEventListener(eventName, function (event) {
                var section = trackedSection(event);
                if (!section) return;
                section.dataset.overviewLoadState = 'failed';
                updateTracker();
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeTracker, { once: true });
    } else {
        initializeTracker();
    }
})();
</script>
