{% import "analytics/components/_analysis_surfaces.html" as analysis_surface %}
<div id="analytics-overview-load-tracker"
     class="hidden overflow-hidden rounded-xl border border-outline-default bg-surface-card px-4 py-3 shadow-sm sm:px-5"
     data-overview-load-tracker="true"
     data-overview-load-state="idle"
     role="status"
     aria-live="polite">
    <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex min-w-0 items-center gap-3">
            <span class="{{ analysis_surface.metric_icon_classes() }}" aria-hidden="true">
                <i data-lucide="loader-circle" class="h-4 w-4 animate-spin"></i>
            </span>
            <div class="min-w-0">
                <p class="text-sm font-semibold text-content-primary" data-overview-load-title>Loading Analytics Overview</p>
                <p class="mt-0.5 text-xs leading-5 text-content-secondary" data-overview-load-description>Preparing committed analytics snapshots.</p>
            </div>
        </div>
        <p class="shrink-0 text-xs font-semibold text-kaori-primary" data-overview-load-counter>0/0 Sections</p>
    </div>
    <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-kaori-soft" aria-hidden="true">
        <div class="relative h-full w-[4%] min-w-[4%] rounded-full bg-kaori-primary transition-[width] duration-300 ease-out"
             data-overview-load-progress>
            <span class="kaori-loading-bar-segment absolute inset-y-0 left-0 w-1/3 rounded-full bg-white/40"></span>
        </div>
    </div>
</div>
