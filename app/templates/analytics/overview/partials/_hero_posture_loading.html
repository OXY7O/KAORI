{% import "components/table_label.html" as table_label %}
<div class="flex h-full min-h-[12rem] flex-col rounded-xl border border-brand-outline bg-brand-surface-strong p-4 backdrop-blur-md">
    <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
            <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-brand-foreground-muted">Operational posture</p>
            <div class="mt-3 h-8 w-32 animate-pulse rounded-lg bg-brand-surface"></div>
            <div class="mt-3 h-3 w-52 animate-pulse rounded-md bg-brand-surface"></div>
        </div>
        {{ table_label.status_label('Checking', 'pending', 'loader-circle') }}
    </div>
    <div class="mt-auto grid grid-cols-2 gap-2 pt-4">
        <div class="rounded-lg border border-brand-outline bg-brand-surface px-3 py-3">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-brand-foreground-muted">Actionable</p>
            <div class="mt-2 h-6 w-10 animate-pulse rounded-md bg-brand-surface-strong"></div>
        </div>
        <div class="rounded-lg border border-brand-outline bg-brand-surface px-3 py-3">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-brand-foreground-muted">Active alerts</p>
            <div class="mt-2 h-6 w-10 animate-pulse rounded-md bg-brand-surface-strong"></div>
        </div>
    </div>
</div>
