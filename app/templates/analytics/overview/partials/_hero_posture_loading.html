<div class="overflow-hidden rounded-xl border border-brand-outline bg-brand-surface backdrop-blur-md">
    <div class="grid gap-px bg-brand-outline md:grid-cols-2 xl:grid-cols-6">
        <article class="bg-brand-surface-strong p-4 md:col-span-2 xl:col-span-2">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                    <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-brand-foreground-muted">Operational Posture</p>
                    <div class="mt-2 h-7 w-32 animate-pulse rounded-md bg-brand-surface"></div>
                </div>
                <div class="h-7 w-28 animate-pulse rounded-md bg-brand-surface"></div>
            </div>
            <div class="mt-3 h-4 w-full animate-pulse rounded bg-brand-surface"></div>
            <div class="mt-2 h-4 w-3/4 animate-pulse rounded bg-brand-surface"></div>
            <div class="mt-3 border-t border-brand-outline pt-3">
                <div class="h-4 w-2/3 animate-pulse rounded bg-brand-surface"></div>
            </div>
        </article>
        {% for _ in range(4) %}
            <article class="bg-brand-surface p-4">
                <div class="h-3 w-24 animate-pulse rounded bg-brand-surface-strong"></div>
                <div class="mt-3 h-6 w-16 animate-pulse rounded bg-brand-surface-strong"></div>
                <div class="mt-2 h-4 w-full animate-pulse rounded bg-brand-surface-strong"></div>
            </article>
        {% endfor %}
    </div>
</div>
