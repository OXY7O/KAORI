{% import "components/page_hero.html" as page_hero %}
{% import "components/table_label.html" as table_label %}
<div class="{{ page_hero.context_panel_classes() }}">
    <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
            <p class="{{ page_hero.context_panel_eyebrow_classes() }}">Operational Posture</p>
            <div class="mt-3 h-8 w-32 animate-pulse rounded-lg bg-brand-surface"></div>
        </div>
        {{ table_label.status_label('Checking', 'pending', 'loader-circle') }}
    </div>
    <div class="mt-auto grid grid-cols-2 gap-2 pt-4">
        <div class="{{ page_hero.context_metric_card_classes() }}">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-brand-foreground-muted">Actionable</p>
            <div class="mt-2 h-6 w-10 animate-pulse rounded-md bg-brand-surface-strong"></div>
            <div class="mt-1 h-4 w-28 animate-pulse rounded bg-brand-surface-strong"></div>
        </div>
        <div class="{{ page_hero.context_metric_card_classes() }}">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-brand-foreground-muted">Active Alerts</p>
            <div class="mt-2 h-6 w-10 animate-pulse rounded-md bg-brand-surface-strong"></div>
            <div class="mt-1 h-4 w-28 animate-pulse rounded bg-brand-surface-strong"></div>
        </div>
    </div>
    <div class="mt-3 flex min-h-10 w-full items-center gap-2.5 rounded-lg border border-brand-outline bg-brand-surface px-3 py-2.5">
        <div class="h-7 w-7 animate-pulse rounded-md bg-brand-surface-strong"></div>
        <div class="h-3 w-44 animate-pulse rounded-md bg-brand-surface-strong"></div>
    </div>
</div>
