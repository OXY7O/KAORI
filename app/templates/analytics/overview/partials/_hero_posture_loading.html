{% import "components/page_hero.html" as page_hero %}
{% import "components/table_label.html" as table_label %}
<div class="{{ page_hero.context_panel_classes() }}">
    <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
            <h2 class="text-base font-semibold leading-6 text-brand-foreground">Operational Posture</h2>
            <p class="mt-1 text-xs leading-5 text-brand-foreground-muted">Current cross-domain analytics state.</p>
        </div>
        {{ table_label.status_label('Checking', 'pending', 'loader-circle') }}
    </div>
    <div class="mt-auto grid grid-cols-2 gap-2 pt-4">
        <div class="{{ page_hero.context_metric_card_classes() }}">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-brand-foreground-muted">Actionable</p>
            <div class="mt-2 h-5 w-8 animate-pulse rounded-md bg-brand-surface-strong"></div>
            <div class="mt-1 h-4 w-28 animate-pulse rounded bg-brand-surface-strong"></div>
        </div>
        <div class="{{ page_hero.context_metric_card_classes() }}">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-brand-foreground-muted">Active Alerts</p>
            <div class="mt-2 h-5 w-8 animate-pulse rounded-md bg-brand-surface-strong"></div>
            <div class="mt-1 h-4 w-28 animate-pulse rounded bg-brand-surface-strong"></div>
        </div>
    </div>
    <a href="{{ url_for('integrations.kubernetes') }}" class="{{ page_hero.context_single_action_classes() }}">
        <i data-lucide="settings-2" class="h-4 w-4" aria-hidden="true"></i>
        Manage Clusters
    </a>
</div>
