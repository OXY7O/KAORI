<div class="overflow-hidden rounded-xl border border-white/20 bg-white/12 p-4 shadow-sm backdrop-blur-md lg:p-5">
    <div class="grid gap-4 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,0.8fr)] lg:items-start">
        <div class="min-w-0 rounded-xl border border-white/15 bg-white/10 p-4">
            <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-brand-foreground-muted">Operational Posture</p>
            <div class="mt-3 h-8 w-48 animate-pulse rounded-lg bg-white/20"></div>
            <div class="mt-4 h-5 w-full max-w-2xl animate-pulse rounded-md bg-white/15"></div>
            <div class="mt-1 h-5 w-3/4 animate-pulse rounded-md bg-white/15"></div>
            <div class="mt-4 grid gap-3 xl:grid-cols-3">
                {% for _ in range(3) %}
                    <div class="rounded-lg border border-white/15 bg-white/10 px-3 py-3">
                        <div class="h-3 w-24 animate-pulse rounded bg-white/20"></div>
                        <div class="mt-3 h-4 w-28 animate-pulse rounded bg-white/15"></div>
                        <div class="mt-2 h-4 w-full animate-pulse rounded bg-white/15"></div>
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="grid gap-3 sm:grid-cols-3 lg:grid-cols-1">
            {% for _ in range(3) %}
                <div class="rounded-lg border border-white/15 bg-white/10 px-3 py-3">
                    <div class="h-3 w-20 animate-pulse rounded bg-white/20"></div>
                    <div class="mt-3 h-5 w-20 animate-pulse rounded bg-white/15"></div>
                    <div class="mt-2 h-4 w-full animate-pulse rounded bg-white/15"></div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
