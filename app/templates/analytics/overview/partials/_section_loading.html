<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <div class="flex items-start justify-between gap-4">
        <div class="space-y-3">
            <div class="h-4 w-44 animate-pulse rounded-full bg-slate-200 dark:bg-slate-700"></div>
            <div class="h-3 w-72 animate-pulse rounded-full bg-slate-100 dark:bg-slate-800"></div>
        </div>
        <div class="h-9 w-9 animate-pulse rounded-xl bg-slate-100 dark:bg-slate-800"></div>
    </div>
    <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">
        {% for _ in range(4) %}
            <div class="h-24 animate-pulse rounded-xl bg-slate-100 dark:bg-slate-800"></div>
        {% endfor %}
    </div>
</section>
