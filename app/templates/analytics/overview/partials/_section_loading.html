<section class="rounded-xl border border-outline-default bg-surface-card p-5 shadow-sm">
    <div class="flex items-start justify-between gap-4">
        <div class="space-y-3">
            <div class="h-4 w-44 animate-pulse rounded-md bg-surface-hover"></div>
            <div class="h-3 w-72 animate-pulse rounded-md bg-kaori-soft"></div>
        </div>
        <div class="h-9 w-9 animate-pulse rounded-lg bg-kaori-soft"></div>
    </div>
    <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">
        {% for _ in range(4) %}
            <div class="h-24 animate-pulse rounded-lg bg-surface-hover"></div>
        {% endfor %}
    </div>
</section>
