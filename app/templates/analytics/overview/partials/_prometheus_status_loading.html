{% import "components/table_label.html" as table_label %}
<section class="rounded-lg border border-outline-default bg-kaori-soft px-4 py-3">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex min-w-0 items-center gap-3">
            <span class="h-2.5 w-2.5 shrink-0 animate-pulse rounded-full bg-status-pending"></span>
            <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">
                    <h2 class="text-sm font-semibold text-content-primary">Prometheus Status</h2>
                    {{ table_label.status_label('Checking', 'pending', 'loader-circle') }}
                </div>
                <p class="mt-1 truncate text-xs text-content-muted">Checking selected cluster Prometheus connection...</p>
            </div>
        </div>
        <div class="h-6 w-32 animate-pulse rounded-md bg-surface-hover"></div>
    </div>
</section>
