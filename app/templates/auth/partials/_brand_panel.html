<aside class="kaori-brand-panel">

        <span class="kaori-node kaori-node--one"></span>
        <span class="kaori-node kaori-node--two"></span>
        <span class="kaori-node kaori-node--three"></span>
        <span class="kaori-node kaori-node--four"></span>
        <span class="kaori-network-line kaori-network-line--one"></span>
        <span class="kaori-network-line kaori-network-line--two"></span>
        <span class="kaori-network-line kaori-network-line--three"></span>

    <div class="kaori-brand-content">

    <div class="kaori-brand-footnote">
