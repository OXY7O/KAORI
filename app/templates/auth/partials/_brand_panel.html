<aside class="relative hidden min-h-full overflow-hidden bg-gradient-to-br from-kaori-primary-dark via-kaori-primary to-kaori-accent p-6 text-white lg:col-span-5 lg:flex lg:flex-col xl:p-7">
    <div class="pointer-events-none absolute inset-0" aria-hidden="true">
        <div class="absolute -right-24 -top-24 h-72 w-72 rounded-full border border-white/10"></div>
        <div class="absolute -right-8 top-16 h-48 w-48 rounded-full border border-white/10"></div>
        <div class="absolute -bottom-28 -left-20 h-80 w-80 rounded-full bg-white/5 blur-2xl"></div>
        <div class="absolute right-8 top-10 grid grid-cols-5 gap-2 opacity-20">
            {% for _ in range(20) %}<span class="h-1 w-1 rounded-full bg-white"></span>{% endfor %}
        </div>
    </div>

    <div class="relative z-10 flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl border border-white/20 bg-white/10 shadow-lg shadow-violet-950/20 backdrop-blur">
            <img src="{{ url_for('static', filename='images/kaori-logo.svg') }}"
                 alt=""
                 class="h-6 w-6 brightness-0 invert" />
        </span>
        <span class="text-lg font-extrabold tracking-widest">KAORI</span>
    </div>

    <div class="relative z-10 mt-5">
        <p class="text-xs font-semibold uppercase tracking-widest text-violet-100">Infrastructure Operations</p>
        <h1 class="mt-2 max-w-sm text-2xl font-extrabold leading-tight tracking-tight xl:text-3xl">
            Operate with clarity.
        </h1>
        <p class="mt-2 text-sm text-violet-100">Unified visibility. Controlled operations.</p>
    </div>

    <div class="relative z-10 mt-3 flex flex-1 items-center justify-center">
        {% include "auth/partials/_feature_cards.html" %}
    </div>
</aside>
