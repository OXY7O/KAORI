<aside class="relative hidden min-h-full overflow-hidden bg-surface-sidebar p-6 text-brand-foreground lg:col-span-5 lg:flex lg:flex-col xl:p-7">
    <div class="pointer-events-none absolute inset-0" aria-hidden="true">
        <div class="absolute -right-28 -top-28 h-80 w-80 rounded-full border border-brand-outline"></div>
        <div class="absolute -right-10 top-12 h-52 w-52 rounded-full border border-brand-outline"></div>
        <div class="absolute -bottom-28 -left-20 h-80 w-80 rounded-full bg-kaori-primary/25 blur-3xl"></div>
        <div class="absolute left-1/3 top-1/3 h-56 w-56 rounded-full bg-kaori-accent/10 blur-3xl"></div>
        <div class="absolute right-8 top-10 grid grid-cols-5 gap-2 opacity-20">
            {% for _ in range(20) %}<span class="h-1 w-1 rounded-full bg-brand-foreground"></span>{% endfor %}
        </div>
    </div>

    <div class="relative z-10 flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl border border-brand-outline bg-brand-surface-strong shadow-lg shadow-black/20 backdrop-blur">
            <img src="{{ url_for('static', filename='images/kaori-logo.svg') }}"
                 alt=""
                 class="h-6 w-6 brightness-0 invert" />
        </span>
        <span class="text-lg font-extrabold tracking-widest">KAORI</span>
    </div>

    <div class="relative z-10 mt-5">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-kaori-accent">Infrastructure Operations</p>
        <h1 class="mt-2 max-w-sm text-2xl font-extrabold leading-tight tracking-tight xl:text-3xl">
            Operate With <span class="text-kaori-accent">Clarity</span>
        </h1>
        <p class="mt-2 max-w-sm text-xs leading-5 text-brand-foreground-muted">
           Knowledge, Automation, Operations, Resilience & Intelligence
        </p>
    </div>

    <div class="relative z-10 mt-4 flex min-h-0 flex-1 items-center justify-center">
        {% include "auth/partials/_feature_cards.html" %}
    </div>
</aside>
