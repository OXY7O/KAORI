{% extends "layouts/auth.html" %}
{% block title %}Sign In · KAORI{% endblock title %}
{% block content %}
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden bg-surface-page px-3 py-3 sm:px-5 sm:py-4 lg:px-6 lg:py-5">
        <div class="pointer-events-none absolute inset-0 overflow-hidden"
             aria-hidden="true">
            <div class="absolute -left-24 -top-24 h-72 w-72 rounded-full bg-kaori-soft opacity-80 blur-3xl"></div>
            <div class="absolute -bottom-32 -right-20 h-96 w-96 rounded-full bg-kaori-soft opacity-70 blur-3xl"></div>
            <div class="absolute right-12 top-10 grid grid-cols-6 gap-2 opacity-30">
                {% for _ in range(24) %}<span class="h-1 w-1 rounded-full bg-kaori-accent"></span>{% endfor %}
            </div>
            <div class="absolute bottom-10 left-12 grid grid-cols-5 gap-2 opacity-20">
                {% for _ in range(20) %}<span class="h-1 w-1 rounded-full bg-kaori-primary"></span>{% endfor %}
            </div>
        </div>
        <section class="kaori-login-shell relative z-10 grid overflow-hidden rounded-2xl border border-outline-default bg-surface-card shadow-xl shadow-black/10 lg:grid-cols-12 dark:shadow-black/40"
                 aria-label="KAORI sign in">
            {% include "auth/partials/_brand_panel.html" %}
            {% include "auth/partials/_login_form.html" %}
        </section>
    </main>
{% endblock content %}
