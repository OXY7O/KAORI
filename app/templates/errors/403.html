{% extends "layouts/app.html" %}
{% block title %}Access Denied{% endblock title %}
{% block dashboard_content %}
    <div class="mx-auto max-w-2xl rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-950">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-50 text-amber-600 dark:bg-amber-950/40 dark:text-amber-300">
            <i data-lucide="shield-alert" class="h-7 w-7"></i>
        </div>
        <h1 class="mt-4 text-2xl font-extrabold text-slate-950 dark:text-white">Access denied</h1>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Your role does not include the permission required to open this workspace or perform this action.</p>
        <a href="{{ url_for('dashboard.index') }}"
           class="mt-6 inline-flex rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-500">Back to Dashboard</a>
    </div>
{% endblock dashboard_content %}
