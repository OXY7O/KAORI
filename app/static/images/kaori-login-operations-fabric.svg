<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">KAORI Operations Fabric</title>
  <desc id="desc">Abstract infrastructure operations fabric with connected systems, evidence paths, and a governed operational core.</desc>
  <defs>
    <linearGradient id="fabric-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171124" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#21143A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#120F1B" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="fabric-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C4B5FD" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="small-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
