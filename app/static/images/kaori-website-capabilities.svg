<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img" aria-labelledby="title description">
  <title id="title">KAORI connected infrastructure operations</title>
  <desc id="description">Visibility, Control, Intelligence and Assurance connect to KAORI as a single operational context.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120e22"/><stop offset=".52" stop-color="#241544"/><stop offset="1" stop-color="#110e20"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302051" stop-opacity=".98"/><stop offset="1" stop-color="#18132c" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3d8ff"/><stop offset=".45" stop-color="#a974ff"/><stop offset="1" stop-color="#6530d2"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#7634e3" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#6427ce" stop-opacity=".09"/>
      <stop offset="1" stop-color="#6427ce" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" stroke="#b79ce8" stroke-opacity=".036" fill="none"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="600" rx="24" fill="url(#background)"/>
  <rect width="920" height="600" rx="24" fill="url(#grid)"/>
  <ellipse cx="460" cy="300" rx="300" ry="265" fill="url(#aura)"/>
  <g fill="#7d40e2" fill-opacity=".12">
    <rect x="322" y="186" width="128" height="135" rx="30"/>
    <rect x="470" y="186" width="128" height="135" rx="30"/>
    <rect x="322" y="323" width="128" height="130" rx="30"/>
    <rect x="470" y="323" width="128" height="130" rx="30"/>
    <rect x="50" y="410" width="96" height="120" rx="26"/>
    <rect x="784" y="88" width="96" height="122" rx="26"/>
  </g>
  <g stroke="#b18aff" stroke-opacity=".88" stroke-width="1.8" fill="none">
