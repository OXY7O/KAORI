  <text x="460" y="364" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="27" letter-spacing="5" font-weight="800" fill="#fff">KAORI</text>
  <text x="460" y="390" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12.5" fill="#d1c2e8">Connected operational context</text>
