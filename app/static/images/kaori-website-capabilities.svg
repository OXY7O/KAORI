    <rect x="58" y="383" width="267" height="118" rx="20"/>
    <rect x="595" y="383" width="267" height="118" rx="20"/>
  </g>
  <g fill="#5e31ba" stroke="#9e71ef" stroke-opacity=".38">
    <rect x="83" y="134" width="62" height="62" rx="12"/>
    <rect x="620" y="134" width="62" height="62" rx="12"/>
    <rect x="83" y="413" width="62" height="62" rx="12"/>
    <rect x="620" y="413" width="62" height="62" rx="12"/>
  </g>
