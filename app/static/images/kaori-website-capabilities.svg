    <path d="M595 163h-33q-24 0-24 24v78h-26"/>
    <path d="M325 442h33q24 0 24-24v-80h26"/>
    <path d="M595 442h-33q-24 0-24-24v-80h-26"/>
  </g>
  <g fill="#d5b6ff" filter="url(#glow)">
