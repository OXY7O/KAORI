      <text x="696" y="160">Control</text>
      <text x="159" y="439">Intelligence</text>
      <text x="696" y="439">Assurance</text>
    </g>
    <g fill="#c5b7de" font-size="14">
      <text x="159" y="184">Infrastructure context</text>
      <text x="696" y="184">Governed workflows</text>
      <text x="159" y="463">Connected evidence</text>
      <text x="696" y="463">Traceable operations</text>
    </g>
  </g>
  <rect x="375" y="228" width="170" height="200" rx="28" fill="#3d1b7d" opacity=".17" filter="url(#glow)"/>
  <rect x="365" y="212" width="190" height="206" rx="26" fill="url(#panel)" stroke="#b18aff" stroke-width="2"/>
  <g filter="url(#glow)">
    <rect x="419" y="248" width="36" height="37" rx="8" fill="#e4d6ff"/>
    <rect x="461" y="248" width="36" height="37" rx="8" fill="#7938ee"/>
    <rect x="419" y="292" width="36" height="37" rx="8" fill="#7938ee"/>
    <rect x="461" y="292" width="36" height="37" rx="8" fill="#6930d7"/>
