    <path d="M633 154h34m-34 12h34m-34 12h34"/>
    <circle cx="642" cy="154" r="4" fill="#6530d2"/><circle cx="657" cy="166" r="4" fill="#6530d2"/><circle cx="646" cy="178" r="4" fill="#6530d2"/>
    <path d="M97 445c-4-9 4-16 11-13 4-12 19-11 23-1 10-1 14 12 6 17 3 9-7 16-14 10-6 10-19 5-19-5-7 2-12-2-7-8Z"/>
