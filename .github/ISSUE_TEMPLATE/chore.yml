name: Chore
description: Track KAORI maintenance or administrative work without a product behavior change.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Use a concise sentence-case title that describes the maintenance outcome. Native GitHub Issue Type is the type authority; do not add `[CHORE]` to the title.
  - type: input
    id: parent
    attributes:
      label: Parent Work Item
      description: Reference the governing Epic, Story, Task, or maintenance initiative when applicable.
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Describe the maintenance or administrative outcome.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Explain why this work is needed and what risk or burden it removes.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion Criteria
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security / Data / Operational Impact
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Define the evidence required before this Chore is considered complete.
    validations:
      required: true
  - type: textarea
    id: uat
    attributes:
      label: UAT Evidence
      description: Record staging UAT evidence when the Chore affects application/runtime behavior.
