services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kaori_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaori_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ci:
    build:
      context: ../..
      dockerfile: .github/ci/Dockerfile
    image: ${KAORI_CI_TOOLCHAIN_IMAGE:-kaori-ci-toolchain:local}
    working_dir: /workspace
    user: "${CI_UID:-1000}:${CI_GID:-1000}"
    command: ["sleep", "infinity"]
    volumes:
      - ../..:/workspace
    environment: &ci_environment
      HOME: /tmp
      APP_ENV: testing
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kaori_test
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kaori_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      TEST_SECRET_KEY: kaori-ci-test-key
      SECRET_KEY: kaori-ci-test-secret
      INTEGRATION_CREDENTIAL_KEY: REREREREREREREREREREREREREREREREREREREREREQ=
      REPORTS_CELERY_QUEUE: reports

  ci-reports-worker:
    image: ${KAORI_CI_TOOLCHAIN_IMAGE:-kaori-ci-toolchain:local}
    working_dir: /workspace
    user: "${CI_UID:-1000}:${CI_GID:-1000}"
    volumes:
      - ../..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *ci_environment
    command:
      - celery
      - -A
      - celery_worker.celery_app
      - worker
      - --loglevel=WARNING
      - --queues=reports
      - --hostname=reports-source-ci@%h
      - --without-gossip
      - --without-mingle
      - --without-heartbeat

  runtime:
    image: ${KAORI_RUNTIME_IMAGE:-kaori:ci-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &runtime_environment
      APP_ENV: production
      APP_VERSION: ${KAORI_RUNTIME_APP_VERSION:-0.0.0}
      APP_BUILD_SHA: ${KAORI_RUNTIME_BUILD_SHA:-ci-local}
      APP_BUILD_DATE: ${KAORI_RUNTIME_BUILD_DATE:-1970-01-01T00:00:00Z}
      SECRET_KEY: kaori-ci-runtime-secret
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kaori_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      INTEGRATION_CREDENTIAL_KEY: REREREREREREREREREREREREREREREREREREREREREQ=
      TRUSTED_HOSTS: runtime,localhost,127.0.0.1
      PROXY_FIX_ENABLED: "false"
      WAIT_FOR_DB: "true"
      REPORTS_CELERY_QUEUE: reports
      DATA_LIFECYCLE_SCHEDULER_ENABLED: "false"
      JOB_POLICY_SCHEDULER_ENABLED: "false"
      INTEGRATION_RUNTIME_MONITORING_ENABLED: "false"
      AUTOMATION_CANDIDATE_MATERIALIZATION_ENABLED: "false"
      AUTOMATION_LIFECYCLE_RECONCILIATION_ENABLED: "false"
      RESOLVER_MAINTENANCE_ENABLED: "false"
      REPORT_STORAGE_HEALTH_MONITOR_ENABLED: "false"

  runtime-reports-worker:
    image: ${KAORI_RUNTIME_IMAGE:-kaori:ci-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *runtime_environment
    command:
      - celery
      - -A
      - celery_worker.celery_app
      - worker
      - --loglevel=WARNING
      - --queues=reports
      - --hostname=reports-image-ci@%h
      - --without-gossip
      - --without-mingle
      - --without-heartbeat

  zap:
    image: ${KAORI_ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:2.17.0}
    profiles: ["dast"]
    volumes:
      - ../../tmp/ci-artifacts/zap:/zap/wrk
