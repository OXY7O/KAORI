name: KAORI Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - kaori/rc-request

permissions:
  contents: read
  actions: read

concurrency:
  group: kaori-release-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY_HOST: ${{ vars.KAORI_DOCKER_REGISTRY_HOST }}
  REGISTRY_IMAGE: ${{ vars.KAORI_DOCKER_REGISTRY_IMAGE }}

jobs:
  wait-for-quality:
    name: Staging Gate
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/kaori/rc-request') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/kaori/staging') }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 120
    outputs:
      accepted_sha: ${{ steps.staging.outputs.accepted_sha }}
      quality_run_id: ${{ steps.quality.outputs.quality_run_id }}
      conclusion: ${{ steps.quality.outputs.conclusion }}
      should_publish: ${{ steps.candidate.outputs.should_publish }}
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
      candidate_image: ${{ steps.candidate.outputs.candidate_image }}
      compare_base: ${{ steps.candidate.outputs.compare_base }}
    steps:
      - name: Resolve Exact Accepted Staging SHA
        id: staging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/kaori/staging"
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          ACCEPTED_SHA="$(jq -r '.object.sha' <<<"$response")"
          [[ "$ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'Unable to resolve current kaori/staging SHA.\n' >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/kaori/rc-request' ]] || {
              printf 'Push-based RC cuts are allowed only from kaori/rc-request.\n' >&2
              exit 1
            }
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/kaori/staging' ]] || {
              printf 'Manual RC cuts must be dispatched against kaori/staging.\n' >&2
              exit 1
            }
          else
            printf 'Unsupported RC cut event: %s\n' "$GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          [[ "$GITHUB_SHA" == "$ACCEPTED_SHA" ]] || {
            printf 'RC request SHA %s is stale; current kaori/staging is %s.\n' \
              "$GITHUB_SHA" "$ACCEPTED_SHA" >&2
            exit 1
          }

          printf 'accepted_sha=%s\n' "$ACCEPTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'ACCEPTED_SHA=%s\n' "$ACCEPTED_SHA" >> "$GITHUB_ENV"
          printf 'Accepted staging authority: %s\n' "$ACCEPTED_SHA"

      - name: Require Exact Successful KAORI CI
        id: quality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          deadline=$(( $(date +%s) + 6900 ))
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?branch=kaori%2Fstaging&event=push&per_page=100"

          while (( $(date +%s) < deadline )); do
            response="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            record="$(jq -c --arg sha "$ACCEPTED_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | last // empty' \
              <<<"$response")"

            if [[ -z "$record" ]]; then
              printf 'Waiting for quality.yml run for %s\n' "$ACCEPTED_SHA"
              sleep 10
              continue
            fi

            status="$(jq -r '.status' <<<"$record")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$record")"
            quality_run_id="$(jq -r '.id' <<<"$record")"
            printf 'quality.yml run=%s status=%s conclusion=%s sha=%s\n' \
              "$quality_run_id" "$status" "${conclusion:-pending}" "$ACCEPTED_SHA"

            if [[ "$status" != 'completed' ]]; then
              sleep 15
              continue
            fi

            [[ "$conclusion" == 'success' ]] || {
              printf 'Exact KAORI CI did not pass for %s: %s\n' \
                "$ACCEPTED_SHA" "$conclusion" >&2
              exit 1
            }

            {
              printf 'quality_run_id=%s\n' "$quality_run_id"
              printf 'conclusion=%s\n' "$conclusion"
            } >> "$GITHUB_OUTPUT"
            exit 0
          done

          printf 'Timed out waiting for exact quality.yml success for %s\n' "$ACCEPTED_SHA" >&2
          exit 1

      - name: Validate Registry Identity
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${REGISTRY_HOST:?Missing repository variable KAORI_DOCKER_REGISTRY_HOST}"
          : "${REGISTRY_IMAGE:?Missing repository variable KAORI_DOCKER_REGISTRY_IMAGE}"
          [[ "$REGISTRY_IMAGE" == "$REGISTRY_HOST/"* ]] || {
            printf 'KAORI_DOCKER_REGISTRY_IMAGE must be rooted at KAORI_DOCKER_REGISTRY_HOST\n' >&2
            exit 1
          }

      - name: Check Out Exact Accepted Staging SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.staging.outputs.accepted_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve Intentional SemVer Candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          INITIAL_VERSION='0.1.0'
          api_root="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          existing_rc="$(
            git tag --points-at "$ACCEPTED_SHA" |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' |
              sort -V |
              head -n 1 || true
          )"
          if [[ -n "$existing_rc" ]]; then
            release_file="$(mktemp)"
            if ! release_status="$(curl --silent --show-error \
              --output "$release_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api_root}/releases/tags/${existing_rc}")"; then
              printf 'Unable to query GitHub prerelease evidence for reserved RC %s.\n' \
                "$existing_rc" >&2
              rm -f "$release_file"
              exit 1
            fi

            if [[ "$release_status" == '404' ]]; then
              printf 'Reserved RC tag has no GitHub prerelease; its number remains consumed. tag=%s sha=%s\n' \
                "$existing_rc" "$ACCEPTED_SHA"
            elif [[ "$release_status" =~ ^2[0-9][0-9]$ ]]; then
              release_json="$(cat "$release_file")"
              [[ "$(jq -r '.prerelease' <<<"$release_json")" == 'true' ]] || {
                printf 'Existing RC %s is not recorded as a GitHub prerelease.\n' "$existing_rc" >&2
                rm -f "$release_file"
                exit 1
              }
              existing_image="$REGISTRY_IMAGE:$existing_rc"
              {
                printf 'should_publish=false\n'
                printf 'candidate_tag=%s\n' "$existing_rc"
                printf 'candidate_image=%s\n' "$existing_image"
                printf 'compare_base=%s\n' "$existing_rc"
              } >> "$GITHUB_OUTPUT"
              printf 'Accepted source %s already owns %s; no new RC will be consumed.\n' \
                "$ACCEPTED_SHA" "$existing_rc"
              rm -f "$release_file"
              exit 0
            else
              printf 'GitHub prerelease evidence lookup failed for %s with HTTP %s.\n' \
                "$existing_rc" "$release_status" >&2
              cat "$release_file" >&2 || true
              rm -f "$release_file"
              exit 1
            fi
            rm -f "$release_file"
          fi

          latest_stable_tag="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"

          if [[ -z "$latest_stable_tag" ]]; then
            NEXT_VERSION="$INITIAL_VERSION"
            printf 'No stable KAORI tag exists; bootstrap release train is %s\n' "$NEXT_VERSION"
          else
            version="${latest_stable_tag#v}"
            IFS='.' read -r major minor patch <<<"$version"
            range="${latest_stable_tag}..${ACCEPTED_SHA}"
            subjects="$(git log --format='%s' "$range")"
            bodies="$(git log --format='%b' "$range")"

            if grep -Eq '^[[:alnum:]_-]+(\([^)]*\))?!:' <<<"$subjects" || \
              grep -Eq '^BREAKING CHANGE:' <<<"$bodies"; then
              major=$((major + 1))
              minor=0
              patch=0
            elif grep -Eq '^feat(\([^)]*\))?:' <<<"$subjects"; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            NEXT_VERSION="${major}.${minor}.${patch}"
          fi

          previous_rc="$(
            git tag --list "v${NEXT_VERSION}-rc.*" --sort=-version:refname |
              head -n 1 || true
          )"
          latest_rc=0
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            rc="${tag##*.}"
            if [[ "$rc" =~ ^[0-9]+$ ]] && (( rc > latest_rc )); then
              latest_rc="$rc"
            fi
          done < <(git tag --list "v${NEXT_VERSION}-rc.*" --sort=version:refname)
          NEXT_RC=$((latest_rc + 1))
          CANDIDATE_TAG="v${NEXT_VERSION}-rc.${NEXT_RC}"
          CANDIDATE_IMAGE="$REGISTRY_IMAGE:$CANDIDATE_TAG"
          compare_base="${previous_rc:-$latest_stable_tag}"
          {
            printf 'should_publish=true\n'
            printf 'next_version=%s\n' "$NEXT_VERSION"
            printf 'next_rc=%s\n' "$NEXT_RC"
            printf 'candidate_tag=%s\n' "$CANDIDATE_TAG"
            printf 'candidate_image=%s\n' "$CANDIDATE_IMAGE"
            printf 'compare_base=%s\n' "$compare_base"
          } >> "$GITHUB_OUTPUT"
          printf 'Resolved intentional KAORI RC: %s at %s\n' \
            "$CANDIDATE_TAG" "$ACCEPTED_SHA"

  publish:
    name: Publish RC
    needs: wait-for-quality
    if: ${{ needs.wait-for-quality.outputs.should_publish == 'true' }}
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      ACCEPTED_SHA: ${{ needs.wait-for-quality.outputs.accepted_sha }}
      QUALITY_RUN_ID: ${{ needs.wait-for-quality.outputs.quality_run_id }}
      CANDIDATE_TAG: ${{ needs.wait-for-quality.outputs.candidate_tag }}
      CANDIDATE_IMAGE: ${{ needs.wait-for-quality.outputs.candidate_image }}
      COMPARE_BASE: ${{ needs.wait-for-quality.outputs.compare_base }}
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.3
    steps:
      - name: Check Out Accepted Staging Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.wait-for-quality.outputs.accepted_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Registry Identity
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${REGISTRY_HOST:?Missing repository variable KAORI_DOCKER_REGISTRY_HOST}"
          : "${REGISTRY_IMAGE:?Missing repository variable KAORI_DOCKER_REGISTRY_IMAGE}"
          [[ "$REGISTRY_IMAGE" == "$REGISTRY_HOST/"* ]] || {
            printf 'KAORI_DOCKER_REGISTRY_IMAGE must be rooted at KAORI_DOCKER_REGISTRY_HOST\n' >&2
            exit 1
          }

      - name: Resolve CI Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$(cat .github/ci/Dockerfile .github/ci/requirements-security.txt requirements/base.txt requirements/dev.txt | sha256sum | cut -c1-20)"
          image="kaori-ci-toolchain:$key"
          docker image inspect "$image" >/dev/null 2>&1 || \
            docker build --file .github/ci/Dockerfile --tag "$image" .
          printf 'CI_TOOLCHAIN_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Resolve OCI Build Metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          OCI_CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'OCI_CREATED=%s\n' "$OCI_CREATED" >> "$GITHUB_ENV"

      - name: Build Exact Candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --target production \
            --build-arg OCI_SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg OCI_REVISION="$ACCEPTED_SHA" \
            --build-arg OCI_VERSION="$CANDIDATE_TAG" \
            --build-arg OCI_CREATED="$OCI_CREATED" \
            --build-arg OCI_TITLE="KAORI" \
            --build-arg OCI_DESCRIPTION="Knowledge, Automation, Operations, Resilience & Intelligence" \
            --build-arg OCI_DOCUMENTATION="https://github.com/${GITHUB_REPOSITORY}#readme" \
            --build-arg OCI_LICENSES="LicenseRef-KAORI-Internal-Use" \
            --tag "$CANDIDATE_IMAGE" \
            .

      - name: Scan Exact Candidate
        run: >-
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock
          --volume kaori-trivy-cache:/root/.cache/trivy "$CI_TOOLCHAIN_IMAGE"
          trivy image --cache-dir /root/.cache/trivy --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --scanners vuln "$CANDIDATE_IMAGE"

      - name: Validate Exact Candidate Runtime and DAST
        run: bash .github/ci/run-runtime-validation.sh "$CANDIDATE_IMAGE"

      - name: Reserve RC Git Tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          payload="$(cat <<EOF_JSON
          {"ref": "refs/tags/${CANDIDATE_TAG}", "sha": "${ACCEPTED_SHA}"}
          EOF_JSON
          )"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "${repo_api}/git/refs")"
          [[ "$(jq -r '.ref' <<<"$response")" == "refs/tags/${CANDIDATE_TAG}" ]] || {
            printf 'GitHub did not reserve expected RC ref refs/tags/%s.\n' "$CANDIDATE_TAG" >&2
            exit 1
          }
          [[ "$(jq -r '.object.sha' <<<"$response")" == "$ACCEPTED_SHA" ]] || {
            printf 'Reserved RC tag %s does not target accepted SHA %s.\n' \
              "$CANDIDATE_TAG" "$ACCEPTED_SHA" >&2
            exit 1
          }
          printf 'Reserved RC tag %s -> %s before registry mutation.\n' \
            "$CANDIDATE_TAG" "$ACCEPTED_SHA"

      - name: Log In to Docker Registry
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.KAORI_DOCKER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.KAORI_DOCKER_REGISTRY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          : "${REGISTRY_USERNAME:?Missing repository secret KAORI_DOCKER_REGISTRY_USERNAME}"
          : "${REGISTRY_PASSWORD:?Missing repository secret KAORI_DOCKER_REGISTRY_PASSWORD}"
          printf '%s' "$REGISTRY_PASSWORD" | \
            docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Refuse Existing Registry Tag
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          manifest_output="$(docker manifest inspect "$CANDIDATE_IMAGE" 2>&1)"
          manifest_status=$?
          set -e
          if (( manifest_status == 0 )); then
            printf 'Registry tag already exists and will not be overwritten: %s\n' \
              "$CANDIDATE_IMAGE" >&2
            exit 1
          fi
          if ! grep -Eqi 'no such manifest|manifest unknown|not found' <<<"$manifest_output"; then
            printf 'Unable to prove registry tag is unused: %s\n' "$CANDIDATE_IMAGE" >&2
            printf '%s\n' "$manifest_output" >&2
            exit 1
          fi
          printf 'Registry tag is unused and eligible for first publication: %s\n' \
            "$CANDIDATE_IMAGE"

      - name: Push Exact Candidate
        run: docker push "$CANDIDATE_IMAGE"

      - name: Pull Published Candidate
        run: docker pull "$CANDIDATE_IMAGE"

      - name: Record Immutable Digest Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE_IMAGE")"
          digest="${digest_ref#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf 'Registry did not return a valid immutable digest: %s\n' "$digest" >&2
            exit 1
          }
          image_ref="$REGISTRY_IMAGE@$digest"
          {
            printf 'KAORI_IMAGE_NAME=%s\n' "$REGISTRY_IMAGE"
            printf 'KAORI_SOURCE_SHA=%s\n' "$ACCEPTED_SHA"
            printf 'KAORI_CANDIDATE_TAG=%s\n' "$CANDIDATE_TAG"
            printf 'KAORI_IMAGE_DIGEST=%s\n' "$digest"
            printf 'KAORI_IMAGE_REF=%s\n' "$image_ref"
          } > staging-image.env
          {
            printf 'KAORI_IMAGE_DIGEST=%s\n' "$digest"
            printf 'KAORI_IMAGE_REF=%s\n' "$image_ref"
          } >> "$GITHUB_ENV"
          cat staging-image.env

      - name: Verify Published Candidate OCI Metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          bash .github/ci/release-lib.sh verify-labels "$KAORI_IMAGE_REF" "$CANDIDATE_TAG" "$ACCEPTED_SHA"

      - name: Generate RC Supply Chain Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume kaori-trivy-cache:/root/.cache/trivy \
            --volume "$PWD:/workspace" \
            "$CI_TOOLCHAIN_IMAGE" \
            trivy image \
              --cache-dir /root/.cache/trivy \
              --format spdx-json \
              --output /workspace/kaori-sbom.spdx.json \
              "$KAORI_IMAGE_REF"

          finished_on="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          build_type="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-staging-image.yml"
          builder_id="${build_type}@${GITHUB_REF}"
          source_uri="git+https://github.com/${GITHUB_REPOSITORY}.git"
          invocation_id="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg build_type "$build_type" \
            --arg builder_id "$builder_id" \
            --arg source_uri "$source_uri" \
            --arg source_sha "$ACCEPTED_SHA" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg invocation_id "$invocation_id" \
            --arg started_on "$OCI_CREATED" \
            --arg finished_on "$finished_on" \
            '{
              buildDefinition: {
                buildType: $build_type,
                externalParameters: {
                  candidateTag: $candidate_tag,
                  target: "production"
                },
                systemParameters: {
                  runner: "self-hosted",
                  platform: "linux/amd64"
                },
                resolvedDependencies: [
                  {
                    uri: $source_uri,
                    digest: {gitCommit: $source_sha}
                  }
                ]
              },
              runDetails: {
                builder: {id: $builder_id},
                metadata: {
                  invocationId: $invocation_id,
                  startedOn: $started_on,
                  finishedOn: $finished_on
                }
              }
            }' > kaori-provenance.json

          sbom_sha="sha256:$(sha256sum kaori-sbom.spdx.json | awk '{print $1}')"
          provenance_sha="sha256:$(sha256sum kaori-provenance.json | awk '{print $1}')"
          {
            printf 'KAORI_SBOM_SHA256=%s\n' "$sbom_sha"
            printf 'KAORI_PROVENANCE_SHA256=%s\n' "$provenance_sha"
          } >> staging-image.env
          {
            printf 'KAORI_SBOM_SHA256=%s\n' "$sbom_sha"
            printf 'KAORI_PROVENANCE_SHA256=%s\n' "$provenance_sha"
          } >> "$GITHUB_ENV"

      - name: Attest RC Supply Chain Evidence with GitHub OIDC
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user 0:0 \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env DOCKER_CONFIG=/root/.docker \
            --volume "$HOME/.docker:/root/.docker:ro" \
            --volume "$PWD:/workspace:ro" \
            "$COSIGN_IMAGE" \
            attest --yes \
              --predicate /workspace/kaori-sbom.spdx.json \
              --type spdxjson \
              "$KAORI_IMAGE_REF"

          docker run --rm \
            --user 0:0 \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env DOCKER_CONFIG=/root/.docker \
            --volume "$HOME/.docker:/root/.docker:ro" \
            --volume "$PWD:/workspace:ro" \
            "$COSIGN_IMAGE" \
            attest --yes \
              --predicate /workspace/kaori-provenance.json \
              --type slsaprovenance1 \
              "$KAORI_IMAGE_REF"

      - name: Verify RC Supply Chain Attestations
        shell: bash
        run: |
          set -Eeuo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-staging-image.yml@${GITHUB_REF}"

          docker run --rm \
            --user 0:0 \
            --env DOCKER_CONFIG=/root/.docker \
            --volume "$HOME/.docker:/root/.docker:ro" \
            "$COSIGN_IMAGE" \
            verify-attestation \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --type spdxjson \
              "$KAORI_IMAGE_REF" > sbom-attestation-verification.json

          docker run --rm \
            --user 0:0 \
            --env DOCKER_CONFIG=/root/.docker \
            --volume "$HOME/.docker:/root/.docker:ro" \
            "$COSIGN_IMAGE" \
            verify-attestation \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --type slsaprovenance1 \
              "$KAORI_IMAGE_REF" > provenance-attestation-verification.json

      - name: Upload Staging Image Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-image-${{ needs.wait-for-quality.outputs.accepted_sha }}
          path: |
            staging-image.env
            kaori-sbom.spdx.json
            kaori-provenance.json
            sbom-attestation-verification.json
            provenance-attestation-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Build Human-Friendly RC Release Notes
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$COMPARE_BASE" ]] && git rev-parse --verify "$COMPARE_BASE^{commit}" >/dev/null 2>&1; then
            change_range="${COMPARE_BASE}..${ACCEPTED_SHA}"
            changed_files="$(git diff --name-only "$COMPARE_BASE" "$ACCEPTED_SHA")"
            highlights="$(git log -n 8 --format='- %s (%h)' "$change_range")"
          else
            changed_files="$(git show --format='' --name-only "$ACCEPTED_SHA")"
            highlights="$(git log -n 8 --format='- %s (%h)' "$ACCEPTED_SHA")"
          fi
          [[ -n "$highlights" ]] || highlights='- No source changes detected in the selected comparison range.'

          if grep -Eq '^migrations/' <<<"$changed_files"; then
            migration_impact='Migration files changed in this candidate; validate upgrade and rollback behavior during UAT.'
          else
            migration_impact='No migration files changed in the selected release comparison range.'
          fi

          if grep -Eq '^(deploy/|compose\.production\.yml|\.github/workflows/)' <<<"$changed_files"; then
            operational_impact='Deployment or release surfaces changed; operators must verify the governed VPS/UAT path for this exact candidate.'
          else
            operational_impact='No deployment-surface change was detected in the selected release comparison range.'
          fi

          cat > rc-release-notes.md <<EOF
          ## Overview
          **${CANDIDATE_TAG}** is an intentional KAORI prerelease cut from the exact admitted \`kaori/staging\` source below. Publication does not imply UAT or production acceptance.

          ## Highlights
          ${highlights}

          ## Operational Impact
          ${operational_impact}
          ${migration_impact}

          ## Validation Evidence
          Exact \`kaori/staging\` KAORI CI: **PASS**
          Quality run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}
          Trivy HIGH/CRITICAL image scan: **PASS**
          Production runtime & baseline DAST: **PASS**
          SPDX SBOM attestation: **PASS**
          SLSA provenance v1 attestation: **PASS**

          ### Immutable Evidence
          Candidate tag: \`${CANDIDATE_TAG}\`
          Staging source SHA: \`${ACCEPTED_SHA}\`
          Candidate image: \`${CANDIDATE_IMAGE}\`
          Immutable digest: \`${KAORI_IMAGE_DIGEST}\`
          Deployment authority: \`${KAORI_IMAGE_REF}\`

          ## Known Limitations
          This prerelease does not itself perform VPS deployment or stable production promotion. UAT remains pending until the governed VPS path passes and the maintainer explicitly accepts this exact source SHA and immutable digest.

          ## Promotion Status
          **Pending UAT.** Stable promotion is prohibited until explicit UAT acceptance of this exact source SHA and immutable image digest. Stable \`vX.Y.Z\` must reuse the accepted digest and must not rebuild application bits.
          EOF

      - name: Create Human-Friendly GitHub Prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          RELEASES_PATH="/releases"
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          release_name="KAORI ${CANDIDATE_TAG}"
          release_body="$(cat rc-release-notes.md)"
          payload="$(jq -nc \
            --arg tag "$CANDIDATE_TAG" \
            --arg sha "$ACCEPTED_SHA" \
            --arg name "$release_name" \
            --arg body "$release_body" \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, draft: false, prerelease: true, make_latest: "false"}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "${repo_api}${RELEASES_PATH}"
          printf 'Published GitHub prerelease %s -> %s\n' "$CANDIDATE_TAG" "$ACCEPTED_SHA"

      - name: Log Out from Docker Registry
        if: ${{ always() }}
        run: docker logout "$REGISTRY_HOST"
