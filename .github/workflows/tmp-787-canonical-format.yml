name: Temporary #787 Canonical Frontend Format

on:
  push:
    branches:
      - kaori/fix/787-fast-track-prettier

permissions:
  contents: write

jobs:
  format:
    name: Canonical Prettier Remediation
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: [self-hosted, linux, x64, platform-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: kaori/fix/787-fast-track-prettier
          fetch-depth: 0

      - name: Apply canonical KAORI formatter
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            kaori-ci-toolchain:67e845f61559672c4148 \
            bash -lc 'npm ci --no-audit --no-fund && npm run format'

          git config user.name "KAORI CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/static/js/info_tips.js \
            app/static/js/reports/generate.js \
            app/static/js/tenant_access_grant_form.js \
            app/static/js/tenant_resource_profile_presets.js

          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi

          git commit -m "style(admission): apply canonical Prettier output (#787)"
          git push origin HEAD:kaori/fix/787-fast-track-prettier
