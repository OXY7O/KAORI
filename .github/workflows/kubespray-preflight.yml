# Non-admission focused QA for #4800, never official Developer Check.
name: Kubespray Source and Evidence Preflight

on:
  push:
    branches:
      - kaori/issue-4800-kubespray-preflight-plan-readiness
      - kaori/issue-4800-kubespray-plan-evidence

permissions:
  contents: read

jobs:
  targeted-static:
    name: Static, preflight and review-only Plan contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing KAORI test tools
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff lint
        run: |
          python -m ruff check \
            app/infrastructure_automation/kubernetes \
            app/infrastructure_automation/tasks.py \
            tests/contracts/platform_operations/test_kubespray_static_preflight_contract.py \
            app/integrations/orchestration/configuration_automation/providers/ansible/preflight.py \
            app/integrations/routes.py \
            tests/integrations/test_ansible_kubespray_preflight.py \
            tests/integrations/test_kubespray_plan_review_contract.py \
            tests/integrations/test_kubespray_plan_dispatch_contract.py \
            tests/integrations/test_kubespray_plan_worker_contract.py \
            tests/contracts/integrations/test_ansible_source_posture_contract.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
      - name: Ruff formatting
        run: |
          python -m ruff format --check \
            app/infrastructure_automation/kubernetes \
            app/infrastructure_automation/tasks.py \
            tests/contracts/platform_operations/test_kubespray_static_preflight_contract.py \
            app/integrations/orchestration/configuration_automation/providers/ansible/preflight.py \
            app/integrations/routes.py \
            tests/integrations/test_ansible_kubespray_preflight.py \
            tests/integrations/test_kubespray_plan_review_contract.py \
            tests/integrations/test_kubespray_plan_dispatch_contract.py \
            tests/integrations/test_kubespray_plan_worker_contract.py \
            tests/contracts/integrations/test_ansible_source_posture_contract.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
      - name: Pyright static and evidence-bound preflight typing
        run: |
          python -m pyright app/infrastructure_automation/kubernetes
          python -m pyright app/infrastructure_automation/tasks.py
          python -m pyright app/integrations/orchestration/configuration_automation/providers/ansible/preflight.py
      - name: djlint shared Ansible validation workspace
        run: |
          djlint --check \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/_detail_validation.html
      - name: Existing KAORI UI reuse and style gates
        run: |
          python scripts/verify_ui_reuse.py
          python scripts/verify_ui_style.py
      - name: Focused non-mutating Kubernetes contract
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/platform_operations/test_kubespray_static_preflight_contract.py \
            tests/integrations/test_ansible_kubespray_preflight.py \
            tests/integrations/test_kubespray_plan_review_contract.py \
            tests/integrations/test_kubespray_plan_dispatch_contract.py \
            tests/integrations/test_kubespray_plan_worker_contract.py \
            tests/contracts/integrations/test_ansible_source_posture_contract.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
