# Non-admission focused QA for #4800, never official Developer Check.
name: Kubespray Static Plan Preflight

on:
  push:
    branches:
      - kaori/task-4800-kubespray-static-plan-preflight

permissions:
  contents: read

jobs:
  targeted-static:
    name: Source quality and non-mutation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing KAORI test tools
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff lint
        run: |
          python -m ruff check \
            app/infrastructure_automation/kubernetes \
            tests/contracts/platform_operations/test_kubespray_static_preflight_contract.py
      - name: Ruff formatting
        run: |
          python -m ruff format --check \
            app/infrastructure_automation/kubernetes \
            tests/contracts/platform_operations/test_kubespray_static_preflight_contract.py
      - name: Pyright static preflight typing
        run: python -m pyright app/infrastructure_automation/kubernetes
      - name: Focused non-mutating Kubernetes contract
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/platform_operations/test_kubespray_static_preflight_contract.py
