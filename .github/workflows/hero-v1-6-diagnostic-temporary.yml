name: Hero v1.6 Temporary Diagnostic

on:
  push:
    branches:
      - kaori/refactor/198-canonical-hero-profiles

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 20
    steps:
      - name: Check Out Work Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve CI Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$(cat .github/ci/Dockerfile .github/ci/requirements-security.txt requirements/base.txt requirements/dev.txt | sha256sum | cut -c1-20)"
          image="kaori-ci-toolchain:$key"
          docker image inspect "$image" >/dev/null 2>&1 || docker build --file .github/ci/Dockerfile --tag "$image" .
          printf 'CI_TOOLCHAIN_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: DjLint Shared Page Hero
        run: docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace "$CI_TOOLCHAIN_IMAGE" python -m djlint app/templates/components/page_hero.html --check

      - name: DjLint Kubernetes Dashboard Hero
        run: docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace "$CI_TOOLCHAIN_IMAGE" python -m djlint app/templates/kubernetes/dashboard/partials/_hero.html --check

      - name: DjLint Object Storage Dashboard Hero
        run: docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace "$CI_TOOLCHAIN_IMAGE" python -m djlint app/templates/storage/object_storage/dashboard/partials/_hero.html --check

      - name: DjLint Object Storage Analytics Hero
        run: docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace "$CI_TOOLCHAIN_IMAGE" python -m djlint app/templates/storage/object_storage/analytics/partials/_hero.html --check
