# Issue-scoped non-admission test: no remote Kubernetes operations.
name: Ansible Kubernetes Bindings Preflight

on:
  push:
    branches:
      - kaori/issue-4845-ansible-kubernetes-binding-read-model

permissions:
  contents: read

jobs:
  read-model:
    name: Canonical association and UI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kaori_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaori_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: testing
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaori_test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing QA toolchain
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff and Pyright
        run: |
          python -m ruff check \
            app/integrations/orchestration/configuration_automation/providers/ansible/service.py \
            app/integrations/routes.py \
            tests/integrations/test_ansible_cluster_binding_read_model.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
          python -m ruff format --check \
            app/integrations/orchestration/configuration_automation/providers/ansible/service.py \
            app/integrations/routes.py \
            tests/integrations/test_ansible_cluster_binding_read_model.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
          python -m pyright app/integrations/orchestration/configuration_automation/providers/ansible
      - name: Djlint canonical inventory and detail templates
        run: |
          djlint --check \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/_detail_inventory.html \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/detail.html
      - name: Existing UI style and reuse gates
        run: |
          python scripts/verify_ui_reuse.py
          python scripts/verify_ui_style.py
      - name: Real PostgreSQL HTTP inventory and existing Ansible contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/integrations/test_ansible_cluster_binding_read_model.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py \
            tests/contracts/integrations/test_ansible_source_posture_contract.py
