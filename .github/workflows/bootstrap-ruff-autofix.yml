name: KAORI Bootstrap Ruff Autofix

on:
  push:
    branches:
      - kaori/governance-agile-v1

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-ruff-autofix
  cancel-in-progress: false

jobs:
  autofix:
    if: "${{ github.event.head_commit.message == 'fix(ci): repair bootstrap ruff workflow' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-bootstrap-ruff:${GITHUB_SHA}" .

      - name: Apply Deterministic Ruff Import Fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            app/reports/export/xlsx/analytics_profiles.py
            app/reports/export/xlsx/builder.py
            app/reports/storage/service.py
            tests/reports/test_analytics_xlsx_standard.py
          )
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bootstrap-ruff:${GITHUB_SHA}" \
            ruff check --fix --select I,UP035 "${files[@]}"

          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files after Ruff:\n%s\n' "${changed[*]}"
          [[ "${#changed[@]}" -eq 4 ]]
          for file in "${files[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$file"
          done
          git diff --check

      - name: Commit Import-Only Fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/reports/export/xlsx/analytics_profiles.py \
            app/reports/export/xlsx/builder.py \
            app/reports/storage/service.py \
            tests/reports/test_analytics_xlsx_standard.py
          git commit -m "fix(quality): apply deterministic ruff import fixes"
          git push origin HEAD:kaori/governance-agile-v1
