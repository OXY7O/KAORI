name: Temporary 1734 Code Health Ledger
on:
  push:
    branches: [kaori/issue-1734-capsule-release-payload-guards]
permissions:
  contents: write
jobs:
  record:
    if: github.repository == 'OXY7O/KAORI'
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Record exact Capsule guard debt
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/kaori/issue-1734-capsule-release-payload-guards" ]]
          key="$(cat .github/ci/Dockerfile .github/ci/requirements-security.txt requirements/base.txt requirements/dev.txt | sha256sum | cut -c1-20)"
          image="kaori-ci-toolchain:$key"
          docker image inspect "$image" >/dev/null 2>&1 || docker build --file .github/ci/Dockerfile --tag "$image" .
          run_toolchain() {
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace "$image" "$@"
          }
          run_toolchain python scripts/verify_code_health.py --write-baseline
          run_toolchain python scripts/verify_code_health.py
          run_toolchain python scripts/verify_code_health_baseline_integrity.py
          git add docs/architecture/code-health-debt-baseline.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(admission): record Capsule guard code-health metric changes #1734'
          git push origin HEAD:refs/heads/kaori/issue-1734-capsule-release-payload-guards
