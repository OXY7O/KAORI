name: KAORI Bootstrap Workflow Lint 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-workflow-lint-12
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'chore(ci): validate workflow lint remediation #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-workflow-lint-12:${GITHUB_SHA}" .

      - name: Confirm RED Workflow Lint Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          output="$(docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-workflow-lint-12:${GITHUB_SHA}" actionlint .github/workflows/*.yml 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [[ "$status" -ne 0 ]]
          grep -Fq 'SC2129' <<<"$output"
          grep -Fq 'SC2155' <<<"$output"
          if grep -Fq 'label "kaori-ci" is unknown' <<<"$output"; then
            printf 'actionlint self-hosted runner configuration is not active\n' >&2
            exit 1
          fi

      - name: Apply Workflow Shell Remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, got {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              '.github/workflows/quality.yml',
              '''          echo "CI_UID=$(id -u)" >> "$GITHUB_ENV"\n          echo "CI_GID=$(id -g)" >> "$GITHUB_ENV"\n          echo "KAORI_CI_TOOLCHAIN_IMAGE=$CI_TOOLCHAIN_IMAGE" >> "$GITHUB_ENV"\n          echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tests" >> "$GITHUB_ENV"\n''',
              '''          {\n            echo "CI_UID=$(id -u)"\n            echo "CI_GID=$(id -g)"\n            echo "KAORI_CI_TOOLCHAIN_IMAGE=$CI_TOOLCHAIN_IMAGE"\n            echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tests"\n          } >> "$GITHUB_ENV"\n''',
          )
          replace_once(
              '.github/workflows/quality.yml',
              '''          echo "CI_UID=$(id -u)" >> "$GITHUB_ENV"\n          echo "CI_GID=$(id -g)" >> "$GITHUB_ENV"\n          echo "KAORI_CI_TOOLCHAIN_IMAGE=$CI_TOOLCHAIN_IMAGE" >> "$GITHUB_ENV"\n          echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime" >> "$GITHUB_ENV"\n          echo "VALIDATION_IMAGE=kaori:ci-${GITHUB_SHA}" >> "$GITHUB_ENV"\n''',
              '''          {\n            echo "CI_UID=$(id -u)"\n            echo "CI_GID=$(id -g)"\n            echo "KAORI_CI_TOOLCHAIN_IMAGE=$CI_TOOLCHAIN_IMAGE"\n            echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime"\n            echo "VALIDATION_IMAGE=kaori:ci-${GITHUB_SHA}"\n          } >> "$GITHUB_ENV"\n''',
          )
          replace_once(
              '.github/workflows/release-image.yml',
              '''          echo "CI_UID=$(id -u)" >> "$GITHUB_ENV"\n          echo "CI_GID=$(id -g)" >> "$GITHUB_ENV"\n          echo "KAORI_CI_TOOLCHAIN_IMAGE=kaori-ci-toolchain:${GITHUB_SHA}" >> "$GITHUB_ENV"\n          echo "COMPOSE_PROJECT_NAME=kaori-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-preflight" >> "$GITHUB_ENV"\n''',
              '''          {\n            echo "CI_UID=$(id -u)"\n            echo "CI_GID=$(id -g)"\n            echo "KAORI_CI_TOOLCHAIN_IMAGE=kaori-ci-toolchain:${GITHUB_SHA}"\n            echo "COMPOSE_PROJECT_NAME=kaori-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-preflight"\n          } >> "$GITHUB_ENV"\n''',
          )
          replace_once(
              '.github/workflows/release-image.yml',
              '''          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"\n          echo "digest=$digest" >> "$GITHUB_OUTPUT"\n          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"\n''',
              '''          {\n            echo "candidate_tag=$candidate_tag"\n            echo "digest=$digest"\n            echo "build_date=$build_date"\n          } >> "$GITHUB_OUTPUT"\n''',
          )
          replace_once(
              '.github/workflows/release-image.yml',
              '''          export CI_UID="$(id -u)"\n          export CI_GID="$(id -g)"\n          export KAORI_CI_TOOLCHAIN_IMAGE="kaori-ci-toolchain:${RELEASE_SHA}"\n''',
              '''          CI_UID="$(id -u)"\n          CI_GID="$(id -g)"\n          export CI_UID CI_GID\n          export KAORI_CI_TOOLCHAIN_IMAGE="kaori-ci-toolchain:${RELEASE_SHA}"\n''',
          )
          PY
          git diff --check

      - name: Verify GREEN Workflow Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-workflow-lint-12:${GITHUB_SHA}" actionlint .github/workflows/*.yml
          git diff --check

      - name: Commit Verified Workflow Fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Verified workflow files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 2 ]]
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/quality.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/release-image.yml'
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/quality.yml .github/workflows/release-image.yml
          git commit -m "fix(ci): satisfy workflow lint on self-hosted pipeline #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
