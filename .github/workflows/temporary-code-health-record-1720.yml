name: Temporary Code Health Baseline Recorder (1720)

on:
  push:
    branches:
      - kaori/issue-1720-code-health-baseline-admission

permissions:
  contents: write

concurrency:
  group: kaori-issue-1720-ledger
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'OXY7O/KAORI'
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout exact admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate and verify canonical exact debt ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/kaori/issue-1720-code-health-baseline-admission" ]]
          key="$(cat .github/ci/Dockerfile .github/ci/requirements-security.txt requirements/base.txt requirements/dev.txt | sha256sum | cut -c1-20)"
          image="kaori-ci-toolchain:$key"
          docker image inspect "$image" >/dev/null 2>&1 || docker build --file .github/ci/Dockerfile --tag "$image" .
          run_toolchain() {
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/workspace" --workdir /workspace "$image" "$@"
          }
          run_toolchain python scripts/verify_code_health.py --write-baseline
          run_toolchain python scripts/verify_code_health.py
          run_toolchain python scripts/verify_code_health_baseline_integrity.py
          git add docs/architecture/code-health-debt-baseline.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Canonical ledger already exactly matches current source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(admission): record exact approved Code Health debt without slack #1720'
          git push origin HEAD:refs/heads/kaori/issue-1720-code-health-baseline-admission
