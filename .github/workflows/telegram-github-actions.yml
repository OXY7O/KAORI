name: KAORI GitHub Actions Telegram Notification

on:
  workflow_run:
    workflows: ["KAORI CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kaori-telegram-github-actions-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  notify:
    name: KAORI GitHub Actions Notification
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: kaori-github-actions
    steps:
      - name: Check Out Trusted Notifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send Categorized Telegram Notification
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_GITHUB_ACTIONS_TOPIC_ID: ${{ vars.TELEGRAM_GITHUB_ACTIONS_TOPIC_ID }}
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ vars.TELEGRAM_NOTIFICATIONS_ENABLED }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          WORKFLOW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: >-
          python scripts/ci_delivery_notify.py
          --workflow-run-id "$WORKFLOW_RUN_ID"
          --workflow-event "$WORKFLOW_EVENT"
          --workflow-conclusion "$WORKFLOW_CONCLUSION"
          --head-branch "$WORKFLOW_HEAD_BRANCH"
          --base-branch "$WORKFLOW_BASE_BRANCH"
          --source-sha "$WORKFLOW_SOURCE_SHA"
          --repository "$GITHUB_REPOSITORY"
          --run-url "$WORKFLOW_RUN_URL"
          --pr-number "$WORKFLOW_PR_NUMBER"
