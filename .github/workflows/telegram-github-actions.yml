name: KAORI Telegram Notify

on:
  push:
    branches:
      - kaori/staging
      - main
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: kaori-telegram-github-actions-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify Trusted Push
    if: ${{ github.repository == 'OXY7O/KAORI' && github.event_name == 'push' && (github.ref == 'refs/heads/kaori/staging' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Out Trusted Push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Send Trusted Branch Telegram Notification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_GITHUB_ACTIONS_TOPIC_ID: ${{ vars.TELEGRAM_GITHUB_ACTIONS_TOPIC_ID }}
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ vars.TELEGRAM_NOTIFICATIONS_ENABLED }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_HEAD_BRANCH: ${{ github.ref_name }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci_delivery_notify.py
          --discover-workflow-run
          --workflow-event "$WORKFLOW_EVENT"
          --head-branch "$WORKFLOW_HEAD_BRANCH"
          --source-sha "$WORKFLOW_SOURCE_SHA"
          --repository "$GITHUB_REPOSITORY"

  observe-pr-failures:
    name: Observe PR Delivery Failures
    if: ${{ github.repository == 'OXY7O/KAORI' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Trusted Notification Authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan Actionable PR Delivery Failures
        id: scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_GITHUB_ACTIONS_TOPIC_ID: ${{ vars.TELEGRAM_GITHUB_ACTIONS_TOPIC_ID }}
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ vars.TELEGRAM_NOTIFICATIONS_ENABLED }}
        run: >-
          python scripts/ci_delivery_notify.py
          --scan-pr-failures
          --source-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"

      - name: Create Notification Receipt
        if: ${{ steps.scan.outputs.quality_run_id != '' }}
        shell: bash
        env:
          QUALITY_RUN_ID: ${{ steps.scan.outputs.quality_run_id }}
        run: printf '%s\n' "$QUALITY_RUN_ID" > kaori-telegram-quality-run.txt

      - name: Retain Notification Receipt
        if: ${{ steps.scan.outputs.quality_run_id != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaori-telegram-quality-run-${{ steps.scan.outputs.quality_run_id }}
          path: kaori-telegram-quality-run.txt
          if-no-files-found: error
          retention-days: 30
