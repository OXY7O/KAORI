name: KAORI Quality Gate

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  static-quality:
    name: Static, Architecture, and Migration Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/dev.txt

      - name: Run Static Foundation Gate
        run: bash scripts/quality_gate.sh --static

  functional-tests:
    name: Functional and Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kaori_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaori_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kaori_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kaori_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/3
      TEST_SECRET_KEY: kaori-ci-test-key
      INTEGRATION_CREDENTIAL_KEY: REREREREREREREREREREREREREREREREREREREREREQ=

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/dev.txt

      - name: Run Functional Test Gate
        run: bash scripts/quality_gate.sh --tests

  frontend:
    name: Offline Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build and Verify Frontend
        run: bash scripts/quality_gate.sh --frontend

  production-image:
    name: Production Image Build
    runs-on: ubuntu-latest
    needs:
      - static-quality
      - functional-tests
      - frontend

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Build Production Image
        run: docker build --target production --tag kaori:quality-gate .
