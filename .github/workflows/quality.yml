name: KAORI CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "kaori/**"
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - kaori/staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: kaori-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_TOOLCHAIN_IMAGE: kaori-ci-toolchain:${{ github.sha }}

jobs:
  static-quality:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Static, Architecture, and Governance
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "$CI_TOOLCHAIN_IMAGE" .

      - name: Run Static Foundation Gate
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --volume "$PWD:/workspace"
          --workdir /workspace
          "$CI_TOOLCHAIN_IMAGE"
          bash scripts/quality_gate.sh --static

  static-security:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Secrets, SAST, Dependencies, and Workflow Security
    needs: static-quality
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "$CI_TOOLCHAIN_IMAGE" .

      - name: Run Free-Plan Static Security Gate
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --volume "$PWD:/workspace"
          --workdir /workspace
          "$CI_TOOLCHAIN_IMAGE"
          bash .github/ci/run-security-static.sh

      - name: Upload Security Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-artifacts/security
          if-no-files-found: ignore
          retention-days: 7

  functional-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Functional and Integration Tests
    needs: static-security
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 60
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare CI Runtime Contract
        shell: bash
        run: |
          echo "CI_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CI_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "KAORI_CI_TOOLCHAIN_IMAGE=$CI_TOOLCHAIN_IMAGE" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tests" >> "$GITHUB_ENV"

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "$CI_TOOLCHAIN_IMAGE" .

      - name: Start PostgreSQL and Redis
        run: docker compose --file .github/ci/compose.yml up -d postgres redis

      - name: Run Functional Test Gate
        run: >-
          docker compose --file .github/ci/compose.yml
          run --rm ci bash scripts/quality_gate.sh --tests

      - name: Cleanup Test Services
        if: ${{ always() }}
        run: docker compose --file .github/ci/compose.yml down --volumes --remove-orphans

  frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Frontend Reproducibility
    needs: functional-tests
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "$CI_TOOLCHAIN_IMAGE" .

      - name: Build and Verify Frontend
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --volume "$PWD:/workspace"
          --workdir /workspace
          "$CI_TOOLCHAIN_IMAGE"
          bash scripts/quality_gate.sh --frontend

  production-runtime:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Production Image, Container Security, Runtime, and DAST
    needs: frontend
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 75
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare Runtime Contract
        shell: bash
        run: |
          echo "CI_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CI_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "KAORI_CI_TOOLCHAIN_IMAGE=$CI_TOOLCHAIN_IMAGE" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime" >> "$GITHUB_ENV"
          echo "VALIDATION_IMAGE=kaori:ci-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "$CI_TOOLCHAIN_IMAGE" .

      - name: Build Production Validation Image
        run: docker build --target production --tag "$VALIDATION_IMAGE" .

      - name: Scan Production Validation Image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          "$CI_TOOLCHAIN_IMAGE"
          trivy image
          --exit-code 1
          --ignore-unfixed
          --severity HIGH,CRITICAL
          --scanners vuln
          "$VALIDATION_IMAGE"

      - name: Validate Production Runtime
        run: bash .github/ci/run-runtime-validation.sh "$VALIDATION_IMAGE"

      - name: Upload Runtime Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/ci-artifacts/runtime
            tmp/ci-artifacts/zap
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup Runtime Resources
        if: ${{ always() }}
        shell: bash
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --file .github/ci/compose.yml --profile dast down --volumes --remove-orphans || true
          docker image rm "$VALIDATION_IMAGE" >/dev/null 2>&1 || true

  admission:
    name: KAORI CI Admission
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - static-quality
      - static-security
      - functional-tests
      - frontend
      - production-runtime
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 5
    steps:
      - name: Assert Required Gates
        shell: bash
        env:
          STATIC_QUALITY: ${{ needs.static-quality.result }}
          STATIC_SECURITY: ${{ needs.static-security.result }}
          FUNCTIONAL_TESTS: ${{ needs.functional-tests.result }}
          FRONTEND: ${{ needs.frontend.result }}
          PRODUCTION_RUNTIME: ${{ needs.production-runtime.result }}
        run: |
          printf 'static-quality=%s\n' "$STATIC_QUALITY"
          printf 'static-security=%s\n' "$STATIC_SECURITY"
          printf 'functional-tests=%s\n' "$FUNCTIONAL_TESTS"
          printf 'frontend=%s\n' "$FRONTEND"
          printf 'production-runtime=%s\n' "$PRODUCTION_RUNTIME"
          for result in \
            "$STATIC_QUALITY" \
            "$STATIC_SECURITY" \
            "$FUNCTIONAL_TESTS" \
            "$FRONTEND" \
            "$PRODUCTION_RUNTIME"
          do
            [[ "$result" == "success" ]] || exit 1
          done
          printf 'PASS — KAORI CI Admission\n'
