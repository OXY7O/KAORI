name: Full Admission

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Validation profile override
        required: false
        default: full
        type: choice
        options:
          - full
          - auto
  push:
    branches:
      - kaori/staging
      - main
      - "release/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: kaori-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  KAORI_PROFILE_VERSION: "3"
  KAORI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validation-profile:
    name: Resolve Profile
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && ((github.base_ref == 'kaori/staging' && startsWith(github.head_ref, 'kaori/') && github.head_ref != 'kaori/staging') || (github.base_ref == 'main' && github.head_ref == 'kaori/staging'))) }}
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.final.outputs.profile }}
      display_profile: ${{ steps.final.outputs.display_profile }}
      execution: ${{ steps.final.outputs.execution }}
      reason: ${{ steps.final.outputs.reason }}
      fallback: ${{ steps.final.outputs.fallback }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
      evidence_run_id: ${{ steps.evidence.outputs.evidence_run_id }}
      evidence_source_sha: ${{ steps.evidence.outputs.evidence_source_sha }}
      evidence_source_tree: ${{ steps.evidence.outputs.evidence_source_tree }}
      started_epoch: ${{ steps.identity.outputs.started_epoch }}
      toolchain_image: ${{ steps.toolchain.outputs.image }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.KAORI_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve CI Toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$(cat .github/ci/Dockerfile .github/ci/requirements-security.txt requirements/base.txt requirements/dev.txt | sha256sum | cut -c1-20)"
          image="kaori-ci-toolchain:$key"
          docker image inspect "$image" >/dev/null 2>&1 || docker build --file .github/ci/Dockerfile --tag "$image" .
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Resolve Source Identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git show -s --format=%T HEAD)"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
            printf 'started_epoch=%s\n' "$(date +%s)"
          } >> "$GITHUB_OUTPUT"
          mkdir -p tmp/ci-artifacts/profile
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            git diff --name-only "$PR_BASE_SHA" "$source_sha" > tmp/ci-artifacts/profile/changed-paths.txt
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] && git rev-parse --verify --quiet "$EVENT_BEFORE" >/dev/null; then
            git diff --name-only "$EVENT_BEFORE" "$source_sha" > tmp/ci-artifacts/profile/changed-paths.txt
          else
            git show --pretty='' --name-only "$source_sha" > tmp/ci-artifacts/profile/changed-paths.txt
          fi

      - name: Route Profile
        id: routing
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          DISPATCH_PROFILE: ${{ inputs.validation_profile }}
          CI_TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "${DISPATCH_PROFILE:-full}" == "full" ]]; then
            {
              echo 'profile=full'
              echo 'execution=full'
              echo 'display_profile=Full Admission'
              echo 'reason=Manual dispatch requested Full Admission.'
            } >> "$GITHUB_OUTPUT"
          else
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              "$CI_TOOLCHAIN_IMAGE" \
              python scripts/ci_admission.py route \
                --event-name "$EVENT_NAME" \
                --ref "$EVENT_REF" \
                --base-ref "${BASE_REF:-}" \
                --head-ref "${HEAD_REF:-}" \
                --changed-paths-file tmp/ci-artifacts/profile/changed-paths.txt \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Locate Admission Evidence
        id: evidence
        if: ${{ steps.routing.outputs.execution == 'fast' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env GH_TOKEN \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            python scripts/ci_admission.py find-evidence \
              --repository "$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" \
              --workflow quality.yml \
              --workflow developer-check.yml \
              --start-sha "${{ steps.identity.outputs.source_sha }}" \
              --current-tree "${{ steps.identity.outputs.source_tree }}" \
            >> "$GITHUB_OUTPUT"

      - name: Verify Lineage
        id: lineage
        if: ${{ steps.routing.outputs.execution == 'fast' && steps.evidence.outputs.reusable == 'true' }}
        shell: bash
        env:
          PROFILE: ${{ steps.routing.outputs.profile }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          EXPECTED_BEFORE: ${{ github.event.before }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_SOURCE_SHA: ${{ steps.evidence.outputs.evidence_source_sha }}
          EVIDENCE_SOURCE_TREE: ${{ steps.evidence.outputs.evidence_source_tree }}
          CI_TOOLCHAIN_IMAGE: ${{ steps.toolchain.outputs.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            python scripts/ci_admission.py verify-lineage \
              --profile "$PROFILE" \
              --source-sha "$SOURCE_SHA" \
              --source-tree "$SOURCE_TREE" \
              --expected-before "${EXPECTED_BEFORE:-}" \
              --expected-base "${EXPECTED_BASE:-}" \
              --evidence-source-sha "$EVIDENCE_SOURCE_SHA" \
              --evidence-source-tree "$EVIDENCE_SOURCE_TREE" \
            >> "$GITHUB_OUTPUT"

      - name: Finalize Profile
        id: final
        shell: bash
        env:
          PROFILE: ${{ steps.routing.outputs.profile }}
          DISPLAY_PROFILE: ${{ steps.routing.outputs.display_profile }}
          ROUTED_EXECUTION: ${{ steps.routing.outputs.execution }}
          ROUTED_REASON: ${{ steps.routing.outputs.reason }}
          REUSABLE: ${{ steps.evidence.outputs.reusable }}
          EVIDENCE_REASON: ${{ steps.evidence.outputs.evidence_reason }}
          LINEAGE_REUSABLE: ${{ steps.lineage.outputs.lineage_reusable }}
          LINEAGE_REASON: ${{ steps.lineage.outputs.lineage_reason }}
        run: |
          set -Eeuo pipefail
          execution="$ROUTED_EXECUTION"
          reason="$ROUTED_REASON"
          fallback=false
          if [[ "$ROUTED_EXECUTION" == "fast" && "${REUSABLE:-false}" != "true" ]]; then
            execution=full
            fallback=true
            reason="FALLBACK — ${EVIDENCE_REASON:-exact Full Admission evidence unavailable}"
          elif [[ "$ROUTED_EXECUTION" == "fast" && "${LINEAGE_REUSABLE:-false}" != "true" ]]; then
            execution=full
            fallback=true
            reason="FALLBACK — ${LINEAGE_REASON:-transition lineage could not be proven}"
          fi
          {
            printf 'profile=%s\n' "$PROFILE"
            printf 'display_profile=%s\n' "$DISPLAY_PROFILE"
            printf 'execution=%s\n' "$execution"
            printf 'reason=%s\n' "$reason"
            printf 'fallback=%s\n' "$fallback"
          } >> "$GITHUB_OUTPUT"
          if [[ "$fallback" == "true" ]]; then
            printf '⚠️ %s · execution=%s · %s\n' "$DISPLAY_PROFILE" "$execution" "$reason"
          else
            printf '✅ %s · execution=%s\n' "$DISPLAY_PROFILE" "$execution"
          fi

  full-admission-gates:
    if: ${{ needs.validation-profile.outputs.execution == 'full' }}
    needs: validation-profile
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          # Keep the longest comprehensive gate in the first scheduling wave.
          - gate: functional
            name: Functional Tests
          - gate: static
            name: Static & Governance
          - gate: security
            name: Security
          - gate: frontend
            name: Frontend
          - gate: runtime
            name: Runtime & DAST
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 75
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validation-profile.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Gate Contract
        shell: bash
        run: |
          {
            echo "CI_TOOLCHAIN_IMAGE=${{ needs.validation-profile.outputs.toolchain_image }}"
            echo "KAORI_CI_TOOLCHAIN_IMAGE=${{ needs.validation-profile.outputs.toolchain_image }}"
            echo "GATE_CONTAINER=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.gate }}"
          } >> "$GITHUB_ENV"

      - name: Prepare Functional Runtime
        if: ${{ matrix.gate == 'functional' }}
        shell: bash
        run: |
          {
            echo "CI_UID=$(id -u)"
            echo "CI_GID=$(id -g)"
            echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tests"
          } >> "$GITHUB_ENV"

      - name: Prepare Runtime & DAST Contract
        if: ${{ matrix.gate == 'runtime' }}
        shell: bash
        run: |
          {
            echo "CI_UID=$(id -u)"
            echo "CI_GID=$(id -g)"
            echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime"
            echo "VALIDATION_IMAGE=kaori:ci-${{ needs.validation-profile.outputs.source_sha }}"
          } >> "$GITHUB_ENV"

      - name: Run Static & Governance
        if: ${{ matrix.gate == 'static' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          started="$(date +%s)"
          docker run --rm --name "$GATE_CONTAINER" --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD:/workspace" --workdir /workspace "$CI_TOOLCHAIN_IMAGE" \
            bash scripts/quality_gate.sh --static &
          gate_pid=$!

          (
            while kill -0 "$gate_pid" >/dev/null 2>&1; do
              sleep 60
              if kill -0 "$gate_pid" >/dev/null 2>&1; then
                elapsed=$(( $(date +%s) - started ))
                printf '⏳ Static & Governance still running · ⏱ %dm %02ds\n' $((elapsed / 60)) $((elapsed % 60))
              fi
            done
          ) &
          heartbeat_pid=$!

          gate_status=0
          wait "$gate_pid" || gate_status=$?
          kill "$heartbeat_pid" >/dev/null 2>&1 || true
          wait "$heartbeat_pid" >/dev/null 2>&1 || true
          exit "$gate_status"

      - name: Run Security Gate
        if: ${{ matrix.gate == 'security' }}
        run: >-
          docker run --rm --name "$GATE_CONTAINER" --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/workspace" --workdir /workspace "$CI_TOOLCHAIN_IMAGE"
          bash .github/ci/run-security-static.sh

      - name: Start Test Dependencies
        if: ${{ matrix.gate == 'functional' }}
        run: docker compose --file .github/ci/compose.yml up -d postgres redis

      - name: Run Functional Tests
        if: ${{ matrix.gate == 'functional' }}
        run: >-
          docker compose --file .github/ci/compose.yml run --rm ci
          bash scripts/quality_gate.sh --tests

      - name: Build & Verify Frontend
        if: ${{ matrix.gate == 'frontend' }}
        run: >-
          docker run --rm --name "$GATE_CONTAINER" --user "$(id -u):$(id -g)" --env HOME=/tmp
          --volume "$PWD:/workspace" --workdir /workspace "$CI_TOOLCHAIN_IMAGE"
          bash scripts/quality_gate.sh --frontend

      - name: Build Production Image
        if: ${{ matrix.gate == 'runtime' }}
        run: docker build --target production --tag "$VALIDATION_IMAGE" .

      - name: Scan Production Image
        if: ${{ matrix.gate == 'runtime' }}
        run: >-
          docker run --rm --name "${GATE_CONTAINER}-trivy"
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume kaori-trivy-cache:/root/.cache/trivy "$CI_TOOLCHAIN_IMAGE"
          trivy image --cache-dir /root/.cache/trivy --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL --scanners vuln "$VALIDATION_IMAGE"

      - name: Validate Runtime & DAST
        if: ${{ matrix.gate == 'runtime' }}
        run: bash .github/ci/run-runtime-validation.sh "$VALIDATION_IMAGE"

      - name: Upload Static JUnit Evidence
        if: ${{ success() && matrix.gate == 'static' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-admission-junit-static-${{ github.run_id }}
          path: tmp/ci-artifacts/test-output/contract-migration.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload Functional JUnit Evidence
        if: ${{ success() && matrix.gate == 'functional' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-admission-junit-functional-${{ github.run_id }}
          path: |
            tmp/ci-artifacts/test-output/release-suite.xml
            tmp/ci-artifacts/test-output/e2e.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload Static Diagnostics
        if: ${{ failure() && matrix.gate == 'static' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-artifacts/static-output
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Security Diagnostics
        if: ${{ failure() && matrix.gate == 'security' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-artifacts/security
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Test Diagnostics
        if: ${{ failure() && matrix.gate == 'functional' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-artifacts/test-output
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Runtime Diagnostics
        if: ${{ failure() && matrix.gate == 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/ci-artifacts/runtime
            tmp/ci-artifacts/zap
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup Test Dependencies
        if: ${{ always() && matrix.gate == 'functional' }}
        shell: bash
        run: >-
          docker compose
          --project-name "kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tests"
          --file .github/ci/compose.yml
          down --volumes --remove-orphans || true

      - name: Cleanup Runtime Resources
        if: ${{ always() && matrix.gate == 'runtime' }}
        shell: bash
        run: |
          docker rm -f "${GATE_CONTAINER}-trivy" >/dev/null 2>&1 || true
          docker compose \
            --project-name "kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime" \
            --file .github/ci/compose.yml \
            --profile dast down --volumes --remove-orphans || true
          docker image rm "${VALIDATION_IMAGE:-}" >/dev/null 2>&1 || true

      - name: Cleanup Toolchain Gate Container
        if: ${{ always() && (matrix.gate == 'static' || matrix.gate == 'security' || matrix.gate == 'frontend') }}
        shell: bash
        run: docker rm -f "$GATE_CONTAINER" >/dev/null 2>&1 || true

  integration-smoke:
    if: ${{ needs.validation-profile.outputs.execution == 'fast' }}
    needs: validation-profile
    name: Fast Smoke
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validation-profile.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Smoke Contract
        shell: bash
        run: |
          {
            echo "CI_UID=$(id -u)"
            echo "CI_GID=$(id -g)"
            echo "KAORI_CI_TOOLCHAIN_IMAGE=${{ needs.validation-profile.outputs.toolchain_image }}"
            echo "COMPOSE_PROJECT_NAME=kaori-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-smoke"
          } >> "$GITHUB_ENV"
      - name: Start Smoke Dependencies
        run: docker compose --file .github/ci/compose.yml up -d postgres redis
      - name: Run Fast Smoke
        run: >-
          docker compose --file .github/ci/compose.yml run --rm ci
          bash scripts/quality_gate.sh --smoke
      - name: Upload Smoke Diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ci-artifacts/test-output
          if-no-files-found: ignore
          retention-days: 3
      - name: Cleanup Smoke Dependencies
        if: ${{ always() }}
        run: docker compose --file .github/ci/compose.yml down --volumes --remove-orphans

  admission:
    name: CI Admission
    if: ${{ always() && needs.validation-profile.result == 'success' }}
    permissions:
      contents: read
      statuses: write
    needs:
      - validation-profile
      - full-admission-gates
      - integration-smoke
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validation-profile.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Static JUnit Evidence
        if: ${{ needs.validation-profile.outputs.execution == 'full' && needs.full-admission-gates.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-admission-junit-static-${{ github.run_id }}
          path: tmp/ci-artifacts/admission-junit/static

      - name: Download Functional JUnit Evidence
        if: ${{ needs.validation-profile.outputs.execution == 'full' && needs.full-admission-gates.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-admission-junit-functional-${{ github.run_id }}
          path: tmp/ci-artifacts/admission-junit/functional

      - name: Assert Selected Path
        id: result
        shell: bash
        env:
          EXECUTION: ${{ needs.validation-profile.outputs.execution }}
          FULL_GATES: ${{ needs.full-admission-gates.result }}
          INTEGRATION_SMOKE: ${{ needs.integration-smoke.result }}
        run: |
          set -Eeuo pipefail
          if [[ "$EXECUTION" == "full" ]]; then
            [[ "$FULL_GATES" == "success" ]] || {
              printf 'selected Full Admission matrix failed or was cancelled: %s\n' "$FULL_GATES"
              exit 1
            }
            {
              echo 'coverage=Foundation & Governance; Domain & Capability Contracts; Engineering Quality; Functional & Integration; Frontend; Security & Runtime'
              echo 'fresh=Foundation & Governance|Domain & Capability Contracts|Engineering Quality|Functional & Integration|Frontend|Security & Runtime'
              echo 'reused='
            } >> "$GITHUB_OUTPUT"
          else
            [[ "$INTEGRATION_SMOKE" == "success" ]] || { echo 'fast integration smoke failed'; exit 1; }
            {
              echo 'coverage=Exact Full Admission evidence reused with fresh lineage and integration smoke.'
              echo 'fresh=Admission evidence identity|transition lineage|syntax/architecture/import/migration smoke|release contracts|E2E smoke'
              echo 'reused=Foundation & Governance|Domain & Capability Contracts|Engineering Quality|Functional & Integration|Frontend|Security & Runtime'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write Full Test Taxonomy Summary
        id: full_test_evidence
        if: ${{ needs.validation-profile.outputs.execution == 'full' && steps.result.outcome == 'success' }}
        shell: bash
        env:
          CI_TOOLCHAIN_IMAGE: ${{ needs.validation-profile.outputs.toolchain_image }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            python scripts/ci_admission.py test-summary \
              --junit tmp/ci-artifacts/admission-junit/static/contract-migration.xml \
              --junit tmp/ci-artifacts/admission-junit/functional/release-suite.xml \
              --junit tmp/ci-artifacts/admission-junit/functional/e2e.xml \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Admission Evidence
        id: full-evidence
        if: ${{ needs.validation-profile.outputs.execution == 'full' && steps.result.outcome == 'success' && steps.full_test_evidence.outcome == 'success' }}
        shell: bash
        env:
          CI_TOOLCHAIN_IMAGE: ${{ needs.validation-profile.outputs.toolchain_image }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            python scripts/ci_admission.py write-evidence \
              --source-sha "${{ needs.validation-profile.outputs.source_sha }}" \
              --source-tree "${{ needs.validation-profile.outputs.source_tree }}" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/quality.yml@$KAORI_SOURCE_SHA" \
              --static-quality "${{ needs.full-admission-gates.result }}" \
              --static-security "${{ needs.full-admission-gates.result }}" \
              --functional-tests "${{ needs.full-admission-gates.result }}" \
              --frontend "${{ needs.full-admission-gates.result }}" \
              --production-runtime "${{ needs.full-admission-gates.result }}" \
              --output admission-evidence.json

      - name: Upload Admission Evidence
        id: full-evidence-upload
        if: ${{ needs.validation-profile.outputs.execution == 'full' && steps.full-evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaori-full-admission-${{ needs.validation-profile.outputs.source_sha }}
          path: admission-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Write Admission Summary
        id: summary
        if: ${{ always() }}
        shell: bash
        env:
          CI_TOOLCHAIN_IMAGE: ${{ needs.validation-profile.outputs.toolchain_image }}
          EXECUTION: ${{ needs.validation-profile.outputs.execution }}
          PROFILE: ${{ needs.validation-profile.outputs.display_profile }}
          FALLBACK: ${{ needs.validation-profile.outputs.fallback }}
          REASON: ${{ needs.validation-profile.outputs.reason }}
          EVIDENCE_RUN: ${{ needs.validation-profile.outputs.evidence_run_id }}
          STARTED_EPOCH: ${{ needs.validation-profile.outputs.started_epoch }}
          FRESH: ${{ steps.result.outputs.fresh }}
          REUSED: ${{ steps.result.outputs.reused }}
          COVERAGE: ${{ steps.result.outputs.coverage }}
          FULL_GATES: ${{ needs.full-admission-gates.result }}
          TEST_EVIDENCE: ${{ steps.full_test_evidence.outcome }}
          INTEGRATION_SMOKE: ${{ needs.integration-smoke.result }}
        run: |
          set -Eeuo pipefail
          elapsed=$(( $(date +%s) - STARTED_EPOCH ))
          duration="$(printf '%dm %02ds' $((elapsed / 60)) $((elapsed % 60)))"
          evidence='Fresh Full Admission'
          if [[ "$EXECUTION" == "fast" ]]; then
            evidence="REUSED Full Admission #${EVIDENCE_RUN}"
          elif [[ "$FALLBACK" == "true" ]]; then
            evidence="FALLBACK — ${REASON}; fresh Full Admission executed"
          fi

          RESULT=PASS
          FIRST_FAILURE=''
          if [[ "$EXECUTION" == "full" ]]; then
            if [[ "$FULL_GATES" != "success" ]]; then
              RESULT=FAIL
              FIRST_FAILURE="Comprehensive gate matrix — $FULL_GATES; see failed/cancelled matrix child"
            elif [[ "$TEST_EVIDENCE" != "success" ]]; then
              RESULT=FAIL
              FIRST_FAILURE="Full test taxonomy evidence — $TEST_EVIDENCE"
            fi
          elif [[ "$INTEGRATION_SMOKE" != "success" ]]; then
            RESULT=FAIL
            FIRST_FAILURE="Fast Smoke — $INTEGRATION_SMOKE"
          fi

          next='Ready for staging integration'
          if [[ "$RESULT" == "FAIL" ]]; then
            next='Collect all actionable findings on the governed integration branch before any promotion or UAT progression'
          else
            case "${{ needs.validation-profile.outputs.profile }}" in
              staging-integration) next='Ready for human UAT on the exact staging SHA' ;;
              promotion) next='Ready to promote accepted staging lineage to main' ;;
              post-promotion) next='Production lineage verified; delivery evidence complete' ;;
            esac
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            python scripts/ci_admission.py summary \
              --result "$RESULT" \
              --profile "$PROFILE" \
              --commit-sha "${{ needs.validation-profile.outputs.source_sha }}" \
              --tree-sha "${{ needs.validation-profile.outputs.source_tree }}" \
              --evidence "$evidence" \
              --duration "$duration" \
              --coverage-summary "${COVERAGE:-Selected validation path did not complete.}" \
              --fresh-checks "$FRESH" \
              --reused-checks "$REUSED" \
              --first-failure "$FIRST_FAILURE" \
              --next-action "$next" \
            >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RESULT" == "PASS" ]]; then
            printf '✅ %s · ⏱ %s\n' "$PROFILE" "$duration"
          else
            printf '❌ %s · ⏱ %s\n' "$PROFILE" "$duration"
          fi
          printf '📦 %s\n' "${COVERAGE:-Selected validation path did not complete.}"
          printf '➡️ %s\n' "$next"

      - name: Publish Admission Commit Status
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validation-profile.outputs.source_sha }}
          EXECUTION: ${{ needs.validation-profile.outputs.execution }}
          ASSERT_OUTCOME: ${{ steps.result.outcome }}
          TEST_EVIDENCE_OUTCOME: ${{ steps.full_test_evidence.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.full-evidence.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.full-evidence-upload.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          set -Eeuo pipefail

          state=failure
          description='Full Admission failed'

          if [[ "$ASSERT_OUTCOME" == "success" && "$SUMMARY_OUTCOME" == "success" ]]; then
            if [[ "$EXECUTION" == "full" ]]; then
              if [[ "$TEST_EVIDENCE_OUTCOME" == "success" && "$EVIDENCE_OUTCOME" == "success" && "$EVIDENCE_UPLOAD_OUTCOME" == "success" ]]; then
                state=success
                description='Full Admission passed'
              fi
            else
              state=success
              description='Staging admission passed'
            fi
          fi

          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload="$(printf '{"state":"%s","target_url":"%s","description":"%s","context":"KAORI CI / Admission"}' "$state" "$target_url" "$description")"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            --data "$payload"
