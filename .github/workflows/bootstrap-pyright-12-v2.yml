name: KAORI Bootstrap Pyright 12 v2

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-pyright-12-v2
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'chore(ci): validate xlsx marker contract #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-bootstrap-pyright-12-v2:${GITHUB_SHA}" .

      - name: Apply Corrected Source-Level Type Boundary Fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/bootstrap-pyright-12.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          payload = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          payload = textwrap.dedent(payload)
          payload = payload.replace(
              "preferred_label = preferred_key.title() if preferred_key else 'Resource'",
              "preferred_label = str(preferred_key).title() if preferred_key else 'Resource'",
              1,
          )
          old_guard = "    'preferred_key.title()',\n    'preferred_label',\n    4,\n)"
          new_guard = "    'preferred_key.title()',\n    'preferred_label',\n    3,\n)"
          if payload.count(old_guard) != 1:
              raise SystemExit(f'Expected one corrected preferred-label guard, found {payload.count(old_guard)}')
          payload = payload.replace(old_guard, new_guard, 1)
          exec(compile(payload, 'bootstrap-pyright-12-source-fixes', 'exec'), {})

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/reports/export/xlsx/analytics_builder.py',
              """    primary_visual = str(metadata_values.get('Primary Visual') or '').strip()\n    if primary_visual and primary_visual != 'No chartable evidence' and not overview._charts:\n        raise ValueError('Analytics XLSX Primary Visual is missing for chartable committed evidence.')\n\n    if overview._charts:\n        chart = overview._charts[0]\n""",
              """    primary_visual = str(metadata_values.get('Primary Visual') or '').strip()\n    overview_charts = cast(Any, overview)._charts\n    if primary_visual and primary_visual != 'No chartable evidence' and not overview_charts:\n        raise ValueError('Analytics XLSX Primary Visual is missing for chartable committed evidence.')\n\n    if overview_charts:\n        chart = overview_charts[0]\n""",
          )
          replace_once(
              'app/reports/export/xlsx/builder.py',
              """        has_no_chart_message = str(overview['A15'].value or '').strip() == (\n            'No committed chartable evidence is available for this workbook scope.'\n        )\n        if not overview._charts and not has_no_chart_message:\n            raise ValueError(\n                'KAORI XLSX contract violation: Overview must contain an evidence-backed chart '\n                'when chartable report evidence is available.'\n            )\n        if overview._charts:\n            chart = overview._charts[0]\n""",
              """        has_no_chart_message = str(overview['A15'].value or '').strip() == (\n            'No committed chartable evidence is available for this workbook scope.'\n        )\n        overview_charts = cast(Any, overview)._charts\n        if not overview_charts and not has_no_chart_message:\n            raise ValueError(\n                'KAORI XLSX contract violation: Overview must contain an evidence-backed chart '\n                'when chartable report evidence is available.'\n            )\n        if overview_charts:\n            chart = overview_charts[0]\n""",
          )

          test_path = 'tests/reports/test_analytics_xlsx_standard.py'
          replace_once(
              test_path,
              'from zipfile import ZipFile\n',
              'from xml.etree import ElementTree\nfrom zipfile import ZipFile\n',
          )
          replace_once(
              test_path,
              """    with ZipFile(output_path) as archive:\n        chart_xml = archive.read('xl/charts/chart1.xml').decode('utf-8')\n    assert chart_xml.count('<marker><symbol val=\"none\"/>') == 3\n""",
              """    with ZipFile(output_path) as archive:\n        chart_xml = archive.read('xl/charts/chart1.xml').decode('utf-8')\n    chart_root = ElementTree.fromstring(chart_xml)\n    chart_namespace = {'c': 'http://schemas.openxmlformats.org/drawingml/2006/chart'}\n    marker_symbols = chart_root.findall('.//c:marker/c:symbol', chart_namespace)\n    assert [symbol.get('val') for symbol in marker_symbols].count('none') == 3\n""",
          )
          PY

          mapfile -t changed < <(git diff --name-only)
          printf 'Type remediation changed %s files:\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 8 ]]
          git diff --check

      - name: Canonicalize Changed Python
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            app/reports/export/inventory_common.py
            app/reports/export/xlsx/analytics_builder.py
            app/reports/export/xlsx/analytics_overview.py
            app/reports/export/xlsx/analytics_profiles.py
            app/reports/export/xlsx/builder.py
            app/reports/export/xlsx/overview.py
            app/reports/storage/routes.py
            tests/reports/test_analytics_xlsx_standard.py
          )
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v2:${GITHUB_SHA}" python -m ruff format "${files[@]}"
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v2:${GITHUB_SHA}" python -m ruff check "${files[@]}"
          git diff --check

      - name: Verify Pyright Green
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v2:${GITHUB_SHA}" python -m pyright --project pyrightconfig.json

      - name: Run Reporting Regression Tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v2:${GITHUB_SHA}" \
            pytest -q \
              tests/reports/test_analytics_xlsx_standard.py \
              tests/reports/test_inventory_xlsx_standard.py \
              tests/contracts/reports/test_report_storage_worker_verification_contract.py

      - name: Commit Verified Type Fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Verified type remediation files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 8 ]]
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${changed[@]}"
          git commit -m "fix(reports): restore static type safety #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
