name: KAORI Bootstrap UI Style 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-ui-style-12
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'chore(ci): validate reports ui style remediation #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-ui-style-12:${GITHUB_SHA}" .

      - name: Confirm RED Style Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          output="$(docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-ui-style-12:${GITHUB_SHA}" python scripts/verify_ui_style.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [[ "$status" -ne 0 ]]
          grep -Fq 'app/templates/reports/schedules/index.html: arbitrary_text_sizes 4 exceeds style ceiling 0' <<<"$output"
          grep -Fq 'app/templates/reports/storage/_verification_status.html: arbitrary_text_sizes 3 exceeds style ceiling 0' <<<"$output"
          grep -Fq 'app/templates/reports/storage/_verification_status.html: semantic_border_utilities 1 exceeds style ceiling 0' <<<"$output"
          grep -Fq 'app/templates/reports/storage/index.html: arbitrary_text_sizes 3 exceeds style ceiling 0' <<<"$output"
          grep -Fq 'app/templates/reports/storage/index.html: semantic_border_utilities 2 exceeds style ceiling 0' <<<"$output"

      - name: Apply Canonical KAORI Style Ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          schedules = Path('app/templates/reports/schedules/index.html')
          text = schedules.read_text(encoding='utf-8')
          if text.count('text-[11px]') != 4:
              raise SystemExit('Expected exactly four Schedule arbitrary 11px utilities.')
          schedules.write_text(text.replace('text-[11px]', 'text-xs'), encoding='utf-8')

          verification = Path('app/templates/reports/storage/_verification_status.html')
          text = verification.read_text(encoding='utf-8')
          import_marker = '{% set verification = verification_execution %}\n'
          import_line = '{% import "components/table_label.html" as table_label %}\n'
          if import_line not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit('Expected one verification import insertion point.')
              text = text.replace(import_marker, import_line + import_marker, 1)
          old_badge = "{% set badge_classes = 'border-status-success-border bg-status-success-soft text-status-success-text' if state == 'healthy' else 'border-status-danger-border bg-status-danger-soft text-status-danger-text' if state == 'failed' else 'border-status-warning-border bg-status-warning-soft text-status-warning-text' if state in ['canceled', 'retrying'] else 'border-kaori-primary/25 bg-kaori-soft text-kaori-primary' if state in ['queued', 'running'] else 'border-outline-subtle bg-surface-subtle text-content-secondary' %}"
          new_badge = "{% set badge_tone = 'normal' if state == 'healthy' else 'critical' if state == 'failed' else 'warning' if state in ['canceled', 'retrying'] else 'info' if state in ['queued', 'running'] else 'unknown' %}"
          if text.count(old_badge) != 1:
              raise SystemExit('Expected one page-local verification badge class mapping.')
          text = text.replace(old_badge, new_badge, 1)
          old_span = '<span class="inline-flex min-h-6 shrink-0 items-center rounded-md border px-2 py-1 text-[10px] font-semibold {{ badge_classes }}">{{ display_status }}</span>'
          new_span = "{{ table_label.status_indicator_label(display_status, badge_tone) }}"
          if text.count(old_span) != 1:
              raise SystemExit('Expected one page-local verification status badge.')
          text = text.replace(old_span, new_span, 1)
          if text.count('text-[10px]') != 2:
              raise SystemExit('Expected exactly two remaining verification 10px utilities.')
          verification.write_text(text.replace('text-[10px]', 'text-xs'), encoding='utf-8')

          storage = Path('app/templates/reports/storage/index.html')
          text = storage.read_text(encoding='utf-8')
          import_marker = '{% import "components/table_label.html" as table_label %}\n'
          import_line = '{% import "components/operational_callout.html" as operational_callout %}\n'
          if import_line not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit('Expected one storage operational-callout import insertion point.')
              text = text.replace(import_marker, import_marker + import_line, 1)
          if text.count('border-status-warning-border') != 2:
              raise SystemExit('Expected exactly two page-local warning border utilities in Reports Storage.')
          text = text.replace(
              'border-status-warning-border',
              "{{ operational_callout.semantic_border_classes('warning') }}",
          )
          if text.count('text-[10px]') != 2:
              raise SystemExit('Expected exactly two Reports Storage 10px utilities.')
          if text.count('text-[11px]') != 1:
              raise SystemExit('Expected exactly one Reports Storage 11px utility.')
          text = text.replace('text-[10px]', 'text-xs').replace('text-[11px]', 'text-xs')
          storage.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Verify Targeted Style Remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-ui-style-12:${GITHUB_SHA}" python -m djlint \
            app/templates/reports/schedules/index.html \
            app/templates/reports/storage/_verification_status.html \
            app/templates/reports/storage/index.html --check
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-ui-style-12:${GITHUB_SHA}" python scripts/verify_ui_style.py
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-ui-style-12:${GITHUB_SHA}" python scripts/verify_ui_reuse.py
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-ui-style-12:${GITHUB_SHA}" python scripts/verify_template_dependencies.py
          git diff --check

      - name: Commit Verified Style Fix
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Verified style files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 3 ]]
          printf '%s\n' "${changed[@]}" | grep -Fxq 'app/templates/reports/schedules/index.html'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'app/templates/reports/storage/_verification_status.html'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'app/templates/reports/storage/index.html'
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/templates/reports/schedules/index.html \
            app/templates/reports/storage/_verification_status.html \
            app/templates/reports/storage/index.html
          git commit -m "fix(reports): align storage and schedule ui style #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
