name: Community Fork Check

on:
  pull_request:
    branches:
      - kaori/staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Fork validation is feedback only. It is not the trusted Developer Check
# or the Ready Full Admission authority.
permissions:
  contents: read

concurrency:
  group: kaori-community-fork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fork-validation:
    name: Untrusted Fork Validation
    # Never schedule code from a fork onto KAORI's privileged runners.
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Exact Fork Head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Source Identity and Whitespace
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA" "$EXPECTED_HEAD"

      - name: Validate Python Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q app migrations scripts tests

      - name: Set Up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22.23.2'

      - name: Install Locked Frontend Dependencies Without Scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check Frontend and Workflow Formatting
        run: npm run check-format
