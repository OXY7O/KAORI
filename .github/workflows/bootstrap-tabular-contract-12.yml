name: KAORI Bootstrap Tabular Contract 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-tabular-contract-12
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'chore(ci): validate tabular navigation semantics #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-tabular-contract-12:${GITHUB_SHA}" .

      - name: Confirm RED Contract Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          output="$(docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-tabular-contract-12:${GITHUB_SHA}" python scripts/verify_tabular_export_standard.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [[ "$status" -ne 0 ]]
          grep -Fq 'ERROR: Overview workbook navigation is missing' <<<"$output"

      - name: Apply Semantic Navigation Contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify_tabular_export_standard.py')
          text = path.read_text(encoding='utf-8')

          helper_marker = "\n\ndef main() -> int:\n"
          helper = '''\n\ndef function_uses_attribute(source: str, function_name: str, attribute_name: str) -> bool:\n    tree = ast.parse(source)\n    for node in tree.body:\n        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == function_name:\n            return any(\n                isinstance(child, ast.Attribute) and child.attr == attribute_name\n                for child in ast.walk(node)\n            )\n    return False\n'''
          if text.count(helper_marker) != 1:
              raise SystemExit('Expected one main insertion point.')
          text = text.replace(helper_marker, helper + helper_marker, 1)

          old = """    require(\n        'Workbook Navigation' in xlsx_overview and 'sheet.parent.sheetnames' in xlsx_overview,\n        'Overview workbook navigation is missing',\n        errors,\n    )\n"""
          new = """    require(\n        'Workbook Navigation' in xlsx_overview\n        and function_uses_attribute(xlsx_overview, '_write_overview_navigation', 'sheetnames'),\n        'Overview workbook navigation must derive targets from workbook sheet names',\n        errors,\n    )\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected one stale Overview navigation check.')
          text = text.replace(old, new, 1)

          old_output = """    if errors:\n        for error in errors:\n            print(f'ERROR: {error}')\n        return 1\n\n    print(\n        'KAORI tabular export audit passed: CSV v3 and global XLSX v2 cover Inventory XLSX v4 and '\n        'Analytics XLSX v1 with shared metadata/security contracts, category-owned Overview semantics, and runtime validation.'\n    )\n    return 0\n"""
          new_output = """    if errors:\n        print('FAIL — KAORI Tabular Export Standard')\n        print()\n        print('Contract Errors')\n        for error in errors:\n            print(f'  FAIL — {error}')\n        print()\n        print('Summary')\n        print(f'  {len(errors)} failed')\n        return 1\n\n    print('PASS — KAORI Tabular Export Standard')\n    print()\n    print('CSV Contract')\n    print('  PASS — CSV v3 uses canonical metadata, encoding, and formula-safety contracts.')\n    print()\n    print('XLSX Contract')\n    print('  PASS — Global XLSX v2 covers Inventory XLSX v4 and Analytics XLSX v1.')\n    print('  PASS — Inventory Overview navigation derives targets from workbook sheet names.')\n    print()\n    print('Runtime Validation')\n    print('  PASS — Inventory and Analytics XLSX artifacts retain runtime validation gates.')\n    print()\n    print('Summary')\n    print('  4 checks passed · 0 failed')\n    return 0\n"""
          if text.count(old_output) != 1:
              raise SystemExit('Expected one legacy tabular output block.')
          path.write_text(text.replace(old_output, new_output, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Verify Semantic Helper Contract
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-tabular-contract-12:${GITHUB_SHA}" python - <<'PY'
          from scripts.verify_tabular_export_standard import function_uses_attribute

          direct = 'def nav(sheet):\n    return sheet.parent.sheetnames\n'
          narrowed = 'def nav(sheet):\n    workbook = sheet.parent\n    return workbook.sheetnames\n'
          absent = 'def nav(sheet):\n    return ()\n'
          assert function_uses_attribute(direct, 'nav', 'sheetnames')
          assert function_uses_attribute(narrowed, 'nav', 'sheetnames')
          assert not function_uses_attribute(absent, 'nav', 'sheetnames')
          PY

      - name: Canonicalize and Verify
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-tabular-contract-12:${GITHUB_SHA}" python -m ruff format scripts/verify_tabular_export_standard.py
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-tabular-contract-12:${GITHUB_SHA}" python -m ruff check scripts/verify_tabular_export_standard.py
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-tabular-contract-12:${GITHUB_SHA}" python scripts/verify_tabular_export_standard.py
          git diff --check

      - name: Commit Verified Contract Fix
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Verified contract files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 1 ]]
          [[ "${changed[0]}" == 'scripts/verify_tabular_export_standard.py' ]]
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/verify_tabular_export_standard.py
          git commit -m "fix(reports): make tabular navigation contract semantic #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
