name: KAORI Bootstrap Pyright 12 v3

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-pyright-12-v3
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'chore(ci): retry serializer-neutral pyright remediation #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-bootstrap-pyright-12-v3:${GITHUB_SHA}" .

      - name: Apply Verified Source Fixes and Serializer-Neutral Regression Contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/bootstrap-pyright-12-v2.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          payload = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          payload = textwrap.dedent(payload)
          exec(compile(payload, 'bootstrap-pyright-12-v2-source-fixes', 'exec'), {})

          test_path = Path('tests/reports/test_analytics_xlsx_standard.py')
          test_text = test_path.read_text(encoding='utf-8')
          import_old = 'from zipfile import ZipFile\n'
          import_new = 'from xml.etree import ElementTree\nfrom zipfile import ZipFile\n'
          if test_text.count(import_old) != 1:
              raise SystemExit('Expected one ZipFile import in analytics XLSX regression test.')
          test_text = test_text.replace(import_old, import_new, 1)

          assertion_old = '''    with ZipFile(output_path) as archive:\n        chart_xml = archive.read('xl/charts/chart1.xml').decode('utf-8')\n    assert chart_xml.count('<marker><symbol val="none"/>') == 3\n'''
          assertion_new = '''    with ZipFile(output_path) as archive:\n        chart_root = ElementTree.fromstring(archive.read('xl/charts/chart1.xml'))\n    chart_ns = {'c': 'http://schemas.openxmlformats.org/drawingml/2006/chart'}\n    marker_symbols = chart_root.findall('.//c:marker/c:symbol', chart_ns)\n    assert [symbol.attrib.get('val') for symbol in marker_symbols] == ['none', 'none', 'none']\n'''
          if test_text.count(assertion_old) != 1:
              raise SystemExit('Expected one lexical marker XML assertion in analytics XLSX regression test.')
          test_path.write_text(test_text.replace(assertion_old, assertion_new, 1), encoding='utf-8')
          PY

          mapfile -t changed < <(git diff --name-only)
          printf 'Remediation changed %s files:\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 8 ]]
          git diff --check

      - name: Canonicalize Changed Python
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            app/reports/export/inventory_common.py
            app/reports/export/xlsx/analytics_builder.py
            app/reports/export/xlsx/analytics_overview.py
            app/reports/export/xlsx/analytics_profiles.py
            app/reports/export/xlsx/builder.py
            app/reports/export/xlsx/overview.py
            app/reports/storage/routes.py
            tests/reports/test_analytics_xlsx_standard.py
          )
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v3:${GITHUB_SHA}" python -m ruff format "${files[@]}"
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v3:${GITHUB_SHA}" python -m ruff check "${files[@]}"
          git diff --check

      - name: Verify Pyright Green
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v3:${GITHUB_SHA}" python -m pyright --project pyrightconfig.json

      - name: Run Reporting Regression Tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-bootstrap-pyright-12-v3:${GITHUB_SHA}" \
            pytest -q \
              tests/reports/test_analytics_xlsx_standard.py \
              tests/reports/test_inventory_xlsx_standard.py \
              tests/contracts/reports/test_report_storage_worker_verification_contract.py

      - name: Commit Verified Type and Regression Fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Verified remediation files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 8 ]]
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${changed[@]}"
          git commit -m "fix(reports): restore static type and xlsx contract safety #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
