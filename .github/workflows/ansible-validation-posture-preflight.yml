# Issue-scoped pre-admission QA; does not replace Developer Check or Full Admission.
name: Ansible Validation Posture Preflight

on:
  push:
    branches:
      - kaori/issue-4842-ansible-validation-evidence-posture

permissions:
  contents: read

jobs:
  evidence-contract:
    name: Committed source and capability evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing development toolchain
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff lint and format
        run: |
          python -m ruff check \
            app/integrations/orchestration/configuration_automation/providers/ansible \
            app/integrations/routes.py \
            tests/contracts/integrations/test_ansible_source_posture_contract.py
          python -m ruff format --check \
            app/integrations/orchestration/configuration_automation/providers/ansible \
            app/integrations/routes.py \
            tests/contracts/integrations/test_ansible_source_posture_contract.py
      - name: Djlint UI template contract
        run: |
          djlint --check \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/detail.html \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/_detail_validation.html
      - name: Pyright provider posture
        run: python -m pyright app/integrations/orchestration/configuration_automation/providers/ansible
      - name: UI reuse and style verification
        run: |
          python scripts/verify_ui_reuse.py
          python scripts/verify_ui_style.py
      - name: Source posture, Jinja and existing provider regression
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/integrations/test_ansible_source_posture_contract.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py \
            tests/integrations/test_ansible_public_git_source.py
