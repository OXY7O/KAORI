# #4978 issue-scoped read-only evidence. Existing canonical checks, not admission.
name: Kubespray Architecture Boundary Preflight

on:
  push:
    branches:
      - kaori/task-4978-architecture-preflight

permissions:
  contents: read

jobs:
  targeted-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact corrective source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "44cd44f76963ea362e8282fed7f97a3c6e485e1b"
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Existing canonical architecture verifiers
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "44cd44f76963ea362e8282fed7f97a3c6e485e1b"
          python scripts/verify_architecture_boundaries.py
          python scripts/verify_import_cycles.py
          python scripts/verify_internal_import_symbols.py
          python scripts/verify_module_reachability.py
          python scripts/verify_application_package_architecture.py
          python scripts/verify_code_health.py
      - name: Install existing KAORI test tools
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff lint and formatting
        run: |
          python -m ruff check app/infrastructure_automation app/integrations/orchestration/configuration_automation/providers/ansible app/integrations/source_control/source_control/providers/github/public_automation_source.py tests/contracts/architecture/test_dependency_cycle_edge_evidence_contract.py tests/contracts/integrations/test_ansible_source_posture_contract.py
          python -m ruff format --check app/infrastructure_automation app/integrations/orchestration/configuration_automation/providers/ansible app/integrations/source_control/source_control/providers/github/public_automation_source.py tests/contracts/architecture/test_dependency_cycle_edge_evidence_contract.py tests/contracts/integrations/test_ansible_source_posture_contract.py
      - name: Focused existing preflight, provider and Plan tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/architecture/test_dependency_cycle_edge_evidence_contract.py \
            tests/contracts/integrations/test_ansible_source_posture_contract.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py \
            tests/contracts/platform_operations/test_kubespray_static_preflight_contract.py \
            tests/integrations/test_ansible_kubespray_preflight.py \
            tests/integrations/test_ansible_public_git_source.py \
            tests/integrations/test_ansible_provider_registration_web.py \
            tests/integrations/test_kubespray_plan_review_contract.py \
            tests/integrations/test_kubespray_plan_currentness_contract.py \
            tests/integrations/test_kubespray_plan_dispatch_contract.py \
            tests/integrations/test_kubespray_plan_worker_contract.py
