name: KAORI Bootstrap Ruff Imports 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-ruff-imports-12
  cancel-in-progress: false

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'chore(ci): bootstrap canonical ruff imports #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 20
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-bootstrap-ruff-12:${GITHUB_SHA}" .

      - name: Apply Canonical Ruff Import Fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            app/reports/export/xlsx/analytics_profiles.py
            app/reports/export/xlsx/builder.py
            app/reports/storage/service.py
            tests/reports/test_analytics_xlsx_standard.py
          )

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bootstrap-ruff-12:${GITHUB_SHA}" \
            python -m ruff check --fix -- "${files[@]}"

          mapfile -t changed < <(git diff --name-only)
          printf 'Ruff changed %s files:\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 4 ]]

          for file in "${changed[@]}"; do
            case "$file" in
              app/reports/export/xlsx/analytics_profiles.py|app/reports/export/xlsx/builder.py|app/reports/storage/service.py|tests/reports/test_analytics_xlsx_standard.py) ;;
              *) echo "Unexpected Ruff change outside approved #12 files: $file" >&2; exit 1 ;;
            esac
          done

          git diff --check

      - name: Verify Ruff Idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            app/reports/export/xlsx/analytics_profiles.py
            app/reports/export/xlsx/builder.py
            app/reports/storage/service.py
            tests/reports/test_analytics_xlsx_standard.py
          )
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bootstrap-ruff-12:${GITHUB_SHA}" \
            python -m ruff check -- "${files[@]}"

      - name: Commit Formatter-Only Changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 4 ]]
          git add -- "${changed[@]}"
          git commit -m "style(quality): apply canonical ruff import fixes #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
