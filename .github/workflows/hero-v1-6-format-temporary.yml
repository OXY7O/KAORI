name: Hero v1.6 Temporary Formatter

on:
  push:
    branches:
      - kaori/refactor/198-canonical-hero-profiles

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Work Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12,<1'

      - name: Format Hero Contract Python
        run: |
          python -m ruff format \
            scripts/verify_hero_component_standard.py \
            scripts/verify_operational_dashboard_standard.py \
            tests/contracts/design/test_hero_component_standard_contract.py

      - name: Commit Formatter Output
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/verify_hero_component_standard.py \
            scripts/verify_operational_dashboard_standard.py \
            tests/contracts/design/test_hero_component_standard_contract.py
          if git diff --cached --quiet; then
            echo 'Ruff formatting already canonical.'
            exit 0
          fi
          git commit -m 'style: apply canonical ruff format to hero v1.6 contracts (#198)'
          git push origin HEAD:kaori/refactor/198-canonical-hero-profiles
