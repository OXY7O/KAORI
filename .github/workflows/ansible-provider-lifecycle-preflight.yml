# Issue #4834 focused checks; not official Developer Check / Full Admission.
name: Ansible Provider Lifecycle Preflight
on:
  push:
    branches:
      - kaori/issue-4834-ansible-kubespray-provider-lifecycle

permissions:
  contents: read

jobs:
  profile-ui-security:
    name: Source registration, Violet UI and negative contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed issue head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing KAORI QA dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff lint
        run: |
          python -m ruff check \
            app/integrations/orchestration/configuration_automation \
            app/integrations/source_control/source_control/providers/github/public_automation_source.py \
            app/integrations/routes.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py \
            tests/integrations/test_ansible_public_git_source.py
      - name: Ruff format
        run: |
          python -m ruff format --check \
            app/integrations/orchestration/configuration_automation \
            app/integrations/source_control/source_control/providers/github/public_automation_source.py \
            app/integrations/routes.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py \
            tests/integrations/test_ansible_public_git_source.py
      - name: djlint shared Violet templates
        run: |
          djlint --check \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/*.html \
            app/templates/integrations/partials/_domain_workspace.html
      - name: Pyright
        run: |
          python -m pyright \
            app/integrations/orchestration/configuration_automation \
            app/integrations/source_control/source_control/providers/github/public_automation_source.py
      - name: Source negative and live-template contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py \
            tests/integrations/test_ansible_public_git_source.py \
            tests/contracts/integrations/test_provider_matrix_runtime_alignment_contract.py \
            tests/contracts/integrations/test_integration_domain_navigation_contract.py
      - name: KAORI standard UI reuse and style verifiers
        run: |
          python scripts/verify_ui_reuse.py
          python scripts/verify_ui_style.py
