# #4980 isolated exact-source evidence, never admission.
name: Automation Celery Topology Preflight

on:
  push:
    branches:
      - kaori/task-4980-celery-topology-preflight

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact corrective source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "73e77914e34da51eca5bdfa303404f7d1be29f46"
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Canonical topology and code health
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "73e77914e34da51eca5bdfa303404f7d1be29f46"
          python scripts/verify_celery_topology.py
          python scripts/verify_code_health.py
      - name: Install existing test tools
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff lint and format
        run: |
          python -m ruff check app/config/default.py scripts/verify_celery_topology.py tests/contracts/platform_operations/test_ansible_localhost_worker_contract.py
          python -m ruff format --diff app/config/default.py scripts/verify_celery_topology.py tests/contracts/platform_operations/test_ansible_localhost_worker_contract.py
          python -m ruff format --check app/config/default.py scripts/verify_celery_topology.py tests/contracts/platform_operations/test_ansible_localhost_worker_contract.py
      - name: Focused topology and pilot worker/dispatch regressions
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/platform_operations/test_ansible_localhost_worker_contract.py \
            tests/integrations/test_kubespray_plan_dispatch_contract.py \
            tests/integrations/test_kubespray_plan_worker_contract.py \
            tests/contracts/release/test_production_image_runtime_boundary_contract.py
