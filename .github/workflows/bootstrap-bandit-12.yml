name: KAORI Bootstrap Bandit Comment Cleanup 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-bandit-comment-cleanup-12
  cancel-in-progress: false

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore(ci): normalize Bandit suppression comments #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-bandit-cleanup-12:${GITHUB_SHA}" .

      - name: Normalize Suppression Comments
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'app/access/authentication/identity_provider/providers/github/browser.py': (
                  '# nosec B113 - timeout is bounded by request_timeout_seconds().',
                  '# nosec B113',
              ),
              'app/access/authentication/identity_provider/providers/google/browser.py': (
                  '# nosec B113 - timeout is bounded by request_timeout_seconds().',
                  '# nosec B113',
              ),
              'app/integrations/storage/object_storage/providers/minio/client.py': (
                  '# nosec B113 - timeout is bounded to at least one second.',
                  '# nosec B113',
              ),
              'app/integrations/delivery/notification_channels/providers/microsoft_teams.py': (
                  '# noqa: S310  # nosec B310 - URL is revalidated against approved HTTPS hosts.',
                  '# noqa: S310  # nosec B310',
              ),
              'app/integrations/delivery/notification_channels/providers/telegram.py': (
                  '# noqa: S310  # nosec B310 - fixed HTTPS Telegram API base.',
                  '# noqa: S310  # nosec B310',
              ),
          }
          for path, (old, new) in replacements.items():
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: suppression comment target not found')
              target.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check

      - name: Verify Clean Bandit Output
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            app/access/authentication/identity_provider/providers/github/browser.py
            app/access/authentication/identity_provider/providers/google/browser.py
            app/integrations/storage/object_storage/providers/minio/client.py
            app/integrations/delivery/notification_channels/providers/microsoft_teams.py
            app/integrations/delivery/notification_channels/providers/telegram.py
          )
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-cleanup-12:${GITHUB_SHA}" \
            ruff check "${files[@]}"
          output="$(docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-cleanup-12:${GITHUB_SHA}" \
            bandit -r app scripts -q -ll 2>&1)"
          printf '%s\n' "$output"
          if grep -Fq 'Test in comment:' <<<"$output"; then
            printf 'Bandit suppression comments still produce parser warnings.\n' >&2
            exit 1
          fi
          printf 'PASS — KAORI Python SAST Comment Hygiene\n'

      - name: Commit Verified Comment Cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=(
            app/access/authentication/identity_provider/providers/github/browser.py
            app/access/authentication/identity_provider/providers/google/browser.py
            app/integrations/delivery/notification_channels/providers/microsoft_teams.py
            app/integrations/delivery/notification_channels/providers/telegram.py
            app/integrations/storage/object_storage/providers/minio/client.py
          )
          mapfile -t changed < <(git diff --name-only | sort)
          mapfile -t allowed < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${allowed[@]}") <(printf '%s\n' "${changed[@]}")
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add "${expected[@]}"
          git commit -m "chore(security): normalize Bandit suppression comments #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
