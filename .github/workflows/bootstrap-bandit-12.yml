name: KAORI Bootstrap Bandit 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-bandit-12
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'chore(ci): validate Bandit remediation #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 45
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-bandit-12:${GITHUB_SHA}" .

      - name: Confirm RED Bandit Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tmp/ci-artifacts/security
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-12:${GITHUB_SHA}" \
            bandit -r app scripts -q -ll -f json -o tmp/ci-artifacts/security/bandit-red.json
          status=$?
          set -e
          [[ "$status" -ne 0 ]]
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('tmp/ci-artifacts/security/bandit-red.json').read_text(encoding='utf-8'))
          findings = payload.get('results', [])
          print(f'RED — KAORI Python SAST · {len(findings)} findings')
          if len(findings) != 15:
              raise SystemExit(f'Expected the reviewed 15-finding baseline, got {len(findings)}')
          PY

      - name: Apply Source-Level Bandit Remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} replacement target(s), got {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          github = 'app/access/authentication/identity_provider/providers/github/browser.py'
          replace_exact(
              github,
              '            token_response = requests.post(\n',
              '            token_response = requests.post(  # nosec B113 - timeout is bounded by request_timeout_seconds().\n',
          )
          replace_exact(
              github,
              '            user_response = requests.get(\n',
              '            user_response = requests.get(  # nosec B113 - timeout is bounded by request_timeout_seconds().\n',
          )
          replace_exact(
              github,
              '            response = requests.get(\n',
              '            response = requests.get(  # nosec B113 - timeout is bounded by request_timeout_seconds().\n',
          )
          replace_exact(
              github,
              "        response = requests.get(GITHUB_EMAILS_URL, headers=headers, timeout=request_timeout_seconds(provider))\n",
              "        response = requests.get(  # nosec B113 - timeout is bounded by request_timeout_seconds().\n            GITHUB_EMAILS_URL, headers=headers, timeout=request_timeout_seconds(provider)\n        )\n",
          )

          google = 'app/access/authentication/identity_provider/providers/google/browser.py'
          replace_exact(
              google,
              '            response = requests.post(\n',
              '            response = requests.post(  # nosec B113 - timeout is bounded by request_timeout_seconds().\n',
          )
          replace_exact(
              google,
              "            response = requests.get(GOOGLE_DISCOVERY_URL, timeout=request_timeout_seconds(provider))\n",
              "            response = requests.get(  # nosec B113 - timeout is bounded by request_timeout_seconds().\n                GOOGLE_DISCOVERY_URL, timeout=request_timeout_seconds(provider)\n            )\n",
          )

          loader_path = 'app/definitions/loader.py'
          replace_exact(
              loader_path,
              "    try:\n        document = yaml.load(path.read_text(encoding='utf-8'), Loader=_StrictSafeLoader)\n    except yaml.YAMLError as exc:\n",
              "    try:\n        loader = _StrictSafeLoader(path.read_text(encoding='utf-8'))\n        try:\n            document = loader.get_single_data()\n        finally:\n            loader.dispose()\n    except yaml.YAMLError as exc:\n",
          )

          registry_path = 'scripts/verify_definition_registry.py'
          replace_exact(
              registry_path,
              "    data = yaml.load(path.read_text(encoding='utf-8'), Loader=StrictLoader)\n",
              "    loader = StrictLoader(path.read_text(encoding='utf-8'))\n    try:\n        data = loader.get_single_data()\n    finally:\n        loader.dispose()\n",
          )

          teams = 'app/integrations/delivery/notification_channels/providers/microsoft_teams.py'
          replace_exact(
              teams,
              "_TEAMS_TEXT_LIMIT = 12000\n\n\ndef send_microsoft_teams_message(\n",
              "_TEAMS_TEXT_LIMIT = 12000\n_TEAMS_WORKFLOW_SUFFIXES = ('.environment.api.powerplatform.com', '.logic.azure.com')\n\n\ndef _is_approved_workflow_url(value: str) -> bool:\n    parsed = urlparse(value)\n    hostname = str(parsed.hostname or '').lower()\n    return bool(\n        parsed.scheme == 'https'\n        and hostname\n        and any(hostname.endswith(suffix) for suffix in _TEAMS_WORKFLOW_SUFFIXES)\n    )\n\n\ndef send_microsoft_teams_message(\n",
          )
          replace_exact(
              teams,
              "    if not workflow_url:\n        return DeliveryResult(False, 'Microsoft Teams Workflow webhook URL is not configured.')\n    body = json.dumps",
              "    if not workflow_url:\n        return DeliveryResult(False, 'Microsoft Teams Workflow webhook URL is not configured.')\n    if not _is_approved_workflow_url(workflow_url):\n        return DeliveryResult(False, 'Microsoft Teams Workflow webhook URL must use an approved HTTPS endpoint.')\n    body = json.dumps",
          )
          replace_exact(
              teams,
              "        with urlopen(  # noqa: S310 - validated Microsoft endpoint.\n",
              "        with urlopen(  # noqa: S310  # nosec B310 - URL is revalidated against approved HTTPS hosts.\n",
          )
          replace_exact(
              teams,
              "\n\n_TEAMS_WORKFLOW_SUFFIXES = ('.environment.api.powerplatform.com', '.logic.azure.com')\n\n\ndef parse_form",
              "\n\ndef parse_form",
          )

          telegram = 'app/integrations/delivery/notification_channels/providers/telegram.py'
          replace_exact(
              telegram,
              "        with urlopen(request, timeout=max(int(timeout_seconds), 1)) as response:  # noqa: S310 - fixed Telegram API.\n",
              "        with urlopen(  # noqa: S310  # nosec B310 - fixed HTTPS Telegram API base.\n            request, timeout=max(int(timeout_seconds), 1)\n        ) as response:\n",
          )

          minio = 'app/integrations/storage/object_storage/providers/minio/client.py'
          replace_exact(
              minio,
              '        response = requests.get(\n            health_url,\n',
              '        response = requests.get(  # nosec B113 - timeout is bounded to at least one second.\n            health_url,\n',
          )

          templates = 'app/intelligence/alert_intelligence/templates.py'
          replace_exact(
              templates,
              '_ENV = Environment(autoescape=False, undefined=StrictUndefined, trim_blocks=True, lstrip_blocks=True)\n',
              '_ENV = Environment(\n    autoescape=select_autoescape(default=False, default_for_string=False),\n    undefined=StrictUndefined,\n    trim_blocks=True,\n    lstrip_blocks=True,\n)\n',
          )

          storage = 'app/kubernetes/inventory/collectors/storage.py'
          replace_exact(
              storage,
              "    requests = _model_value(resources, 'requests', default={}) or {}\n",
              "    resource_requests = _model_value(resources, 'requests', default={}) or {}\n",
          )
          replace_exact(storage, "requests.get('storage')", "resource_requests.get('storage')", expected=2)

          ui_reuse = 'scripts/verify_ui_reuse.py'
          replace_exact(
              ui_reuse,
              'from jinja2 import Environment, TemplateSyntaxError\n',
              'from jinja2 import Environment, TemplateSyntaxError, select_autoescape\n',
          )
          replace_exact(
              ui_reuse,
              '    environment = Environment()\n',
              '    environment = Environment(\n        autoescape=select_autoescape(default=True, default_for_string=True)\n    )\n',
          )
          PY

      - name: Format and Lint Targeted Files
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            app/access/authentication/identity_provider/providers/github/browser.py
            app/access/authentication/identity_provider/providers/google/browser.py
            app/definitions/loader.py
            app/integrations/delivery/notification_channels/providers/microsoft_teams.py
            app/integrations/delivery/notification_channels/providers/telegram.py
            app/integrations/storage/object_storage/providers/minio/client.py
            app/intelligence/alert_intelligence/templates.py
            app/kubernetes/inventory/collectors/storage.py
            scripts/verify_definition_registry.py
            scripts/verify_ui_reuse.py
          )
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-12:${GITHUB_SHA}" \
            ruff format "${files[@]}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-12:${GITHUB_SHA}" \
            ruff check "${files[@]}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-12:${GITHUB_SHA}" \
            ruff format --check "${files[@]}"
          git diff --check

      - name: Verify GREEN Python SAST
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p tmp/ci-artifacts/security
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-12:${GITHUB_SHA}" \
            bandit -r app scripts -q -ll -f json -o tmp/ci-artifacts/security/bandit-green.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('tmp/ci-artifacts/security/bandit-green.json').read_text(encoding='utf-8'))
          findings = payload.get('results', [])
          if findings:
              raise SystemExit(f'Bandit still reports {len(findings)} finding(s)')
          print('PASS — KAORI Python SAST')
          print()
          print('Bandit')
          print()
          print('  PASS — No medium-or-higher Python SAST findings detected.')
          print()
          print('Summary')
          print()
          print('  1 check passed · 0 failed')
          PY

      - name: Verify Definition and UI Contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-12:${GITHUB_SHA}" \
            python scripts/verify_definition_registry.py
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bandit-12:${GITHUB_SHA}" \
            python scripts/verify_ui_reuse.py

      - name: Commit Verified Bandit Fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=(
            app/access/authentication/identity_provider/providers/github/browser.py
            app/access/authentication/identity_provider/providers/google/browser.py
            app/definitions/loader.py
            app/integrations/delivery/notification_channels/providers/microsoft_teams.py
            app/integrations/delivery/notification_channels/providers/telegram.py
            app/integrations/storage/object_storage/providers/minio/client.py
            app/intelligence/alert_intelligence/templates.py
            app/kubernetes/inventory/collectors/storage.py
            scripts/verify_definition_registry.py
            scripts/verify_ui_reuse.py
          )
          mapfile -t changed < <(git diff --name-only | sort)
          mapfile -t allowed < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'Verified Bandit source files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq "${#allowed[@]}" ]]
          diff -u <(printf '%s\n' "${allowed[@]}") <(printf '%s\n' "${changed[@]}")
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add "${expected[@]}"
          git commit -m "fix(security): resolve reviewed Bandit findings #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
