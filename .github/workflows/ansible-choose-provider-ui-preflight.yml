# Issue-scoped pre-admission UI QA; not official Developer Check or Full Admission.
name: Ansible Choose Provider UI Preflight

on:
  push:
    branches:
      - kaori/issue-4854-ansible-choose-provider-parity

permissions:
  contents: read

jobs:
  ui-contract:
    name: Canonical chooser parity and Orchestration copy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing QA toolchain
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff lint and formatting
        run: |
          python -m ruff check tests/contracts/integrations/test_ansible_choose_provider_visual_parity_contract.py
          python -m ruff format --check tests/contracts/integrations/test_ansible_choose_provider_visual_parity_contract.py
      - name: djlint shared Violet templates
        run: |
          djlint --check \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/choose.html \
            app/templates/integrations/domain.html \
            app/templates/integrations/partials/_domain_workspace.html
      - name: Existing UI reuse and style gates
        run: |
          python scripts/verify_ui_reuse.py
          python scripts/verify_ui_style.py
      - name: Rendered chooser and provider/domain regressions
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/integrations/test_ansible_choose_provider_visual_parity_contract.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py \
            tests/contracts/integrations/test_integration_domain_ui_refinement_contract.py \
            tests/contracts/integrations/test_integration_domain_navigation_contract.py
