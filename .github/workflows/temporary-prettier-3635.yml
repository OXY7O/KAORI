name: Temporary KAORI Prettier Recorder (3635)
on:
  push:
    branches:
      - kaori/style-3635-prettier-six-js
permissions:
  contents: write
concurrency:
  group: kaori-3635-prettier
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'OXY7O/KAORI'
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout exact issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply pinned Prettier and verify canonical frontend style
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/kaori/style-3635-prettier-six-js" ]]
          key="$(cat .github/ci/Dockerfile .github/ci/requirements-security.txt requirements/base.txt requirements/dev.txt | sha256sum | cut -c1-20)"
          image="kaori-ci-toolchain:$key"
          docker image inspect "$image" >/dev/null 2>&1 || docker build --file .github/ci/Dockerfile --tag "$image" .
          run_toolchain() {
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/workspace" --workdir /workspace "$image" "$@"
          }
          run_toolchain bash -lc 'npm ci --no-audit --no-fund'
          run_toolchain ./node_modules/.bin/prettier app/static/js/kubernetes/inventory/topology.js app/static/js/secret_reveal_value.js app/static/js/secret_reveal_workspace.js app/static/js/side_drawer.js app/static/js/tenant_access_grant_form.js app/static/js/tenant_resource_profile_presets.js --write
          run_toolchain bash -lc 'npm run check-format'
          git add -- app/static/js/kubernetes/inventory/topology.js app/static/js/secret_reveal_value.js app/static/js/secret_reveal_workspace.js app/static/js/side_drawer.js app/static/js/tenant_access_grant_form.js app/static/js/tenant_resource_profile_presets.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Source was already canonically formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(admission): apply pinned Prettier to six JS files #3635'
          git push origin HEAD:refs/heads/kaori/style-3635-prettier-six-js
