# Issue #5093: single safe read-only preflight, no runtime mutation.
name: Environment Credential Preflight

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Existing protected GitHub Environment to verify
        required: true
        type: choice
        options:
          - staging
          - production
      inspect_runtime:
        description: Explicit read-only receipt/image/Compose runtime inventory; not UAT or deployment
        required: false
        default: false
        type: boolean
  push:
    branches:
      - kaori/staging
    paths:
      - .github/workflows/environment-credential-preflight.yml
      - scripts/environment-credential-preflight.sh

permissions:
  contents: read

concurrency:
  group: env-preflight-${{ github.ref }}-${{ inputs.target_environment || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only Environment / Registry / SSH
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 12
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || inputs.target_environment }}
    env:
      TARGET_ENV: ${{ inputs.target_environment || 'staging' }}
      TARGET_INVENTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_runtime || false }}
      REGISTRY_HOST: ${{ vars.KAORI_DOCKER_REGISTRY_HOST }}
      REGISTRY_IMAGE: ${{ vars.KAORI_DOCKER_REGISTRY_IMAGE }}
      REGISTRY_USER: ${{ secrets.KAORI_DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.KAORI_DOCKER_REGISTRY_PASSWORD }}
      DEPLOY_HOST: ${{ vars.KAORI_HOST }}
      DEPLOY_PORT: ${{ vars.KAORI_HOST_PORT }}
      DEPLOY_USER: ${{ vars.KAORI_HOST_USER }}
      DEPLOY_ROOT: ${{ vars.KAORI_HOST_DEPLOY_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.KAORI_HOST_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PASSPHRASE: ${{ secrets.KAORI_HOST_SSH_PASSPHRASE }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.KAORI_HOST_KNOWN_HOSTS }}
      RECEIPT_PATH: /var/lib/kaori/deploy-state/release.env
      HOST_ENV_PATH: /etc/kaori/deploy.env
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Environment registry, pinned SSH and VM receipt without mutation
        shell: bash
        run: |
          bash -n scripts/environment-credential-preflight.sh
          bash scripts/environment-credential-preflight.sh
