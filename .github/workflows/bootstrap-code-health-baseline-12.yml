name: KAORI Bootstrap Code Health Baseline 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-code-health-baseline-12
  cancel-in-progress: false

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'chore(ci): reconcile code health baseline #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-code-health-12:${GITHUB_SHA}" .

      - name: Confirm RED Baseline Evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          output="$(docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-code-health-12:${GITHUB_SHA}" python scripts/verify_code_health.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          [[ "$status" -ne 0 ]]
          grep -Fq 'module lines' <<<"$output"
          grep -Fq 'branch points' <<<"$output"

      - name: Reconcile Exact Debt Ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-code-health-12:${GITHUB_SHA}" python scripts/verify_code_health.py --write-baseline
          git diff -- docs/architecture/code-health-debt-baseline.json

      - name: Apply Human-Readable Code Health Output
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify_code_health.py')
          text = path.read_text(encoding='utf-8')
          old = """    except (OSError, ValueError, json.JSONDecodeError) as exc:\n        print(f'ERROR: {exc}')\n        return 1\n\n    if errors:\n        for error in errors:\n            print(f'ERROR: {error}')\n        return 1\n    modules, functions, broad_exceptions = scan(args.app_root)\n    print(\n        'KAORI code-health debt is bounded across '\n        f'{len(modules)} modules and {len(functions)} functions; '\n        f'{broad_exceptions} broad exception handlers remain in the burn-down baseline.'\n    )\n    return 0\n"""
          new = """    except (OSError, ValueError, json.JSONDecodeError) as exc:\n        print('FAIL — KAORI Code Health')\n        print()\n        print('Verifier Error')\n        print(f'  FAIL — {exc}')\n        print()\n        print('Summary')\n        print('  1 failed')\n        return 1\n\n    if errors:\n        print('FAIL — KAORI Code Health')\n        print()\n        print('Debt Ledger')\n        for error in errors:\n            print(f'  FAIL — {error}')\n        print()\n        print('Summary')\n        print(f'  {len(errors)} failed')\n        return 1\n\n    modules, functions, broad_exceptions = scan(args.app_root)\n    print('PASS — KAORI Code Health')\n    print()\n    print('Default Ceilings')\n    print('  PASS — Module 800 lines · Function 160 lines · Branch points 30 · Arguments 8.')\n    print()\n    print('Debt Boundary')\n    print(f'  PASS — {len(modules)} modules and {len(functions)} functions are bounded by the exact debt ledger.')\n    print(f'  PASS — {broad_exceptions} broad exception handlers are explicitly tracked for burn-down.')\n    print()\n    print('Summary')\n    print('  3 checks passed · 0 failed')\n    return 0\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected one legacy code-health output block.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Verify Exact Baseline and Output
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-code-health-12:${GITHUB_SHA}" python -m ruff format scripts/verify_code_health.py
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-code-health-12:${GITHUB_SHA}" python -m ruff check scripts/verify_code_health.py
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-code-health-12:${GITHUB_SHA}" python scripts/verify_code_health.py
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/workspace" --workdir /workspace \
            "kaori-code-health-12:${GITHUB_SHA}" python scripts/verify_code_health_baseline_integrity.py
          git diff --check

      - name: Commit Reviewed Baseline Reconciliation
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Baseline reconciliation files (%s):\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 2 ]]
          printf '%s\n' "${changed[@]}" | grep -Fxq 'docs/architecture/code-health-debt-baseline.json'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'scripts/verify_code_health.py'
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture/code-health-debt-baseline.json scripts/verify_code_health.py
          git commit -m "chore(quality): reconcile exact code health baseline #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
