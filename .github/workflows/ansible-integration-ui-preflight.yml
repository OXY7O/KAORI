# Issue-scoped visual/render preflight; NOT the full admission workflow.
name: Ansible Integration UI Preflight
on:
  push:
    branches:
      - kaori/issue-4827-ansible-integration-workspace
permissions:
  contents: read
jobs:
  ui-contract:
    name: Violet UI and registry contract
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing KAORI QA toolchain
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Ruff check
        run: |
          python -m ruff check app/integrations/orchestration/configuration_automation \
            app/integrations/kernel/registry.py app/integrations/routes.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
      - name: Ruff format
        run: |
          python -m ruff format --check app/integrations/orchestration/configuration_automation \
            app/integrations/kernel/registry.py app/integrations/routes.py \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
      - name: Djlint shared template contract
        run: |
          djlint --reformat \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/frontpage.html \
            app/templates/integrations/orchestration/configuration_automation/providers/ansible/_execution_registry.html \
            app/templates/integrations/partials/_domain_workspace.html
      - name: Output formatted template candidates for GitHub review
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          paths = [
              'app/templates/integrations/orchestration/configuration_automation/providers/ansible/frontpage.html',
              'app/templates/integrations/orchestration/configuration_automation/providers/ansible/_execution_registry.html',
              'app/templates/integrations/partials/_domain_workspace.html',
          ]
          for path in paths:
              print(f'FORMAT_BEGIN:{path}')
              print(base64.b64encode(Path(path).read_bytes()).decode('ascii'))
              print(f'FORMAT_END:{path}')
          PY
          # This is a one-off formatting diagnostic; fail closed until reviewed source is committed.
          exit 1
      - name: Pyright provider workspace
        run: python -m pyright app/integrations/orchestration/configuration_automation
      - name: Focused route and template contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/integrations/test_ansible_configuration_automation_workspace_contract.py
      - name: Shared integration taxonomy regression
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/contracts/integrations/test_provider_matrix_runtime_alignment_contract.py \
            tests/contracts/integrations/test_integration_domain_navigation_contract.py
