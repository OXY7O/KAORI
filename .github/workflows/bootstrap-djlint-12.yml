name: KAORI Bootstrap djLint 12

on:
  push:
    branches:
      - kaori/tech-debt-12-static-quality-baseline

permissions:
  contents: write

concurrency:
  group: kaori-bootstrap-djlint-12
  cancel-in-progress: false

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'chore(ci): bootstrap canonical djlint #12' }}"
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 30
    steps:
      - name: Check Out Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build CI Toolchain
        run: docker build --file .github/ci/Dockerfile --tag "kaori-bootstrap-djlint-12:${GITHUB_SHA}" .

      - name: Apply Canonical djLint Format
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bootstrap-djlint-12:${GITHUB_SHA}" \
            python -m djlint app/templates --reformat
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then
            echo "djLint reformat failed with unexpected status: $status" >&2
            exit "$status"
          fi

          mapfile -t changed < <(git diff --name-only)
          printf 'djLint changed %s files:\n' "${#changed[@]}"
          printf '%s\n' "${changed[@]}"
          [[ "${#changed[@]}" -eq 13 ]]
          for file in "${changed[@]}"; do
            case "$file" in
              app/templates/*) ;;
              *) echo "Unexpected djLint change outside app/templates: $file" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Verify djLint Idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "kaori-bootstrap-djlint-12:${GITHUB_SHA}" \
            python -m djlint app/templates --check

      - name: Commit Formatter-Only Changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "KAORI CI Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 13 ]]
          git add -- "${changed[@]}"
          git commit -m "style(templates): apply canonical djlint formatting #12"
          git push origin HEAD:kaori/tech-debt-12-static-quality-baseline
