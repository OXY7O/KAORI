name: KAORI UI Visual Baseline Capture

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: KAORI staging URL to capture for external login baseline
        required: true
        default: https://kaori.cloud
        type: string
      capture_scope:
        description: Visual baseline candidate scope
        required: true
        default: all
        type: choice
        options:
          - all
          - login
          - authenticated

permissions:
  contents: read

concurrency:
  group: kaori-ui-visual-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture Reviewed Baseline Candidate
    runs-on: [self-hosted, linux, x64, kaori-ci]
    timeout-minutes: 15
    steps:
      - name: Check Out Requested Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve CI Toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$(cat .github/ci/Dockerfile .github/ci/requirements-security.txt requirements/base.txt requirements/dev.txt | sha256sum | cut -c1-20)"
          image="kaori-ci-toolchain:$key"
          docker image inspect "$image" >/dev/null 2>&1 || docker build --file .github/ci/Dockerfile --tag "$image" .
          printf 'CI_TOOLCHAIN_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Capture Login Visual Baseline Candidate
        if: ${{ inputs.capture_scope != 'authenticated' }}
        shell: bash
        env:
          KAORI_UI_BASE_URL: ${{ inputs.base_url }}
          KAORI_UPDATE_VISUAL_BASELINES: "1"
        run: |
          set -Eeuo pipefail
          mkdir -p tests/ui/artifacts/login
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env KAORI_UI_BASE_URL \
            --env KAORI_UPDATE_VISUAL_BASELINES \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            bash -lc 'pytest -q tests/ui/test_visual_regression.py --tracing retain-on-failure --screenshot only-on-failure --output tests/ui/artifacts/login'

      - name: Build Authenticated Visual Test Assets
        if: ${{ inputs.capture_scope != 'login' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            bash -lc 'npm ci --no-audit --no-fund && npm run build-css'

      - name: Capture Authenticated Visual Baseline Candidate
        if: ${{ inputs.capture_scope != 'login' }}
        shell: bash
        env:
          KAORI_UPDATE_VISUAL_BASELINES: "1"
        run: |
          set -Eeuo pipefail
          mkdir -p tests/ui/artifacts/authenticated tmp/ci-artifacts/test-output/ui-browser
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env KAORI_UPDATE_VISUAL_BASELINES \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "$CI_TOOLCHAIN_IMAGE" \
            bash -lc 'pytest -q tests/ui/test_representative_interactions.py -k "welcome_visual_qa_light_and_dark or deterministic_visual_surface_catalog_light_and_dark" --output tests/ui/artifacts/authenticated'

      - name: Upload Baseline Review Evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaori-ui-visual-baseline-${{ github.sha }}
          path: |
            tests/ui/baselines
            tests/ui/artifacts
            tmp/ci-artifacts/test-output/ui-browser
          if-no-files-found: warn
          retention-days: 14
