name: shared-edge

services:
  nginx:
    image: ${EDGE_NGINX_IMAGE:?Set EDGE_NGINX_IMAGE in the shared-edge environment}
    restart: unless-stopped
    environment:
      EDGE_SITES_DIR: /etc/shared-edge/sites
      EDGE_RELOAD_INTERVAL_SECONDS: ${EDGE_RELOAD_INTERVAL_SECONDS:-30}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/shared-edge-nginx-entrypoint
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx-entrypoint.sh:/usr/local/bin/shared-edge-nginx-entrypoint:ro
      - ${EDGE_SITES_DIR:-/opt/shared-edge/config/sites}:/etc/shared-edge/sites:ro
      - ${EDGE_CERTIFICATE_DIR:-/opt/shared-edge/state/letsencrypt}:/etc/letsencrypt:ro
      - ${EDGE_ACME_WEBROOT_DIR:-/opt/shared-edge/state/acme-webroot}:/var/www/certbot:ro
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=4m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=2m
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - edge_public
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  certbot:
    image: ${EDGE_CERTBOT_IMAGE:?Set EDGE_CERTBOT_IMAGE in the shared-edge environment}
    restart: unless-stopped
    environment:
      EDGE_LETSENCRYPT_EMAIL: ${EDGE_LETSENCRYPT_EMAIL:?Set EDGE_LETSENCRYPT_EMAIL in the shared-edge environment}
      EDGE_SITES_DIR: /etc/shared-edge/sites
      EDGE_CERTBOT_RENEW_INTERVAL_SECONDS: ${EDGE_CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/shared-edge-certbot-entrypoint
    volumes:
      - ./certbot-entrypoint.sh:/usr/local/bin/shared-edge-certbot-entrypoint:ro
      - ${EDGE_SITES_DIR:-/opt/shared-edge/config/sites}:/etc/shared-edge/sites:ro
      - ${EDGE_CERTIFICATE_DIR:-/opt/shared-edge/state/letsencrypt}:/etc/letsencrypt
      - ${EDGE_ACME_WEBROOT_DIR:-/opt/shared-edge/state/acme-webroot}:/var/www/certbot
    tmpfs:
      - /var/lib/letsencrypt:rw,noexec,nosuid,size=16m
      - /var/log/letsencrypt:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - edge_public
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  edge_public:
    name: edge-public
    external: true
