# Candidate overlay for disposable staging qualification (#5202).
# Not loaded by the canonical deploy entry point until target and recovery admission.
services:
  secret-store:
    profiles: [operator-bootstrap]
    image: ${KAORI_SECRET_STORE_IMAGE:?Supply the reviewed OpenBao 2.7.3 OCI digest}
    restart: unless-stopped
    env_file:
      - ${KAORI_SECRET_STORE_ENV_FILE:?Supply the private OpenBao service env file}
    # The upstream entrypoint supplies /openbao/config exactly once.
    command: ["server"]
    environment:
      SKIP_CHOWN: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${KAORI_SECRET_STORE_CONFIG_DIR:?Supply target-specific OpenBao config and TLS directory}
        target: /openbao/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KAORI_SECRET_STORE_AUDIT_DIR:?Supply target-specific restricted audit directory}
        target: /openbao/audit
        bind:
          create_host_path: false
    networks:
      - kaori_production
    expose:
      - "8200"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 512m
